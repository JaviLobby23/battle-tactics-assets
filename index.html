function enemiesInAoeRange(attacker, abilityDef, fromPos){
  const pos = fromPos || attacker;
  return enemyTeamOf(attacker).instances.filter(e=>{
    if(!e.alive) return false;
    if(distanceFor(pos,e,abilityDef) > abilityDef.aoeEnemiesRange) return false;
    if(abilityDef.straightOnly && !isOnStraightLine(pos,e)) return false;
    return true;
  });
}
// Most abilities can hit anywhere from 1 tile up to their range. A few (Ranger's
// basic, Javelin) are exact-range-only — they can ONLY hit at exactly that distance,
// not anything closer.
function heightDiffBetween(a,b){
  return Math.abs(effectiveHeightAt(a.x,a.y,a.elevated) - effectiveHeightAt(b.x,b.y,b.elevated));
}
function inRange(dist, abilityDef, heightDiff){
  // Melee (range 1) abilities can't reach a target 2+ height levels above or below.
  if(abilityDef.range===1 && heightDiff!==undefined && heightDiff>=2) return false;
  if(abilityDef.exactRange) return dist===abilityDef.range;
  // minRange (Rogue's basic: R4-R5 only): a genuine band rather than a single exact
  // value — anything from minRange up to range (inclusive) counts, anything closer
  // is out of reach entirely (unlike a normal ability, which always also works at
  // shorter distances).
  if(abilityDef.minRange!==undefined) return dist>=abilityDef.minRange && dist<=abilityDef.range;
  return dist<=abilityDef.range;
}

// Enchanter-style rule (firstHeightOnly): reaching UP onto a height-2+ tile ignores
// her normal ranged reach entirely — she has to be standing directly next to it
// (adjacent, not at range), and she can't reach any other elevated tile beyond that
// one. Targets that aren't elevated relative to her (same height, lower, or below the
// ability's reach threshold) are unaffected and just use her normal range as-is.
// twoRangeCombo abilities (Sorcerer's Arcane) need a genuine PAIR of distinct
// enemies to work at all — one within the ability's normal range, and a different
// one within secondRange of the attacker. If no such pair exists (e.g. only one
// enemy is anywhere in range, or nobody at all is), the whole special is unusable
// this turn — there's no partial "just hit the one enemy" fallback.
function hasValidTwoRangePair(c, abil){
  if(abil.secondRange===undefined) return true;
  // During Thief's Charm bonus segment, a charmed unit's valid targets are its
  // own real teammates (see charmedOwnTeam) — enemyTeamOf(c) would point at
  // Thief's own side instead, wrongly reporting no valid pair and leaving the
  // Special button disabled.
  const targets = state.charmBonusUid===c.uid ? charmedOwnTeam(c) : enemyTeamOf(c);
  const firstPool = targets.instances.filter(e=>e.alive && canReach(c,e,abil));
  // Runeblade: no dead-end requirement — the combo is usable as soon as there's
  // anyone at all within the first hit's range, second hit or not.
  if(abil.secondHitOptional) return firstPool.length>0;
  if(abil.secondRangeFromTarget){
    // Paladin's Holy: the second range is measured from the FIRST target's own
    // position, not the attacker's — so each candidate first pick needs its own
    // check for a distinct second enemy within secondRange of *it*.
    return firstPool.some(e1=> targets.instances.some(e2=> e2.alive && e2.uid!==e1.uid && canReach(e1,e2,{...abil, range:abil.secondRange})));
  }
  const secondPool = targets.instances.filter(e=>e.alive && canReach(c,e,{...abil, range:abil.secondRange}));
  return firstPool.some(e1=> secondPool.some(e2=> e2.uid!==e1.uid));
}

function inRangeWithHeightRule(attacker, target, abilityDef){
  // A straightOnly ability (e.g. Vigilant's boomerang) can only target something
  // directly on one of the 4 cardinal lines from the attacker — never diagonal or
  // off-axis, regardless of distance.
  if(abilityDef.straightOnly && !isOnStraightLine(attacker, target)) return false;
  if(abilityDef.firstHeightOnly!==undefined){
    const attackerHeight = effectiveHeightAt(attacker.x, attacker.y, attacker.elevated);
    const targetHeight = effectiveHeightAt(target.x, target.y, target.elevated);
    if(targetHeight > attackerHeight && targetHeight >= abilityDef.firstHeightOnly){
      // "Next to" uses the same distance metric as her normal range (manhattan) —
      // a diagonal step has manhattan distance 2, so it does NOT count as adjacent
      // here even though it's one square away.
      return distanceFor(attacker, target, abilityDef) === 1;
    }
  }
  return inRange(distanceFor(attacker,target,abilityDef), abilityDef, heightDiffBetween(attacker,target));
}

// Combines range, height-diff, and the firstHeightOnly rule in one call — use this
// instead of inRange(distanceFor(...), ..., heightDiffBetween(...)) directly.
// Straight-line-of-sight check for physical ranged attacks (arrows, thrown shuriken,
// gunshots) — the shot is blocked by a tree, or by any tile in between that's taller
// than both the attacker and target (a wall/roof rising above the sightline). Only
// applied to abilities flagged requiresLineOfSight — melee hits (nothing can stand
// "in between" an adjacent pair) and magic-style abilities with their own bespoke
// rules (e.g. Enchanter's firstHeightOnly) aren't affected.
function hasLineOfSight(attacker, target){
  const dx = target.x - attacker.x, dy = target.y - attacker.y;
  const dist = Math.max(Math.abs(dx), Math.abs(dy));
  if(dist<=1) return true; // adjacent — nothing could be in between
  const stepX = dx/dist, stepY = dy/dist;
  const attackerHeight = effectiveHeightAt(attacker.x, attacker.y, attacker.elevated);
  const targetHeight = effectiveHeightAt(target.x, target.y, target.elevated);
  const sightlineHeight = Math.max(attackerHeight, targetHeight);
  for(let step=1; step<dist; step++){
    const tx = Math.round(attacker.x + stepX*step);
    const ty = Math.round(attacker.y + stepY*step);
    if(terrainAt(tx,ty)===2) return false; // a tree blocks the shot
    if(effectiveHeightAt(tx,ty,false) > sightlineHeight) return false; // a taller obstacle blocks the shot
  }
  return true;
}

function canReach(attacker, target, abilityDef){
  if(abilityDef.barrelRoll){
    // Same idea as lineAttack below, but using the barrel's own path rules
    // (blocked by a rise in height, not just a wall) — so directly clicking an
    // enemy to aim BaRoll only ever offers one the barrel could actually reach.
    if(!isOnStraightLine(attacker, target)) return false;
    const dir = lineDirectionTo(attacker, target);
    return barrelRollTiles(attacker, abilityDef, dir).some(t=>t.x===target.x && t.y===target.y);
  }
  if(abilityDef.lineAttack){
    // A lineAttack's real hit-list already accounts for walls stopping the line and
    // (for Lancer) an elevated first target capping the line's reach — reuse that
    // exact logic here so a target that wouldn't actually get hit never shows up as
    // a clickable direction-pick in the first place.
    if(!isOnStraightLine(attacker, target)) return false;
    const dir = lineDirectionTo(attacker, target);
    return enemiesInLineFrom(attacker, abilityDef, dir).some(e=>e.uid===target.uid);
  }
  return inRangeWithHeightRule(attacker, target, abilityDef)
    && (!abilityDef.requiresLineOfSight || hasLineOfSight(attacker, target));
}

// Walks the line of fire out from the attacker, along the angle the player aimed
// at, and returns the enemies standing on it in the order the shot reaches them —
// up to maxHits of them. Living enemies do NOT stop the shot (that is the whole
// point of a piercing round); walls, allies and downed characters do.
//
// Aiming only sets the direction. Which enemies get hit is worked out from the
// attacker outward, so clicking the second enemy in a line hits the same pair as
// clicking the first — the player never has to identify the front one themselves.
function findLineEnemies(attacker, aim, maxRange, maxHits){
  const dx = aim.x - attacker.x, dy = aim.y - attacker.y;
  const dist = Math.max(Math.abs(dx), Math.abs(dy));
  if(dist===0) return [];
  const stepX = dx/dist, stepY = dy/dist;
  const found = [];
  let x = attacker.x, y = attacker.y;
  for(let travelled=1; travelled<=maxRange; travelled++){
    x += stepX; y += stepY;
    const tx = Math.round(x), ty = Math.round(y);
    if(tx<0 || tx>=BOARD_COLS || ty<0 || ty>=BOARD_ROWS) break;
    if(terrainAt(tx,ty)===2) break;            // walls stop the shot
    const occ = occupantAt(tx,ty);
    if(!occ) continue;
    if(!occ.alive || occ.team===attacker.team) break;  // allies and bodies stop it
    found.push(occ);
    if(found.length>=maxHits) break;
  }
  return found;
}

// One shot, one roll, up to two enemies. Kept separate from the generic special
// resolution because the hit list is derived rather than clicked.
function resolvePierceSpecialAttack(attacker, aim, s){
  const hits = findLineEnemies(attacker, aim, s.range, s.pierceHits || 2);
  const shot = hits.length ? hits : (aim && aim.alive ? [aim] : []);
  const roll = specialAttackRoll(attacker.status.blind>0);
  const names = shot.map(h=>`<b>${h.def.name}</b>`).join(' and ');
  if(!shot.length){
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; nothing on that line to hit.`, 'miss');
    return;
  }
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on ${names} &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return;
  }
  const dealt = shot.map(h=>applyDamage(h, s.dmg, attacker));
  const dmgTexts = shot.map((h,i)=>`<b>${h.def.name}</b> -${dealt[i]}`).join(' and ');
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: the shot pierces ${dmgTexts}.`, '');
}


function checkWin(){
  if(state.gameEnded) return true; // already ended — don't re-record a win
  const p1dead = state.p1.instances.every(c=>!c.alive);
  const p2dead = state.p2.instances.every(c=>!c.alive);
  if(p1dead || p2dead){
    state.gameEnded = true;
    state.winner = p1dead && p2dead ? 0 : (p1dead? 2 : 1);
    const winnerProfileIndex = winningProfileIndexFor(state.winner);
    const before = snapshotCrownCounts(winnerProfileIndex);
    recordProfileWin(state.winner);
    recordMapPvpWin(state.winner);
    state.newlyEarnedCrowns = diffNewlyEarnedCrowns(winnerProfileIndex, before);
    return true;
  }
  return false;
}

// Previews the current + upcoming turn order without mutating any real state — mirrors
// advanceToLivingTurn's exact alternate-teams-and-skip-dead logic. First entry is
// whoever's turn it actually is right now.
function upcomingTurnSequence(count){
  const seq = [];
  let team = state.activeTeam;
  let p1Idx = state.p1TurnIdx;
  let p2Idx = state.p2TurnIdx;
  let first = true;
  let safety = 0;
  while(seq.length < count && safety++ < count*20){
    if(!first){
      if(team===1){ p1Idx = (p1Idx+1) % (state.p1TurnOrder.length||1); }
      else { p2Idx = (p2Idx+1) % (state.p2TurnOrder.length||1); }
      team = team===1 ? 2 : 1;
    }
    first = false;
    const order = team===1 ? state.p1TurnOrder : state.p2TurnOrder;
    if(!order || !order.length) break;
    let idx = team===1 ? p1Idx : p2Idx;
    let guard=0, found=null;
    while(guard++ < order.length){
      const cand = getByUid(order[idx]);
      if(cand && cand.alive){ found = cand; break; }
      idx = (idx+1) % order.length;
    }
    if(team===1) p1Idx = idx; else p2Idx = idx;
    if(!found) break; // this team has no living units left
    seq.push({char:found, team});
  }
  return seq;
}

function advanceToLivingTurn(isFirst){
  if(checkWin()) return;
  if(!isFirst){
    // Move the team that just went to their next unit in line, then hand the turn
    // to the other team — sides always alternate, no matter who died.
    setActiveTurnIdx((activeTurnIdx()+1) % activeTurnOrder().length);
    state.activeTeam = state.activeTeam===1 ? 2 : 1;
  }
  // If the next-up unit on the now-active team is dead, skip forward within that
  // same team's order until a living unit is found (never switches team here).
  // Specter's Possess: while Specter is off possessing someone, it's not
  // "present" to take its own separate turn — skip past it here too, the same
  // way a dead character is skipped, so its own turn slot never comes up again
  // before the host's hijacked turn resolves the possession. (If Specter is
  // somehow the only living option left on its team, the loop below still
  // terminates and falls back to it rather than deadlocking.)
  let guard=0;
  const order = activeTurnOrder();
  while(guard++ < order.length){
    const c = currentChar();
    const isPossessingSpecter = c && state.possession && state.possession.specterUid===c.uid;
    if(c && c.alive && !isPossessingSpecter) break;
    setActiveTurnIdx((activeTurnIdx()+1) % order.length);
  }
  const c = currentChar();
  if(state.guardAuraSourceUid===c.uid){
    state.guardAuraSourceUid = null;
    log(`<b>${c.def.name}</b>'s Guard protection ends.`, '');
  }
  state.hasteActiveUid = null;
  // Haste (Scholar's Erudite, etc.): this only ever runs once, right here, at the
  // very start of each fresh normal turn — so if Haste was cast on this character
  // mid-turn (including on themself), that charge simply isn't seen until the NEXT
  // time their turn comes around, which is exactly the "takes effect next turn,
  // not this one" rule. Consuming it here queues a bonus turn (move + basic only)
  // to immediately follow once this normal turn ends — see endTurnAdvance below.
  if(c.status.haste>0){
    c.status.haste--;
    state.hasteQueuedUid = c.uid;
  } else {
    state.hasteQueuedUid = null;
  }
  c.movedThisTurn=false; c.actedThisTurn=false;
  c.undoX=undefined; c.undoY=undefined;
  state.pendingDiceRollsLeft = null;
  // Regen heals at the beginning of the affected character's turn, before anything else.
  if(c.status.regen>0 && c.alive && c.hp<c.maxHp){
    const healed = Math.min(2, c.maxHp-c.hp);
    c.hp += healed;
    log(`<b>${c.def.name}</b> regenerates ${healed} HP.`, '');
  }
  // handle sleep
  if(c.status.sleep>0){
    state.mode=null;
    log(`<b>${c.def.name}</b> is asleep and skips the turn.`, 'miss');
    c.status.sleep--;
    endTurnAdvance();
    return;
  }
  // auto-highlight movement range at the start of the turn (unless Leg Break prevents moving)
  state.mode = c.status.legbreak>0 ? null : 'move';
}

// Haste's bonus turn (Scholar's Erudite, etc.): the same character goes again
// immediately, before the turn passes to anyone else — restricted to move + basic
// attack. The basic auto-hits (doBasicAttack checks state.hasteActiveUid) at a
// fixed Dmg 2, or Dmg 1 if the character's own basic already deals only 1 — no
// roll needed, since this rides on the already-successful cast that granted Haste.
function startHasteBonusTurn(c){
  state.hasteQueuedUid = null;
  state.hasteActiveUid = c.uid;
  log(`<b>${c.def.name}</b> is Hasted and takes another turn!`, '');
  c.movedThisTurn=false; c.actedThisTurn=false;
  c.undoX=undefined; c.undoY=undefined;
  state.pendingDiceRollsLeft = null;
  if(c.status.regen>0 && c.alive && c.hp<c.maxHp){
    const healed = Math.min(2, c.maxHp-c.hp);
    c.hp += healed;
    log(`<b>${c.def.name}</b> regenerates ${healed} HP.`, '');
  }
  if(c.status.sleep>0){
    state.mode=null;
    log(`<b>${c.def.name}</b> is asleep and skips the bonus turn.`, 'miss');
    c.status.sleep--;
    state.hasteActiveUid = null;
    endTurnAdvance();
    return;
  }
  state.mode = c.status.legbreak>0 ? null : 'move';
}

// Mercenary's Hire: finds a living ally (other than `c`) flagged hireAssist with a
// special charge available, standing within that ability's hireRange of `c`. Used
// both by the player-facing "Hire" button (offered on an ALLY's turn, in place of
// their own attack) and by the CPU's opportunistic use of the same option.
function findHireHelper(c){
  if(!c || !c.alive) return null;
  return teamOf(c).instances.find(m=> m.alive && m.uid!==c.uid && m.def.special && m.def.special.hireAssist
    && m.specialCharges>0 && m.status.armbreak<=0 && m.status.sleep<=0 && m.status.confuse<=0
    && manhattan(c,m)<=(m.def.special.hireRange||1)) || null;
}
// Reverts the temporary Move/basic-attack boost Hire grants for its bonus segment
// (see the btnHire handler and cpuTryHireAssist) and clears the panel-control
// override — called once that segment finishes normally, and again as a safety
// net at the top of every endTurnAdvance() in case a turn ends mid-segment.
function clearHireBonus(){
  if(!state.hireBonusUid) return;
  const helper = getByUid(state.hireBonusUid);
  if(helper){ helper.move = undefined; helper.basicOverride = null; }
  state.hireBonusUid = null;
}

// Ends Assassin's Quick bonus segment: reverts the temporary basicOverride (R1
// D3's own real basic comes back). Unlike Hire/Charm, this is the SAME
// character finishing out their own turn (not control being handed to someone
// else), so there's no separate follow-up hit to land here — just cleanup.
// Called both right after the bonus attack resolves and as a safety net at the
// top of every endTurnAdvance(), matching clearHireBonus/endCharmSegment.
function clearQuickBonus(){
  if(!state.quickBonusUid) return;
  const c = getByUid(state.quickBonusUid);
  if(c) c.basicOverride = null;
  state.quickBonusUid = null;
}

// Ends Thief's Charm bonus segment on the charmed enemy: reverts the temporary
// auto-hit basicOverride, clears the panel-control override, and lands Thief's
// own D1 on the charmed unit — but only once, and only if it's still alive.
// Called both when the segment finishes normally (right after the charmed
// unit's move+attack click handler resolves an attack) and as a safety net at
// the top of every endTurnAdvance(), so ending the turn early (or Undoing back
// out) can't dodge the D1 or leave the panel stuck on the wrong character.
function endCharmSegment(){
  if(!state.charmBonusUid) return;
  const pc = state.pendingCharm;
  const charmed = getByUid(state.charmBonusUid);
  const thief = pc ? getByUid(pc.thiefUid) : null;
  if(charmed) charmed.basicOverride = null;
  if(charmed && charmed.alive && thief && pc){
    const dealt = applyDamage(charmed, pc.dmg, thief);
    log(`&mdash; <b>${thief.def.name}</b>'s Charm wears off: <b>${charmed.def.name}</b> -${dealt}.`, '');
  }
  if(thief) thief.actedThisTurn = true;
  state.pendingCharm = null;
  state.charmBonusUid = null;
}

function endTurnAdvance(){
  clearHireBonus();
  endCharmSegment();
  clearQuickBonus();
  // Safety net: if a Tomb-trap status choice is somehow still pending (e.g. the
  // turn got ended before it was answered), just pick one rather than leaving
  // it stuck unresolved forever.
  if(state.pendingTombChoice){
    const p = state.pendingTombChoice;
    const mover = getByUid(p.moverUid);
    if(mover && mover.alive) applyStatus(mover, p.options[Math.floor(Math.random()*p.options.length)], 1);
    state.pendingTombChoice = null;
  }
  // Safety net: an interrupted Aerial (e.g. the turn ends mid-pick) shouldn't
  // leave a stale landing tile lying around for the next time this special is used.
  state.pendingAerialLanding = null;
  // Safety net: if a Portal mid-move choice or its leftover-budget continuation
  // is somehow still pending, just settle the mover where they are and restore
  // their real move stat rather than leaving it stuck overridden.
  if(state.pendingPortalMove){
    const mover = getByUid(state.pendingPortalMove.moverUid);
    if(mover && mover.alive){ mover.x = state.pendingPortalMove.atX; mover.y = state.pendingPortalMove.atY; mover.elevated = state.pendingPortalMove.atElevated; mover.movedThisTurn = true; }
    state.pendingPortalMove = null;
  }
  if(state.pendingPortalContinuation){
    const mover = getByUid(state.pendingPortalContinuation.moverUid);
    if(mover) mover.move = state.pendingPortalContinuation.savedMove;
    state.pendingPortalContinuation = null;
  }
  // Safety net: an interrupted Portal cast (targets picked but placement never
  // finished) shouldn't leave stale picks around for next time.
  state.pendingPortalTargets = []; state.pendingPortalHitsNeeded = 0;
  state.pendingPortalPlace = null;
  // Safety net: an interrupted Stalker landing choice just settles them where
  // they already are (they already hit everyone in the line either way).
  if(state.pendingStalkerLandUid){
    const mover = getByUid(state.pendingStalkerLandUid);
    if(mover) mover.movedThisTurn = true;
    state.pendingStalkerLandOptions = []; state.pendingStalkerLandUid = null;
  }
  const c = currentChar();
  if(c){
    // The CPU's character is finishing its turn — swap the steady glow for a
    // one-shot fade-out, then clear it once the fade animation has played. Skipped
    // when a Haste bonus turn is about to start for this same character — they're
    // acting again immediately, so the glow should stay steady, not fade.
    const willGrantHasteBonus = c.alive && state.hasteQueuedUid===c.uid;
    if(!willGrantHasteBonus && state.vsMode==='cpu' && c.team===2 && state.cpuActiveUid===c.uid){
      state.cpuActiveUid = null;
      state.cpuFadeUid = c.uid;
      state.cpuFadeStartTime = Date.now();
      const fadeUid = c.uid;
      setTimeout(()=>{
        if(state.cpuFadeUid===fadeUid){
          state.cpuFadeUid = null;
          if(state.phase==='battle') render();
        }
      }, 6000); // 3s fully lit + 3s fade-out, kept in sync with the CSS animation below
    }
    if(c.status.poison>0 && c.alive){
      c.hp -= 2;
      log(`<b>${c.def.name}</b> takes 2 poison damage.`, 'miss');
      if(c.hp<=0){ defeat(c); }
    }
    ['poison','legbreak','armbreak','blind','regen','confuse'].forEach(k=>{
      if(k==='legbreak' && c.trapLegbreakFreshThisTurn){ c.trapLegbreakFreshThisTurn=false; return; }
      if(c.status[k]>0) c.status[k]--;
    });
  }
  if(checkWin()) return;
  // Specter's Possess: if the turn that's ending belonged to a possessed
  // character, it doesn't advance straight to the next turn — Specter's
  // controller picks where Specter reappears first (see
  // resolvePossessLanding), which itself calls advanceToLivingTurn once
  // that's resolved.
  if(c && c.alive && state.possession && state.possession.targetUid===c.uid){
    resolvePossessLanding(c);
    return;
  }
  if(c && c.alive && state.hasteQueuedUid===c.uid){
    startHasteBonusTurn(c);
    return;
  }
  state.hasteQueuedUid = null;
  state.hasteActiveUid = null;
  advanceToLivingTurn(false);
}

// Specter's Possess: called once the possessed character's hijacked turn
// ends. Specter's controller — not the host's own side — picks a tile within
// Possess's landRange of the host's (possibly now-moved) position for Specter
// to reappear on, ending the possession. Same CPU-vs-interactive split as the
// pick-up-and-move mechanic.
function resolvePossessLanding(target){
  const specter = getByUid(state.possession.specterUid);
  if(!specter || !specter.alive){
    // Specter is gone somehow — just clear the dangling link and continue.
    state.possession = null;
    advanceToLivingTurn(false);
    return;
  }
  const range = specter.def.special.landRange!==undefined ? specter.def.special.landRange : 1;
  const specterIsCpu = state.vsMode==='cpu' && specter.team===2;
  if(specterIsCpu){
    const dest = pickPossessLandingDest(target, specter, range);
    if(dest){
      specter.x = dest.x; specter.y = dest.y; specter.elevated = isElevatedGround(dest.x, dest.y);
      checkHeartTokenPickup(specter);
      checkTrapTrigger(specter); checkCropTrigger(specter);
      checkTeleportDoorway(specter);
      log(`<b>${specter.def.name}</b> reappears near <b>${target.def.name}</b>, no longer possessing them.`, '');
      state.possession = null;
      // Specter's movedThisTurn was set true back when it originally cast
      // Possess (see resolveSpecial) — that flag has had no reason to be
      // touched since, across however many turns it spent invisible. Reset it
      // (and actedThisTurn/undo) explicitly right here rather than trusting
      // it'll happen whenever Specter's own next turn eventually starts.
      specter.movedThisTurn = false; specter.actedThisTurn = false;
      specter.undoX = undefined; specter.undoY = undefined; specter.undoElevated = undefined;
    } else {
      // Extremely unlikely (every tile within range blocked/occupied) — leave
      // the link active rather than strand Specter; it'll get another chance
      // the next time this same character's turn comes back around.
      log(`&mdash; <b>${specter.def.name}</b> has nowhere to land and stays hidden with <b>${target.def.name}</b> for now.`, 'miss');
    }
    advanceToLivingTurn(false);
  } else {
    state.pendingPossessLand = { specterUid: specter.uid, targetUid: target.uid, targetX: target.x, targetY: target.y, range };
    state.mode = 'possessLandSelect';
    log(`&mdash; choose a tile within R${range} of <b>${target.def.name}</b> for <b>${specter.def.name}</b> to land on.`, '');
  }
}
// CPU's choice of where Specter lands after Possess ends — any valid tile
// within range of the host's final position, preferring one that keeps
// Specter away from the host's own team (same isolation instinct as a normal
// relocate pick).
function pickPossessLandingDest(target, specter, range){
  const theirAllies = teamOf(target).instances.filter(e=>e.alive && e.uid!==target.uid);
  let best = null, bestScore = -Infinity;
  for(let ty=Math.max(0,target.y-range); ty<=Math.min(BOARD_ROWS-1,target.y+range); ty++){
    for(let tx=Math.max(0,target.x-range); tx<=Math.min(BOARD_COLS-1,target.x+range); tx++){
      if(manhattan(target,{x:tx,y:ty})>range) continue;
      const hazardHere = isHazardTile(tx,ty);
      if(terrainAt(tx,ty)===2 && !hazardHere) continue;
      if(hazardHere && !(specter.def.abilities||{}).float) continue;
      if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
      const score = theirAllies.length ? Math.min(...theirAllies.map(a=>manhattan({x:tx,y:ty},a))) : Math.random();
      if(score>bestScore){ bestScore=score; best={x:tx,y:ty}; }
    }
  }
  return best;
}

// Specter's Possess: Specter shares its host's tile for the whole duration of
// the possession, so ANY involuntary repositioning of the host (push back,
// being picked up and thrown, a teleport doorway, a rearrange, etc.) has to
// drag Specter along with it — otherwise the two visibly separate, which
// breaks both the "invisible passenger" fiction and the untargetability logic
// (enemyTeamOf only hides Specter on the assumption it's riding along).
// Call this right after finalizing any such move.
function syncPossessedSpecter(host){
  if(!state.possession || state.possession.targetUid!==host.uid) return;
  const specter = getByUid(state.possession.specterUid);
  if(!specter) return;
  specter.x = host.x; specter.y = host.y; specter.elevated = host.elevated;
}
function defeat(c){
  c.alive=false; c.hp=0;
  log(`<b>${c.def.name}</b> has been defeated!`, 'crit');
  if(state.possession && state.possession.targetUid===c.uid){
    // Specter's Possess: the host died before its own turn ever came up to
    // trigger the normal landing step (see endTurnAdvance/resolvePossessLanding).
    // Specter's x/y already matches the host's (they share a tile while
    // possessing), so it simply becomes visible there again immediately.
    const specter = getByUid(state.possession.specterUid);
    if(specter) log(`&mdash; <b>${specter.def.name}</b> is expelled as <b>${c.def.name}</b> falls.`, '');
    state.possession = null;
  }
  if(state.guardAuraSourceUid===c.uid){
    state.guardAuraSourceUid = null;
    log(`&mdash; <b>${c.def.name}</b>'s Guard aura fades.`, '');
  }
  // Drops a heart token on the tile they died on — the next character (either
  // side) to stop there heals 1 HP and the token is consumed. If a token is
  // somehow already sitting on that exact tile, it isn't duplicated.
  if(!state.heartTokens.some(h=>h.x===c.x && h.y===c.y)){
    state.heartTokens.push({x:c.x, y:c.y});
  }
}

// Checks whether a character has just come to rest on a heart-token tile (dropped
// by a defeated character) and, if so, heals them 1 HP (never past their max) and
// removes that token. Call this at the end of every action that finalizes a
// character's new position — normal move, bridge move, teleport, dash, push-back,
// rearrange.
function checkHeartTokenPickup(c, undoable){
  if(!c.alive) return;
  const idx = state.heartTokens.findIndex(h=>h.x===c.x && h.y===c.y);
  if(idx===-1) return;
  state.heartTokens.splice(idx,1);
  const healedAmount = Math.min(1, c.maxHp-c.hp);
  if(healedAmount>0){
    c.hp += healedAmount;
    log(`<b>${c.def.name}</b> picks up a heart token &mdash; +1 HP.`, '');
  } else {
    log(`<b>${c.def.name}</b> picks up a heart token, but is already at full HP.`, '');
  }
  // Only tracked for undo when reached via a normal (undoable) move — teleporting,
  // dashing, being pushed back, or being rearranged are never undoable anyway.
  if(undoable) c.pendingHeartUndo = {x: c.x, y: c.y, healedAmount};
}

// Checks whether a character has just come to rest on an enemy-laid trap tile
// (their own team's traps never affect them at all — no check needed for that
// case, since reachableTiles already lets them pass through/stand on those
// freely with zero interaction). Deals D3 + Leg Break 1 and consumes the trap.
function checkTrapTrigger(c, undoable){
  if(!c.alive) return;
  const idx = state.traps.findIndex(t=>t.x===c.x && t.y===c.y && t.team!==c.team);
  if(idx===-1) return;
  const trapTeam = state.traps[idx].team;
  state.traps.splice(idx,1);
  const preHp = c.hp, preLegbreak = c.status.legbreak;
  const dealt = applyDamage(c, 3, null);
  applyStatus(c, 'legbreak', 1);
  // Applied mid-turn to the character whose OWN turn is currently in progress —
  // without this flag, endTurnAdvance's end-of-turn decay (which runs on this same
  // character in a few moments) would immediately tick it back down to 0 before
  // they ever got a turn where it actually prevented anything.
  c.trapLegbreakFreshThisTurn = true;
  log(`<b>${c.def.name}</b> triggers a trap &mdash; -${dealt} HP and Leg Break 1!`, 'miss');
  if(undoable) c.pendingTrapUndo = {x: c.x, y: c.y, team: trapTeam, preHp, preLegbreak};
}

// Farmer's Plant: unlike a trap (checkTrapTrigger above), a crop isn't
// harmless to its own team — it helps whoever laid it and hurts everyone
// else. Consumed the moment anyone lands on it, same trigger points as a
// trap (move, push, relocate, confuse-stumble, rearrange, teleport doorway).
function checkCropTrigger(c){
  if(!c.alive) return;
  const idx = state.crops.findIndex(t=>t.x===c.x && t.y===c.y);
  if(idx===-1) return;
  const cropTeam = state.crops[idx].team;
  state.crops.splice(idx,1);
  // Same principle as a trap or heart token: landing on a crop is a real,
  // committed consequence of the move, so Undo Move locks out once this fires
  // (see the button's disabled condition).
  c.pendingCropUndo = true;
  if(c.team===cropTeam){
    if(c.hp<c.maxHp){
      const healed = Math.min(2, c.maxHp-c.hp);
      c.hp += healed;
      log(`<b>${c.def.name}</b> lands on a crop &mdash; heals ${healed} HP.`, '');
    } else {
      log(`<b>${c.def.name}</b> lands on a crop, already at full HP.`, '');
    }
  } else {
    const dealt = applyDamage(c, 2, null);
    log(`<b>${c.def.name}</b> lands on a crop &mdash; -${dealt} HP.`, 'miss');
  }
}

// Pirate Ship's cabin/deck doorways: two linked tiles anywhere on the map — coming
// to rest on either one (by any means: walking, being pushed, dashed, picked up and
// relocated, rearranged) instantly relocates the character to the other. Unlike
// Desert Hideout's doorways this has a real mechanical effect, not just a visual.
function checkTeleportDoorway(c){
  if(!c.alive) return;
  const pair = TELEPORT_PAIRS.find(p => (p.a.x===c.x && p.a.y===c.y) || (p.b.x===c.x && p.b.y===c.y));
  if(!pair) return;
  const dest = (pair.a.x===c.x && pair.a.y===c.y) ? pair.b : pair.a;
  // If someone's already standing on the other side, stay put rather than stacking
  // two characters on one tile — a rare collision, but worth guarding against.
  if(occupantAt(dest.x, dest.y)) return;
  c.x = dest.x; c.y = dest.y; c.elevated = isElevatedGround(dest.x, dest.y);
  log(`<b>${c.def.name}</b> steps through the doorway and reappears on the other side.`, '');
  // Chain into whatever's waiting at the new spot.
  checkHeartTokenPickup(c);
  checkTrapTrigger(c); checkCropTrigger(c);
  syncPossessedSpecter(c);
}

// Guard is a live aura, not a one-time shield: it checks the source's current
// position and range every time damage is applied, so allies are only protected
// while they're actually standing within range at that moment.
function activeGuardReduction(target){
  const uid = state.guardAuraSourceUid;
  if(!uid) return 0;
  const source = getByUid(uid);
  if(!source || !source.alive) return 0;
  if(teamOf(source) !== teamOf(target)) return 0;
  const s = source.def.special;
  if(!s || !s.shield) return 0;
  if(manhattan(source, target) > s.shieldRange) return 0;
  return s.shield;
}

// "Auto" abilities are always-on passives, active for as long as the character is
// alive — no activation needed, unlike Guard which has to be cast and can drop.
// Currently only Vigilant's Locate: an enemy standing within her aura's range takes
// bonus damage from her OTHER allies' attacks (not from Vigilant's own attacks).
function activeAutoDamageBonus(attacker, target){
  if(!attacker || teamOf(attacker)===teamOf(target)) return 0;
  let bonus = 0;
  teamOf(attacker).instances.forEach(source=>{
    if(!source.alive || source.uid===attacker.uid) return;
    const auto = source.def.auto;
    if(!auto || auto.extraDmg===undefined || auto.range===undefined) return;
    if(manhattan(source, target) > auto.range) return;
    if(auto.straightOnly && !isOnStraightLine(source, target)) return;
    bonus += auto.extraDmg;
  });
  return bonus;
}

// Wanderer's Counter: a personal passive — ANY successful attack that actually
// lands damage on him, from anyone within R5 at the moment it lands, gets an
// automatic D1 strike back with no roll. Unlike Squire's Impede (a spendable
// reactive special that AVOIDS the original hit and only works at R1), Counter
// never negates the incoming damage, has no charge cost, and just adds this on
// top. Only fires when Wanderer survives the hit that triggered it, and only
// ever fires off a REAL attacker (the `attacker` param is null for trap/crop/
// scripted damage) — and the counter hit itself is dealt with attacker=null,
// so it can never chain into triggering a second Counter.
function triggerCounterAttack(target, attacker, dealt){
  if(!attacker || !dealt || !target.alive || attacker.uid===target.uid) return;
  if(teamOf(attacker)===teamOf(target)) return;
  const auto = target.def.auto;
  if(!auto || !auto.counterAll || auto.range===undefined) return;
  if(!attacker.alive) return;
  if(manhattan(target, attacker) > auto.range) return;
  const dealtBack = applyDamage(attacker, auto.dmg||1, null);
  log(`<b>${target.def.name}</b> Counters &mdash; <b>${attacker.def.name}</b> -${dealtBack} HP (no roll).`, '');
}

/* ============== MOVEMENT ============== */
function reachableTiles(c){
  const maxMove = c.move !== undefined ? c.move : c.def.move;
  const abilities = c.def.abilities || {};
  const climb = abilities.jump || 1; // how many height levels this character can climb (up OR down) in one step
  const startElevated = !!c.elevated;
  // waterEntryStep tracks the exact step-cost at which water was first entered on this path (null = never).
  // Once you take ANY step beyond that point — even staying in water — the 2-point tax applies to the
  // whole move. Stopping exactly on the step you first touch water (your very last step) stays free.
  const startWaterEntryStep = (terrainAt(c.x,c.y)===1 && !abilities.float) ? 0 : null;
  const start = {x:c.x,y:c.y,cost:0,elevated:startElevated,waterEntryStep:startWaterEntryStep};
  const best = {}; // key "x,y,elevated,waterEntryStep" -> cost, prevents revisiting a worse-or-equal state
  const keyState = (x,y,el,wes)=> x+','+y+','+(el?1:0)+','+(wes===null?'n':wes);
  best[keyState(start.x,start.y,start.elevated,start.waterEntryStep)] = 0;
  const queue=[start];
  while(queue.length){
    const cur = queue.shift();
    const curHeight = effectiveHeightAt(cur.x,cur.y,cur.elevated);
    const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(const [dx,dy] of dirs){
      const nx=cur.x+dx, ny=cur.y+dy;
      if(nx<0||nx>=BOARD_COLS||ny<0||ny>=BOARD_ROWS) continue;
      if(isEdgeBlocked(cur.x,cur.y,dx,dy)) continue; // a wall on just this one border — always blocks, no bypass
      const terr = terrainAt(nx,ny);
      const hazardHere = isHazardTile(nx,ny);
      // A pit or lava tile can be leapt over by a jump>=2 character, or freely
      // crossed (and even stood on) by a Float character — passable in transit,
      // but for anyone else never a place to stop (filtered out of the final
      // candidates below). This check is independent of the tile's underlying
      // terrain value — a hazard sitting on plain ground still needs Jump 2+ or
      // Float, the same as one sitting on wall terrain. Every other wall/tree/
      // crate (terrain 2 with no hazard tag) stays always impassable regardless
      // of height, jump, "through", or float.
      if(terr===2 && !hazardHere) continue;
      if(hazardHere && !abilities.float && (abilities.jump||0) < 2) continue;
      // On maps where water is a genuine impassable ocean (not a taxed shallow
      // crossing), it's a hard block for anyone without Float — same treatment as
      // a wall, not a distance penalty.
      if(terr===1 && WATER_IMPASSABLE && !abilities.float) continue;
      // Height check applies both climbing up AND dropping down — you can only change
      // height by your climb capacity (1 normally, or your Jump value) in either direction.
      const nextHeightIfElevated = effectiveHeightAt(nx,ny,true);
      const nextHeightIfGrounded = effectiveHeightAt(nx,ny,false);
      // Elevation carries over onto bridge tiles; roof always sets it; anything else grounds it.
      const nextElevated = (isBridgeTile(nx,ny) ? cur.elevated : isElevatedGround(nx,ny));
      const nextHeight = nextElevated ? nextHeightIfElevated : nextHeightIfGrounded;
      if(Math.abs(nextHeight - curHeight) > climb) continue; // too steep to climb or drop
      const occ = occupantAt(nx,ny,nextElevated);
      if(occ && occ.team!==c.team && !abilities.through) continue;
      const total = cur.cost+1; // every step costs 1 — the water tax (if any) is only resolved once a final stop is chosen
      const nextWaterEntryStep = (terr===1 && !abilities.float) ? (cur.waterEntryStep===null ? total : cur.waterEntryStep) : cur.waterEntryStep;
      if(total>maxMove) continue; // search with the full budget; water's 2-point tax is applied later
      const sKey = keyState(nx,ny,nextElevated,nextWaterEntryStep);
      if(best[sKey]!==undefined && best[sKey]<=total) continue;
      best[sKey]=total;
      // An enemy trap stops you the moment you touch it — you can land there, but
      // never continue past it to reach anything beyond. Your own team's traps
      // don't affect you at all, so they don't block anything. Ice works the same
      // way, but for everyone regardless of team, and it's a fixed map feature
      // rather than something either side placed.
      const enemyTrapHere = state.traps.some(t=>t.x===nx && t.y===ny && t.team!==c.team);
      const iceHere = isIceTile(nx,ny);
      if(!enemyTrapHere && !iceHere) queue.push({x:nx,y:ny,cost:total,elevated:nextElevated,waterEntryStep:nextWaterEntryStep});
    }
    // Jump: hop clean over a water gap exactly 1 tile wide, landing on solid ground, no water penalty
    if(abilities.jump){
      for(const [dx,dy] of dirs){
        const wx=cur.x+dx, wy=cur.y+dy;
        if(terrainAt(wx,wy)!==1) continue;
        const lx=cur.x+2*dx, ly=cur.y+2*dy;
        if(lx<0||lx>=BOARD_COLS||ly<0||ly>=BOARD_ROWS) continue;
        if(terrainAt(lx,ly)!==0) continue;
        if(isHazardTile(lx,ly) && !abilities.float && (abilities.jump||0) < 2) continue;
        const locc = occupantAt(lx,ly,false);
        if(locc && locc.team!==c.team && !abilities.through) continue;
        const total = cur.cost+1; // jump costs like a normal step — you cleared the water, didn't walk in it, entry point unchanged
        if(total>maxMove) continue;
        const sKey = keyState(lx,ly,false,cur.waterEntryStep);
        if(best[sKey]!==undefined && best[sKey]<=total) continue;
        best[sKey]=total;
        if(!isIceTile(lx,ly)) queue.push({x:lx,y:ly,cost:total,elevated:false,waterEntryStep:cur.waterEntryStep});
      }
    }
  }
  const candidates = {}; // key "x,y,elevated" -> cheapest valid cost among waterEntryStep variants
  Object.keys(best).forEach(k=>{
    const parts = k.split(',');
    const x = Number(parts[0]), y = Number(parts[1]), elevated = parts[2]==='1';
    const wesRaw = parts[3];
    const waterEntryStep = wesRaw==='n' ? null : Number(wesRaw);
    if(x===c.x&&y===c.y) return;
    const cost = best[k];
    // Taxed once you've taken any step beyond the point you first touched water — stopping
    // exactly on the step you entered water (your last step) stays free.
    const taxed = waterEntryStep!==null && cost>waterEntryStep;
    // Characters with only 2 total move get a lighter water tax (-1 instead of the
    // usual -2) — a flat -2 would strand a 2-move character at the water's edge
    // every single turn, so this is judged against their permanent base Move stat,
    // not any temporary buff/debuff to it.
    const waterTax = c.def.move===2 ? 1 : 2;
    const effectiveBudget = taxed ? maxMove-waterTax : maxMove;
    if(cost > effectiveBudget) return;
    const dKey = x+','+y+','+(elevated?1:0);
    if(candidates[dKey]===undefined || candidates[dKey].cost>cost){
      candidates[dKey] = {x,y,elevated,cost};
    }
  });
  const results=[];
  Object.values(candidates).forEach(cand=>{
    if(isHazardTile(cand.x,cand.y) && !abilities.float) return; // can never stop on a pit or lava tile, unless you Float (stands on top)
    const occ = occupantAt(cand.x,cand.y,cand.elevated);
    if(occ) return; // can't end on that specific layer if occupied
    // Splitter's Portal: the opposing team can walk ACROSS a portal (nothing
    // above stops the search from continuing through it), but can never end
    // their move standing on one — only the owning team's allies actually use
    // them (see the move-click handler for the walk-through choice).
    const portal = portalAt(cand.x,cand.y);
    if(portal && portal.team!==c.team) return;
    results.push({x:cand.x,y:cand.y,elevated:cand.elevated});
  });
  // Exposed (as a plain extra property, not a second return value) so Huntress's
  // Sense can reconstruct whatever path was actually walked to a given
  // destination — every other caller just uses the array normally and never
  // touches this.
  results.costMap = best;
  return results;
}

// Reconstructs A valid shortest path (not necessarily the literal one the BFS
// happened to explore first, but an equally-short one) from a reachableTiles()
// cost map, walking backward from the destination through orthogonal
// neighbors one cost-step cheaper, back down to the mover's own tile. Used
// only by Huntress's Sense, to check whether a move passed near her even when
// the destination itself doesn't.
// Cheapest recorded cost to stand at (x,y) in a reachableTiles() cost map —
// same lookup reconstructMovePath uses internally, exposed here for Splitter's
// Portal (needs the raw step-cost to a specific tile, not a full path).
function costToTile(costMap, x, y){
  let best;
  for(const k in costMap){
    const parts = k.split(',');
    if(Number(parts[0])===x && Number(parts[1])===y){
      if(best===undefined || costMap[k]<best) best = costMap[k];
    }
  }
  return best;
}
function reconstructMovePath(destX, destY, costMap){
  const costOf = (x,y) => {
    let best;
    for(const k in costMap){
      const parts = k.split(',');
      if(Number(parts[0])===x && Number(parts[1])===y){
        if(best===undefined || costMap[k]<best) best = costMap[k];
      }
    }
    return best;
  };
  let curX = destX, curY = destY, curCost = costOf(curX, curY);
  const path = [{x:curX,y:curY}];
  if(curCost===undefined) return path;
  const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
  let guard = 0;
  while(curCost>0 && guard<200){
    guard++;
    let stepped = false;
    for(const [dx,dy] of dirs){
      const nx=curX+dx, ny=curY+dy;
      const nCost = costOf(nx,ny);
      if(nCost===curCost-1){ curX=nx; curY=ny; curCost=nCost; path.push({x:curX,y:curY}); stepped=true; break; }
    }
    if(!stepped) break; // e.g. a jumped-over water tile has no cost-1 neighbor — path ends a step early, still good enough to check
  }
  return path;
}

// Huntress's Sense: a passive reaction, not something spent on her own turn —
// whenever an ENEMY's movement path comes within range of a living, awake,
// unbroken-armed Huntress, it rolls right then to shoot them, even if they
// don't stop on the tile that triggered it. Call this after any movement that
// represents actually walking (a normal Move, or a forced push-back) — not
// after instant relocations like teleports, dashes, vaults, or being picked up
// and set down, which aren't "walking into range."
function checkSenseReactions(mover, path){
  if(!mover || !mover.alive || !path || !path.length) return;
  const watchers = enemyTeamOf(mover).instances.filter(h=>
    h.alive && effectiveBasic(h).senseReaction && h.status.sleep<=0 && h.status.armbreak<=0);
  watchers.forEach(huntress=>{
    if(!mover.alive) return; // an earlier Huntress's reaction this same move already finished them
    const ability = effectiveBasic(huntress);
    if(!path.some(p=> manhattan(p, huntress) <= ability.range)) return;
    const roll = blindRoll(); // Sense's own table: only a 2 or 3 connects
    if(roll.result==='miss'){
      log(`<b>${huntress.def.name}</b>'s Sense reacts to <b>${mover.def.name}</b> walking into range &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const dmg = (ability.dmg||0) + (huntress.basicBonus||0);
    const dealt = applyDamage(mover, dmg, huntress);
    log(`<b>${huntress.def.name}</b>'s Sense reacts to <b>${mover.def.name}</b> walking into range &mdash; rolled ${roll.roll}: -${dealt} HP.`, '');
  });
}

// Undertaker's Tomb: unlike a normal trap, these never stop movement — an
// enemy just walks straight across, taking D2 for every distinct trap tile
// their path actually touches. If that path crossed more than one DIFFERENT
// status type in the same move, only one of them actually lands, and (when
// it's genuinely their own turn making the move, not just being thrown into
// the traps by someone else's attack) the affected player picks which.
function checkTombTrapTriggers(mover, path){
  if(!mover || !mover.alive || !path || !path.length) return;
  const hitTraps = [];
  path.forEach(p=>{
    const trap = state.tombTraps.find(t=>t.x===p.x && t.y===p.y && t.team!==mover.team);
    if(trap && !hitTraps.includes(trap)) hitTraps.push(trap);
  });
  if(!hitTraps.length) return;
  let totalDealt = 0;
  hitTraps.forEach(()=>{ totalDealt += applyDamage(mover, 2, null); });
  hitTraps.forEach(t=>{
    const idx = state.tombTraps.indexOf(t);
    if(idx!==-1) state.tombTraps.splice(idx,1);
  });
  if(!mover.alive) return;
  const distinctStatuses = [...new Set(hitTraps.map(t=>t.status))];
  if(distinctStatuses.length===1){
    applyStatus(mover, distinctStatuses[0], 1);
    log(`<b>${mover.def.name}</b> walks through a Tomb trap &mdash; -${totalDealt} HP and ${STATUS_DISPLAY_NAME[distinctStatuses[0]]||distinctStatuses[0]}.`, 'miss');
    return;
  }
  // A genuine interactive choice only makes sense when this is the mover's own
  // move on their own turn — if they were thrown through the traps by an
  // opposing attack mid-someone-else's-turn instead, there's no clean way to
  // pause and hand control to them right then, so it's just picked for them.
  const isMoversOwnMove = currentChar() && currentChar().uid===mover.uid;
  const moverIsCpu = state.vsMode==='cpu' && mover.team===2;
  if(!isMoversOwnMove || moverIsCpu){
    const chosen = distinctStatuses[Math.floor(Math.random()*distinctStatuses.length)];
    applyStatus(mover, chosen, 1);
    log(`<b>${mover.def.name}</b> walks through several Tomb traps &mdash; -${totalDealt} HP, ends up with ${STATUS_DISPLAY_NAME[chosen]||chosen}.`, 'miss');
    return;
  }
  log(`<b>${mover.def.name}</b> walks through several Tomb traps &mdash; -${totalDealt} HP so far. Choose which effect lands.`, 'miss');
  state.pendingTombChoice = { moverUid: mover.uid, options: distinctStatuses, dealt: totalDealt };
  state.mode = 'tombChoiceSelect';
}

/* ============== ATTACK RESOLUTION ============== */
function basicAttackRoll(targetAsleep){
  const r = rollDie();
  // A sleeping target can't dodge, flinch, or counter — a 1 just lands clean
  // instead of triggering the usual miss-counter, and 5 is the only roll left
  // that still misses. A 6 was already a hit (crit) either way.
  if(targetAsleep){
    if(r===5) return {result:'miss', roll:r};
    if(r===6) return {result:'crit', roll:r};
    return {result:'hit', roll:r};
  }
  if(r===1) return {result:'miss-counter', roll:r};
  if(r===5) return {result:'miss', roll:r};
  if(r===6) return {result:'crit', roll:r};
  return {result:'hit', roll:r};
}
// Shared "attacking while Blind" roll table: only a 2 or 3 connects. Used by every
// attack type (basic, special, confused-basic) when the attacker is Blind. Blind is
// the ATTACKER's own impairment, so it takes priority over the target being asleep
// wherever both could apply — see each call site's isBlind-first ordering.
function blindRoll(){
  const r = rollDie();
  return (r===2||r===3) ? {result:'hit', roll:r} : {result:'miss', roll:r};
}
function specialAttackRoll(isBlind, targetAsleep){
  if(isBlind) return blindRoll();
  // A sleeping target: only a 5 misses, everything else (including 1 and 6, which
  // normally both miss for a special) connects.
  if(targetAsleep){
    const r = rollDie();
    return r===5 ? {result:'miss', roll:r} : {result:'hit', roll:r};
  }
  const r = rollDie();
  if(r===1||r===5||r===6) return {result:'miss', roll:r};
  return {result:'hit', roll:r};
}

// Enforcer's Shield: a personal passive damage cap, not tied to position or an aura
// (so it applies even alone) — the incoming hit's raw size decides how much actually
// gets through, regardless of who dealt it or from how far away.
function activeShieldTierReduction(target, incomingDmg){
  const auto = target.def.auto;
  if(!auto || !auto.damageTiers || incomingDmg<=1) return 0;
  for(const [maxDmg, takeDmg] of auto.damageTiers){
    if(incomingDmg<=maxDmg) return Math.max(0, incomingDmg-takeDmg);
  }
  return 0;
}

function applyDamage(target, dmg, attacker){
  const hpBefore = target.hp;
  let d = dmg;
  if(attacker) d += activeAutoDamageBonus(attacker, target);
  const guardReduction = activeGuardReduction(target);
  if(guardReduction>0) d = Math.max(0, d - guardReduction);
  const shieldTierReduction = activeShieldTierReduction(target, d);
  if(shieldTierReduction>0) d = Math.max(0, d - shieldTierReduction);
  if(target.shield>0){
    const absorbed = Math.min(target.shield, d);
    target.shield -= absorbed; d -= absorbed;
  }
  target.hp -= d;
  if(target.hp<=0 && target.alive){ defeat(target); }
  const dealt = hpBefore - target.hp;
  if(attacker) triggerCounterAttack(target, attacker, dealt);
  // Returns the ACTUAL HP lost, after auto-damage bonuses, Guard reduction, shield
  // tier reduction, and shield absorption — this can differ from the `dmg` passed
  // in, so callers should use this return value (not the nominal dmg) when writing
  // battle-log text, or the log will state a different number than the HP that
  // actually came off the target.
  return dealt;
}

function applyStatus(target, key, dur){
  if(!target.alive) return;
  target.status[key] = Math.max(target.status[key], dur);
}

function pushBackTarget(attacker, target, distance, opts){
  // ignoreCharacters (Bender's Basic/Aero): the pushed unit barrels straight
  // through anyone else standing in the way — allies or enemies — instead of
  // stopping on them. Only real obstructions (walls/edges/steep ledges) or a
  // fall still stop it, same as a normal push.
  const ignoreCharacters = !!(opts && opts.ignoreCharacters);
  const dx = Math.sign(target.x-attacker.x), dy = Math.sign(target.y-attacker.y);
  if(dx===0 && dy===0) return {moved:0, collision:null};
  let moved = 0;
  const path = [{x:target.x, y:target.y}];
  // 'character' = stopped by someone else in the way (no confuse). 'obstruction' =
  // wall/tree/board edge/pushed UP too steep a ledge (confuses). 'fall' = pushed
  // OFF a ledge with a drop of 2+ (lands on the lower tile, takes 1 fall damage,
  // does NOT confuse). null = pushed the full distance clean.
  let collision = null;
  for(let i=0;i<distance;i++){
    const nx = target.x+dx, ny = target.y+dy;
    if(nx<0||nx>=BOARD_COLS||ny<0||ny>=BOARD_ROWS){ collision='obstruction'; break; }
    if(terrainAt(nx,ny)===2){ collision='obstruction'; break; } // tree/wall
    if(!ignoreCharacters && occupantAt(nx,ny,target.elevated)){ collision='character'; break; }
    const h1 = effectiveHeightAt(target.x,target.y,target.elevated);
    const h2 = effectiveHeightAt(nx,ny,target.elevated);
    const heightDelta = h2-h1;
    if(heightDelta>=2){ collision='obstruction'; break; } // can't be pushed UP a tall ledge
    if(heightDelta<=-2){
      // Falls off the ledge: lands on the lower tile and the push stops there.
      target.x = nx; target.y = ny; moved++;
      path.push({x:nx,y:ny});
      applyDamage(target, 1, attacker);
      collision = 'fall';
      break;
    }
    target.x = nx; target.y = ny; moved++;
    path.push({x:nx,y:ny});
  }
  if(moved>0){
    checkHeartTokenPickup(target); checkTrapTrigger(target); checkCropTrigger(target);
    // Being shoved is still being forced to walk through the tiles in between —
    // Huntress's Sense doesn't care whether the movement was voluntary.
    checkSenseReactions(target, path);
    checkTombTrapTriggers(target, path);
    syncPossessedSpecter(target);
  }
  return {moved, collision};
}

function resolveConfusedBasic(attacker){
  const b = effectiveBasic(attacker);
  const normalTargetsAlly = b.targetType==='ally'; // healers like Priest work in reverse
  const pool = normalTargetsAlly
    ? enemyTeamOf(attacker).instances.filter(c=>c.alive)
    : teamOf(attacker).instances.filter(c=>c.alive && c.uid!==attacker.uid);
  if(!pool.length){
    log(`<b>${attacker.def.name}</b> is Confused but has no ${normalTargetsAlly?'enemy to heal':'ally to attack'}.`, 'miss');
    attacker.movedThisTurn = true;
    return;
  }
  // "Nearest" is decided from wherever the attacker is standing right now.
  let nearest = pool[0], nearestDist = manhattan(attacker,pool[0]);
  pool.forEach(p=>{ const d=manhattan(attacker,p); if(d<nearestDist){ nearest=p; nearestDist=d; } });

  // A confused character still has to move toward that target, following normal movement
  // rules (terrain, height, obstacles, leg break). If the player already moved manually
  // this turn, that move stands and this just attacks (or doesn't) from where they are.
  if(!attacker.movedThisTurn && attacker.status.legbreak<=0){
    const reach = reachableTiles(attacker);
    const options = [{x:attacker.x,y:attacker.y,elevated:attacker.elevated}, ...reach];
    // For exact-range abilities, "closer" means closer to matching the required
    // distance exactly, not just closer to the target.
    const rankDist = d => b.exactRange ? Math.abs(d-b.range) : d;
    let best = options[0], bestInRange = canReach(best,nearest,b), bestDist = rankDist(distanceFor(best,nearest,b));
    options.forEach(opt=>{
      const d = distanceFor(opt,nearest,b);
      const optInRange = canReach(opt,nearest,b);
      const rd = rankDist(d);
      if(optInRange && !bestInRange){ best=opt; bestInRange=true; bestDist=rd; }
      else if(optInRange===bestInRange && rd<bestDist){ best=opt; bestDist=rd; }
    });
    if(best.x!==attacker.x || best.y!==attacker.y){
      attacker.undoX=attacker.x; attacker.undoY=attacker.y; attacker.undoElevated=attacker.elevated;
      attacker.pendingHeartUndo=undefined; attacker.pendingTrapUndo=undefined;
      attacker.x=best.x; attacker.y=best.y; attacker.elevated=best.elevated;
      log(`<b>${attacker.def.name}</b> is Confused and stumbles toward <b>${nearest.def.name}</b>.`);
      checkHeartTokenPickup(attacker, true);
      checkTrapTrigger(attacker, true); checkCropTrigger(attacker);
      checkTeleportDoorway(attacker);
      syncPossessedSpecter(attacker);
    }
  }
  attacker.movedThisTurn = true;

  // Only attack if the nearest target ended up within basic attack range.
  if(!canReach(attacker,nearest,b)){
    log(`<b>${attacker.def.name}</b> is Confused and can't reach anyone to attack.`, 'miss');
    return;
  }
  const isBlind = attacker.status.blind>0;
  const roll = isBlind ? blindRoll() : basicAttackRoll(nearest.status.sleep>0);
  if(roll.result==='miss-counter'){
    if(canReach(attacker,nearest,effectiveBasic(nearest))){
      const recoil = applyDamage(attacker, 1, nearest);
      log(`<b>${attacker.def.name}</b> is Confused, stumbles attacking <b>${nearest.def.name}</b> &mdash; rolled 1: miss! <b>${nearest.def.name}</b> counters for ${recoil} recoil dmg.`, 'miss');
    } else {
      log(`<b>${attacker.def.name}</b> is Confused, stumbles attacking <b>${nearest.def.name}</b> &mdash; rolled 1: miss! (out of <b>${nearest.def.name}</b>'s range, no counter)`, 'miss');
    }
  } else if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> is Confused, attacks <b>${nearest.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
  } else {
    const isCrit = roll.result==='crit';
    if(normalTargetsAlly){
      nearest.hp = Math.min(nearest.maxHp, nearest.hp+2);
      log(`<b>${attacker.def.name}</b> is Confused &mdash; rolled ${roll.roll}${isCrit?' CRITICAL':''}: heals enemy <b>${nearest.def.name}</b> for 2 HP!`, isCrit?'crit':'');
    } else {
      const dealt = applyDamage(nearest, 2, attacker);
      if(isCrit && nearest.specialCharges>0){ nearest.specialCharges--; }
      log(`<b>${attacker.def.name}</b> is Confused &mdash; rolled ${roll.roll}${isCrit?' CRITICAL':''}: attacks ally <b>${nearest.def.name}</b> for ${dealt} HP!${isCrit?' (special charge lost)':''}`, isCrit?'crit':'');
    }
  }
}

// For a lineAttack ability (Vigilant's boomerang): once the player has clicked a
// specific enemy, that click just tells us which of the 4 cardinal directions she's
// throwing in — the attack then hits everyone along that whole line, not just the
// tile that was clicked.
function lineDirectionTo(attacker, target){
  return { dx: Math.sign(target.x - attacker.x), dy: Math.sign(target.y - attacker.y) };
}
function enemiesInLineFrom(attacker, abilityDef, dir){
  const enemies = [];
  let cx = attacker.x, cy = attacker.y;
  const attackerHeight = effectiveHeightAt(attacker.x, attacker.y, attacker.elevated);
  for(let step=1; step<=abilityDef.range; step++){
    // A wall on the border itself, or a solid wall/tree tile, normally stops the
    // line dead — nothing behind it gets hit, same as any physical projectile.
    // ignoreObstacles (Shifu's Shockwave) skips both checks: the shot passes
    // straight through walls just like it already passes through enemies.
    if(!abilityDef.ignoreObstacles && isEdgeBlocked(cx,cy,dir.dx,dir.dy)) break;
    const tx = cx + dir.dx, ty = cy + dir.dy;
    if(tx<0||tx>=BOARD_COLS||ty<0||ty>=BOARD_ROWS) break;
    if(!abilityDef.ignoreObstacles && terrainAt(tx,ty)===2) break;
    const occ = enemyTeamOf(attacker).instances.find(e=>e.alive && e.x===tx && e.y===ty);
    if(occ){
      enemies.push(occ);
      // Disciple's Fireball: explodes on first contact instead of piercing
      // through everyone in the line, unlike Vigilant's Grip or Bender's Aero.
      if(abilityDef.lineMaxHits!==undefined && enemies.length>=abilityDef.lineMaxHits) break;
    }
    // Lancer-style: a tile 2+ higher than the attacker, right at the very first
    // step, is as far as a spear thrust can reach — nothing beyond it is ever hit,
    // whether or not anyone's actually standing on that first tile.
    if(abilityDef.heightDowngradeThreshold!==undefined && step===1){
      const stepHeight = effectiveHeightAt(tx,ty, occ ? occ.elevated : isElevatedGround(tx,ty));
      if(stepHeight > attackerHeight && stepHeight >= abilityDef.heightDowngradeThreshold) break;
    }
    cx = tx; cy = ty;
  }
  return enemies;
}
// Every tile actually reachable along one direction of a lineAttack — used for the
// range-preview highlight, so it stops at exactly the same point enemiesInLineFrom
// would (a wall, or a tile 2+ higher right at the first step capping a spear's
// reach), rather than just shading the ability's raw range regardless of what's
// actually hittable there.
function lineTilesFrom(attacker, abilityDef, dir){
  const tiles = [];
  let cx = attacker.x, cy = attacker.y;
  const attackerHeight = effectiveHeightAt(attacker.x, attacker.y, attacker.elevated);
  for(let step=1; step<=abilityDef.range; step++){
    if(!abilityDef.ignoreObstacles && isEdgeBlocked(cx,cy,dir.dx,dir.dy)) break;
    const tx = cx + dir.dx, ty = cy + dir.dy;
    if(tx<0||tx>=BOARD_COLS||ty<0||ty>=BOARD_ROWS) break;
    if(!abilityDef.ignoreObstacles && terrainAt(tx,ty)===2) break;
    tiles.push({x:tx,y:ty});
    if(abilityDef.heightDowngradeThreshold!==undefined && step===1){
      const occ = enemyTeamOf(attacker).instances.find(e=>e.alive && e.x===tx && e.y===ty);
      const stepHeight = effectiveHeightAt(tx,ty, occ ? occ.elevated : isElevatedGround(tx,ty));
      if(stepHeight > attackerHeight && stepHeight >= abilityDef.heightDowngradeThreshold) break;
    }
    cx = tx; cy = ty;
  }
  return tiles;
}
function lineAttackRangeTiles(attacker, abilityDef){
  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  const out = [];
  dirs.forEach(dir=> out.push(...lineTilesFrom(attacker, abilityDef, dir)));
  return out;
}
// Orc's rolled barrel needs its own version of the line walk: a normal
// lineAttack only cares about walls (and, for a couple of abilities, a very
// tall first step), but a barrel is a physical object rolling along the
// ground — it can't climb, so ANY rise in height stops it dead, not just a
// wall or the board edge. Rolling downhill or along flat ground is fine.
function barrelRollTiles(attacker, abilityDef, dir){
  const tiles = [];
  let cx = attacker.x, cy = attacker.y;
  let curHeight = effectiveHeightAt(cx, cy, attacker.elevated);
  for(let step=1; step<=abilityDef.range; step++){
    if(isEdgeBlocked(cx,cy,dir.dx,dir.dy)) break;
    const tx = cx + dir.dx, ty = cy + dir.dy;
    if(tx<0||tx>=BOARD_COLS||ty<0||ty>=BOARD_ROWS) break;
    if(terrainAt(tx,ty)===2) break;
    const nextHeight = effectiveHeightAt(tx, ty, isElevatedGround(tx,ty));
    if(nextHeight > curHeight) break; // can't roll uphill
    tiles.push({x:tx,y:ty});
    cx = tx; cy = ty; curHeight = nextHeight;
  }
  return tiles;
}
function barrelRollRangeTiles(attacker, abilityDef){
  const dirs=[{dx:1,dy:0},{dx:-1,dy:0},{dx:0,dy:1},{dx:0,dy:-1}];
  const out = [];
  dirs.forEach(dir=> out.push(...barrelRollTiles(attacker, abilityDef, dir)));
  return out;
}
function resolveLineBasicAttack(attacker, target, forceAutoHit){
  const b = effectiveBasic(attacker);
  const dir = lineDirectionTo(attacker, target);
  const enemies = enemiesInLineFrom(attacker, b, dir);
  const roll = forceAutoHit ? {result:'hit', roll:null} : (attacker.status.blind>0 ? blindRoll() : basicAttackRoll());
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
    return;
  }
  if(b.lineTiers){
    // Lancer-style: each line position has its own fully separate damage+status
    // tier (not just a flat dmg/dmgOverflow split). heightDowngradeThreshold means
    // a target significantly elevated above the attacker gets treated as if they
    // were one tier further down the line — a spear thrust loses its full force
    // reaching upward, regardless of where they actually stand in the line.
    const attackerHeight = effectiveHeightAt(attacker.x, attacker.y, attacker.elevated);
    const notes = enemies.map((e)=>{
      // Use the enemy's actual grid distance from the attacker, not their position
      // in the array — if tile 1 is empty and only tile 2 has someone on it, that
      // enemy is still the array's first (and only) entry, but they're genuinely
      // standing 2 tiles out and must get the 2nd-tile tier, not the 1st.
      let tierIndex = manhattan(attacker, e) - 1;
      if(b.heightDowngradeThreshold!==undefined){
        const targetHeight = effectiveHeightAt(e.x, e.y, e.elevated);
        if(targetHeight > attackerHeight && targetHeight >= b.heightDowngradeThreshold){
          tierIndex = Math.min(tierIndex+1, b.lineTiers.length-1);
        }
      }
      const tier = b.lineTiers[Math.min(tierIndex, b.lineTiers.length-1)];
      const dealt = applyDamage(e, tier.dmg, attacker);
      if(tier.applyStatus) applyStatus(e, tier.applyStatus, tier.statusDur||1);
      return `<b>${e.def.name}</b> -${dealt}${tier.applyStatus?` (${STATUS_TOAST_LABELS[tier.applyStatus]||tier.applyStatus})`:''}`;
    });
    log(`<b>${attacker.def.name}</b> attacks &mdash; ${roll.roll===null?'automatically hits':'rolled '+roll.roll}: ${notes.length?notes.join(', '):'no one in range'}.`,'');
    return;
  }
  const dealtList = enemies.map((e,i)=>{
    const eDmg = (b.dmgOverflow!==undefined && i>=2) ? b.dmgOverflow : b.dmg;
    const dealt = applyDamage(e, eDmg, attacker);
    if(b.applyStatus) applyStatus(e, b.applyStatus, b.statusDur||1);
    return dealt;
  });
  const pushNotes = [];
  if(b.pushBack){
    // Bender's Basic: every enemy caught in the line gets shoved back the same
    // distance, passing straight through allies/enemies alike (pushIgnoresCharacters)
    // until a wall or the board edge stops them.
    enemies.forEach(e=>{
      if(!e.alive) return;
      const result = pushBackTarget(attacker, e, b.pushBack, {ignoreCharacters:!!b.pushIgnoresCharacters});
      if(result.collision==='obstruction'){
        applyStatus(e, 'confuse', 1);
        pushNotes.push(`<b>${e.def.name}</b> slams into an obstruction and is now Confused!`);
      } else if(result.collision==='fall'){
        pushNotes.push(`<b>${e.def.name}</b> is pushed off a ledge and falls, taking 1 damage!`);
      }
    });
  }
  const dmgNote = enemies.length
    ? enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ')
    : 'no one in range';
  const pushNote = pushNotes.length ? ` &mdash; ${pushNotes.join(' ')}` : '';
  log(`<b>${attacker.def.name}</b> attacks &mdash; ${roll.roll===null?'automatically hits':'rolled '+roll.roll}: hits ${dmgNote}.${pushNote}`,'');
}
// Vaporize's outcome logic — shared by the second use's normal single-target
// resolution (resolveSpecial's chargeCombo branch) — takes both already-rolled
// results and applies whichever of the 3 outcomes they add up to.
function resolveChargeComboOutcome(attacker, target, s, roll1, roll2){
  const success1 = roll1.result==='hit' || roll1.result==='crit';
  const success2 = roll2.result==='hit';
  if(success1 && success2){
    const dealt = applyDamage(target, s.dmg, attacker);
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; both attacks connect (rolled ${roll1.roll} and ${roll2.roll}): <b>${target.def.name}</b> takes a devastating -${dealt} HP!`, 'crit');
  } else if(success1 || success2){
    const enemies = enemyTeamOf(attacker).instances.filter(e=>e.alive);
    const notes = enemies.map(e=>`<b>${e.def.name}</b> -${applyDamage(e, s.dmgPartial, attacker)}`);
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; only one attack connects (rolled ${roll1.roll} and ${roll2.roll}): ${notes.join(', ')}.`, '');
  } else {
    const dealt = applyDamage(attacker, s.selfDmgFail, attacker);
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; both attacks fail (rolled ${roll1.roll} and ${roll2.roll}): the charge backfires for -${dealt} HP to themself!`, 'miss');
  }
}
// First use of a chargeCombo special (Vaporize): a plain roll with no target and no
// effect of any kind — it only gets recorded on the character (see statusLabel) so
// it's visible right on their card until the second use consumes it. Spends one of
// the two special charges by itself; the actual attack only happens on the second use.
// Uses the special-attack roll table (same as every other special, including
// Vaporize's own second roll) — not the basic-attack table, so a 6 is a miss here
// too, not a crit.
function chargeUpFirstAttack(attacker){
  const roll1 = specialAttackRoll(attacker.status.blind>0);
  attacker.chargeComboPending = { roll1 };
  attacker.specialCharges--;
}

function resolveLineSpecialAttack(attacker, target){
  const s = attacker.def.special;
  const dir = lineDirectionTo(attacker, target);
  const enemies = enemiesInLineFrom(attacker, s, dir);
  const roll = specialAttackRoll(attacker.status.blind>0);
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
    return;
  }
  const dealtList = enemies.map(e=> applyDamage(e, s.dmg, attacker));
  const pushNotes = [];
  if(s.pushBack){
    // Bender's Aero: same all-in-the-line push as his Basic, just farther.
    enemies.forEach(e=>{
      if(!e.alive) return;
      const result = pushBackTarget(attacker, e, s.pushBack, {ignoreCharacters:!!s.pushIgnoresCharacters});
      if(result.collision==='obstruction'){
        applyStatus(e, 'confuse', 1);
        pushNotes.push(`<b>${e.def.name}</b> slams into an obstruction and is now Confused!`);
      } else if(result.collision==='fall'){
        pushNotes.push(`<b>${e.def.name}</b> is pushed off a ledge and falls, taking 1 damage!`);
      }
    });
  }
  const notes = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
  const pushNote = pushNotes.length ? ` &mdash; ${pushNotes.join(' ')}` : '';
  // landAfterLast (Stalker's Swift): moves the attacker after a successful hit,
  // same "only on a hit" gating as any other vault-style attack. No landing
  // logic at all if the line found nobody to hit — nothing to land "after".
  let landNote = '';
  if(s.landAfterLast && enemies.length){
    const lastEnemy = enemies[enemies.length-1];
    const opts = stalkerLandingOptions(attacker, dir, lastEnemy);
    if(opts.forced){
      attacker.x = opts.forced.x; attacker.y = opts.forced.y; attacker.elevated = isElevatedGround(opts.forced.x, opts.forced.y);
      attacker.movedThisTurn = true;
      landNote = ` &mdash; <b>${attacker.def.name}</b> lands past <b>${lastEnemy.def.name}</b>!`;
      checkHeartTokenPickup(attacker);
      checkTrapTrigger(attacker); checkCropTrigger(attacker);
      checkTeleportDoorway(attacker);
      syncPossessedSpecter(attacker);
    } else if(opts.choices.length===1){
      const p = opts.choices[0];
      attacker.x = p.x; attacker.y = p.y; attacker.elevated = isElevatedGround(p.x, p.y);
      attacker.movedThisTurn = true;
      landNote = ` &mdash; the way ahead is blocked; <b>${attacker.def.name}</b> lands beside <b>${lastEnemy.def.name}</b>!`;
      checkHeartTokenPickup(attacker);
      checkTrapTrigger(attacker); checkCropTrigger(attacker);
      checkTeleportDoorway(attacker);
      syncPossessedSpecter(attacker);
    } else if(opts.choices.length===2){
      state.pendingStalkerLandOptions = opts.choices;
      state.pendingStalkerLandUid = attacker.uid;
      state.mode = 'stalkerLandSelect';
      landNote = ` &mdash; the way ahead is blocked; choose which side of <b>${lastEnemy.def.name}</b> to land on.`;
    } else {
      landNote = ` &mdash; no open tile to land on; <b>${attacker.def.name}</b> stays put.`;
    }
  }
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: hits ${notes||'no one in range'}.${pushNote}${landNote}`,'');
}

// Orc's BaRoll: rolls a barrel out along one of the 4 cardinal directions, up to
// wherever the player clicked — that click is a real destination choice, not
// just a direction, so the barrel doesn't have to travel its full range every
// time. It's blocked exactly like a real object rolling on the ground: a wall,
// the board edge, or any rise in height stops it (see barrelRollTiles — it
// can't roll uphill, even onto a low ledge). If it reaches an enemy before the
// chosen tile, that enemy takes the hit and the barrel stops just short of
// them instead of continuing on to the original destination. Either way,
// wherever it lands becomes a height-1 platform (see staticHeightAt) until Orc
// detonates it.
function resolveBarrelRollSpecialAttack(attacker, target){
  const s = attacker.def.special;
  const dir = lineDirectionTo(attacker, target);
  const tiles = barrelRollTiles(attacker, s, dir);
  const requestedSteps = Math.max(Math.abs(target.x-attacker.x), Math.abs(target.y-attacker.y));
  const roll = specialAttackRoll(attacker.status.blind>0);
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: the barrel doesn't roll true.`, 'miss');
    return;
  }
  // The barrel can never travel farther than the tile that was actually clicked
  // (clamped to however far barrelRollTiles could physically reach, in case an
  // obstruction or a height change cut the path shorter than that click implied).
  const maxIndex = Math.min(requestedSteps, tiles.length) - 1;
  let hitEnemy = null, stopIndex = maxIndex;
  for(let i=0;i<=maxIndex;i++){
    const occ = enemyTeamOf(attacker).instances.find(e=>e.alive && e.x===tiles[i].x && e.y===tiles[i].y);
    if(occ){ hitEnemy = occ; stopIndex = i-1; break; }
  }
  let barrelTile = stopIndex>=0 ? tiles[stopIndex] : {x:attacker.x, y:attacker.y};
  // Never rests on top of someone (ally, or an already-hit enemy sharing a tile
  // some other way) — back it up further until it finds clear ground, or gives up.
  while(barrelTile && occupantAt(barrelTile.x, barrelTile.y) && stopIndex>0){
    stopIndex--; barrelTile = tiles[stopIndex];
  }
  let dealt = 0;
  if(hitEnemy) dealt = applyDamage(hitEnemy, s.dmg, attacker);
  let placed = false;
  if(barrelTile && !occupantAt(barrelTile.x, barrelTile.y) && !(barrelTile.x===attacker.x && barrelTile.y===attacker.y)
    && !state.barrels.some(b=>b.x===barrelTile.x && b.y===barrelTile.y)){
    state.barrels.push({x:barrelTile.x, y:barrelTile.y});
    placed = true;
  }
  const hitNote = hitEnemy ? ` &mdash; slams into <b>${hitEnemy.def.name}</b> for -${dealt} HP` : ' &mdash; nothing in the way';
  const restNote = placed ? ' and comes to rest as a platform.' : '.';
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: the barrel rolls out${hitNote}${restNote}`, '');
}

// Only Orc (barrelAttacker on his character def) can target a barrel at all —
// everyone else's attacks simply pass over them. Detonating one still takes a
// real basic-attack roll, same as attacking anything else with his Basic — a
// miss leaves the barrel intact, unexploded, for another turn.
function resolveBarrelExplosion(attacker, point){
  const isBlind = attacker.status.blind>0;
  const roll = isBlind ? blindRoll() : basicAttackRoll();
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> attacks a barrel &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return;
  }
  state.barrels = state.barrels.filter(b=>!(b.x===point.x && b.y===point.y));
  const enemies = enemyTeamOf(attacker).instances.filter(e=>e.alive && manhattan(point,e)<=2);
  const dealtList = enemies.map(e=>applyDamage(e, 4, attacker));
  const notes = enemies.length ? enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ') : 'no one caught in the blast';
  const rollNote = roll.result==='crit' ? `rolled ${roll.roll} CRITICAL` : `rolled ${roll.roll}`;
  log(`<b>${attacker.def.name}</b> detonates a barrel &mdash; ${rollNote}: ${notes}.`, '');
}


// "Target point" abilities (Cannoneer's cannon): the player picks a LOCATION within
// range — not a character — and every enemy within aoeRadius of that spot gets hit.
// The attacker never moves, and (per her kit) nothing in between blocks the shot.
// If abilityDef.splashDmg is set, the enemy standing exactly on the chosen point
// takes abilityDef.dmg while everyone else caught in the radius takes the lower
// splashDmg instead; otherwise every enemy in radius takes the same abilityDef.dmg
// (Cannoneer's original behavior).
function resolveTargetPointAttack(attacker, abilityDef, point, isBasic, forceAutoHit){
  const enemies = enemyTeamOf(attacker).instances.filter(e=>e.alive && manhattan(point,e)<=abilityDef.aoeRadius);
  const roll = forceAutoHit ? {result:'hit', roll:null} : (isBasic ? (attacker.status.blind>0 ? blindRoll() : basicAttackRoll()) : specialAttackRoll(attacker.status.blind>0));
  const label = isBasic ? 'attacks' : `uses <b>${abilityDef.name}</b>`;
  const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}`;
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> ${label} &mdash; ${rollNote}: miss, no effect.`, 'miss');
    return;
  }
  if(enemies.length){
    if(abilityDef.splashDmg!==undefined){
      const parts = enemies.map(e=>{
        const atCenter = e.x===point.x && e.y===point.y;
        const dealt = applyDamage(e, atCenter ? abilityDef.dmg : abilityDef.splashDmg, attacker);
        return `<b>${e.def.name}</b> -${dealt}${atCenter?' (direct hit)':' (splash)'}`;
      });
      log(`<b>${attacker.def.name}</b> ${label} &mdash; ${rollNote}: hits ${parts.join(', ')}.`, '');
    } else {
      const dealtList = enemies.map(e=> applyDamage(e, abilityDef.dmg, attacker));
      if(abilityDef.applyStatus){
        enemies.forEach(e=>{ if(e.alive) applyStatus(e, abilityDef.applyStatus, abilityDef.statusDur||1); });
      }
      const statusNote = abilityDef.applyStatus ? ` + ${STATUS_DISPLAY_NAME[abilityDef.applyStatus]||abilityDef.applyStatus}` : '';
      const notes = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
      log(`<b>${attacker.def.name}</b> ${label} &mdash; ${rollNote}: hits ${notes}${statusNote}.`, '');
    }
  } else {
    log(`<b>${attacker.def.name}</b> ${label} &mdash; ${rollNote}: no enemies in range.`, '');
  }
  if(abilityDef.healAlliesInRange){
    const allies = teamOf(attacker).instances.filter(c=>c.alive && manhattan(point,c)<=abilityDef.aoeRadius);
    if(allies.length){
      allies.forEach(c=>{ c.hp=Math.min(c.maxHp, c.hp+abilityDef.healAlliesInRange); });
      const healNotes = allies.map(c=>`<b>${c.def.name}</b> +${abilityDef.healAlliesInRange}`).join(', ');
      log(`&mdash; allies within range heal: ${healNotes}.`, '');
    }
    if(abilityDef.cureAlliesInRange && allies.length){
      allies.forEach(c=>{
        c.status.poison=0; c.status.sleep=0; c.status.legbreak=0; c.status.armbreak=0; c.status.blind=0;
      });
      log(`&mdash; their status effects are cured.`, '');
    }
  }
}

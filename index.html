      <p class="ui-font" style="font-size:12px; color:var(--text-dim); margin:0 0 10px;">Win&ndash;loss record against each profile.</p>
      <p class="ui-font" style="font-size:13px; color:var(--text-dim); margin:0 0 10px;">Total wins against deleted profiles: <b style="color:var(--gold);">${(i!==null && i!==undefined) ? (deletedOpponentWins[i]||0) : 0}</b></p>
      <table class="ui-font" style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="border-bottom:1px solid var(--line);">
            <th style="padding:6px 10px; text-align:left; color:var(--text-dim); font-weight:700;">Stage</th>
            ${opponents.map(o=>`<th style="padding:6px 10px; text-align:center; color:var(--text-dim); font-weight:700;">${o.label}</th>`).join('')}
          </tr>
        </thead>
        <tbody>${h2hRows}</tbody>
      </table>
      <div style="margin-top:32px; padding-top:16px; border-top:1px solid var(--line);">
        ${confirmingDeleteProfileIndex===i ? `
          <p class="ui-font" style="font-size:13px; color:#ffb3a7; margin:0 0 10px;">Delete ${name}? All logged data for this profile &mdash; wins vs CPU and head-to-head records &mdash; will be erased. This can't be undone.</p>
          <button id="confirmDeleteProfileBtn" class="back-btn ui-font" style="border-color:var(--danger); color:#ffb3a7; padding:8px 16px;">Yes, delete</button>
          <button id="cancelDeleteProfileBtn" class="back-btn ui-font" style="padding:8px 16px;">Cancel</button>
        ` : `
          <button id="deleteProfileBtn" class="back-btn ui-font" style="border-color:var(--danger); color:#ffb3a7; padding:8px 16px;">Delete profile</button>
        `}
      </div>
    </div>
  `;
  document.getElementById('profilePuzzleTacticsBtn')?.addEventListener('click', ()=>{
    openPuzzleTacticsFor(i);
  });
  document.getElementById('backToTitleFromProfileBtn').onclick = ()=>{
    state.viewingProfileIndex = null;
    confirmingDeleteProfileIndex = null;
    state.phase = 'title';
    render();
  };
  document.getElementById('deleteProfileBtn')?.addEventListener('click', ()=>{
    confirmingDeleteProfileIndex = i;
    render();
  });
  document.getElementById('confirmDeleteProfileBtn')?.addEventListener('click', ()=>{
    confirmingDeleteProfileIndex = null;
    deleteProfile(i);
  });
  document.getElementById('cancelDeleteProfileBtn')?.addEventListener('click', ()=>{
    confirmingDeleteProfileIndex = null;
    render();
  });
}

    state.vsMode = 'pvp';
    render();
  };
  document.getElementById('modeVsOnlineBtn').onclick = ()=>{
    state.vsMode = 'online';
    render();
  };
  document.getElementById('hostOnlineBtn')?.addEventListener('click', ()=>{ hostOnlineGame(); });
  document.getElementById('joinOnlineBtn')?.addEventListener('click', ()=>{
    const code = document.getElementById('joinRoomInput').value;
    joinOnlineGame(code);
  });

    const input = document.getElementById('shareLinkInput');
    input.select();
    try { navigator.clipboard.writeText(input.value); } catch(e){ document.execCommand('copy'); }
  });
  document.getElementById('leaveOnlineBtn')?.addEventListener('click', ()=>{
    leaveOnlineGame();
    render();
  });
  document.getElementById('shareGameBtn').onclick = async ()=>{
    // Plain game link, no ?room= param — for handing the game itself to a
    // friend (to play vs CPU on their own, or as a starting point before
    // hosting/joining an online room), as opposed to onlineShareLink, which
    // is specifically an invite into an already-created room.
    const baseLink = location.origin + location.pathname;
    const btn = document.getElementById('shareGameBtn');
    if(location.protocol==='file:'){
      alert("This copy is running from a local file, not a real web address, so there's no link to share yet — host it online first (e.g. GitHub Pages), then this button will share that link.");
      return;
    }
    if(navigator.share){
      try { await navigator.share({ title: 'Battle Tactics', url: baseLink }); } catch(e){ /* user cancelled the share sheet */ }
      return;
    }
    try {
      await navigator.clipboard.writeText(baseLink);
      const original = btn.innerHTML;
      btn.innerHTML = 'Link copied!';
      setTimeout(()=>{ btn.innerHTML = original; }, 1500);
    } catch(e){
      alert(baseLink); // last-resort fallback so the link is still visible to copy manually
    }
  };
  document.getElementById('emailGameBtn').onclick = ()=>{
    if(location.protocol==='file:'){
      alert("This copy is running from a local file, not a real web address, so there's no link to send yet — host it online first (e.g. GitHub Pages), then this button will email that link.");
      return;
    }
    const baseLink = location.origin + location.pathname;
    const subject = encodeURIComponent('Come play Battle Tactics with me!');
    const body = encodeURIComponent(`Join me for a game of Battle Tactics:\n${baseLink}`);
    // A real mailto: link, not window.open — the latter is a popup and gets
    // blocked by most browsers when triggered from a click handler; direct
    // navigation always hands off to the OS's default mail app instead.
    location.href = `mailto:?subject=${subject}&body=${body}`;
  };
  document.getElementById('ruleBookBtn').onclick = ()=>{
    state.phase = 'ruleBook';
    render();
  };
  document.getElementById('startBattleBtn').onclick = ()=>{
    if(!state.vsMode) return;
    if(state.vsMode==='online' && (!onlineRoomCode || onlineRole!=='host')) return;
    if(state.p1ProfileIndex===null){
      const firstActive = firstActiveProfileIndex();
      if(firstActive!==undefined) state.p1ProfileIndex = firstActive;
    }
    state.phase = 'playerSelect';
    render();
  };
  attachSaveSlotHandlers(app);
  attachProfileHandlers(app);
}

        if((role==='p1' && onlineMyTeam!==1) || (role==='p2' && onlineMyTeam!==2)) return;

function mapThumbSvg(){
  // Small static preview built from the current TERRAIN grid.
  const cell = 8;
  const w = BOARD_COLS*cell, h = BOARD_ROWS*cell;
  let rects = '';
  for(let y=0;y<BOARD_ROWS;y++){
    for(let x=0;x<BOARD_COLS;x++){
      const terr = TERRAIN[y][x];
      let fill = 'var(--panel-2)';
      if(terr===1) fill = 'var(--water)';
      else if(terr===2) fill = 'var(--wall)';
      else if(terr===3) fill = 'var(--gold-dim)';
      rects += `<rect x="${x*cell}" y="${y*cell}" width="${cell}" height="${cell}" fill="${fill}" stroke="var(--bg)" stroke-width="0.5"/>`;
    }
  }
  return `<svg viewBox="0 0 ${w} ${h}" width="100%" style="max-width:160px;display:block;">${rects}</svg>`;
}

// Per-map difficulty/record row shown under each map card on the map-select screen.
// CPU mode: E/N/H difficulty buttons — grayed out until hovered, and clicking one both
// picks that map AND that difficulty in one step, then continues straight to the draft.
// Each shows this profile's win count at that map+difficulty. PvP mode: difficulty
// doesn't apply, so it shows one total win count against the currently selected opponent
// instead, and the whole card is clickable to proceed.
function renderMapDiffRow(m){
  if(state.vsMode==='pvp' || state.vsMode==='online'){
    const selfKey = profileKeyFor(state.p1ProfileIndex);
    const oppKey = profileKeyFor(state.p2ProfileIndex);
    const p1Wins = (mapPvpWinLog[m.id] && mapPvpWinLog[m.id][selfKey] && mapPvpWinLog[m.id][selfKey][oppKey]) || 0;
    const p2Wins = (mapPvpWinLog[m.id] && mapPvpWinLog[m.id][oppKey] && mapPvpWinLog[m.id][oppKey][selfKey]) || 0;
    return `<div class="ui-font" style="margin-top:8px; font-size:12px; color:var(--text-dim);"><b style="color:var(--p1);">${p1Wins}</b> &ndash; <b style="color:var(--p2);">${p2Wins}</b></div>`;
  }
  const i = state.p1ProfileIndex;
  const log = (i!==null && i!==undefined && profileWinLogs[i] && profileWinLogs[i][m.id]) || {};
  const diffs = [['easy','E'],['normal','N'],['hard','H']];
  return `<div style="margin-top:8px; display:flex; justify-content:center; gap:5px;">
    ${diffs.map(([key,label])=>`
      <button class="mapDiffBtn ui-font" data-map="${m.id}" data-diff="${key}">
        ${label} <span style="opacity:0.6;">${log[key]||0}</span>
      </button>
    `).join('')}
  </div>`;
}

// Auto (passive) abilities normally get an automatic "(Passive)" tag appended next
// to their name. If the desc itself already opens with "Passive —" (written manually,
// matching how reactive specials state their own category), skip the automatic tag
// so it isn't shown twice.
function autoPassiveTag(auto){
  return /^passive\b/i.test(auto.desc || '') ? '' : ' (Passive)';
}

function renderPlacement(app){
  const teamId = state.placementTurn;
  const team = teamId===1? state.p1 : state.p2;
  const side = teamId===1? state.p1Side : state.p2Side;
  const zoneTiles = zoneTilesFor(side);
  const placedDefIds = new Set(team.placements.map(p=>p.defId));
  const unplaced = team.chars.filter(id=>!placedDefIds.has(id));
  if(!state.placementSelectedDef || !unplaced.includes(state.placementSelectedDef)){
    state.placementSelectedDef = unplaced[0] || null;
  }
  const allPlacements = [...state.p1.placements.map(p=>({...p,team:1})), ...state.p2.placements.map(p=>({...p,team:2}))];
  const occupiedKeys = new Set(allPlacements.map(p=>p.x+','+p.y));

  let boardHtml = '';
  for(let y=0;y<BOARD_ROWS;y++){
    for(let x=0;x<BOARD_COLS;x++){
      const terr = TERRAIN[y][x];
      const cls = ['tile'];
      if(inZoneP1(x,y)) cls.push('zone1');
      if(inZoneP2(x,y)) cls.push('zone2');
      const key = x+','+y;
      const isZoneTile = zoneTiles.some(t=>t.x===x && t.y===y);
      const canPlaceHere = isZoneTile && !occupiedKeys.has(key) && state.placementSelectedDef;
      if(canPlaceHere) cls.push(teamId===1 ? 'placeable-p1' : 'placeable-p2');
      const occ = allPlacements.find(p=>p.x===x && p.y===y);
      let inner = '';
      if(occ){
        const def = ROSTER.find(r=>r.id===occ.defId);
        inner = `<div class="token ${teamCls(occ)} ${tokenImageClass(def)}" title="${def.name}">${tokenPieceInner(def,3)}</div>`;
      }
      boardHtml += `<div class="${cls.join(' ')}" data-x="${x}" data-y="${y}">${inner}</div>`;
    }
  }

  app.innerHTML = `

              return `<div class="char-card ${isPlaced?'taken':''}" data-defid="${id}"

                <div style="display:flex; align-items:flex-start; gap:5px;">
                  ${def.image?`<img src="${def.image}" alt="" style="width:48px; height:48px; object-fit:contain; flex-shrink:0;${def.smallToken?' transform:scale(0.85); transform-origin:50% 100%;':''}">`:''}

                  </div>
                </div>
                <div class="stat-line basic-line" style="color:var(--p1);">${def.basic.label}</div>

  document.getElementById('randomPlaceAllBtn').onclick = ()=> randomPlaceAllForCurrentTeam();
  app.querySelectorAll('.char-card[data-defid]:not(.taken)').forEach(el=>{
    el.onclick = ()=>{ state.placementSelectedDef = el.dataset.defid; render(); };
  });
  app.querySelectorAll('.board .tile').forEach(el=>{
    el.onclick = ()=>{
      const x = Number(el.dataset.x), y = Number(el.dataset.y);
      if(!state.placementSelectedDef) return;
      if(!zoneTiles.some(t=>t.x===x && t.y===y)) return;
      if(occupiedKeys.has(x+','+y)) return;
      placeCharacter(state.placementSelectedDef, x, y);
    };
  });
}

function availableRoster(){
  return ROSTER.filter(r=> !state.draftPicks.includes(r.id));
}

function randomPick(){
  if(!isMyOnlineTurn()) return;
  const avail = availableRoster();
  if(!avail.length) return;
  const choice = avail[Math.floor(Math.random()*avail.length)];
  pickCharacter(choice.id);
}

function randomizeRestOfDraft(){
  if(!isMyOnlineTurn()) return;
  // Online, this can only ever auto-pick for the calling player's OWN side —
  // the other person's picks aren't this client's to make. So the loop also
  // has to stop the instant the turn changes, rather than spinning forever
  // waiting for a turn that will never come from this client.
  while(state.phase==='draft' && availableRoster().length && isMyOnlineTurn()){
    randomPick();
  }
}

const STATUS_DISPLAY_NAME = {
  poison:'Poison', sleep:'Sleep', legbreak:'Leg Break', armbreak:'Arm Break', blind:'Blind', confuse:'Confuse', regen:'Regen', haste:'Haste'
};

function statusLabel(c){
  const tags=[];
  // Every numeric status field already IS its own remaining-turn counter — it
  // decrements once per turn cycle (see endTurnAdvance/advanceToLivingTurn) — so
  // showing it straight on the tag is an accurate "turns left" readout.
  if(c.status.poison>0) tags.push(`Poison (${c.status.poison})`);
  if(c.status.sleep>0) tags.push(`Sleep (${c.status.sleep})`);
  if(c.status.legbreak>0) tags.push(`Leg Break (${c.status.legbreak})`);
  if(c.status.armbreak>0) tags.push(`Arm Break (${c.status.armbreak})`);
  if(c.status.blind>0) tags.push(`Blind (${c.status.blind})`);
  if(c.status.regen>0) tags.push(`Regen (${c.status.regen})`);
  if(c.status.confuse>0) tags.push(`Confuse (${c.status.confuse})`);
  if(c.status.haste>0) tags.push(`Haste (${c.status.haste})`);
  // Vaporize's first attack has no visible effect of its own — this is the only
  // way to see whether it connected, right up until the second attack resolves.
  if(c.chargeComboPending){
    const s1 = c.chargeComboPending.roll1;
    tags.push((s1.result==='hit'||s1.result==='crit') ? 'Charged: Hit' : 'Charged: Miss');
  }
  return tags;
}

// Shared board-piece rendering: uses the character's art if we have it,
// otherwise falls back to a 2-3 letter abbreviation on a team-colored circle.
function tokenPieceInner(def, abbrevLen){
  if(def.image) return `<img src="${def.image}" alt="${def.name}">`;
  return def.name.slice(0,abbrevLen).toUpperCase();
}
function tokenImageClass(def){
  if(!def.image) return '';
  // Bender is a child, so his board art renders noticeably smaller than the
  // other tokens sharing the same tile size (see .token.small-token below).
  return def.smallToken ? 'has-image small-token' : 'has-image';
}

function renderBattle(app){
  if(!slotNamesLoaded) loadSlotMeta();
  // Once the game is decided, freeze all interaction — no active mode means every
  // highlighting/targeting branch below naturally skips, and the action buttons get
  // force-disabled further down. Only the board and the log stay visible/scrollable.
  if(state.gameEnded) state.mode = null;
  // Mercenary's Hire and Thief's Charm both temporarily hand the action panel to
  // a DIFFERENT character than whoever's turn it really is — Hire to a willing
  // ally, Charm to a charmed enemy — without touching turn rotation itself (see
  // findHireHelper/clearHireBonus and endCharmSegment).
  const c = state.hireBonusUid ? getByUid(state.hireBonusUid) : (state.charmBonusUid ? getByUid(state.charmBonusUid) : currentChar());
  const hireHelper = (!state.hireBonusUid && !state.charmBonusUid && c && !c.actedThisTurn && c.status.armbreak<=0 && c.status.sleep<=0 && c.status.confuse<=0) ? findHireHelper(c) : null;
  // Every targeting/resolution check below that asks "who can `c` attack?" reads
  // enemiesOfC — correct for a normal turn, but during Thief's Charm bonus
  // segment `c` IS a charmed enemy, and they're meant to attack their OWN
  // original side, not Thief's. Swapping this one shared value covers every one
  // of those call sites (targeting highlights, second-pick pools, no-targets
  // checks, the actual resolution guards) without having to special-case each
  // individually.
  const enemiesOfC = c ? (state.charmBonusUid===c.uid ? charmedOwnTeam(c) : enemyTeamOf(c)) : { instances: [] };
  const reach = (state.mode==='move' && c) ? reachableTiles(c) : [];
  const reachSet = new Set(reach.map(t=>t.x+','+t.y));
  const reachOptions = {}; // key "x,y" -> array of {elevated} — usually 1, but 2 on a dual-layer bridge tile
  reach.forEach(t=>{ const key=t.x+','+t.y; (reachOptions[key]=reachOptions[key]||[]).push(t); });

  let targetSet = new Set();
  let targetableUids = new Set();
  let tileTargetSet = new Set();
  let rangeTileSet = new Set(); // every tile within the active ability's range, occupied or not
  let shieldRangeTileSet = new Set(); // secondary range preview (e.g. Knight's Guard R4 ally-shield zone)
  let barrelTargetSet = new Set(); // Orc's barrelAttacker: barrels within his basic's range, clickable during Basic mode
  let targetType = null;
  let noneAbilPreview = null; // for hit-all abilities: {count, label} used by the Confirm button text
  // Teleport Coin — independent of whichever character's turn it currently is:
  // step 1 highlights every alive character on the board (either side, ally or
  // enemy) as pickable, step 2 (once one's picked) highlights every open,
  // non-wall, non-pit tile on the board.
  if(state.mode==='teleportSelectChar'){
    allInstances().filter(e=>e.alive).forEach(e=>{ targetableUids.add(e.uid); });
  } else if(state.mode==='teleportSelectDest'){
    for(let ty=0; ty<BOARD_ROWS; ty++){
      for(let tx=0; tx<BOARD_COLS; tx++){
        if(terrainAt(tx,ty)===2) continue;
        if(isHazardTile(tx,ty)) continue;
        if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
        tileTargetSet.add(tx+','+ty);
      }
    }
  } else if(state.mode==='mugTeleportSelectDest'){
    // Gypsy's Mug bonus ("both Mugs land"): same "anywhere open on the map"
    // tile pool as the Teleport Coin button above, just for the specific
    // target stored in state.pendingMugTeleportUid rather than a free pick.
    for(let ty=0; ty<BOARD_ROWS; ty++){
      for(let tx=0; tx<BOARD_COLS; tx++){
        if(terrainAt(tx,ty)===2) continue;
        if(isHazardTile(tx,ty)) continue;
        if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
        tileTargetSet.add(tx+','+ty);
      }
    }
  } else if(state.mode==='portalChoiceSelect' && state.pendingPortalMove){
    // Splitter's Portal, mid-move choice: every OTHER portal belonging to the
    // mover's own team is a valid "walk through to" destination. Staying put
    // is a separate button (see the panel), not a tile click.
    const pm = state.pendingPortalMove;
    const mover = getByUid(pm.moverUid);
    state.portals.forEach(p=>{
      if(mover && p.team===mover.team && (p.x!==pm.atX || p.y!==pm.atY) && !occupantAt(p.x,p.y)){
        tileTargetSet.add(p.x+','+p.y);
      }
    });
  } else if(state.mode==='stalkerLandSelect'){
    // Stalker's Swift: exactly the 2 precomputed side tiles — nothing to scan,
    // resolveLineSpecialAttack already worked out which ones are actually open.
    (state.pendingStalkerLandOptions||[]).forEach(p=> tileTargetSet.add(p.x+','+p.y));
  } else if(state.mode==='basicRelocateSelect' && state.pendingRelocateOrigin){
    // Machinist-style: the destination has to be within the basic's own range of
    // where the attacker was standing when they hit — not anywhere on the board.
    for(let ty=0; ty<BOARD_ROWS; ty++){
      for(let tx=0; tx<BOARD_COLS; tx++){
        if(terrainAt(tx,ty)===2) continue;
        if(isHazardTile(tx,ty)) continue;
        if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
        if(manhattan(state.pendingRelocateOrigin,{x:tx,y:ty}) > state.pendingRelocateRange) continue;
        tileTargetSet.add(tx+','+ty);
      }
    }
  } else if(state.mode==='vaultSelectLanding' && state.vaultTargetUid){
    const vaultTarget = getByUid(state.vaultTargetUid);
    if(vaultTarget && c){
      vaultLandingTiles(c, vaultTarget).forEach(p=> tileTargetSet.add(p.x+','+p.y));
    }
  } else if(state.mode==='aerialSelectLanding' && c){
    // Shinobi's Aerial: any empty tile within Jump range of her current spot —
    // unlike Vault, not tied to being near either target.
    tileSpecialOptions(c, {moveRange:c.def.special.jumpRange, crossWater:c.def.special.crossWater}).forEach(p=> tileTargetSet.add(p.x+','+p.y));
  } else if(state.mode==='possessLandSelect' && state.pendingPossessLand){
    const { targetX, targetY, range, specterUid } = state.pendingPossessLand;
    const specter = getByUid(specterUid);
    for(let ty=Math.max(0,targetY-range); ty<=Math.min(BOARD_ROWS-1,targetY+range); ty++){
      for(let tx=Math.max(0,targetX-range); tx<=Math.min(BOARD_COLS-1,targetX+range); tx++){
        if(manhattan({x:targetX,y:targetY},{x:tx,y:ty})>range) continue;
        const hazardHere = isHazardTile(tx,ty);
        if(terrainAt(tx,ty)===2 && !hazardHere) continue;
        if(hazardHere && !(specter?.def.abilities||{}).float) continue;
        if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
        tileTargetSet.add(tx+','+ty);
      }
    }
  }
  if(c && (state.mode==='basic' || state.mode==='special')){
    const abil = state.mode==='basic'? effectiveBasic(c) : c.def.special;
    // Orc's basic can also target a barrel instead of an enemy — checked against
    // the same range as his normal attack, independent of whatever targetType
    // branch below handles actual enemies.
    if(state.mode==='basic' && c.def.barrelAttacker){
      state.barrels.forEach(b=>{ if(canReach(c,b,abil)) barrelTargetSet.add(b.x+','+b.y); });
    }
    // secondRange abilities (Paladin's Holy, Sorcerer's Arcane, and now Runeblade's
    // basic AND special) can live on either a basic or a special, so the in-progress
    // target list has to be picked per-mode rather than assumed to be the special's.
    const pendingTargets = state.mode==='basic' ? (state.pendingBasicTargets||[]) : (state.pendingSpecialTargets||[]);
    targetType = abil.targetType===undefined? 'enemy' : abil.targetType;
    // chargeCombo abilities (Vaporize) act like a targetType:'none' ability for
    // their first use (a plain roll, no target) and their normal declared type
    // (here, 'enemy') once that first roll is already banked on the character.
    if(state.mode==='special' && abil.chargeCombo && !c.chargeComboPending) targetType = 'none';
    if(targetType==='enemy' || targetType==='ally' || targetType==='anyAlign'){
      if(abil.barrelRoll){
        // A rolled barrel can't be aimed like a normal lineAttack — it's blocked
        // by a rise in height (can't roll uphill), not just a wall, so its own
        // preview has to stop wherever it actually would.
        barrelRollRangeTiles(c, abil).forEach(p=> rangeTileSet.add(p.x+','+p.y));
      } else if(abil.lineAttack){
        // A lineAttack's visual range preview has to match exactly what would
        // actually get hit — including a wall or an elevated first enemy capping
        // the line short of its raw range — not just a blanket shape.
        lineAttackRangeTiles(c, abil).forEach(p=> rangeTileSet.add(p.x+','+p.y));
      } else {
        // Show the whole reachable range first, then layer the actual valid targets on top.
        for(let ty=0; ty<BOARD_ROWS; ty++){
          for(let tx=0; tx<BOARD_COLS; tx++){
            if(tx===c.x && ty===c.y) continue;
            if(inRangeWithHeightRule(c,{x:tx,y:ty},abil)
              && (!abil.requiresLineOfSight || hasLineOfSight(c,{x:tx,y:ty,elevated:false}))) rangeTileSet.add(tx+','+ty);
          }
        }
      }
    }
    if(abil.barrelRoll){
      // BaRoll doesn't need an enemy actually standing there — the barrel can
      // roll into open space just fine and still lands as a platform, so every
      // tile it could actually reach (not just ones with an enemy on them) is a
      // valid pick — and picking a CLOSER tile than its max reach is exactly how
      // you choose how far it rolls, rather than it always going the full distance.
      barrelRollRangeTiles(c, abil).forEach(p=> tileTargetSet.add(p.x+','+p.y));
    }
    if(targetType==='enemy'){
      // adjacentPairPick (Warrior's Chill, Crusader's Swing): pick 1 must be in the
      // ability's normal range, same as any other target — then pick 2 only needs
      // to be directly adjacent to pick 1. For most (Chill), that means pick 2 can
      // be outside the ability's range entirely. bothMustBeInRange (Swing) tightens
      // that: pick 2 must ALSO sit within the ability's own range, not just be
      // adjacent to pick 1.
      if(abil.adjacentPairPick && pendingTargets.length===1){
        const first = getByUid(pendingTargets[0]);
        if(first){
          enemiesOfC.instances.filter(e=>e.alive && e.uid!==first.uid && manhattan(e,first)===1
            && (!abil.bothMustBeInRange || canReach(c,e,abil))).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
        }
      } else if(abil.secondRange!==undefined && pendingTargets.length===1){
        // Sorcerer's Arcane: the second pick uses its OWN range (measured from the
        // attacker, same as the first pick) rather than the ability's normal range,
        // and must be a different enemy than the one already picked.
        // Paladin's Holy (and Runeblade's basic/special) sets secondRangeFromTarget,
        // so this is instead measured from the already-picked first target's position.
        const firstUid = pendingTargets[0];
        const firstChar = abil.secondRangeFromTarget ? getByUid(firstUid) : null;
        const secondOrigin = firstChar || c;
        enemiesOfC.instances.filter(e=>e.alive && e.uid!==firstUid && canReach(secondOrigin,e,{...abil, range:abil.secondRange})).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.secondRange!==undefined && abil.secondHitOptional){
        // Runeblade: unlike Arcane/Holy, the first pick doesn't need a guaranteed
        // second option — the combo still fires as a single hit if nothing else is
        // reachable from wherever the first target ends up standing.
        enemiesOfC.instances.filter(e=>e.alive && canReach(c,e,abil)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.secondRange!==undefined){
        // First pick: only offer an enemy here if picking them still leaves at least
        // one OTHER enemy reachable within secondRange — otherwise starting the combo
        // on them would be a dead end, and per her kit Arcane simply doesn't fire
        // unless a genuine pair (one in each range, distinct) is available.
        // For secondRangeFromTarget abilities, that secondRange check is measured
        // from each candidate first target itself, not from the attacker.
        enemiesOfC.instances.filter(e=>e.alive && canReach(c,e,abil)
          && enemiesOfC.instances.some(e2=>e2.alive && e2.uid!==e.uid && canReach(abil.secondRangeFromTarget?e:c,e2,{...abil, range:abil.secondRange})))
          .forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.optionalSecondHit && state.mode==='basic' && (state.pendingBasicTargets||[]).length===1){
        // Duke's dual basic attack: the (optional) second pick must be a DIFFERENT

        // enemy, and — only for abilities that define closeRange (Duke's) — at
        // least one of the two has to be within it. A basic like Guardian's that
        // doesn't define closeRange has no such restriction: any two reachable,
        // distinct enemies are a valid pair.
        const firstUid = state.pendingBasicTargets[0];
        const first = getByUid(firstUid);
        const hasCloseRange = abil.closeRange!==undefined;
        const firstIsClose = hasCloseRange && first && manhattan(c, first) <= abil.closeRange;
        enemiesOfC.instances.filter(e=>e.alive && e.uid!==firstUid && canReach(c,e,abil)
          && (!hasCloseRange || firstIsClose || manhattan(c,e)<=abil.closeRange)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.optionalSecondHit && state.mode==='special' && (state.pendingSpecialTargets||[]).length===1){
        // Duke's Twofold: the optional second pick just needs to be a different
        // enemy within the same range — no closeRange asymmetry like his basic.
        const firstUid = state.pendingSpecialTargets[0];
        enemiesOfC.instances.filter(e=>e.alive && e.uid!==firstUid && canReach(c,e,abil)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.jumpBetweenHits && (state.pendingSpecialTargets||[]).length===1 && state.pendingAerialLanding){
        // Shinobi's Aerial: the second pick's range is measured from wherever
        // she's about to land, not from her current tile.
        const landing = state.pendingAerialLanding;
        const pseudo = {x:landing.x, y:landing.y, elevated: isElevatedGround(landing.x, landing.y)};
        enemiesOfC.instances.filter(e=>e.alive && canReach(pseudo,e,abil)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      } else if(abil.secondPickAlly && (state.pendingSpecialTargets||[]).length===1){
        // Scholar's Erudite: pick 1 is any enemy on the board (Poison); pick 2
        // switches populations entirely — any OTHER living ally on the board
        // (Regen), unrestricted range same as pick 1. Haste on the attacker
        // itself isn't a click at all, so it never shows up here.
        teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && canReach(c,a,abil)).forEach(a=>{ targetSet.add(a.x+','+a.y); targetableUids.add(a.uid); });
      } else if(abil.distinctTargets && (state.pendingSpecialTargets||[]).length===1){
        // Fencer's Combo: the second pick must be a different enemy than the first
        // whenever another one is actually reachable — only falls back to
        // re-offering the same enemy when they're the sole one in range (matching
        // resolveSpecial's single-hit fallback for that case).
        const firstUid = state.pendingSpecialTargets[0];
        const others = enemiesOfC.instances.filter(e=>e.alive && e.uid!==firstUid && canReach(c,e,abil));
        if(others.length){
          others.forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
        } else {
          const first = getByUid(firstUid);
          if(first){ targetSet.add(first.x+','+first.y); targetableUids.add(first.uid); }
        }
      } else {
        // excludeUid (Assassin's Quick bonus attack): the one enemy already hit
        // by the first half of the special isn't a valid pick for the forced
        // "different enemy" follow-up.
        enemiesOfC.instances.filter(e=>e.alive && e.uid!==abil.excludeUid && canReach(c,e,abil)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      }
    } else if(targetType==='ally'){
      teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && canReach(c,a,abil)).forEach(a=>{ targetSet.add(a.x+','+a.y); targetableUids.add(a.uid); });
      if(abil.selfHeal!==undefined && c.alive){ targetSet.add(c.x+','+c.y); targetableUids.add(c.uid); }
    } else if(targetType==='anyAlign'){
      // Hybrid abilities (e.g. Priest's basic): can target an enemy for damage, or an
      // ally/self for a heal — both populations are valid, in-range clickable targets.
      enemiesOfC.instances.filter(e=>e.alive && canReach(c,e,abil)).forEach(e=>{ targetSet.add(e.x+','+e.y); targetableUids.add(e.uid); });
      teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && canReach(c,a,abil)).forEach(a=>{ targetSet.add(a.x+','+a.y); targetableUids.add(a.uid); });
      if(abil.selfHeal!==undefined && c.alive){ targetSet.add(c.x+','+c.y); targetableUids.add(c.uid); }
    } else if(targetType==='layTraps'){
      // Machinist-style: pick N distinct empty tiles within range to drop traps on
      // — never on top of a wall/pit/occupied tile, an already-trapped tile, or a
      // tile already picked earlier in this same action.
      const alreadyPicked = state.pendingSpecialTiles || [];
      for(let ty=0; ty<BOARD_ROWS; ty++){
        for(let tx=0; tx<BOARD_COLS; tx++){
          if(manhattan(c,{x:tx,y:ty})>abil.range) continue;
          if(terrainAt(tx,ty)===2) continue;
          if(isHazardTile(tx,ty)) continue;
          if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
          if(state.traps.some(t=>t.x===tx && t.y===ty)) continue;
          if(state.tombTraps.some(t=>t.x===tx && t.y===ty)) continue;
          if(state.crops.some(t=>t.x===tx && t.y===ty)) continue;
          if(alreadyPicked.some(p=>p.x===tx && p.y===ty)) continue;
          tileTargetSet.add(tx+','+ty);
        }
      }
    } else if(targetType==='targetPoint'){
      // Cannoneer-style: every tile within range is a valid, clickable target point
      // — the whole range shows highlighted, even a spot that wouldn't currently
      // land on anyone (she can still choose to fire there). Obstructions block the
      // shot from reaching a given point at all, same as any other physical ranged
      // attack, UNLESS this specific ability is flagged ignoreObstacles (Cannoneer's
      // cannon/mortar shots explicitly arc over anything in the way).
      for(let ty=0; ty<BOARD_ROWS; ty++){
        for(let tx=0; tx<BOARD_COLS; tx++){
          if(manhattan(c,{x:tx,y:ty})>abil.range) continue;
          if(!abil.ignoreObstacles && !hasLineOfSight(c,{x:tx,y:ty,elevated:isElevatedGround(tx,ty)})) continue;
          tileTargetSet.add(tx+','+ty);
        }
      }
    } else if(targetType==='tile'){
      const canCrossWater = c.def.abilities?.float || (!WATER_IMPASSABLE && abil.crossWater);
      for(let ty=0; ty<BOARD_ROWS; ty++){
        for(let tx=0; tx<BOARD_COLS; tx++){
          if(tx===c.x && ty===c.y) continue;
          if(manhattan(c,{x:tx,y:ty})>abil.moveRange) continue;
          const terr = terrainAt(tx,ty);
          if(terr===2) continue; // walls/trees always block
          if(terr===1 && !canCrossWater) continue; // water blocks unless this ability (and this map) allows crossing it
          if(occupantsAt(tx,ty).length>0) continue; // must be empty
          // Only a valid destination if it would actually let the ability hit an
          // enemy from there — Sandslash/Bulldoze-style specials aren't just a free
          // reposition, they have to land a hit.
          const pseudo = {x:tx, y:ty, elevated:isElevatedGround(tx,ty)};
          const hitsSomething = abil.aoeEnemiesRange!==undefined
            ? enemiesOfC.instances.some(e=>e.alive && manhattan(pseudo,e)<=abil.aoeEnemiesRange)
            : enemiesOfC.instances.some(e=>e.alive && canReach(pseudo,e,abil));
          if(!hitsSomething) continue;
          tileTargetSet.add(tx+','+ty);
        }
      }
    } else if(targetType==='none'){
      // Hit-all ability (e.g. Guard, Whirl, Wave, Pray): preview the whole affected zone
      // and who's currently in it, but don't make them individually clickable —
      // resolution happens via Confirm.
      if(abil.aoe==='allies'){
        const affected = teamOf(c).instances.filter(a=>a.alive && (!abil.excludeSelf || a.uid!==c.uid));
        affected.forEach(a=>{ targetSet.add(a.x+','+a.y); });
        noneAbilPreview = {count:affected.length, label: affected.length===1?'ally':'allies'};
      } else if(abil.aoeEnemiesRange!==undefined){
        for(let ty=0; ty<BOARD_ROWS; ty++){
          for(let tx=0; tx<BOARD_COLS; tx++){
            if(distanceFor(c,{x:tx,y:ty},abil)<=abil.aoeEnemiesRange
              && (!abil.straightOnly || isOnStraightLine(c,{x:tx,y:ty}))) rangeTileSet.add(tx+','+ty);
          }
        }
        const affected = enemiesInAoeRange(c, abil);
        affected.forEach(e=>{ targetSet.add(e.x+','+e.y); });

      } else {
        noneAbilPreview = {count:0, label:'targets'};
      }
      if(abil.shieldRange!==undefined){
        for(let ty=0; ty<BOARD_ROWS; ty++){
          for(let tx=0; tx<BOARD_COLS; tx++){
            if(distanceFor(c,{x:tx,y:ty},abil)<=abil.shieldRange) shieldRangeTileSet.add(tx+','+ty);
          }
        }
      }
    }
  } else if(state.mode==='charmControlSelect' && state.pendingCharm){
    // Thief's Charm: the acting unit for this step is the CHARMED enemy, not
    // whoever's turn it technically still is — their own ability (special if
    // available and eligible, else basic), their own range, aimed at their own
    // team's targets (which, since they're charmed, is Thief's side).
    const pc = state.pendingCharm;
    const charmed = getByUid(pc.targetUid);
    if(charmed && charmed.alive){
      const abil = pc.useSpecial ? charmed.def.special : effectiveBasic(charmed);
      for(let ty=0; ty<BOARD_ROWS; ty++){

          if(inRangeWithHeightRule(charmed,{x:tx,y:ty},abil)
            && (!abil.requiresLineOfSight || hasLineOfSight(charmed,{x:tx,y:ty,elevated:false}))) rangeTileSet.add(tx+','+ty);

    }
  } else if(c && state.mode==='dashThenTargetSelect'){

    for(let ty=0; ty<BOARD_ROWS; ty++){
      for(let tx=0; tx<BOARD_COLS; tx++){
        if(tx===c.x && ty===c.y) continue;
        if(inRangeWithHeightRule(c,{x:tx,y:ty},abil)

  } else if(c && state.mode==='splitHealSelect'){

          if(!(state.pendingSpecialTargets||[]).length){

            const landingTiles = tileSpecialOptions(c, {moveRange:s.jumpRange, crossWater:s.crossWater});
            if(landingTiles.length){
              state.mode = 'aerialSelectLanding';
            } else {
              // No open tile to jump to at all — resolve as a plain single hit.
              const first = getByUid(uid);
              state.pendingSpecialTargets = [];
              resolveSpecial(c, first ? [first] : [], state.charmBonusUid===c.uid);
              c.actedThisTurn = true; state.mode=null;
              maybeAutoEnd();
            }
          } else {
            const firstUid = state.pendingSpecialTargets[0];
            const first = getByUid(firstUid);
            const second = getByUid(uid);
            state.pendingSpecialTargets = [];
            resolveSpecial(c, [first, second].filter(Boolean), state.charmBonusUid===c.uid);
            state.pendingAerialLanding = null;
            c.actedThisTurn = true; state.mode=null;
            maybeAutoEnd();
          }
          render();
        } else if(hitsNeeded > 1){
          state.pendingSpecialTargets = state.pendingSpecialTargets || [];
          state.pendingSpecialTargets.push(uid);
          // adjacentPairPick (Chill, Swing): if nothing is adjacent to the just-picked
          // first target, there's no valid second pick to wait for — resolve immediately
          // as a single hit (same fallback the resolver already uses when only one
          // enemy was reachable at all). bothMustBeInRange (Swing) additionally requires
          // that adjacent candidate to be within the ability's own range.
          const noValidSecondPick = s.adjacentPairPick && state.pendingSpecialTargets.length===1
            && !enemiesOfC.instances.some(e=>e.alive && e.uid!==uid && manhattan(e,target)===1
              && (!s.bothMustBeInRange || canReach(c,e,s)));
          // twoRangeCombo (Sorcerer's Arcane, Paladin's Holy): these don't fire
          // without a genuine pair — the first-pick highlighting already only
          // offers enemies that have a valid distinct second option, so this should
          // never actually trigger in normal play; it's just a safety net that backs
          // out of the pick (no charge spent) instead of firing a partial attack.
          // secondHitOptional (Runeblade) is the exception: it fires as a single hit
          // instead of backing out, since its first-pick highlighting never required
          // a guaranteed second in the first place.
          const noValidSecondRangePick = s.secondRange!==undefined && state.pendingSpecialTargets.length===1
            && !enemiesOfC.instances.some(e=>e.alive && e.uid!==uid && canReach(s.secondRangeFromTarget?target:c,e,{...s, range:s.secondRange}));
          // secondPickAlly (Scholar's Erudite): unlike Arcane, a missing second pick
          // here doesn't cancel the whole special — Poison (on the enemy just picked)
          // and Haste (on Scholar himself) still land even with no other ally on the
          // board to Regen, so this resolves immediately as a single-target pick
          // instead of backing out.
          const noAllyForSecondPick = s.secondPickAlly && state.pendingSpecialTargets.length===1
            && !teamOf(c).instances.some(a=>a.alive && a.uid!==c.uid);
          if(noValidSecondRangePick && !s.secondHitOptional){
            state.pendingSpecialTargets = [];
            render();
          } else if(state.pendingSpecialTargets.length >= hitsNeeded || noValidSecondPick || noAllyForSecondPick || noValidSecondRangePick){
            const targets = noValidSecondPick ? [target, target] // Chill/Swing: duplicate onto the same target
              : noAllyForSecondPick ? [target] // Erudite: no ally available, resolve with just the enemy pick
              : noValidSecondRangePick ? [target] // Runeblade: no second enemy reachable, resolve with just the first hit
              : state.pendingSpecialTargets.map(u=>getByUid(u));
            state.pendingSpecialTargets = [];
            resolveSpecial(c, targets);
            c.actedThisTurn = true; state.mode=null;
            maybeAutoEnd(); render();
          } else {
            render(); // wait for the next target pick
          }
        } else if(s.healFollowup && (state.charmBonusUid===c.uid || target.team!==c.team)){
          // Diviner's Faith: clicking an enemy chains into a mandatory heal pick
          // (self or an ally) before anything resolves — same two-step flow as
          // Priest's basic (see basicHealSelect / resolveSpecial's healFollowup).
          state.pendingSpecialComboTargetUid = uid;
          state.mode = 'specialHealSelect';
          render();
        } else {
          // Thief's Charm bonus segment: this special was already guaranteed to
          // qualify for the charm-eligible forceAutoHit branch (see
          // abilDisabledSpecial), so no second roll happens here either.
          resolveSpecial(c, target, state.charmBonusUid===c.uid);
          if(state.mode==='mateySelectAlly' || state.mode==='vaultSelectLanding' || state.mode==='charmControlSelect' || state.mode==='basicRelocateSelect' || state.mode==='darknessSelectTarget' || state.mode==='mugTeleportSelectDest' || state.mode==='stalkerLandSelect' || state.charmBonusUid || state.quickBonusUid){
            render(); // wait for the next step (or the charmed unit's/Assassin's whole bonus segment) before ending the turn
          } else {
            c.actedThisTurn = true; state.mode=null;
            maybeAutoEnd(); render();
          }
        }
      } else if(state.mode==='mateySelectAlly'){
        state.mateyAllyUid = uid;
        state.mode = 'mateySelectTarget';
        render();
      } else if(state.mode==='darknessSelectTarget'){
        // Auto-hit — same "the enabling roll already succeeded" precedent as
        // Matey's follow-up attack above.
        const finalized = doBasicAttack(c, target, false, true);
        state.pendingDarknessFirstTargetUid = null;
        if(finalized){
          c.actedThisTurn = true; state.mode=null;
          maybeAutoEnd();
        }
        render();
      } else if(state.mode==='mateySelectTarget'){
        const ally = getByUid(state.mateyAllyUid);
        // No second roll — the one Matey roll already succeeded, so this attack
        // just lands automatically.
        const finalized = ally ? doBasicAttack(ally, target, false, true) : true;
        state.mateyAllyUid = null;
        if(finalized){
          c.actedThisTurn = true; state.mode=null;
          maybeAutoEnd();
        }
        render();
      } else if(state.mode==='charmControlSelect'){
        // Thief's Charm: the player just picked who the charmed enemy attacks.
        // No roll here either — Charm's own roll already covered it. Thief's own
        // D1 lands only now, AFTER the controlled attack resolves, so a fragile
        // target still gets to act even if that D1 would otherwise have dropped
        // them first.
        const pc = state.pendingCharm;
        const thief = pc ? getByUid(pc.thiefUid) : null;
        const charmed = pc ? getByUid(pc.targetUid) : null;
        if(charmed && charmed.alive && target){
          if(pc.useSpecial) resolveSpecial(charmed, target, true);
          else doBasicAttack(charmed, target, true, true);
        }
        if(charmed && charmed.alive && thief){
          const dealt = applyDamage(charmed, pc.dmg, thief);
          log(`&mdash; <b>${thief.def.name}</b>'s Charm wears off: <b>${charmed.def.name}</b> -${dealt}.`, '');
        }
        state.pendingCharm = null;
        if(thief){ thief.actedThisTurn = true; }
        state.mode = null;
        maybeAutoEnd();
        render();
      } else if(state.mode==='dashThenTargetSelect'){
        resolveDashThenTarget(c, target);
        c.actedThisTurn = true; state.mode=null;
        maybeAutoEnd(); render();
      } else if(state.mode==='teleportSelectChar'){
        state.teleportCharUid = uid;
        state.mode = 'teleportSelectDest';
        render();
      }
    };
  });
  document.getElementById('previewCloseBtn')?.addEventListener('click', ()=>{
    state.previewUid = null;
    render();
  });
  document.getElementById('previewOverlay')?.addEventListener('click', (evt)=>{
    if(evt.target.id==='previewOverlay'){
      state.previewUid = null;
      render();
    }
  });
  document.getElementById('backToDraftBtn')?.addEventListener('click', ()=>{
    state.confirmBackToDraft = true;
    render();
  });
  document.getElementById('confirmBackYes')?.addEventListener('click', ()=>{
    backToDraft();
  });
  document.getElementById('confirmBackNo')?.addEventListener('click', ()=>{
    state.confirmBackToDraft = false;
    render();
  });
  document.getElementById('saveSlotBtn0')?.addEventListener('click', (evt)=>{
    saveGame(0, evt.currentTarget);
  });
  document.getElementById('saveSlotBtn1')?.addEventListener('click', (evt)=>{
    saveGame(1, evt.currentTarget);
  });
  document.getElementById('forfeitBtn1')?.addEventListener('click', ()=>{
    state.confirmForfeit = 1;
    render();
  });
  document.getElementById('forfeitBtn2')?.addEventListener('click', ()=>{
    state.confirmForfeit = 2;
    render();
  });
  document.getElementById('teleportCoinBtn')?.addEventListener('click', ()=>{
    state.mode = 'teleportSelectChar';
    render();
  });
  document.getElementById('confirmForfeitYes')?.addEventListener('click', ()=>{
    const forfeiter = state.confirmForfeit;
    state.confirmForfeit = null;
    state.gameEnded = true;
    state.forfeited = true;
    state.winner = forfeiter===1 ? 2 : 1;
    const winnerProfileIndex = winningProfileIndexFor(state.winner);
    const before = snapshotCrownCounts(winnerProfileIndex);
    recordProfileWin(state.winner);
    recordMapPvpWin(state.winner);
    state.newlyEarnedCrowns = diffNewlyEarnedCrowns(winnerProfileIndex, before);
    render();
  });
  document.getElementById('confirmForfeitNo')?.addEventListener('click', ()=>{
    state.confirmForfeit = null;
    render();
  });
}

function maybeAutoEnd(){
  // Thief's Charm bonus segment: whichever code path just finished resolving the
  // charmed unit's attack (there are many — plain basic, optionalSecondHit,
  // twoRangeCombo, healFollowup, targetPoint, the charm-eligible special branch,
  // etc.), all of them call maybeAutoEnd() right after, so checking here once
  // covers every case instead of patching each finalize point individually. A
  // move alone doesn't set actedThisTurn, so this correctly waits for the actual
  // attack before ending the segment.
  if(state.charmBonusUid){
    const charmed = getByUid(state.charmBonusUid);
    if(!charmed || !charmed.alive || charmed.actedThisTurn) endCharmSegment();
  }
  checkWin();
}

function renderActiveChar(c){
  const tags = statusLabel(c);
  return `
    <div class="active-char">
      ${c.shield>0? `<div style="font-size:11px;color:#7fc7e8">Shield: ${c.shield}</div>`:''}
      ${activeGuardReduction(c)>0? `<div style="font-size:11px;color:#7fc7e8">Guarded: &minus;${activeGuardReduction(c)} dmg/hit</div>`:''}
      ${tags.length? `<div class="status-tags">${tags.map(t=>`<span class="${t.startsWith('Regen')?'tag-regen':''}">${t}</span>`).join('')}</div>`:''}
    </div>
  `;
}

function renderPreviewOverlay(c){
  const tags = statusLabel(c);
  const teamClass = c.team===1 ? 'p1' : 'p2';
  const teamName = teamOf(c).name;
  const portrait = c.def.image
    ? `<img src="${c.def.image}" alt="${c.def.name}">`
    : `<div class="preview-token-fallback ${teamClass}" style="background:${teamColorVar(c)}">${c.def.name.slice(0,3).toUpperCase()}</div>`;
  return `
    <div class="preview-overlay" id="previewOverlay">
      <div class="preview-card" id="previewCard">
        <button class="preview-close" id="previewCloseBtn" title="Close">&times;</button>
        <div class="preview-portrait">${portrait}</div>
        <div class="preview-name">${c.def.name}</div>
        <div class="preview-team ${teamClass}">${teamName}</div>
        ${c.alive ? `
          <div class="preview-hp-row">${c.hp}/${c.maxHp} HP &middot; Move: ${c.def.move}${c.shield>0? ` &middot; Shield: ${c.shield}`:''}${activeGuardReduction(c)>0? ` &middot; Guarded: &minus;${activeGuardReduction(c)} dmg/hit`:''}</div>
        ` : `<div class="preview-defeated">Defeated</div>`}
        ${tags.length? `<div class="preview-status-tags">${tags.map(t=>`<span>${t}</span>`).join('')}</div>`:''}
        <div class="preview-ability-box">
          <span style="color:var(--p1); font-size:14px; font-weight:700;">${effectiveBasic(c).label}${c.basicBonus?` (+${c.basicBonus} buffed)`:''}</span><br>
          <b style="color:var(--p2);">${c.def.special.name}:</b> ${c.def.special.desc}<br>
          ${c.def.auto?`<b style="color:var(--gold);">${c.def.auto.name}${autoPassiveTag(c.def.auto)}:</b> ${c.def.auto.desc}<br>`:''}
          <span style="color:var(--text-dim); font-size:12px;">Special charges left: ${c.specialCharges}</span>
        </div>
      </div>
    </div>
  `;
}

function renderMini(list, current){
  return list.map(c=>{
    const cls = ['mtoken', teamCls(c)];
    if(!c.alive) cls.push('dead');
    if(current && current.uid===c.uid) cls.push('current');
    return `<div class="${cls.join(' ')}" title="${c.def.name} ${c.hp}/${c.maxHp} HP">${c.def.name.slice(0,3).toUpperCase()}</div>`;
  }).join('');
}

function renderGameOver(app){
  const winner = state.winner===0? 'Draw' : (state.winner===1? state.p1.name : state.p2.name);
  app.innerHTML = `
    <div class="gameover">
      <h2>${winner==='Draw'? 'Draw!' : winner+' wins!'}</h2>
      <p class="ui-font">All of the opposing squad has been defeated.</p>
      <button id="restartBtn" class="back-btn ui-font" style="padding:10px 18px; font-size:14px;">Play again</button>
      <br>
      <button id="mainMenuBtn" class="back-btn ui-font" style="margin-top:12px;">Main menu</button>
    </div>
  `;
  document.getElementById('restartBtn').onclick = ()=>{
    const vsMode = state.vsMode, cpuDifficulty = state.cpuDifficulty;
    const p1ProfileIndex = state.p1ProfileIndex, p2ProfileIndex = state.p2ProfileIndex;
    const p1Name = state.p1.name, p2Name = state.p2.name;
    state = freshState();
    state.vsMode = vsMode; state.cpuDifficulty = cpuDifficulty;
    state.p1ProfileIndex = p1ProfileIndex; state.p2ProfileIndex = p2ProfileIndex;
    state.p1.name = p1Name; state.p2.name = p2Name;
    render();
  };
  document.getElementById('mainMenuBtn').onclick = ()=>{
    state = freshState();
    state.phase = 'title';
    render();
  };
}



/* ============== PUZZLE TACTICS (logic nonogram + mines puzzle mode) ==============
   A puzzle mode opened from a profile's page, with its own progression saved
   against that profile. There is no Guest path — the mode is profile-only, since
   solving puzzles awards crowns and crowns belong to a profile. Every square is
   either a mine or safe, and the mines spell out a hidden Battle Tactics picture. Two clue systems overlap and
   always agree:
     - edge clues: the runs of consecutive mines in that row/column (nonogram)
     - given numbers in the grid: mines among that square's 8 neighbours
   Puzzles sit on a staggered path and unlock strictly in order.

   Marks are validated the instant they're placed: a correct mark settles the
   square for good, a wrong one is corrected on the spot and spends one of the
   run's wrong guesses. Spend more than the board allows and the puzzle is lost
   and has to be restarted — so there is no pencilling in, no checking, and no
   undo. Every square showing a mark is a square already known to be right.

   Squares can be tapped one at a time or painted by dragging across a run. A
   drag stops dead on the first wrong square rather than ploughing on and
   spending the whole allowance in one careless stroke.

   The art/hint pairs below were generated offline, and each puzzle was verified
   to be forced by pure logic from those two clue systems together — no guessing
   is ever required. `hints` is [cellIndex, adjacentMineCount]; every hint square
   is a safe (non-mine) square, so hint squares are never markable. */

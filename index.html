  {id:100,size:20,name:"The Sovereign",cat:"Character",art:['.......######.......','.......#.#.#........','......########......','........####........','.......######.......','......########......','......########......','......#..##..#......','......########......','.......######.......','........####........','........####........','.....##########.....','..################..','..################..','#########..#########','########....########','#########..#########','####################','########....########'],hints:[[21,0],[24,0],[26,4],[28,8],[32,6],[34,1],[36,0],[39,0],[61,0],[64,0],[66,3],[67,6],[72,6],[74,1],[76,0],[79,0],[121,0],[124,0],[125,3],[134,3],[136,0],[139,0],[148,7],[151,7]]},
];

// The puzzle list is built in repeating blocks of ten: four 5x5, three 10x10,
// two 15x15 and one 20x20, ordered smallest first. Puzzles 11-20 repeat the same
// shape, and so on, so the difficulty curve resets and climbs again each block.
// puzzleBlockSizeFor() is what any new batch of puzzles must line up with.
const PUZZLE_BLOCK_PATTERN = [5,5,5,5,10,10,10,15,15,20];
function puzzleBlockSizeFor(id){ return PUZZLE_BLOCK_PATTERN[(id-1) % PUZZLE_BLOCK_PATTERN.length]; }

// Each block of ten is a nation, announced on the path where that block begins.
// Add a name here when a new block of puzzles is added; blocks past the end of
// this list fall back to a numbered region rather than breaking.
const PUZZLE_NATIONS = ['Wildewoods', 'Desert Lands', 'Westlands', 'Southtown', 'Holy City', 'Oriental Kingdom', 'The Islands', 'The Coldlands', 'The Cliffs', 'Royal Kingdom'];
function puzzleBlockIndexFor(id){ return Math.floor((id-1) / PUZZLE_BLOCK_PATTERN.length); }
function puzzleNationFor(id){
  const b = puzzleBlockIndexFor(id);
  return PUZZLE_NATIONS[b] || `Region ${b+1}`;
}

const PUZZLE_CELL = { 5:48, 10:34, 15:25, 20:20 };   // px per square, by puzzle size
const PUZZLE_CLUE = { 5:22, 10:17, 15:14, 20:12 };   // px per clue number in the gutters
// How many wrong guesses a board tolerates, scaling with size. Spending them all
// is survivable; the guess after that loses the run.
const PUZZLE_WRONG_GUESSES = { 5:1, 10:2, 15:3, 20:4 };
const PUZZLE_CROWN_EVERY = 10;                // one crown per this many puzzles solved
const PUZZLE_NUM_COLORS = {
  0:'#5b6376', 1:'#6ea8ff', 2:'#5fbf7a', 3:'#e07a5f', 4:'#b48ce0',
  5:'#e0b45f', 6:'#5fd0d0', 7:'#e9e6dc', 8:'#9aa0b4',
};

// Cell values. Anything other than BLANK is settled and can't be changed —
// FIX_* are squares the game corrected after a wrong guess.
const PT_BLANK = 0, PT_MINE = 1, PT_CROSS = 2, PT_FIX_SAFE = 3, PT_FIX_MINE = 4;
function ptIsMineMark(v){ return v===PT_MINE || v===PT_FIX_MINE; }

/* ---------------- per-profile progression ---------------- */

const PUZZLE_PROGRESS_KEYS = Array.from({length:MAX_PROFILES}, (_,i)=>`btProfile${i+1}PuzzleTactics`);
// profile index (as a string) -> { solved:{"3":true}, boards:{"3":{m:"01204...", w:1}} }
let puzzleProgress = {};
let puzzleProgressLoaded = false;

function puzzleRecord(key){
  if(!puzzleProgress[key]) puzzleProgress[key] = { solved:{}, boards:{} };
  return puzzleProgress[key];
}
function puzzleStorageKeyFor(key){
  return PUZZLE_PROGRESS_KEYS[Number(key)];
}
function puzzleSolvedCountFor(key){
  const r = puzzleRecord(key);
  return PUZZLE_TACTICS.filter(p=>r.solved[String(p.id)]).length;
}
// One crown per PUZZLE_CROWN_EVERY puzzles solved. Feeds crownCountForProfile().
function puzzleCrownsEarnedFor(key){
  return Math.floor(puzzleSolvedCountFor(key) / PUZZLE_CROWN_EVERY);
}
function puzzleCrownsEarned(i){
  if(i===null || i===undefined) return 0;
  return puzzleCrownsEarnedFor(String(i));
}

async function loadPuzzleProgress(){
  if(puzzleProgressLoaded) return;
  puzzleProgressLoaded = true;
  const keys = profileIndices().map(i=>String(i));
  await Promise.all(keys.map(async key=>{
    try{
      const res = await storageGet(puzzleStorageKeyFor(key));
      if(res && res.value){
        const data = typeof res.value==='string' ? JSON.parse(res.value) : res.value;
        if(data && typeof data==='object'){
          puzzleProgress[key] = { solved:data.solved || {}, boards:data.boards || {} };
        }
      }
    }catch(e){ /* first run, or storage unavailable — start fresh */ }
  }));
  render();
}
function savePuzzleProgress(key){
  try{ storageSet(puzzleStorageKeyFor(key), JSON.stringify(puzzleRecord(key))); }catch(e){}
}
// Called when a profile is deleted so a later profile in the same slot doesn't
// inherit someone else's puzzle progression or crowns.
async function clearPuzzleProgressForProfile(index){
  puzzleProgress[String(index)] = { solved:{}, boards:{} };
  try{ await storageSet(PUZZLE_PROGRESS_KEYS[index], JSON.stringify({solved:{}, boards:{}})); }catch(e){}
}

/* ---------------- live session ---------------- */

// Tracks {key, done} for the last profile/solved-count the path screen auto-
// scrolled for, so renderPuzzlePath only re-centres on the next puzzle when
// real progress changes rather than on every re-render.
let ptPathScrollState = null;
// Set right before leaving a puzzle screen so the path knows to land back on
// that exact node, instead of wherever the "next puzzle to play" logic below
// would otherwise centre the view.
let ptReturnFocusId = null;

let ptx = {
  profileKey:null,    // which profile's progression is open, as an index string
  dragging:false,     // a paint stroke is in progress
  holdAnchor:null,     // {i,x,y} of the square the current stroke started on
  heldSet:null,        // Set of square indices currently held (highlighted, not yet graded)
  dragButtonBit:1,     // e.buttons bit for whichever mouse button started the current stroke
  suppressClick:false, // set when a chord just cancelled a hold, to swallow the resulting native click
  activeId:null,
  grid:null,          // settled marks for the open puzzle
  tool:'mine',        // 'mine' | 'x' — set by which mouse button was pressed, or by the touch toolbar
  touchSeen:false,    // a touch pointer has been used, so show the marker toggle
  wrong:0,            // wrong guesses spent on this run
  cellEls:[],         // cached cell nodes for the open board, indexed by cell
  viewSolved:false,   // showing the finished picture rather than the playable grid
  solvedNow:false,    // true only for the reveal right after clearing it
  crownEarned:0,      // crowns newly earned by that solve, for the reveal notice
  failed:false,       // ran out of wrong guesses
  confirmingReset:false, // showing the "reset progress" confirm prompt on the path screen
};

const puzzleCache = {};

function puzzleRuns(cells){
  const out = []; let run = 0;
  for(const c of cells){ if(c===1) run++; else { if(run) out.push(run); run = 0; } }
  if(run) out.push(run);
  return out;
}

// Derives everything the screens need from the compact stored art/hints.
function puzzleData(id){
  if(puzzleCache[id]) return puzzleCache[id];
  const p = PUZZLE_TACTICS.find(q=>q.id===id);
  if(!p) return null;
  const W = p.size, H = p.size, sol = [];
  p.art.forEach(row=>{ for(const ch of row) sol.push(ch==='#'?1:0); });
  const rowClues = [], colClues = [];
  for(let y=0;y<H;y++) rowClues.push(puzzleRuns(sol.slice(y*W, y*W+W)));
  for(let x=0;x<W;x++){
    const col = []; for(let y=0;y<H;y++) col.push(sol[y*W+x]);
    colClues.push(puzzleRuns(col));
  }
  const hintMap = new Map();
  p.hints.forEach(([i,n])=>hintMap.set(i,n));
  const data = {
    p, W, H, sol, rowClues, colClues, hintMap,
    mineCount: sol.reduce((a,v)=>a+v,0),
    allowance: PUZZLE_WRONG_GUESSES[W] || Math.ceil(W/5),
  };
  puzzleCache[id] = data;
  return data;
}

function puzzleUnlockedFor(key, id){
  return id===1 || !!puzzleRecord(key).solved[String(id-1)];
}
function puzzleLabelForKey(key){
  return profileNames[Number(key)];
}

/* ---------------- the path ---------------- */

// Every screen in this mode was entered from a profile's page, so backing out
// returns there rather than to the main menu.
function puzzleBackToProfile(){
  state.viewingProfileIndex = Number(ptx.profileKey);
  state.phase = 'profileDetail';
  render();
}
// Opens a profile's path. Called from the profile page.
function openPuzzleTacticsFor(index){
  ptx.profileKey = String(index);
  ptx.confirmingReset = false;
  // A fresh entry into the path (from the profile screen, not a return trip
  // from playing a puzzle) should always re-land on the current/next level —
  // clearing this forces renderPuzzlePath's own re-centre logic to run even
  // if it's the same profile/done-count as last time this screen was open.
  ptPathScrollState = null;
  state.phase = 'puzzlePath';
  render();
}

// Node centres for the staggered trail. Puzzle 1 sits at the bottom and the
// path snakes upward, so progress reads as a climb.
function puzzlePathLayout(){
  const n = PUZZLE_TACTICS.length;
  // The swing is kept a little tighter than the container so the crown markers,
  // which hang off the outer edge of their node, still land inside the path.
  // padBottom clears the label and the nation banner under the very first node.
  const W = 340, spacing = 90, padTop = 46, padBottom = 190, node = 58, swing = 0.29;
  const block = PUZZLE_BLOCK_PATTERN.length;
  const gap = 200;         // extra breathing room where one nation gives way to the next
  const bannerDrop = 150;  // how far below a block's first node its banner sits

  // Offsets measured upward from the bottom of the path, so a block boundary can
  // open up a gap without shifting everything below it.
  const offsets = [];
  let off = 0;
  for(let idx=0; idx<n; idx++){
    if(idx > 0) off += spacing + (idx % block === 0 ? gap : 0);
    offsets.push(off);
  }
  const H = padTop + padBottom + offsets[n-1];
  const pts = PUZZLE_TACTICS.map((p, idx)=>({
    p, idx,
    x: W * (0.5 + swing*Math.sin(idx*Math.PI/2)),
    y: H - padBottom - offsets[idx],
  }));
  const nations = pts.filter(pt=>pt.idx % block === 0).map(pt=>({
    name: puzzleNationFor(pt.p.id),
    firstId: pt.p.id,
    y: pt.y + bannerDrop,
  }));
  return { W, H, node, pts, nations };
}

// One <path> per thumbnail rather than a rect per square — keeps the path
// screen light even with the 15x15 pictures drawn on it.
function puzzleThumbPath(art){
  let d = '';
  art.forEach((row,y)=>{ for(let x=0;x<row.length;x++) if(row[x]==='#') d += `M${x} ${y}h1v1h-1z`; });
  return d;
}

function renderPuzzlePath(app){
  ptx.cellEls = [];
  if(!profileNamesLoaded) loadProfileMeta();
  if(!puzzleProgressLoaded) loadPuzzleProgress();
  const key = ptx.profileKey;
  const rec = puzzleRecord(key);
  const L = puzzlePathLayout();
  const done = puzzleSolvedCountFor(key);
  const crowns = puzzleCrownsEarnedFor(key);
  const toNextCrown = PUZZLE_CROWN_EVERY - (done % PUZZLE_CROWN_EVERY);

  const trail = L.pts.slice(0,-1).map((a,i)=>{
    const b = L.pts[i+1];
    // No line across a nation boundary — the banner is the join there, and a
    // trail running through it would read as one continuous region.
    if(b.idx % PUZZLE_BLOCK_PATTERN.length === 0) return '';
    const cleared = !!rec.solved[String(a.p.id)];
    return `<line x1="${a.x.toFixed(1)}" y1="${a.y}" x2="${b.x.toFixed(1)}" y2="${b.y}"
      stroke="${cleared?'var(--gold-dim)':'var(--line)'}" stroke-width="4" stroke-linecap="round"
      ${cleared?'':'stroke-dasharray="7 8"'} />`;
  }).join('');

  const nodes = L.pts.map(pt=>{
    const id = pt.p.id;
    const solved = !!rec.solved[String(id)];
    const unlocked = puzzleUnlockedFor(key, id);
    const cls = solved ? 'pt-done' : unlocked ? 'pt-open' : 'pt-locked';
    const inner = solved
      ? `<svg viewBox="0 0 ${pt.p.size} ${pt.p.size}" width="34" height="34"><path d="${puzzleThumbPath(pt.p.art)}" fill="var(--gold)"/></svg>`
      : unlocked
        ? `<span class="pt-num">${id}</span>`
        : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="10.5" width="16" height="11" rx="1.5"/><path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/></svg>`;
    // The level number shows on every node, solved or not — a cleared node swaps
    // its number for the picture it revealed, so the label has to carry it.
    const label = `<b>Level ${id}</b>`
      + (solved ? `<span class="pt-name">${pt.p.name}</span>` : '')
      + `<span class="pt-size">${pt.p.size}&times;${pt.p.size}</span>`;
    // Every tenth puzzle is a crown milestone, so it wears a crown on the path:
    // grey while the crown is still to be won, gold once that puzzle is solved.
    // It hangs off the outer edge of the node, away from the path's centre line.
    let crown = '';
    if(id % PUZZLE_CROWN_EVERY === 0){
      const offset = (pt.x >= L.W/2 ? 1 : -1) * (L.node/2 + 17);
      crown = `<div class="pt-crown-mark${solved?' earned':''}"
        style="left:${(pt.x + offset).toFixed(1)}px; top:${pt.y}px;"
        title="${solved ? `Crown earned \u2014 ${id} puzzles solved` : `Solve this to earn a crown at ${id} puzzles`}">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>
      </div>`;
    }
    return `${crown}
      <button class="pt-node ${cls}" data-puzzle="${id}" ${unlocked?'':'disabled'}
        style="left:${pt.x.toFixed(1)}px; top:${pt.y}px; width:${L.node}px; height:${L.node}px;">${inner}</button>
      <div class="pt-label" style="left:${pt.x.toFixed(1)}px; top:${pt.y + L.node/2 + 7}px;">${label}</div>`;
  }).join('');

  const banners = L.nations.map(nat=>{
    const reached = nat.firstId===1 || !!rec.solved[String(nat.firstId-1)];
    return `<div class="pt-nation${reached?'':' locked'}" style="top:${nat.y}px;">
      <span class="pt-nation-rule"></span>
      <span class="pt-nation-name">${nat.name}</span>
      <span class="pt-nation-rule"></span>
    </div>`;
  }).join('');

  app.innerHTML = `
    <div class="pt-head">
    <div class="draft-status">
      <button id="ptBackToProfileBtn" class="back-btn ui-font" style="margin-bottom:10px;">&larr; Back to ${puzzleLabelForKey(key)}</button><br>
      <span class="turn-badge p1">Puzzle Tactics</span>
      <div class="pt-status" style="margin-top:10px;">
        ${puzzleLabelForKey(key)} &mdash; <b>${done}</b> of ${PUZZLE_TACTICS.length} solved${crowns?` &middot; <b>${crowns}</b> crown${crowns>1?'s':''} earned`:''}
      </div>
      <div class="ui-font" style="font-size:12px; color:var(--text-dim); margin-top:4px;">
        ${done < PUZZLE_TACTICS.length ? `${toNextCrown} more to earn a crown` : 'Every puzzle solved'}
      </div>
      ${done || crowns ? (ptx.confirmingReset ? `
        <p class="ui-font" style="font-size:13px; color:#ffb3a7; margin:10px 0 6px;">Reset all Puzzle Tactics progress for ${puzzleLabelForKey(key)}? Every solved puzzle and any crowns earned from them will be erased. This can't be undone.</p>
        <button id="confirmResetProgressBtn" class="back-btn ui-font" style="border-color:var(--danger); color:#ffb3a7; padding:8px 16px;">Yes, reset</button>
        <button id="cancelResetProgressBtn" class="back-btn ui-font" style="padding:8px 16px;">Cancel</button>
      ` : `<button id="ptResetProgressBtn" class="back-btn ui-font" style="margin-top:10px; border-color:var(--danger); color:#ffb3a7;">Reset progress</button>`) : ''}
    </div>
    <div style="max-width:520px; margin:14px auto 0;">
      <details class="panel" style="padding:0;">
        <summary class="ui-font" style="cursor:pointer; padding:12px 14px; font-size:13px; font-weight:700; color:var(--gold); font-family:var(--serif);">How to play</summary>
        <div class="ui-font" style="padding:0 14px 14px; color:var(--text-dim); font-size:13px;">
          Every square is either a <b>mine</b> or safe, and the mines spell out a hidden Battle Tactics picture. Find every mine to solve the puzzle.<br><br>
          <b>Left-click</b> a square to call it a mine, and <b>right-click</b> one to rule it out. A single click is judged the moment you let go.<br><br>
          <b>Hold and drag</b> to select more than one square at once &mdash; the squares you pass over are only highlighted, nothing is judged until you release. Drag <b>straight up/down or left/right</b> to hold a whole line, or drag <b>diagonally</b> to hold a filled rectangle spanning wherever you started and wherever you are now. Letting go grades the whole hold at once, top row to bottom, left to right within a row. A counter in the corner of the board tracks how many squares are currently held. Pressing the <b>other</b> mouse button while holding cancels the hold instead &mdash; nothing in it gets graded.<br><br>
          On a touch screen there's no right button, so a marker toggle appears above the board instead &mdash; pick one, then tap or drag.<br><br>
          <b>Every held square is judged the instant you release.</b> Get it right and the square is settled for good. Get it wrong and the square is corrected in red, and you spend one of your wrong guesses. Grading stops the moment it hits a wrong square, so one careless hold can only ever cost you a single guess. Spend more than the board allows and the run is over &mdash; restart and go again.<br><br>
          You get <b>${PUZZLE_WRONG_GUESSES[5]}</b> wrong guess on a 5&times;5, <b>${PUZZLE_WRONG_GUESSES[10]}</b> on a 10&times;10, <b>${PUZZLE_WRONG_GUESSES[15]}</b> on a 15&times;15, and <b>${PUZZLE_WRONG_GUESSES[20]}</b> on a 20&times;20.<br><br>
          <b>Numbers inside the grid</b> sit on safe squares and count the mines in the 8 squares touching them, diagonals included.<br><br>
          <b>Numbers along the top and left</b> give the runs of mines in that column or row, in order &mdash; so <i>3 1</i> means a run of 3, at least one gap, then a run of 1.<br><br>
          Both clue types always agree, and every puzzle can be finished by logic alone &mdash; you never have to guess. Solve a puzzle to unlock the next one, and earn a crown for every ${PUZZLE_CROWN_EVERY} you clear.<br><br>
          The path is split into nations of ${PUZZLE_BLOCK_PATTERN.length} puzzles. Each one climbs the same way: four 5&times;5 boards, then three 10&times;10, then two 15&times;15, then a 20&times;20 to finish, with a crown waiting at the end of every nation.
        </div>
      </details>
    </div>
    </div>
    <div class="pt-path-wrap">
      <div class="pt-path" style="width:${L.W}px; height:${L.H}px;">
        <svg class="pt-trail" viewBox="0 0 ${L.W} ${L.H}" width="${L.W}" height="${L.H}">${trail}</svg>
        ${banners}
        ${nodes}
      </div>
    </div>
  `;

  document.getElementById('ptBackToProfileBtn').onclick = ()=>{ puzzleBackToProfile(); };
  document.getElementById('ptResetProgressBtn')?.addEventListener('click', ()=>{
    ptx.confirmingReset = true;
    render();
  });
  document.getElementById('cancelResetProgressBtn')?.addEventListener('click', ()=>{
    ptx.confirmingReset = false;
    render();
  });
  document.getElementById('confirmResetProgressBtn')?.addEventListener('click', async ()=>{
    ptx.confirmingReset = false;
    await clearPuzzleProgressForProfile(Number(key));
    ptPathScrollState = null; // progress just reset — re-centre on puzzle 1 next render
    render();
  });
  app.querySelectorAll('.pt-node[data-puzzle]').forEach(el=>{
    el.onclick = ()=>{
      const id = Number(el.dataset.puzzle);
      if(puzzleUnlockedFor(ptx.profileKey, id)) openPuzzle(id);
    };
  });

  // Land the view on the next puzzle to play rather than wherever the path's
  // top edge happens to fall — the path only grows taller as nations are
  // added, so opening at the very top buries a player's actual progress. Only
  // re-centres when the profile or solved count actually changed, so it
  // doesn't yank the view around while someone's just confirming a reset.
  const nextId = done < PUZZLE_TACTICS.length ? PUZZLE_TACTICS[done].id : PUZZLE_TACTICS[PUZZLE_TACTICS.length-1].id;
  if(ptReturnFocusId!=null){
    const focusId = ptReturnFocusId;
    ptReturnFocusId = null;
    ptPathScrollState = { key, done };
    const targetEl = app.querySelector(`.pt-node[data-puzzle="${focusId}"]`);
    if(targetEl) requestAnimationFrame(()=> targetEl.scrollIntoView({ block:'center' }));
  } else if(!ptPathScrollState || ptPathScrollState.key!==key || ptPathScrollState.done!==done){
    ptPathScrollState = { key, done };
    const targetEl = app.querySelector(`.pt-node[data-puzzle="${nextId}"]`);
    if(targetEl) requestAnimationFrame(()=> targetEl.scrollIntoView({ block:'center' }));
  }
}

/* ---------------- playing a puzzle ---------------- */

function openPuzzle(id, forceRestart){
  const d = puzzleData(id);
  if(!d) return;
  const rec = puzzleRecord(ptx.profileKey);
  const board = rec.boards[String(id)];
  const usable = !forceRestart && board && typeof board.m==='string' && board.m.length===d.W*d.H;
  ptx.activeId = id;
  ptx.grid = usable ? board.m.split('').map(Number) : new Array(d.W*d.H).fill(PT_BLANK);
  ptx.wrong = usable ? (board.w || 0) : 0;
  ptx.failed = false;
  ptx.solvedNow = false;
  ptx.crownEarned = 0;
  ptx.dragging = false;
  ptx.holdAnchor = null;
  ptx.heldSet = null;
  ptx.viewSolved = !!rec.solved[String(id)];
  if(forceRestart) puzzlePersistBoard();
  state.phase = 'puzzlePlay';
  render();
}

function puzzlePersistBoard(){
  const rec = puzzleRecord(ptx.profileKey);
  rec.boards[String(ptx.activeId)] = { m: ptx.grid.join(''), w: ptx.wrong };
  savePuzzleProgress(ptx.profileKey);
}

function puzzleIsSolved(){
  const d = puzzleData(ptx.activeId);
  for(let i=0;i<d.sol.length;i++){
    if(d.hintMap.has(i)) continue;                 // givens are safe and unmarkable
    if(d.sol[i]===1 && !ptIsMineMark(ptx.grid[i])) return false;
  }
  return true;
}

function puzzleFinish(){
  const rec = puzzleRecord(ptx.profileKey);
  const before = puzzleCrownsEarnedFor(ptx.profileKey);
  rec.solved[String(ptx.activeId)] = true;
  ptx.crownEarned = puzzleCrownsEarnedFor(ptx.profileKey) - before;
  ptx.viewSolved = true;
  ptx.solvedNow = true;
  puzzlePersistBoard();
  render();
}

// Every tap is judged immediately. A correct call settles the square; a wrong
// one corrects it in place and spends a guess.
// Returns false when a paint stroke must stop here — a wrong guess, a solve, or
// a lost run. Squares that were already settled return true, so dragging over
// them just carries on.
function puzzleApply(i){
  const d = puzzleData(ptx.activeId);
  if(!d || ptx.viewSolved || ptx.failed) return false;
  if(d.hintMap.has(i)) return true;
  if(ptx.grid[i]!==PT_BLANK) return true;          // already settled
  const calledMine = ptx.tool==='mine';
  const isMine = d.sol[i]===1;
  if(calledMine === isMine){
    ptx.grid[i] = calledMine ? PT_MINE : PT_CROSS;
    if(puzzleIsSolved()){ puzzleFinish(); return false; }
    puzzlePersistBoard();
    puzzlePaintCell(i);
    puzzleUpdateStatus();
    return true;
  }
  // Wrong guess: show the square's real state and charge the run for it.
  ptx.grid[i] = isMine ? PT_FIX_MINE : PT_FIX_SAFE;
  ptx.wrong++;
  if(ptx.wrong > d.allowance){
    ptx.failed = true;
    // A lost run doesn't carry over — the next attempt starts from a clean board.
    const rec = puzzleRecord(ptx.profileKey);
    delete rec.boards[String(ptx.activeId)];
    savePuzzleProgress(ptx.profileKey);
    render();
    return false;
  }
  if(puzzleIsSolved()){ puzzleFinish(); return false; }  // a corrected mine can complete the picture
  puzzlePersistBoard();
  puzzlePaintCell(i);
  puzzleUpdateStatus();
  return false;   // a wrong guess always ends the stroke, so one bad drag can't drain the allowance
}

/* Drag painting. Touch implicitly captures the pointer to whichever square it
   started on, so the stroke is tracked with pointermove + elementFromPoint on the
   grid rather than per-square enter events.

   The hold's shape is recomputed from scratch on every move, purely from where
   the pointer is right now relative to the anchor square — there's no locking
   onto a direction the moment the pointer first steps away. That keeps it
   honest and glitch-free: whatever's highlighted is exactly what will be
   graded if the player lets go this instant.
     - pointer directly above/below the anchor -> a vertical line
     - pointer directly left/right of the anchor -> a horizontal line
     - anywhere else -> a filled rectangle spanning the anchor and the pointer
   Nothing is graded until the pointer is released, at which point the whole
   hold is judged in reading order (top row to bottom, left to right within a
   row) in one go. Pressing the *other* mouse button while a hold is in
   progress cancels it outright — nothing in it gets graded. */
let puzzleDragReleaseBound = false;

function puzzleClearHoldVisuals(){
  if(ptx.heldSet){
    ptx.heldSet.forEach(i=>{ const el = ptx.cellEls[i]; if(el) el.classList.remove('pt-holding'); });
  }
  const badge = document.getElementById('ptHoldBadge');
  if(badge) badge.classList.remove('show');
}

// Recomputes which squares are currently spanned by the hold, given where the
// pointer is right now, and repaints only what changed. Skips givens and
// squares already settled — nothing to hold there.
function puzzleHoldUpdate(currentX, currentY){
  const d = puzzleData(ptx.activeId);
  if(!d) return;
  const { x: ax, y: ay } = ptx.holdAnchor;
  const next = new Set();
  // Givens are never selectable — everything else counts, settled or not,
  // since the counter should reflect the whole span, not just what's left to grade.
  const consider = idx => { if(!d.hintMap.has(idx)) next.add(idx); };
  if(currentX===ax && currentY!==ay){
    const from = Math.min(ay, currentY), to = Math.max(ay, currentY);
    for(let row=from; row<=to; row++) consider(row*d.W + ax);
  } else if(currentY===ay && currentX!==ax){
    const from = Math.min(ax, currentX), to = Math.max(ax, currentX);
    for(let col=from; col<=to; col++) consider(ay*d.W + col);
  } else if(currentX===ax && currentY===ay){
    consider(ay*d.W + ax);
  } else {
    // A filled rectangle spanning the anchor and the current square.
    const fromX = Math.min(ax, currentX), toX = Math.max(ax, currentX);
    const fromY = Math.min(ay, currentY), toY = Math.max(ay, currentY);
    for(let row=fromY; row<=toY; row++){
      for(let col=fromX; col<=toX; col++) consider(row*d.W + col);
    }
  }
  const prev = ptx.heldSet || new Set();
  prev.forEach(i=>{ if(!next.has(i)){ const el = ptx.cellEls[i]; if(el) el.classList.remove('pt-holding'); } });
  next.forEach(i=>{ if(!prev.has(i)){ const el = ptx.cellEls[i]; if(el) el.classList.add('pt-holding'); } });
  ptx.heldSet = next;
  const badge = document.getElementById('ptHoldBadge');
  if(badge){
    badge.textContent = `${next.size} held`;
    badge.classList.toggle('show', next.size>0);
  }
}

// Judges every square the hold spans, in reading order, stopping the moment
// one comes back wrong — the same "one bad square ends the stroke" rule an
// ordinary drag has always followed, just deferred until the player lets go.
function puzzleCommitHold(){
  puzzleClearHoldVisuals();
  const run = Array.from(ptx.heldSet || []).sort((a,b)=>a-b);
  for(const i of run){
    if(ptx.viewSolved || ptx.failed) return;
    if(!puzzleApply(i)) return;
  }
}

// Ends a stroke the ordinary way: whatever it was holding gets graded.
function puzzleEndStroke(){
  if(ptx.dragging) puzzleCommitHold();
  ptx.dragging = false;
  ptx.holdAnchor = null;
  ptx.heldSet = null;
}

// Ends a stroke by throwing it away instead — used when the other mouse
// button interrupts a hold in progress. Nothing in it gets graded, and the
// click that the cancelling button's own release would otherwise fire on
// whatever square is under the cursor gets swallowed too (see puzzleBindDrag).
function puzzleCancelHold(){
  puzzleClearHoldVisuals();
  ptx.dragging = false;
  ptx.holdAnchor = null;
  ptx.heldSet = null;
  ptx.suppressClick = true;
}

function puzzleBindDrag(grid){
  const LEFT_BIT = 1, RIGHT_BIT = 2;
  if(!puzzleDragReleaseBound){
    puzzleDragReleaseBound = true;
    ['pointerup','pointercancel'].forEach(ev=>document.addEventListener(ev, puzzleEndStroke));
    // The chording button always fires a genuine 'mousedown', even on
    // browsers/situations where a second 'pointerdown' doesn't — this is the
    // one reliable signal, caught in the capture phase so it lands before the
    // square's own click handling even sees the press.
    document.addEventListener('mousedown', e=>{
      if(!ptx.dragging) return;
      if(e.button!==0 && e.button!==2) return;
      const bit = e.button===2 ? RIGHT_BIT : LEFT_BIT;
      if(bit===ptx.dragButtonBit) return;   // the button already driving the hold — not a chord
      e.preventDefault();
      puzzleCancelHold();
    }, true);
    // The cancelling button's own mousedown+mouseup still produces a native
    // 'click' on whatever square is underneath it. Swallow exactly that one.
    document.addEventListener('click', e=>{
      if(!ptx.suppressClick) return;
      ptx.suppressClick = false;
      e.preventDefault();
      e.stopPropagation();
    }, true);
  }
  const squareAt = (x, y)=>{
    const el = document.elementFromPoint(x, y);
    const cell = el && el.closest ? el.closest('button.pt-cell[data-i]') : null;
    return (cell && grid.contains(cell)) ? Number(cell.dataset.i) : null;
  };
  grid.addEventListener('contextmenu', e=>e.preventDefault());   // right-drag must not open the menu
  grid.addEventListener('pointerdown', e=>{
    if(e.pointerType==='mouse'){
      if(e.button!==0 && e.button!==2) return;
      if(ptx.dragging){
        // A chord — if this browser does fire a second pointerdown for it,
        // catch it here too; the mousedown/pointermove checks are the
        // fallbacks for browsers that don't.
        e.preventDefault();
        puzzleCancelHold();
        return;
      }
      // Left button calls a mine, right button rules a square out. The marker
      // sticks for the whole stroke, so a right-drag holds/sweeps crosses.
      ptx.tool = e.button===2 ? 'x' : 'mine';
    } else if(!ptx.touchSeen){
      // No right button on a touch screen, so the marker toggle appears the
      // moment a finger arrives — desktop players never see it.
      puzzleShowTouchControls();
    }
    const i = squareAt(e.clientX, e.clientY);
    if(i===null) return;
    e.preventDefault();
    const d = puzzleData(ptx.activeId);
    ptx.dragging = true;
    ptx.dragButtonBit = e.pointerType==='mouse' ? (e.button===2 ? RIGHT_BIT : LEFT_BIT) : LEFT_BIT;
    ptx.holdAnchor = { i, x: i % d.W, y: Math.floor(i / d.W) };
    ptx.heldSet = null;
    puzzleHoldUpdate(ptx.holdAnchor.x, ptx.holdAnchor.y);   // highlight the anchor immediately
  });
  grid.addEventListener('pointermove', e=>{
    if(!ptx.dragging) return;
    e.preventDefault();
    if(e.pointerType==='mouse'){
      // e.buttons is a live bitmask of every button currently down, so this
      // catches a chorded press on the move that follows it even on browsers
      // where the mousedown listener above somehow missed it.
      const otherBit = ptx.dragButtonBit===RIGHT_BIT ? LEFT_BIT : RIGHT_BIT;
      if(e.buttons & otherBit){ puzzleCancelHold(); return; }
      if(!(e.buttons & ptx.dragButtonBit)){ puzzleEndStroke(); return; }   // driving button released off-element
    }
    const i = squareAt(e.clientX, e.clientY);
    if(i===null) return;   // over a gap (a given square) — wait for the next real square
    const d = puzzleData(ptx.activeId);
    puzzleHoldUpdate(i % d.W, Math.floor(i / d.W));
  });
}

// Swaps the mouse legend for the tap-friendly marker toggle. Called once, the
// first time a touch pointer lands on a board.
function puzzleShowTouchControls(){
  ptx.touchSeen = true;
  const legend = document.getElementById('ptLegend');
  const tools = document.getElementById('ptTools');
  const hint = document.getElementById('ptToolhint');
  if(legend) legend.hidden = true;
  if(tools) tools.hidden = false;
  if(hint) hint.textContent = 'Pick a marker, then tap squares \u2014 or press and drag to hold a run. Straight lines hold a row or column; diagonal drags hold a rectangle. Nothing is judged until you let go.';
}

/* Targeted DOM updates instead of a full re-render on every tap — this keeps the
   horizontal scroll position of the wider boards and avoids flicker. */
function puzzlePaintCell(i){
  const el = ptx.cellEls[i];
  if(!el) return;
  const v = ptx.grid[i];
  const mark = v===PT_MINE ? ' pt-mine'
    : v===PT_CROSS ? ' pt-cross'
    : v===PT_FIX_MINE ? ' pt-fix-mine'
    : v===PT_FIX_SAFE ? ' pt-fix-safe' : '';
  el.className = 'pt-cell' + (el.dataset.sep || '') + mark;
  el.innerHTML = (v===PT_CROSS || v===PT_FIX_SAFE) ? '&#10005;' : '';
}
function puzzleUpdateStatus(){
  const d = puzzleData(ptx.activeId);
  const found = document.getElementById('ptStatus');
  if(found) found.innerHTML = `Mines found <b>${ptx.grid.filter(ptIsMineMark).length}</b> / ${d.mineCount}`;
  const pips = document.getElementById('ptPips');
  if(pips) pips.innerHTML = puzzlePipsHtml(d);
  const wrap = document.getElementById('ptGuesses');
  if(wrap) wrap.className = 'pt-guesses' + (ptx.wrong>=d.allowance ? ' empty' : '');
  const note = document.getElementById('ptGuessNote');
  if(note) note.textContent = puzzleGuessNote(d);
}
function puzzlePipsHtml(d){
  return Array.from({length:d.allowance}, (_,n)=>
    `<span class="pt-pip${n < ptx.wrong ? ' spent' : ''}"></span>`).join('');
}
function puzzleGuessNote(d){
  const left = d.allowance - ptx.wrong;
  if(left > 0) return `${left} wrong guess${left===1?'':'es'} left`;
  return 'No wrong guesses left \u2014 one more ends the run';
}

function renderPuzzlePlay(app){
  const id = ptx.activeId;
  const d = puzzleData(id);
  if(!d){ state.phase='puzzlePath'; render(); return; }
  if(ptx.failed){ renderPuzzleFailed(app, d); return; }
  if(ptx.viewSolved){ renderPuzzleReveal(app, d); return; }

  const cell = PUZZLE_CELL[d.W] || 30;
  const clue = PUZZLE_CLUE[d.W] || 16;
  const gutL = Math.max(1, ...d.rowClues.map(c=>c.length))*clue + 8;
  const gutT = Math.max(1, ...d.colClues.map(c=>c.length))*clue + 8;
  const clueText = arr => (arr.length ? arr : [0]).map(n=>`<span>${n}</span>`).join('');

  let cells = `<div style="grid-column:1; grid-row:1;"></div>`;
  for(let x=0;x<d.W;x++){
    cells += `<div class="pt-clue col" style="grid-column:${x+2}; grid-row:1;">${clueText(d.colClues[x])}</div>`;
  }
  for(let y=0;y<d.H;y++){
    cells += `<div class="pt-clue row" style="grid-column:1; grid-row:${y+2};">${clueText(d.rowClues[y])}</div>`;
    for(let x=0;x<d.W;x++){
      const i = y*d.W + x;
      const sep = (x>0 && x%5===0 ? ' pt-sep-l' : '') + (y>0 && y%5===0 ? ' pt-sep-t' : '');
      const pos = `grid-column:${x+2}; grid-row:${y+2};`;
      if(d.hintMap.has(i)){
        const n = d.hintMap.get(i);
        cells += `<div class="pt-cell pt-given${sep}" data-i="${i}" data-sep="${sep}"
          style="${pos} font-size:${Math.round(cell*0.52)}px; color:${PUZZLE_NUM_COLORS[n]};">${n}</div>`;
      } else {
        const v = ptx.grid[i];
        const mark = v===PT_MINE ? ' pt-mine' : v===PT_CROSS ? ' pt-cross'
          : v===PT_FIX_MINE ? ' pt-fix-mine' : v===PT_FIX_SAFE ? ' pt-fix-safe' : '';
        cells += `<button class="pt-cell${sep}${mark}" data-i="${i}" data-sep="${sep}"
          style="${pos} font-size:${Math.round(cell*0.5)}px;">${(v===PT_CROSS||v===PT_FIX_SAFE)?'&#10005;':''}</button>`;
      }
    }
  }

  app.innerHTML = `
    <div class="draft-status">
      <button id="ptBackToPathBtn" class="back-btn ui-font" style="margin-bottom:10px;">&larr; Back to the path</button><br>
      <span class="turn-badge p1">${puzzleNationFor(id)} &middot; Level ${id} &middot; ${d.W}&times;${d.H}</span>
    </div>
    <div class="pt-legend" id="ptLegend" ${ptx.touchSeen?'hidden':''}>
      <span class="pt-leg"><b>Left-click</b> <span class="pt-chip mine"></span> mark a mine</span>
      <span class="pt-leg"><b>Right-click</b> <span class="pt-chip">&#10005;</span> rule one out</span>
    </div>
    <div class="pt-tools" id="ptTools" style="margin-top:16px;" ${ptx.touchSeen?'':'hidden'}>
      <button id="ptToolMine" class="pt-tool ${ptx.tool==='mine'?'sel':''}" title="Call it a mine"><span class="pt-swatch"></span></button>
      <button id="ptToolX" class="pt-tool ${ptx.tool==='x'?'sel':''}" title="Call it safe">&#10005;</button>
    </div>
    <div class="pt-toolhint" id="ptToolhint">${ptx.touchSeen
      ? 'Pick a marker, then tap squares &mdash; or press and drag to hold a run. Straight lines hold a row or column; diagonal drags hold a rectangle. Nothing is judged until you let go.'
      : 'Hold either button and drag to select a run &mdash; straight for a line, diagonal for a rectangle. Nothing is judged until you let go. Press the other button while holding to cancel it.'}</div>
    <div class="pt-status" id="ptStatus" style="margin-top:10px;">Mines found <b>${ptx.grid.filter(ptIsMineMark).length}</b> / ${d.mineCount}</div>
    <div class="pt-guesses ${ptx.wrong>=d.allowance?'empty':''}" id="ptGuesses">
      <span class="pt-pips" id="ptPips">${puzzlePipsHtml(d)}</span>
      <span id="ptGuessNote">${puzzleGuessNote(d)}</span>
    </div>
    <div class="pt-board-wrap">
      <div class="pt-hold-badge" id="ptHoldBadge">0 held</div>
      <div>
        <div class="pt-grid" id="ptGrid" style="
          grid-template-columns:${gutL}px repeat(${d.W}, ${cell}px);
          grid-template-rows:${gutT}px repeat(${d.H}, ${cell}px);">${cells}</div>
      </div>
    </div>
    <div class="draft-random-actions" style="margin-top:14px;">
      <button id="ptRestartBtn" class="back-btn ui-font" style="font-size:13px; padding:8px 16px;">Restart puzzle</button>
    </div>
  `;

  ptx.cellEls = new Array(d.W*d.H).fill(null);
  app.querySelectorAll('#ptGrid .pt-cell[data-i]').forEach(el=>{
    ptx.cellEls[Number(el.dataset.i)] = el;
  });

  document.getElementById('ptBackToPathBtn').onclick = ()=>{ ptReturnFocusId = id; state.phase='puzzlePath'; render(); };
  const selectTool = t => {
    ptx.tool = t;
    document.getElementById('ptToolMine').classList.toggle('sel', t==='mine');
    document.getElementById('ptToolX').classList.toggle('sel', t==='x');
  };
  document.getElementById('ptToolMine').onclick = ()=>selectTool('mine');
  document.getElementById('ptToolX').onclick = ()=>selectTool('x');
  document.getElementById('ptRestartBtn').onclick = ()=>openPuzzle(id, true);
  // Click stays for keyboard activation; a square settled by the pointer stroke
  // is already non-blank, so the follow-up click is a harmless no-op.
  app.querySelectorAll('#ptGrid button.pt-cell').forEach(el=>{
    el.onclick = ()=>puzzleApply(Number(el.dataset.i));
  });
  puzzleBindDrag(document.getElementById('ptGrid'));
}

function renderPuzzleFailed(app, d){
  ptx.cellEls = [];
  const id = ptx.activeId;
  app.innerHTML = `
    <div class="draft-status">
      <button id="ptBackToPathBtn" class="back-btn ui-font" style="margin-bottom:10px;">&larr; Back to the path</button><br>
      <span class="turn-badge p2">Out of guesses</span>
    </div>
    <div style="text-align:center; margin-top:26px;">
      <div class="ui-font" style="font-size:14px; color:var(--text-dim); max-width:420px; margin:0 auto; line-height:1.6;">
        Puzzle ${id} allows <b style="color:var(--gold);">${d.allowance}</b> wrong guess${d.allowance===1?'':'es'} on a ${d.W}&times;${d.H} board, and this run went one over.<br><br>
        The board resets, but the puzzle stays unlocked &mdash; every square can be worked out from the clues, so a clean run is always possible.
      </div>
    </div>
    <div class="draft-random-actions" style="margin-top:26px;">
      <button id="ptRetryBtn" class="back-btn ui-font" style="font-size:14px; font-weight:700; padding:10px 20px; border-color:var(--gold); color:var(--gold);">Try again</button>
      <button id="ptPathBtn" class="back-btn ui-font" style="font-size:13px; padding:10px 18px;">Back to the path</button>
    </div>
  `;
  const toPath = ()=>{ ptReturnFocusId = id; state.phase='puzzlePath'; render(); };
  document.getElementById('ptBackToPathBtn').onclick = toPath;
  document.getElementById('ptPathBtn').onclick = toPath;
  document.getElementById('ptRetryBtn').onclick = ()=>openPuzzle(id, true);
}

// The payoff: clues drop away and the mines are shown as the picture.
function renderPuzzleReveal(app, d){
  ptx.cellEls = [];
  const id = ptx.activeId;
  const px = d.W===5 ? 46 : d.W===10 ? 30 : d.W===15 ? 22 : 17;
  const squares = d.sol.map(v=>`<div style="background:${v?'var(--gold)':'rgba(255,255,255,0.035)'};"></div>`).join('');
  const nextId = id + 1;
  const hasNext = PUZZLE_TACTICS.some(p=>p.id===nextId);
  const done = puzzleSolvedCountFor(ptx.profileKey);
  const crownNote = (ptx.solvedNow && ptx.crownEarned>0)
    ? `<div class="pt-crown-note">
         <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--gold)" style="vertical-align:-4px; margin-right:6px;"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>
         Crown earned &mdash; ${done} puzzles solved, added to ${puzzleLabelForKey(ptx.profileKey)}
       </div>`
    : '';

  app.innerHTML = `
    <div class="draft-status">
      <button id="ptBackToPathBtn" class="back-btn ui-font" style="margin-bottom:10px;">&larr; Back to the path</button><br>
      <span class="turn-badge p1">${ptx.solvedNow ? 'Puzzle solved!' : `Puzzle ${id} &middot; solved`}</span>
    </div>
    <div style="text-align:center; margin-top:22px;">
      <div class="pt-reveal" style="
        width:${d.W*px}px; height:${d.H*px}px;
        grid-template-columns:repeat(${d.W}, ${px}px);
        grid-template-rows:repeat(${d.H}, ${px}px);
        box-shadow:0 0 44px rgba(201,161,59,0.16);">${squares}</div>
      <div style="font-family:'Cinzel', Georgia, serif; font-weight:700; font-size:30px; color:var(--gold); margin-top:22px;">${d.p.name}</div>
      <div class="ui-font" style="font-size:13px; color:var(--text-dim); margin-top:4px;">${d.p.cat} &middot; ${d.W}&times;${d.H}</div>
    </div>
    ${crownNote}
    <div class="draft-random-actions" style="margin-top:22px;">
      ${hasNext ? `<button id="ptNextBtn" class="back-btn ui-font" style="font-size:14px; font-weight:700; padding:10px 20px; border-color:var(--gold); color:var(--gold);">Next puzzle &rarr;</button>` : ''}
      <button id="ptReplayBtn" class="back-btn ui-font" style="font-size:13px; padding:10px 18px;">Solve it again</button>
      <button id="ptPathBtn" class="back-btn ui-font" style="font-size:13px; padding:10px 18px;">Back to the path</button>
    </div>
  `;

  const toPath = ()=>{ ptReturnFocusId = id; state.phase='puzzlePath'; render(); };
  document.getElementById('ptBackToPathBtn').onclick = toPath;
  document.getElementById('ptPathBtn').onclick = toPath;
  if(hasNext) document.getElementById('ptNextBtn').onclick = ()=>openPuzzle(nextId);
  document.getElementById('ptReplayBtn').onclick = ()=>{
    ptx.grid = ptx.grid.map(()=>PT_BLANK);
    ptx.wrong = 0;
    ptx.viewSolved = false;
    ptx.solvedNow = false;
    ptx.failed = false;
    puzzlePersistBoard();
    render();
  };
}
/* ============== INIT ============== */
applyMapTerrain('theTown'); // safe default until a map is actually picked
state = freshState();
state.phase = 'title';
// A ?room=CODE link (from a friend's Host screen) pre-selects Online mode so
// the join box is right there, pre-filled, instead of making them dig for it.
if(new URLSearchParams(location.search).get('room')) state.vsMode = 'online';
render();
</script>

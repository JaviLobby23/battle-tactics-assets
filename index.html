<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Battle Tactics</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
  :root{
    --bg:#12141c;
    --panel:#1b1f2b;
    --panel-2:#232838;
    --line:#33394a;
    --gold:#c9a13b;
    --gold-dim:#8f7429;
    --text:#e9e6dc;
    --text-dim:#9aa0b4;
    --p1:#4a7fd6;
    --p1-dim:#2c4e87;
    --p2:#d97706;
    --p2-dim:#8a4f0a;
    --water:#2f5a73;
    --wall:#0b0c10;
    --danger:#c0432f;
    --ui-font: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --serif: Georgia, serif;
  }
  *{box-sizing:border-box; overflow-anchor:none;}
  /* The battle screen fully rebuilds its DOM on every render() call (attacks,
     CPU turns, floating damage labels fading out, etc.). Without disabling
     scroll anchoring above, the browser's scroll-anchoring feature — which
     tries to keep the same content in view when layout shifts above the
     viewport — loses track of what it was anchored to on each rebuild and
     "corrects" by snapping the scroll position back to wherever it thinks it
     should be. It isn't inherited, hence the universal selector rather than
     just html/body, so nested scroll containers (side panels, etc.) are
     covered too — manually scrolling on mobile now stays where you left it.
  */
  body{
    margin:0;
    background:radial-gradient(ellipse at top, #191d29 0%, #0e1017 70%);
    color:var(--text);
    font-family: Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;
    min-height:100vh;
  }
  .ui-font{ font-family: var(--ui-font); }
  header{
    padding:22px 28px 14px;
    border-bottom:1px solid var(--line);
    display:flex; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:8px;
  }
  header h1{
    margin:0; font-size:28px; letter-spacing:0.5px; font-weight:600;
    color:var(--gold);
  }
  header .sub{ font-size:13px; color:var(--text-dim); font-family: var(--ui-font); }
  #app{ max-width:1180px; margin:0 auto; padding:20px 16px 60px; }

  /* ---- Draft screen ---- */
  .draft-status{ text-align:center; margin-bottom:18px; font-family: var(--ui-font); }
  .draft-status .turn-badge{
    display:inline-block; padding:6px 16px; border-radius:2px; font-size:14px; font-weight:600;
    letter-spacing:0.3px;
  }
  .turn-badge.p1{ background:var(--p1-dim); color:#cfe0ff; border:1px solid var(--p1); }
  .turn-badge.p2{ background:var(--p2-dim); color:#ffd9d0; border:1px solid var(--p2); }
  .draft-random-actions{ margin-top:10px; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  .draft-random-actions button{
    background:var(--panel-2); border:1px solid var(--line); color:var(--text-dim); padding:6px 14px; border-radius:2px;
    font-size:12px; cursor:pointer; transition:border-color .12s, color .12s;
  }
  .draft-random-actions button:hover{ border-color:var(--gold); color:var(--text); }
  .teams-preview{ display:flex; justify-content:center; gap:40px; margin-bottom:20px; font-family: var(--ui-font); font-size:13px; color:var(--text-dim); flex-wrap:wrap; }
  .teams-preview .team-col{ min-width:180px; }
  .teams-preview .team-col h3{ margin:0 0 6px; font-size:12px; text-transform:none; font-weight:700; }
  .teams-preview .p1c{ color:var(--p1); }
  .teams-preview .p2c{ color:var(--p2); }
  .teams-preview ul{ list-style:none; margin:0; padding:0; }
  .teams-preview li{ padding:2px 0; }

  .roster-grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px;
  }
  .char-card{
    background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px;
    cursor:pointer; transition:border-color .15s, transform .1s;
    display:flex; flex-direction:column; gap:6px;
  }
  .char-card:hover:not(.taken){ border-color:var(--gold); transform:translateY(-2px); }
  .char-card.taken{ opacity:0.35; cursor:default; }
  .char-card .name-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .char-card .name{ font-size:17px; font-weight:700; color:var(--gold); font-family: var(--serif); }
  .char-card .nation{ font-size:11px; color:var(--text); font-family: var(--ui-font); letter-spacing:0.3px; }
  .char-card .stat-line{ font-size:12px; color:var(--text-dim); font-family: var(--ui-font); }
  .char-card .ability{ font-size:12px; color:var(--text); font-family: var(--ui-font); line-height:1.4; border-top:1px solid var(--line); padding-top:6px; margin-top:2px;}
  .char-card .basic-line{ font-size:14px; font-weight:700; color:var(--text); font-family: var(--ui-font); line-height:1.4; }
  .char-card .ability b{ color:var(--gold); }
  .mapDiffBtn{
    font-size:11px; padding:4px 7px; border-radius:3px; border:1px solid var(--line);
    background:var(--panel-2); color:var(--text-dim); cursor:pointer; transition:border-color 0.12s, color 0.12s;
  }
  .mapDiffBtn:hover{ border-color:var(--gold); color:var(--gold); }
  .mapDiffBtn:hover span{ opacity:1; }
  .roster-grid.pick-grid{ grid-template-columns:repeat(auto-fill, minmax(110px,1fr)); gap:7px; }
  .roster-grid.pick-grid .char-card{ padding:7px; gap:3px; }
  .roster-grid.pick-grid .char-card .name{ font-size:9px; }
  .roster-grid.pick-grid .char-card .nation{ font-size:6px; }
  .roster-grid.pick-grid .char-card .stat-line{ font-size:6px; }
  .roster-grid.pick-grid .char-card .ability{ font-size:6px; padding-top:3px; margin-top:1px; }
  .roster-grid.pick-grid .char-card .basic-line{ font-size:7px; }

  /* ---- Battle screen ---- */
  .battle-wrap{ display:flex; gap:18px; align-items:flex-start; flex-wrap:nowrap; justify-content:flex-start; overflow-x:auto; padding-bottom:4px; }
  /* The actual battle screen (not the placement screen, which reuses .battle-wrap
     but has no log) switches to a grid so the log can occupy its own row spanning
     full width on mobile, while staying visually part of the sidebar on desktop. */
  .battle-wrap.in-battle{
    display:grid; grid-template-columns:auto 380px; grid-template-areas:"board sidebar" "board log";
    gap:18px; align-items:start; overflow-x:auto; padding-bottom:4px;
  }
  .battle-wrap.in-battle .board-col{ grid-area:board; }
  .battle-wrap.in-battle .side-col{ grid-area:sidebar; align-self:start; }
  .battle-wrap.in-battle .battle-log-col{ grid-area:log; width:100%; }
  .board-col{ display:flex; flex-direction:column; align-items:center; gap:10px; flex-shrink:0; }
  .board{
    display:grid; grid-template-columns:repeat(var(--board-cols, 9), 52px); grid-template-rows:repeat(var(--board-rows, 13), 52px);
    gap:0; background-size:100% 100%; background-repeat:no-repeat; background-position:center;
    border:1px solid var(--line); position:relative;
  }
  .tile{
    width:52px; height:52px; position:relative; display:flex; align-items:center; justify-content:center;
    background:transparent;
  }
  .tile.zone1{ box-shadow:inset 0 0 0 2px rgba(74,127,214,0.65); }
  .tile.zone2{ box-shadow:inset 0 0 0 2px rgba(192,67,47,0.65); }
  .tile.shield-range{ background:rgba(79,198,214,0.22); box-shadow:inset 0 0 0 2px rgba(79,198,214,0.7); }
  .tile.in-range{ background:rgba(201,161,59,0.28); box-shadow:inset 0 0 0 2px rgba(201,161,59,0.75); }
  .tile.reachable{ background:#2f7a4a4d; box-shadow:inset 0 0 0 2px #4fbf7a; cursor:pointer; }
  .tile.targetable{ background:rgba(201,161,59,0.4); box-shadow:inset 0 0 0 3px var(--gold); cursor:pointer; }
  .tile.placeable-p1{ background:rgba(74,127,214,0.3); box-shadow:inset 0 0 0 2px var(--p1); cursor:pointer; }
  .tile.placeable-p2{ background:rgba(217,119,6,0.3); box-shadow:inset 0 0 0 2px var(--p2); cursor:pointer; }
  .tile.active-tile{ box-shadow:inset 0 0 0 2px #fff; }
  .token{
    width:50px; height:50px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:11px; font-weight:700; color:#fff; font-family: var(--ui-font);
    border:2px solid rgba(255,255,255,0.5); position:relative; user-select:none;
  }
  .token.p1{ background:var(--p1); }
  .token.p2{ background:var(--p2); }
  .token.has-image{ background:transparent; border-color:transparent; }
  .token.has-image.clickable-target{ box-shadow:0 0 0 2px var(--gold); }
  .token img{ width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  /* Bender (child character) renders smaller than the standard token art, anchored
     to the bottom of the tile so he reads as standing on it rather than floating
     small in the middle of the square. */
  .token.small-token img{ transform:scale(0.85); transform-origin:50% 100%; }
  .token .hpbar{
    position:absolute; bottom:-9px; left:-2px; right:-2px; height:4px; background:#000a; border-radius:2px; overflow:hidden;
  }
  .token .hpbar i{ display:block; height:100%; background:linear-gradient(90deg,#3a6bc4,#6fa3ec); }
  .token .hpbar i.p1{ background:linear-gradient(90deg,var(--p1-dim),var(--p1)); }
  .token .hpbar i.p2{ background:linear-gradient(90deg,var(--p2-dim),var(--p2)); }
  .token .hpbar i.low, .hp-track i.low{ background:linear-gradient(90deg,#9c2c1f,#e0563d); }
  .token .status-dot{ position:absolute; top:-7px; right:-7px; width:15px; height:15px; border-radius:50%; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; background:#222; border:1px solid #666; color:#ffe600; }
  .token.under-bridge{ opacity:0.55; box-shadow:0 0 0 2px #8a6a3a inset, 0 0 6px 1px #000a; }
  .token .bridge-mark{ position:absolute; bottom:-9px; left:50%; transform:translateX(-50%); font-size:9px; color:#c9a13b; line-height:1; text-shadow:0 1px 1px #000; }
  .token.clickable-target{ cursor:pointer; box-shadow:0 0 0 2px var(--gold); }
  .token.in-doorway, .token-half.in-doorway{ filter:grayscale(1); opacity:0.65; }
  /* CPU-opponent turn indicator: a steady pulsing glow while its character is
     acting; once the turn ends, it stays fully lit for 3s, then fades out over
     the next 3s. Never applied to the human player's own characters. The
     under-bridge rule dims a token's opacity, which would also dim the glow, so
     force opacity back to full whenever the glow/fade is showing. */
  .token.cpu-turn-glow, .token-half.cpu-turn-glow{
    box-shadow:0 0 0 3px #ff5a5a, 0 0 12px 3px rgba(255,90,90,0.85);
    animation: cpuTurnPulse 1.1s ease-in-out infinite;
    opacity:1;
    z-index:5;
  }
  .token.cpu-turn-glow.fading, .token-half.cpu-turn-glow.fading{
    animation: cpuTurnHoldAndFade 6s linear forwards;
  }
  @keyframes cpuTurnPulse{
    0%,100%{ box-shadow:0 0 0 3px #ff5a5a, 0 0 10px 2px rgba(255,90,90,0.6); }
    50%{ box-shadow:0 0 0 4px #ff5a5a, 0 0 18px 6px rgba(255,90,90,1); }
  }
  @keyframes cpuTurnHoldAndFade{
    0%{ box-shadow:0 0 0 4px #ff5a5a, 0 0 18px 6px rgba(255,90,90,1); }
    50%{ box-shadow:0 0 0 4px #ff5a5a, 0 0 18px 6px rgba(255,90,90,1); }
    100%{ box-shadow:0 0 0 0 rgba(255,90,90,0); }
  }
  /* HP/status floating labels — shown above any character (either team, any
     game mode) for 3s whenever their HP or status changes. Sits above the
     token; uses a real-time-synced animation-delay like the CPU glow above,
     since the board is rebuilt from scratch on every render(). */
  .float-label{
    position:absolute; left:50%; bottom:100%; transform:translate(-50%,0);
    display:flex; flex-direction:column; align-items:center; gap:1px;
    pointer-events:none; white-space:nowrap; z-index:15;
    font-family:var(--ui-font); font-size:11px; font-weight:800;
    text-shadow:0 1px 2px #000, 0 0 3px #000;
    animation: floatLabelPop 3s ease forwards;
  }
  .float-label .fl-loss{ color:#ff5a5a; }
  .float-label .fl-gain{ color:#5ad16a; }
  .float-label .fl-status{ color:#ffd75e; }
  @keyframes floatLabelPop{
    0%{ opacity:0; transform:translate(-50%,4px); }
    12%{ opacity:1; transform:translate(-50%,-4px); }
    70%{ opacity:1; transform:translate(-50%,-8px); }
    100%{ opacity:0; transform:translate(-50%,-14px); }
  }
  .split-token{
    width:50px; height:50px; position:relative; border-radius:50%; overflow:hidden;
    clip-path:circle(25px at center);
    border:2px solid rgba(255,255,255,0.5);
    display:flex;
  }
  .token-half{
    width:50%; height:100%; position:relative; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:8px; font-weight:700; color:#fff; font-family: var(--ui-font);
    cursor:default;
  }
  .token-half.p1{ background:var(--p1); }
  .token-half.p2{ background:var(--p2); }
  .token-half.has-image{ background:transparent; }
  .token-half img{ width:100%; height:100%; object-fit:contain; display:block; pointer-events:none; }
  .token-half.small-token img{ transform:scale(0.85); transform-origin:50% 100%; }
  .token-half.bottom{ opacity:0.55; }
  .token-half.clickable-target{ cursor:pointer; box-shadow:inset 0 0 0 2px var(--gold); }
  .split-token::after{
    content:''; position:absolute; top:0; left:50%; width:2px; height:100%; background:rgba(0,0,0,0.6);
    transform:rotate(20deg); transform-origin:center; z-index:2; pointer-events:none;
  }
  .hpbar-mini{ width:80%; height:3px; background:#000a; border-radius:2px; overflow:hidden; margin-top:2px; }
  .hpbar-mini i{ display:block; height:100%; background:linear-gradient(90deg,#3a6bc4,#6fa3ec); }
  .hpbar-mini i.p1{ background:linear-gradient(90deg,var(--p1-dim),var(--p1)); }
  .hpbar-mini i.p2{ background:linear-gradient(90deg,var(--p2-dim),var(--p2)); }
  .move-choice{ width:44px; height:44px; display:flex; border-radius:4px; overflow:hidden; box-shadow:0 0 0 2px var(--gold); }
  .move-half{
    width:50%; display:flex; align-items:center; justify-content:center; text-align:center;
    font-size:8px; font-weight:700; color:#1a1305; cursor:pointer; font-family: var(--ui-font);
    line-height:1.2; padding:2px;
  }
  .move-half.top{ background:#e0c060; }
  .move-half.bottom{ background:#b89a4a; }
  .move-half:hover{ filter:brightness(1.15); }

  .legend{ display:flex; gap:14px; font-size:11px; color:var(--text-dim); font-family: var(--ui-font); flex-wrap:wrap; justify-content:center; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:10px; height:10px; display:inline-block; border-radius:2px; }

  .side-col{ width:380px; flex-shrink:0; display:flex; flex-direction:column; gap:14px; font-family: var(--ui-font); position:sticky; top:16px; align-self:flex-start; max-height:calc(100vh - 32px); overflow-y:auto; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:3px; padding:14px; }
  .panel h2{ margin:0 0 10px; font-size:13px; color:var(--gold); font-weight:700; font-family: var(--serif); letter-spacing:0.3px;}
  .turn-info{ font-size:13px; }
  .turn-info .who{ font-size:15px; font-weight:700; margin-bottom:2px; }
  .active-char{ display:flex; flex-direction:column; gap:8px; }
  .active-char .row1{ display:flex; justify-content:space-between; align-items:center; }
  .active-char .cname{ font-size:24px; font-weight:700; font-family:var(--serif); }
  .hp-row{ display:flex; align-items:center; gap:6px; font-size:12px; }
  .hp-track{ flex:1; height:8px; background:#000a; border-radius:4px; overflow:hidden; }
  .hp-track i{ display:block; height:100%; background:linear-gradient(90deg,#3a6bc4,#6fa3ec); }
  .stat-grid{ display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-size:12px; color:var(--text-dim); }
  .ability-box{ font-size:12px; line-height:1.5; background:var(--panel-2); border:1px solid var(--line); border-radius:3px; padding:8px; }
  .ability-box b{ color:var(--gold); }
  .status-tags{ display:flex; gap:6px; flex-wrap:wrap; }
  .status-tags span{ font-size:10px; font-weight:700; padding:2px 6px; border-radius:10px; background:rgba(255,230,0,0.15); color:#ffe600; border:1px solid rgba(255,230,0,0.5); }
  .status-tags span.tag-regen{ background:#1f3a28; color:#8fd6a3; border-color:#2f5a3d; }

  .actions{ display:flex; flex-direction:column; gap:8px; }
  button.act{
    padding:9px 12px; border-radius:2px; border:1px solid var(--gold-dim); background:var(--panel-2); color:var(--text);
    font-family: var(--ui-font); font-size:13px; font-weight:600; cursor:pointer;
    display:flex; justify-content:space-between; align-items:center;
    transition:background .12s, border-color .12s;
  }
  button.act:hover:not(:disabled){ border-color:var(--gold); background:#2a2f42; }
  button.act:disabled{ opacity:0.35; cursor:not-allowed; }
  button.act.selected{ border-color:var(--gold); background:#332a13; }
  button.act.act-basic{ border-color:var(--p1-dim); }
  button.act.act-basic:hover:not(:disabled){ border-color:var(--p1); background:#1c2c47; }
  button.act.act-basic.selected{ border-color:var(--p1); background:#1c2c47; }
  button.act.act-special{ border-color:var(--p2-dim); }
  button.act.act-special:hover:not(:disabled){ border-color:var(--p2); background:#3a2a12; }
  button.act.act-special.selected{ border-color:var(--p2); background:#3a2a12; }
  button.end-turn{ background:var(--gold-dim); color:#1a1305; border:none; font-weight:700; }
  button.end-turn:hover{ background:var(--gold); }

  .log{ font-size:12px; line-height:1.6; max-height:220px; overflow-y:auto; color:var(--text-dim); display:flex; flex-direction:column; }
  .log .entry{ padding:3px 0; border-bottom:1px solid #ffffff08; }
  .log .entry b{ color:var(--text); }
  .log .entry.crit{ color:var(--gold); }
  .log .entry.miss{ color:#8a8f9e; font-style:italic; }

  .roster-mini{ display:flex; gap:6px; flex-wrap:wrap; }
  .roster-mini .mtoken{
    width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:9px; font-weight:700; color:#fff; border:2px solid rgba(255,255,255,0.4); position:relative;
  }
  .roster-mini .mtoken.dead{ opacity:0.25; filter:grayscale(1); }
  .roster-mini .mtoken.current{ box-shadow:0 0 0 2px var(--gold); }

  .gameover{
    text-align:center; padding:60px 20px;
  }
  .gameover h2{ font-size:34px; color:var(--gold); margin-bottom:10px; }
  .gameover p{ color:var(--text-dim); font-family: var(--ui-font); margin-bottom:22px;}
  .gameover button{
    padding:12px 26px; font-size:14px; background:var(--gold-dim); border:none; color:#1a1305; font-weight:700;
    border-radius:2px; cursor:pointer; font-family: var(--ui-font);
  }

  .preview-overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.65); display:flex; align-items:center; justify-content:center;
    z-index:60; padding:20px; font-family: var(--ui-font);
  }
  .preview-card{
    background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:22px; width:100%; max-width:340px;
    position:relative; max-height:90vh; overflow-y:auto;
  }
  .preview-card .preview-close{
    position:absolute; top:10px; right:10px; background:none; border:1px solid var(--line); color:var(--text-dim);
    width:26px; height:26px; border-radius:2px; cursor:pointer; font-size:14px; line-height:1;
  }
  .preview-card .preview-close:hover{ border-color:var(--gold); color:var(--text); }
  .preview-card .preview-portrait{
    display:flex; justify-content:center; margin-bottom:12px;
  }
  .preview-card .preview-portrait img{ max-width:140px; max-height:180px; object-fit:contain; }
  .preview-card .preview-portrait .preview-token-fallback{
    width:80px; height:80px; border-radius:50%; display:flex; align-items:center; justify-content:center;
    font-size:20px; font-weight:700; color:#fff; font-family: var(--ui-font);
  }
  .preview-card .preview-name{ font-size:20px; font-weight:700; text-align:center; font-family: var(--serif); }
  .preview-card .preview-team{ text-align:center; font-size:12px; margin:2px 0 14px; }
  .preview-card .preview-team.p1{ color:var(--p1); }
  .preview-card .preview-team.p2{ color:var(--p2); }
  .preview-card .preview-hp-row{ text-align:center; font-size:13px; margin-bottom:6px; color:var(--text-dim); }
  .preview-card .preview-defeated{ text-align:center; color:var(--danger); font-weight:700; margin-bottom:10px; }
  .preview-card .preview-status-tags{ display:flex; gap:6px; justify-content:center; flex-wrap:wrap; margin-bottom:12px; }
  .preview-card .preview-status-tags span{
    font-size:11px; font-weight:700; background:rgba(255,230,0,0.15); border:1px solid rgba(255,230,0,0.5); border-radius:2px; padding:2px 6px; color:#ffe600;
  }
  .preview-card .preview-ability-box{
    font-size:13px; line-height:1.6; border-top:1px solid var(--line); padding-top:12px; margin-top:4px;
  }
  .preview-card .preview-ability-box b{ color:var(--gold); }

  .rules-toggle{ text-align:center; margin-bottom:14px; display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; }
  .rules-toggle button{
    background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 14px; border-radius:2px;
    font-family: var(--ui-font); font-size:12px; cursor:pointer;
  }
  .rules-toggle button:hover{ border-color:var(--gold); color:var(--text); }
  .back-btn{
    background:none; border:1px solid var(--line); color:var(--text-dim); padding:6px 14px; border-radius:2px;
    font-family: var(--ui-font); font-size:12px; cursor:pointer;
    transition:border-color .12s, color .12s;
  }
  .back-btn:hover{ border-color:var(--gold); color:var(--text); }
  .battle-toolbar{ margin-bottom:12px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

  @media (max-width:760px){
    #app{ padding:10px 6px 40px; }
    .battle-wrap{ gap:8px; align-items:flex-start; }
    .battle-wrap.in-battle{ grid-template-columns:auto 175px; grid-template-areas:"board sidebar" "log log"; gap:8px; }
    .board{ grid-template-columns:repeat(var(--board-cols, 9), 34px); grid-template-rows:repeat(var(--board-rows, 13),34px); }
    .tile{ width:34px; height:34px; }
    .token{ width:34px; height:34px; font-size:9px; }
    .split-token{ width:34px; height:34px; }
    .token-half{ font-size:7px; }
    .move-choice{ width:30px; height:30px; }
    .move-half{ font-size:7px; padding:1px; }
    .side-col{ width:175px; min-width:175px; gap:8px; }
    .side-col .panel{ padding:8px; }
    .side-col h2{ font-size:12px; margin-bottom:6px; }
    button.act{ font-size:11px; padding:6px 6px; flex-direction:column; align-items:flex-start; gap:2px; }
    .roster-mini .mtoken{ width:24px; height:24px; font-size:8px; }
    .active-char .cname{ font-size:19px; }
    /* The board specifically on the battle screen (not the placement screen) gets
       a bit more room — everything else keeps the sizing above. */
    .battle-wrap.in-battle .board{ grid-template-columns:repeat(var(--board-cols, 9), 40px); grid-template-rows:repeat(var(--board-rows, 13),40px); }
    .battle-wrap.in-battle .tile{ width:40px; height:40px; }
    .battle-wrap.in-battle .token{ width:40px; height:40px; font-size:10px; }
    .battle-wrap.in-battle .split-token{ width:40px; height:40px; }
  }
  @media (max-width:400px){
    .board{ grid-template-columns:repeat(var(--board-cols, 9), 28px); grid-template-rows:repeat(var(--board-rows, 13),28px); }
    .tile{ width:28px; height:28px; }
    .token{ width:28px; height:28px; font-size:8px; }
    .side-col{ width:150px; min-width:150px; }
    .battle-wrap.in-battle{ grid-template-columns:auto 150px; }
    .battle-wrap.in-battle .board{ grid-template-columns:repeat(var(--board-cols, 9), 33px); grid-template-rows:repeat(var(--board-rows, 13),33px); }
    .battle-wrap.in-battle .tile{ width:33px; height:33px; }
    .battle-wrap.in-battle .token{ width:33px; height:33px; font-size:9px; }
    .battle-wrap.in-battle .split-token{ width:33px; height:33px; }
  }


  /* ---- Puzzle Tactics (logic nonogram + mines puzzle mode) ---- */
  /* The path is long, so the header and How to play stay pinned while the levels
     scroll underneath. Sticky rather than fixed, so it still sits in normal flow
     and the layout needs no magic offsets. */
  .pt-head{
    position:sticky; top:0; z-index:6;
    padding-top:10px; padding-bottom:10px;
    background:rgba(14,16,23,0.94);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);
  }
  .pt-head .draft-status{ margin-bottom:0; }
  /* An open How to play must never grow taller than the screen, or the sticky
     header would start scrolling away with the page. */
  .pt-head details > div{ max-height:44vh; overflow-y:auto; }

  .pt-path-wrap{ display:flex; justify-content:center; margin-top:10px; }
  .pt-path{ position:relative; }
  .pt-path svg.pt-trail{ position:absolute; inset:0; pointer-events:none; }
  .pt-node{
    position:absolute; transform:translate(-50%,-50%);
    border-radius:50%; background:var(--panel); border:2px solid var(--line);
    color:var(--text-dim); font-family:var(--ui-font); font-weight:700;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; padding:0; transition:border-color .12s, transform .1s, box-shadow .12s;
  }
  .pt-node:hover:not(.pt-locked){ transform:translate(-50%,-50%) scale(1.06); }
  .pt-node.pt-open{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 4px rgba(201,161,59,0.12); }
  .pt-node.pt-done{ border-color:var(--gold); background:var(--panel-2); box-shadow:0 0 0 3px rgba(201,161,59,0.18); }
  .pt-node.pt-locked{ opacity:0.42; cursor:default; }
  .pt-node .pt-num{ font-size:19px; }
  .pt-node svg{ display:block; }
  .pt-label{
    position:absolute; transform:translateX(-50%); width:110px; text-align:center;
    font-family:var(--ui-font); font-size:11px; color:var(--text-dim); line-height:1.3;
    pointer-events:none;
  }
  .pt-label b{ display:block; color:var(--gold); font-size:12px; }
  .pt-label .pt-name{ display:block; color:var(--text); font-size:11px; }
  .pt-node.pt-locked + .pt-label b{ color:var(--text-dim); }
  /* Crown milestone marker on every tenth node — grey until that puzzle is
     solved, then gold, since clearing it is what awards the crown. */
  .pt-crown-mark{
    position:absolute; transform:translate(-50%,-50%);
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); opacity:0.4;
    transition:color .18s, opacity .18s;
  }
  .pt-crown-mark.earned{
    color:var(--gold); opacity:1;
    filter:drop-shadow(0 0 6px rgba(201,161,59,0.45));
  }
  .pt-label .pt-size{ display:block; opacity:0.65; }

  /* Nation banner marking where one block of ten gives way to the next. Sits
     below that block's first level, since the path is climbed from the bottom. */
  .pt-nation{
    position:absolute; left:0; right:0; transform:translateY(-50%);
    display:flex; align-items:center; justify-content:center; gap:12px; padding:0 6px;
  }
  .pt-nation-rule{
    flex:0 0 40px; height:1px;
    background:linear-gradient(to right, transparent, var(--gold-dim));
  }
  .pt-nation-rule:last-child{
    background:linear-gradient(to left, transparent, var(--gold-dim));
  }
  .pt-nation-name{
    font-family:'Cinzel', Georgia, serif; font-weight:700; font-size:51px;
    letter-spacing:1px; color:var(--gold); white-space:nowrap;
  }
  .pt-nation.locked{ opacity:0.45; }
  .pt-nation.locked .pt-nation-name{ color:var(--text-dim); }

  .pt-board-wrap{ overflow-x:auto; padding:4px 2px 8px; position:relative; }
  .pt-board-wrap > div{ width:max-content; margin:0 auto; }
  .pt-grid{ display:grid; user-select:none; }
  .pt-clue{
    font-family:var(--ui-font); font-size:11px; color:var(--text-dim);
    display:flex; gap:2px; line-height:1;
  }
  .pt-clue.row{ flex-direction:row; align-items:center; justify-content:flex-end; padding-right:6px; }
  .pt-clue.col{ flex-direction:column; align-items:center; justify-content:flex-end; padding-bottom:5px; }
  .pt-clue span{ min-width:11px; text-align:center; }
  .pt-cell{
    background:var(--panel-2); border:1px solid var(--line); padding:0; margin:0;
    cursor:pointer; font-family:var(--ui-font); font-weight:700;
    /* Drag-painting needs the pointer stream, so a touch starting on a square
       must not be claimed by the scroller. Panning the wider boards is done
       from the clue gutters and the margins instead. */
    touch-action:none;
    display:flex; align-items:center; justify-content:center;
    color:var(--text-dim); transition:background .08s;
  }
  .pt-cell:hover{ background:#2c3244; }
  /* Settled squares — every mark on the board is confirmed correct the moment
     it is placed, so nothing here is meant to look provisional. */
  .pt-cell.pt-mine{ background:var(--gold); border-color:#e0bc5c; cursor:default; }
  .pt-cell.pt-mine:hover{ background:var(--gold); }
  .pt-cell.pt-cross{ color:#6b7288; cursor:default; }
  .pt-cell.pt-cross:hover{ background:var(--panel-2); }
  /* Squares the game had to correct after a wrong guess — same information, but
     flagged in red so the player can see where the run went wrong. */
  .pt-cell.pt-fix-mine{ background:var(--gold); border:2px solid var(--danger); cursor:default; }
  .pt-cell.pt-fix-mine:hover{ background:var(--gold); }
  .pt-cell.pt-fix-safe{ background:#3a1d19; border:2px solid var(--danger); color:#e88b76; cursor:default; }
  .pt-cell.pt-fix-safe:hover{ background:#3a1d19; }
  .pt-cell.pt-given{
    background:#161a24; border-color:#2a3040; cursor:default;
    color:var(--text-dim); font-weight:700;
  }
  .pt-cell.pt-given:hover{ background:#161a24; }
  /* A square caught in an in-progress vertical hold — picked out, but not yet
     graded, so it reads as provisional rather than settled. */
  .pt-cell.pt-holding{ background:rgba(201,161,59,0.24); box-shadow:inset 0 0 0 2px var(--gold); }
  .pt-cell.pt-holding:hover{ background:rgba(201,161,59,0.24); }
  /* Corner readout of how many squares the current hold spans. Pinned to the
     board wrapper (not the scrolling inner grid) so it stays put on wide boards. */
  .pt-hold-badge{
    position:absolute; top:6px; right:10px; z-index:5;
    background:rgba(18,20,28,0.92); border:1px solid var(--gold-dim, var(--line));
    color:var(--gold); font-family:var(--ui-font); font-size:12px; font-weight:700;
    padding:4px 10px; border-radius:12px; pointer-events:none;
    opacity:0; transform:translateY(-4px); transition:opacity .12s ease, transform .12s ease;
  }
  .pt-hold-badge.show{ opacity:1; transform:translateY(0); }
  .pt-sep-l{ box-shadow:inset 2px 0 0 -0.5px #59627d; }
  .pt-sep-t{ box-shadow:inset 0 2px 0 -0.5px #59627d; }
  .pt-sep-l.pt-sep-t{ box-shadow:inset 2px 0 0 -0.5px #59627d, inset 0 2px 0 -0.5px #59627d; }

  .pt-tools{ display:flex; gap:10px; justify-content:center; align-items:center; flex-wrap:wrap; }
  .pt-tool{
    width:56px; height:56px; border-radius:3px; background:var(--panel-2);
    border:2px solid var(--line); color:var(--text-dim); cursor:pointer;
    display:flex; align-items:center; justify-content:center; font-size:24px; line-height:1;
    transition:border-color .12s, color .12s;
  }
  .pt-tool:hover{ border-color:var(--gold-dim); }
  .pt-tool.sel{ border-color:var(--gold); color:var(--gold); box-shadow:0 0 0 3px rgba(201,161,59,0.14); }
  .pt-tool .pt-swatch{ width:24px; height:24px; background:currentColor; border-radius:1px; }
  .pt-tool.sel .pt-swatch{ background:var(--gold); }
  .pt-toolhint{ font-family:var(--ui-font); font-size:12px; color:var(--text-dim); text-align:center; margin-top:8px; }

  /* Which mouse button does what, spelled out above the board. Hidden the moment
     a touch pointer shows up, since a finger has no right button. */
  .pt-legend{
    display:flex; justify-content:center; align-items:center; gap:26px; flex-wrap:wrap;
    margin-top:16px; font-family:var(--ui-font); font-size:13px; color:var(--text-dim);
  }
  .pt-legend[hidden]{ display:none; }
  .pt-tools[hidden]{ display:none; }
  .pt-leg{ display:inline-flex; align-items:center; gap:8px; }
  .pt-leg b{ color:var(--text); font-weight:700; }
  .pt-chip{
    width:22px; height:22px; border-radius:2px; background:var(--panel-2);
    border:1px solid var(--line); color:#6b7288;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; line-height:1;
  }
  .pt-chip.mine{ background:var(--gold); border-color:#e0bc5c; }
  .pt-status{ font-family:var(--ui-font); font-size:13px; color:var(--text-dim); text-align:center; margin-top:4px; }
  .pt-status b{ color:var(--gold); }

  /* Wrong-guess allowance, one pip per guess. Spent pips fill red. */
  .pt-guesses{ display:flex; align-items:center; justify-content:center; gap:8px; margin-top:10px; font-family:var(--ui-font); font-size:12px; color:var(--text-dim); }
  .pt-pips{ display:flex; gap:5px; }
  .pt-pip{
    width:15px; height:15px; border-radius:50%; border:2px solid var(--line);
    display:inline-block;
  }
  .pt-pip.spent{ background:var(--danger); border-color:var(--danger); }
  .pt-guesses.empty{ color:#e88b76; }

  .pt-reveal{ display:grid; margin:0 auto; gap:0; }
  .pt-reveal div{ width:100%; height:100%; }
  .pt-crown-note{
    max-width:420px; margin:20px auto 0; padding:12px 16px;
    border:1px solid var(--gold-dim); border-radius:3px; background:rgba(201,161,59,0.08);
    font-family:var(--ui-font); font-size:13px; color:var(--gold); text-align:center;
  }
  .pt-profile-btn{ display:flex; flex-direction:column; align-items:center; gap:3px; }
  .pt-profile-btn .pt-sub{ font-size:11px; opacity:0.7; font-weight:400; }

  /* Puzzle Tactics entry point on a profile's page. The auto margin pushes the
     button and its crown count to the far right of the page column, so the crown
     lands in the same place as the per-map crowns in the table below it. The 4px
     of right padding matches that table cell's own padding so the two columns of
     crowns line up rather than sitting a few pixels apart. */
  .pt-entry{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .pt-entry-btn{
    display:inline-flex; flex-direction:column; align-items:flex-start; gap:2px;
    padding:8px 16px; margin-left:auto;
    /* Orange, using the existing Player 2 accent rather than a new colour, so it
       reads as part of the same palette. The hover rule has to be spelled out
       because .back-btn:hover would otherwise pull it back to gold. */
    border-color:var(--p2); color:var(--p2);
  }
  .pt-entry-btn:hover{ border-color:var(--p2); color:#f0900d; background:rgba(217,119,6,0.10); }
  .pt-entry-btn .pt-sub{ font-size:11px; opacity:0.75; font-weight:400; }
  .pt-entry-crowns{
    display:inline-flex; align-items:center; justify-content:center; gap:5px;
    padding-right:4px;
    font-family:var(--ui-font); font-size:14px; font-weight:700; color:var(--gold);
  }
  .pt-entry-crowns.none{ color:var(--text-dim); opacity:0.5; }
</style>

/* Board: 0 normal, 1 water, 2 wall (trees only), 3 roof (wood — restricted access).
   Board size, terrain, height tiles, bridges and start zones are all per-map data —
   applyMapTerrain() below loads the active map's data into these `let` globals, which
   every movement/rendering function reads from. */
let BOARD_COLS = 9, BOARD_ROWS = 13;
let TERRAIN = [];
let HEIGHT_1_TILES = [];
let HEIGHT_2_TILES = [];
let HEIGHT_3_TILES = []; // an explicit height-3 overlay, for tiles that need to be
                          // elevated WITHOUT being roof terrain (e.g. Waterfall's
                          // height-3 water) — every existing map still just uses
                          // terrain:3 for its roofs, which keeps working unchanged.
let HEIGHT_4_TILES = []; // one level above height-3/roof — no current character can
                          // Jump high enough to climb straight onto it from ground
                          // (max Jump is 2), so it's normally reached via a height-2/3
                          // stepping stone, same idea as any other tall climb.
let EDGE_WALLS = []; // [{x,y,side}] where side is 'left'|'right'|'top'|'bottom' — a
                      // wall on ONE specific border of a tile, not the whole tile.
                      // The tile itself stays fully standable/walkable; only crossing
                      // that particular edge (from either side) is blocked, same as a
                      // regular wall — no bypass for jump, float, or anything else.
let BRIDGE_TILES = [];
let PIT_TILES = []; // impassable to everyone except jump>=2 characters, who can pass over
                     // but never stop on it (e.g. The Well's central hole).
let LAVA_TILES = []; // mechanically identical to a pit today (impassable, jump>=2 can
                      // cross but never land, Float bypasses it entirely) — kept as its
                      // own separate list rather than folded into PIT_TILES so it can
                      // diverge later (e.g. damage on a near-miss) without disturbing pits.
let DOORWAY_TILES = []; // purely cosmetic — no height bypass, no movement effect. Anyone
                         // standing on one is rendered grayed-out on the board.
let ICE_TILES = []; // stepping onto one immediately ends that move action — no further
                     // tiles can be reached past it this turn, same as an enemy trap.
                     // Applies to everyone uniformly (no Float/Jump bypass). The very
                     // next turn is unaffected unless it lands on ice again.
let TELEPORT_PAIRS = []; // [{a:{x,y}, b:{x,y}}, ...] — coming to rest on either tile in a
                          // pair instantly relocates the character to the other (e.g.
                          // Pirate Ship's cabin/deck doorways).
let WATER_IMPASSABLE = false; // when true (e.g. Pirate Ship's open ocean), water is a hard
                               // block for everyone except a Float character — no tax, no
                               // crossing, not even for crossWater dash specials.
let ZONE_A = []; // 4 tiles — one of the two possible starting zones, randomly assigned each battle
let ZONE_B = [];

function inZoneP1(x,y){
  const zone = state.p1Side==='top' ? ZONE_A : ZONE_B;
  return zone.some(t=>t.x===x && t.y===y);
}
function inZoneP2(x,y){
  const zone = state.p2Side==='top' ? ZONE_A : ZONE_B;
  return zone.some(t=>t.x===x && t.y===y);
}

/* Height system: ground=0, crates and the first step of each staircase=1,
   the second step of each staircase=2, the roof/building=3.
   Movement onto a higher tile is only allowed if the height gain is within the
   character's climb (1 normally, or their Jump value e.g. 2 for Raider) — moving
   to an equal or lower tile is always free. This is what makes the crates
   (jump-only, +2 straight to the roof) different from the stairs (a gradual +1
   each step, open to everyone). */
function tileMatch(list,x,y){ return list.some(t=>t.x===x&&t.y===y); }
function isBridgeTile(x,y){ return tileMatch(BRIDGE_TILES,x,y); }
function isPitTile(x,y){ return tileMatch(PIT_TILES,x,y); }
function isLavaTile(x,y){ return tileMatch(LAVA_TILES,x,y); }
// Shared by both pits and lava: impassable in general, but a jump>=2 character can
// transit across it (never stop on it), and Float bypasses it completely.
function isHazardTile(x,y){ return isPitTile(x,y) || isLavaTile(x,y); }
// Splitter's Portal: state.portals is a plain array (like state.traps), so this
// is just a lookup, not a map-defined tile type.
function portalAt(x,y){ return state.portals.find(p=>p.x===x && p.y===y) || null; }
function isDoorwayTile(x,y){ return tileMatch(DOORWAY_TILES,x,y); }
function isIceTile(x,y){ return tileMatch(ICE_TILES,x,y); }
function isHeight3Tile(x,y){ return tileMatch(HEIGHT_3_TILES,x,y); }
function isHeight4Tile(x,y){ return tileMatch(HEIGHT_4_TILES,x,y); }
// Is there a wall on this specific edge of this tile? side is 'left'|'right'|'top'|'bottom'.
function hasEdgeWall(x,y,side){ return EDGE_WALLS.some(w=>w.x===x && w.y===y && w.side===side); }
// Is the border BETWEEN (x,y) and (x+dx,y+dy) blocked by an edge wall? Checks both
// tiles' own edge flags for the shared border, since either side marking it is
// enough to block passage across it (a single physical wall between them).
function isEdgeBlocked(x,y,dx,dy){
  if(dx===1) return hasEdgeWall(x,y,'right') || hasEdgeWall(x+1,y,'left');
  if(dx===-1) return hasEdgeWall(x,y,'left') || hasEdgeWall(x-1,y,'right');
  if(dy===1) return hasEdgeWall(x,y,'bottom') || hasEdgeWall(x,y+1,'top');
  if(dy===-1) return hasEdgeWall(x,y,'top') || hasEdgeWall(x,y-1,'bottom');
  return false;
}
// "Elevated ground" (roof height, 3-and-up) normally just means roof terrain — but a
// tile can also be explicitly promoted to height 3 (or 4) via the overlay lists
// without changing its underlying terrain (e.g. water that's still water, just
// falling from higher up). Every place that used to check terrainAt(...)===3 for
// this now goes through here instead, so every route to elevated ground behaves
// identically everywhere.
function isElevatedGround(x,y){ return terrainAt(x,y)===3 || isHeight3Tile(x,y) || isHeight4Tile(x,y); }
function staticHeightAt(x,y){
  if(isHeight4Tile(x,y)) return 4;
  if(isElevatedGround(x,y)) return 3;
  if(tileMatch(HEIGHT_2_TILES,x,y)) return 2;
  if(tileMatch(HEIGHT_1_TILES,x,y)) return 1;
  // Orc's BaRoll: a barrel at rest acts as a height-1 platform for as long as it
  // exists — anyone can climb up onto it like a crate, and it disappears the
  // instant Orc detonates it.
  if(state && state.barrels && state.barrels.some(b=>b.x===x && b.y===y)) return 1;
  return 0;
}

/* ============== PLAYER PROFILES (up to 10 editable name slots on the title screen) ======= */
const MAX_PROFILES = 10;
const PROFILE_NAME_KEYS = Array.from({length:MAX_PROFILES}, (_,i)=>`btProfile${i+1}Name`);
let profileNames = Array.from({length:MAX_PROFILES}, (_,i)=>`Profile ${i+1}`);
let profileNamesLoaded = false;
let profileMetaVersion = Array.from({length:MAX_PROFILES}, ()=>0);
let editingProfileIndex = null;
let confirmingDeleteProfileIndex = null;

function profileIndices(){ return Array.from({length:MAX_PROFILES}, (_,i)=>i); }

async function loadProfileMeta(){
  if(profileNamesLoaded) return;
  profileNamesLoaded = true;
  const startVersion = [...profileMetaVersion];
  await Promise.all(profileIndices().map(async (i)=>{
    try {
      const nameResult = await storageGet(PROFILE_NAME_KEYS[i]);
      if(nameResult && nameResult.value && profileMetaVersion[i]===startVersion[i]) profileNames[i] = nameResult.value;
    } catch(e){}
  }));
  render();
}

async function saveProfileNameEdit(index, rawValue){
  const trimmed = (rawValue||'').trim().slice(0,40);
  if(trimmed){
    profileNames[index] = trimmed;
    profileMetaVersion[index]++;
    try { await storageSet(PROFILE_NAME_KEYS[index], trimmed); } catch(e){}
  }
  editingProfileIndex = null;
  render();
}

// A profile slot is only "activated" once its placeholder name has actually been
// changed. Until then it doesn't show up as a title-screen profile, isn't offered
// as a Player 1/2 choice, and doesn't appear as a head-to-head opponent — Guest is
// unaffected by any of this and is always available.
function defaultProfileName(i){ return 'Profile ' + (i+1); }
function isProfileActive(i){ return profileNames[i] !== defaultProfileName(i); }
function firstActiveProfileIndex(){ return profileIndices().find(i=>isProfileActive(i)); }

// Total achievements earned by a profile: total-wins tier crowns, per-map CPU
// crowns, and Player-vs-Player tier crowns.
function crownCountForProfile(i){
  return totalWinsCrownsEarned(i) + totalMapCpuCrownsEarned(i) + pvpCrownsEarned(i) + puzzleCrownsEarned(i);
}

// Records a vs.-CPU win for whichever profile is playing Player 1, broken down by
// map and CPU difficulty. Guest games and PvP games aren't tracked — there's no
// profile to credit, or no CPU to have beaten.
function recordProfileWin(winner){
  if(winner!==1) return; // only Player 1 (the human) beating the CPU counts
  if(state.vsMode!=='cpu') return;
  const i = state.p1ProfileIndex;
  if(i===null || i===undefined) return;
  const mapId = state.selectedMap;
  if(!mapId) return;
  const diff = state.cpuDifficulty || 'normal';
  if(!profileWinLogs[i]) profileWinLogs[i] = {};
  if(!profileWinLogs[i][mapId]) profileWinLogs[i][mapId] = {easy:0, normal:0, hard:0};
  profileWinLogs[i][mapId][diff] = (profileWinLogs[i][mapId][diff]||0) + 1;
  persistProfileWinLog(i);
}

// Sums every map/difficulty entry for one profile into a single vs.-CPU win total.
function cpuWinsForProfile(i){
  const log = profileWinLogs[i] || {};
  let total = 0;
  Object.values(log).forEach(byDiff=>{
    total += (byDiff.easy||0) + (byDiff.normal||0) + (byDiff.hard||0);
  });
  return total;
}
function pvpWinsForProfile(i){
  // PvP wins credited to this profile across every map/opponent, plus wins against
  // opponents who have since been deleted (carried in deletedOpponentWins instead,
  // since their column is erased from mapPvpWinLog).
  let total = 0;
  const selfKey = profileKeyFor(i);
  Object.values(mapPvpWinLog).forEach(byWinner=>{
    const byLoser = byWinner[selfKey];
    if(byLoser) total += Object.values(byLoser).reduce((sum,n)=>sum+(n||0), 0);
  });
  total += deletedOpponentWins[i] || 0;
  return total;
}
function totalProfileWins(i){
  return cpuWinsForProfile(i) + pvpWinsForProfile(i);
}

// Total-wins achievement tiers: crown N unlocks once the profile's combined
// (CPU + PvP) win count reaches TOTAL_WINS_CROWN_THRESHOLDS[N-1].
const TOTAL_WINS_CROWN_THRESHOLDS = [10, 25, 50, 75, 100, 150, 200, 250, 350, 500];
function totalWinsCrownsEarned(i){
  const wins = totalProfileWins(i);
  return TOTAL_WINS_CROWN_THRESHOLDS.filter(t => wins >= t).length;
}

// Per-map CPU achievement tiers — vs.-CPU only, not PvP. Crown N unlocks once the
// profile has at least MAP_CPU_CROWN_THRESHOLDS[N-1] wins on EVERY difficulty
// (easy, normal, and hard) for that specific map.
const MAP_CPU_CROWN_THRESHOLDS = [1, 5, 10];
function mapCpuCrownsEarned(w){
  return MAP_CPU_CROWN_THRESHOLDS.filter(t => (w.easy||0)>=t && (w.normal||0)>=t && (w.hard||0)>=t).length;
}
function totalMapCpuCrownsEarned(i){
  const log = (i!==null && i!==undefined) ? (profileWinLogs[i] || {}) : {};
  return MAPS.reduce((sum, m) => sum + mapCpuCrownsEarned(log[m.id] || {easy:0, normal:0, hard:0}), 0);
}

// Player-vs-Player achievement tiers — PvP wins only (never vs.-CPU), including
// wins credited from opponents who have since been deleted.
const PVP_CROWN_THRESHOLDS = [1, 10, 25, 50, 100];
function pvpCrownsEarned(i){
  const wins = pvpWinsForProfile(i);
  return PVP_CROWN_THRESHOLDS.filter(t => wins >= t).length;
}

// Snapshot a profile's crown-earned counts (all 3 categories, plus the count for
// whichever map is currently selected) so a before/after diff can tell exactly
// which crown(s) — if any — were newly earned by the battle that just ended.
function snapshotCrownCounts(i){
  if(i===null || i===undefined) return null;
  const log = profileWinLogs[i] || {};
  return {
    total: totalWinsCrownsEarned(i),
    map: mapCpuCrownsEarned(log[state.selectedMap] || {easy:0, normal:0, hard:0}),
    pvp: pvpCrownsEarned(i),
  };
}
// Compares a "before" snapshot to the profile's current counts and returns a list
// of {label} for every crown newly crossed since then, across all 3 categories.
function diffNewlyEarnedCrowns(i, before){
  if(!before) return [];
  const after = snapshotCrownCounts(i);
  const earned = [];
  for(let n=before.total; n<after.total; n++){
    earned.push({ label: `Total Wins crown &mdash; ${TOTAL_WINS_CROWN_THRESHOLDS[n]} total wins` });
  }
  const mapName = (MAPS.find(m=>m.id===state.selectedMap)||{}).name || state.selectedMap;
  for(let n=before.map; n<after.map; n++){
    earned.push({ label: `${mapName} crown &mdash; ${MAP_CPU_CROWN_THRESHOLDS[n]} win${MAP_CPU_CROWN_THRESHOLDS[n]===1?'':'s'} on Easy, Normal, and Hard` });
  }
  for(let n=before.pvp; n<after.pvp; n++){
    earned.push({ label: `Player vs. Player crown &mdash; ${PVP_CROWN_THRESHOLDS[n]} PvP win${PVP_CROWN_THRESHOLDS[n]===1?'':'s'}` });
  }
  return earned;
}
// Which profile (if any) could possibly gain a recorded win from the current battle
// ending with this winner — matches recordProfileWin/recordMapPvpWin's own logic
// exactly, so the crown snapshot only ever looks at a profile that actually could
// have changed.
function winningProfileIndexFor(winner){
  if(state.vsMode==='cpu' && winner===1) return state.p1ProfileIndex;
  if(state.vsMode==='pvp' && (winner===1 || winner===2)) return winner===1 ? state.p1ProfileIndex : state.p2ProfileIndex;
  return null;
}

/* ============== PER-MAP PVP WIN LOG (profiles/Guest head-to-head) ============== */
const MAP_PVP_LOG_KEY = 'mapPvpWinLog';
let mapPvpWinLog = {}; // { [mapId]: { [winnerKey]: { [loserKey]: count } } } — key is 'guest' or a profile index string
let mapPvpWinLogLoaded = false;

async function loadMapPvpWinLog(){
  if(mapPvpWinLogLoaded) return;
  mapPvpWinLogLoaded = true;
  try {
    const result = await storageGet(MAP_PVP_LOG_KEY);
    if(result && result.value) mapPvpWinLog = JSON.parse(result.value);
  } catch(e){}
  render();
}

function persistMapPvpWinLog(){
  try { storageSet(MAP_PVP_LOG_KEY, JSON.stringify(mapPvpWinLog)); } catch(e){}
}

function profileKeyFor(idx){ return (idx===null || idx===undefined) ? 'guest' : String(idx); }
function profileLabelForKey(key){ return key==='guest' ? 'Guest' : profileNames[Number(key)]; }

// Records a PvP win between whichever profiles (or Guest) played Player 1 and
// Player 2, credited to the map just played. CPU games and draws aren't recorded —
// there's no second human to have beaten.
function recordMapPvpWin(winner){
  if(state.vsMode!=='pvp') return;
  if(winner!==1 && winner!==2) return;
  const mapId = state.selectedMap;
  if(!mapId) return;
  const winnerKey = profileKeyFor(winner===1 ? state.p1ProfileIndex : state.p2ProfileIndex);
  const loserKey = profileKeyFor(winner===1 ? state.p2ProfileIndex : state.p1ProfileIndex);
  if(!mapPvpWinLog[mapId]) mapPvpWinLog[mapId] = {};
  if(!mapPvpWinLog[mapId][winnerKey]) mapPvpWinLog[mapId][winnerKey] = {};
  mapPvpWinLog[mapId][winnerKey][loserKey] = (mapPvpWinLog[mapId][winnerKey][loserKey]||0) + 1;
  persistMapPvpWinLog();
}

// Deletes a profile: resets its name back to the "Profile N" placeholder (which
// deactivates it — see isProfileActive), and clears its recorded win logs so a
// later profile created in the same slot doesn't inherit someone else's history.
async function deleteProfile(index){
  try { await storageDelete(PROFILE_NAME_KEYS[index]); } catch(e){}
  profileNames[index] = defaultProfileName(index);
  profileMetaVersion[index]++;
  profileWinLogs[index] = {};
  try { await storageSet(PROFILE_WIN_LOG_KEYS[index], JSON.stringify({})); } catch(e){}
  await clearPuzzleProgressForProfile(index);
  const key = String(index);
  // Before erasing this profile's column from the head-to-head log, credit
  // whatever wins other profiles had against them into a running "wins against
  // deleted profiles" total, so that history isn't just lost with the column.
  const creditedWinners = {}; // winnerKey -> total wins against this deleted profile, across all maps
  Object.keys(mapPvpWinLog).forEach(mapId=>{
    Object.keys(mapPvpWinLog[mapId]).forEach(winnerKey=>{
      const n = mapPvpWinLog[mapId][winnerKey][key];
      if(n) creditedWinners[winnerKey] = (creditedWinners[winnerKey]||0) + n;
    });
  });
  Object.keys(creditedWinners).forEach(winnerKey=>{
    if(winnerKey==='guest') return; // no persistent profile to credit
    const wi = Number(winnerKey);
    if(wi===index) return; // the deleted profile's own wins don't count toward itself
    deletedOpponentWins[wi] = (deletedOpponentWins[wi]||0) + creditedWinners[winnerKey];
    persistDeletedOpponentWins(wi);
  });
  Object.keys(mapPvpWinLog).forEach(mapId=>{
    if(mapPvpWinLog[mapId][key]) delete mapPvpWinLog[mapId][key];
    Object.keys(mapPvpWinLog[mapId]).forEach(winnerKey=>{
      if(mapPvpWinLog[mapId][winnerKey][key]) delete mapPvpWinLog[mapId][winnerKey][key];
    });
  });
  persistMapPvpWinLog();
  if(state.p1ProfileIndex===index) state.p1ProfileIndex = null;
  if(state.p2ProfileIndex===index) state.p2ProfileIndex = null;
  editingProfileIndex = null;
  if(state.viewingProfileIndex===index){ state.viewingProfileIndex = null; state.phase = 'title'; }
  render();
}

// directly in a regular browser (e.g. double-clicked, or opened in Edge/Chrome/Firefox),
// that API isn't there at all — fall back to the browser's own localStorage so saving
// still works outside Claude.
const hasClaudeStorage = typeof window!=='undefined' && !!window.storage && typeof window.storage.get==='function';

// Firebase Realtime Database — this is what actually lets saves, profiles, and win
// logs sync across different devices/computers, since localStorage and window.storage
// are both tied to a single browser on a single machine. If Firebase can't be reached
// (offline, blocked, etc.) everything below falls back to window.storage/localStorage
// automatically, so the game still works — it just won't sync elsewhere that session.
const firebaseConfig = {

  authDomain: "battle-tactics-saves.firebaseapp.com",
  databaseURL: "https://battle-tactics-saves-default-rtdb.firebaseio.com",

/* ============== ONLINE MULTIPLAYER (room-code relay over Firebase) ==============
   Turn-based, so this doesn't need a dedicated authoritative server — each client
   just mirrors the FULL `state` object into a shared Firebase room, and the other
   client's listener picks it up and re-renders. This is trust-based, not
   cheat-proof: either side could in principle edit their own local state before
   it syncs. Fine for playing with friends; a public/competitive version would
   need a real server validating moves instead of trusting the client.
   All of these are per-CLIENT (never synced) — who's in the room and which side
   THIS browser controls, not shared game data, so they live outside `state`. */
let onlineRoomCode = null;      // the room code this client is in, or null if not online
let onlineRole = null;          // 'host' (created the room, team 1) or 'guest' (joined, team 2)
let onlineMyTeam = null;        // 1 or 2 — which team THIS browser is allowed to act for
let onlineShareLink = null;     // the link shown to the host to send to their friend
let onlineApplyingRemote = false; // true while absorbing an incoming update — suppresses the echo-back push
let onlineListenerRef = null;   // the Firebase ref currently being listened on, so it can be detached
let onlineStatus = null;        // 'waiting' | 'connected' | 'error' | null — shown in the UI

function generateRoomCode(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O/1/I/L — easy to read aloud or type
  let code = '';
  for(let i=0;i<5;i++) code += chars[Math.floor(Math.random()*chars.length)];
  return code;
}

// Whose turn is it to be allowed to click anything right now? Not online at all
// (or not yet in a room) imposes no restriction — this only ever narrows things
// down once a room is actually joined. Screens with no real "turn" (title, rule
// book, profile, gameover, puzzle mode) are never restricted either.
function isMyOnlineTurn(){
  if(state.vsMode!=='online' || !onlineRoomCode) return true;
  if(state.phase==='mapSelect') return onlineRole==='host'; // host picks the map for both
  if(state.phase==='draft') return state.draftTurn===onlineMyTeam;
  if(state.phase==='placement') return state.placementTurn===onlineMyTeam;
  if(state.phase==='battle'){ const cc = currentChar(); return !cc || cc.team===onlineMyTeam; }
  return true;
}

function attachOnlineListener(code){
  if(!fbDb) return;
  if(onlineListenerRef){ try{ onlineListenerRef.off(); }catch(e){} }
  onlineListenerRef = fbDb.ref('rooms/'+code+'/state');
  onlineListenerRef.on('value', snap=>{
    const remote = snap.val();
    if(!remote) return;
    if((remote._rev||0) <= (state._rev||0)) return; // not newer than what we already have (covers our own write echoing back)
    onlineApplyingRemote = true;
    Object.keys(state).forEach(k=>delete state[k]);
    Object.assign(state, remote);
    onlineStatus = 'connected';
    onlineApplyingRemote = false;
    render();
  }, ()=>{ onlineStatus = 'error'; render(); });
}

// Pushes the WHOLE game state to the room. Called once at the end of every
// render() while a room is active — see render() itself — rather than at each
// individual action site, so nothing that changes state can forget to sync it.
function pushOnlineState(){
  if(!fbDb || !onlineRoomCode || onlineApplyingRemote) return;
  // A real timestamp rather than an incrementing counter — "Play Again" and
  // "Main Menu" both reassign `state` to a brand new freshState() object,
  // which would reset a plain counter back to 0/1 and make the other client's
  // listener wrongly treat the reset as "old" (since its own _rev is still
  // however high the finished game left it at). Date.now() only ever goes up.
  state._rev = Date.now();
  fbDb.ref('rooms/'+onlineRoomCode+'/state').set(JSON.parse(JSON.stringify(state))).catch(()=>{ onlineStatus = 'error'; });
}

async function hostOnlineGame(){
  if(!fbDb){ onlineStatus = 'error'; render(); return; }
  const code = generateRoomCode();
  onlineRoomCode = code;
  onlineRole = 'host';
  onlineMyTeam = 1;
  onlineStatus = 'waiting';
  state._rev = Date.now();
  try {
    await fbDb.ref('rooms/'+code).set({ state: JSON.parse(JSON.stringify(state)), createdAt: Date.now() });
  } catch(e){ onlineStatus = 'error'; render(); return; }
  onlineShareLink = location.origin + location.pathname + '?room=' + code;
  attachOnlineListener(code);
  // A guest joining flips this so the host's UI can stop showing "waiting for
  // opponent" the moment someone actually connects.
  fbDb.ref('rooms/'+code+'/guestJoined').on('value', s=>{ if(s.val()){ onlineStatus='connected'; render(); } });
  render();
}

async function joinOnlineGame(code){
  code = (code||'').trim().toUpperCase();
  if(!code){ return; }
  if(!fbDb){ onlineStatus = 'error'; render(); return; }
  onlineStatus = 'waiting';
  render();
  let snap;
  try { snap = await fbDb.ref('rooms/'+code+'/state').once('value'); } catch(e){ onlineStatus = 'error'; render(); return; }
  const remote = snap.val();
  if(!remote){ onlineStatus = 'error'; render(); return; }
  onlineRoomCode = code;
  onlineRole = 'guest';
  onlineMyTeam = 2;
  onlineApplyingRemote = true;
  Object.keys(state).forEach(k=>delete state[k]);
  Object.assign(state, remote);
  onlineApplyingRemote = false;
  onlineStatus = 'connected';
  try { await fbDb.ref('rooms/'+code+'/guestJoined').set(true); } catch(e){}
  attachOnlineListener(code);
  render();
}

function leaveOnlineGame(){
  if(onlineListenerRef){ try{ onlineListenerRef.off(); }catch(e){} onlineListenerRef = null; }
  onlineRoomCode = null; onlineRole = null; onlineMyTeam = null; onlineShareLink = null; onlineStatus = null;
}

async function storageGet(key){
  if(fbDb){
    try {
      const snap = await fbDb.ref(key).once('value');
      const val = snap.val();
      if(val!==null && val!==undefined) return {key, value: val};
    } catch(e){ /* fall through to the local backends below */ }
  }
  if(hasClaudeStorage){
    try { return await window.storage.get(key, false); } catch(e){ return null; }
  }
  try {
    const raw = localStorage.getItem(key);
    return raw!==null ? {key, value:raw} : null;
  } catch(e){ return null; }
}
async function storageSet(key, value){
  if(fbDb){
    try {
      await fbDb.ref(key).set(value);
      return {key, value};
    } catch(e){ /* fall through to the local backends below */ }
  }
  if(hasClaudeStorage){
    try { return await window.storage.set(key, value, false); } catch(e){ return null; }
  }
  try {
    localStorage.setItem(key, value);
    return {key, value};
  } catch(e){ return null; }
}
async function storageDelete(key){
  if(fbDb){
    try {
      await fbDb.ref(key).remove();
      return {key, deleted:true};
    } catch(e){ /* fall through to the local backends below */ }
  }
  if(hasClaudeStorage){
    try { return await window.storage.delete(key, false); } catch(e){ return null; }
  }
  try {
    localStorage.removeItem(key);
    return {key, deleted:true};
  } catch(e){ return null; }
}

async function checkSavedGames(){
  const needsCheck = [0,1].filter(i=>savedGameCache[i]===undefined);
  if(!needsCheck.length) return;
  await Promise.all(needsCheck.map(async (i)=>{
    try {
      const result = await storageGet(SAVE_KEYS[i]);
      savedGameCache[i] = (result && result.value) ? JSON.parse(result.value) : null;
    } catch(e){
      savedGameCache[i] = null;
    }
  }));
  if(state && (state.phase==='title' || state.phase==='mapSelect')) render();
}

async function loadSlotMeta(){
  if(slotNamesLoaded) return;
  slotNamesLoaded = true;
  const startVersion = [...slotMetaVersion];
  await Promise.all([0,1].map(async (i)=>{
    try {
      const nameResult = await storageGet(SLOT_NAME_KEYS[i]);
      // Only apply this fetch if nothing more recent (delete/rename/save) touched this
      // slot while we were waiting — otherwise a slow initial load could resurrect a
      // name/date that was just cleared.
      if(nameResult && nameResult.value && slotMetaVersion[i]===startVersion[i]) slotNames[i] = nameResult.value;
    } catch(e){}
    try {
      const dateResult = await storageGet(SLOT_DATE_KEYS[i]);
      if(dateResult && dateResult.value && slotMetaVersion[i]===startVersion[i]) slotDates[i] = dateResult.value;
    } catch(e){}
  }));
  render();
}

function formatSlotDate(iso){
  if(!iso) return '';
  try {
    return new Date(iso).toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'});
  } catch(e){ return ''; }
}

// Which save slot's name is currently being edited inline (index or null).

async function saveSlotNameEdit(slotIndex, rawValue){
  const trimmed = (rawValue||'').trim().slice(0,40);
  if(trimmed){
    slotNames[slotIndex] = trimmed;
    slotMetaVersion[slotIndex]++;
    try { await storageSet(SLOT_NAME_KEYS[slotIndex], trimmed); } catch(e){}
  }

async function saveGame(slotIndex, btnEl){
  if(btnEl) btnEl.textContent = 'Saving...';
  await loadSlotMeta(); // make sure we know whether this slot already has an original date
  const previousActive = state.activeSaveSlot;
  try {
    state.activeSaveSlot = slotIndex;
    const payload = JSON.stringify(state);
    const result = await storageSet(SAVE_KEYS[slotIndex], payload);
    if(result){
      savedGameCache[slotIndex] = JSON.parse(payload);
      if(!slotDates[slotIndex]){
        slotDates[slotIndex] = new Date().toISOString();
        slotMetaVersion[slotIndex]++;
        try { await storageSet(SLOT_DATE_KEYS[slotIndex], slotDates[slotIndex]); } catch(e){}
      }
      render();
      const freshBtn = document.getElementById(`saveSlotBtn${slotIndex}`);
      if(freshBtn) freshBtn.textContent = 'Saved!';
      setTimeout(()=> render(), 1200);
    } else {
      state.activeSaveSlot = previousActive;
      if(btnEl) btnEl.textContent = 'Save failed';
      setTimeout(()=> render(), 1200);
    }
  } catch(e){
    state.activeSaveSlot = previousActive;
    if(btnEl) btnEl.textContent = 'Save failed';
    setTimeout(()=> render(), 1200);
  }
}

function loadSavedGame(slotIndex){
  if(!savedGameCache[slotIndex]) return;
  state = JSON.parse(JSON.stringify(savedGameCache[slotIndex]));
  state.activeSaveSlot = slotIndex;
  if(state.selectedMap) applyMapTerrain(state.selectedMap);
  render();
}

async function deleteSavedGame(slotIndex){
  try { await storageDelete(SAVE_KEYS[slotIndex]); } catch(e){}
  try { await storageDelete(SLOT_DATE_KEYS[slotIndex]); } catch(e){}
  try { await storageDelete(SLOT_NAME_KEYS[slotIndex]); } catch(e){}
  savedGameCache[slotIndex] = null;
  slotDates[slotIndex] = null;
  slotNames[slotIndex] = `Slot ${slotIndex+1}`;
  slotMetaVersion[slotIndex]++;
  if(state.activeSaveSlot===slotIndex) state.activeSaveSlot = null;
  render();
}

const STATUS_TOAST_LABELS = {
  poison:'Poisoned', blind:'Blinded', confuse:'Confused', sleep:'Asleep',
  armbreak:'Armbreak', legbreak:'Legbreak', regen:'Regen',
};

// Diffs every character's HP/status against the last snapshot taken (on the
// previous render) and queues a small floating "-15" / "Poisoned" label above
// any character whose HP dropped/rose or who just gained a new status — for
// ANY character on either side, in any game mode (CPU or human-vs-human), from
// ANY source (attacks, specials, poison ticks, regen, traps, etc.). Running
// this once at the top of every render(), rather than instrumenting each
// individual action function, means nothing can change a character's HP or
// status without it being caught here. No names or extra text — just the
// number and/or the status word, and only for 3 seconds.
function updateFloatingLabels(){
  const chars = [...(state.p1.instances||[]), ...(state.p2.instances||[])];
  if(!state.hpStatusSnapshot){
    // First time we've seen battle state (fresh battle) — just capture the
    // baseline, don't manufacture labels for the initial max-HP setup.
    state.hpStatusSnapshot = {};
    chars.forEach(c=>{ state.hpStatusSnapshot[c.uid] = { hp:c.hp, status:{...c.status} }; });
    return;
  }
  const now = Date.now();
  chars.forEach(c=>{
    const prev = state.hpStatusSnapshot[c.uid];
    if(!prev){ state.hpStatusSnapshot[c.uid] = { hp:c.hp, status:{...c.status} }; return; }
    const delta = c.hp - prev.hp;
    const newStatuses = [];
    Object.keys(c.status||{}).forEach(key=>{
      if((c.status[key]||0)>0 && !(prev.status[key]>0)) newStatuses.push(key);
    });
    if(delta!==0 || newStatuses.length){
      const parts = [];
      if(delta<0) parts.push(`<span class="fl-loss">-${-delta}</span>`);
      else if(delta>0) parts.push(`<span class="fl-gain">+${delta}</span>`);
      newStatuses.forEach(s=> parts.push(`<span class="fl-status">${STATUS_TOAST_LABELS[s]||s}</span>`));
      const fadeUid = c.uid;
      state.floatingLabels[c.uid] = { html: parts.join(''), startTime: now };
      setTimeout(()=>{
        const cur = state.floatingLabels[fadeUid];
        if(cur && cur.startTime===now){
          delete state.floatingLabels[fadeUid];
          if(state.phase==='battle') render();
        }
      }, 3000);
    }
    prev.hp = c.hp;
    prev.status = {...c.status};
  });
}

// Real-time-synced animation-delay for a floating label, matching the
// cpuGlowStyle() approach — since the board is fully rebuilt every render(),
// a plain CSS animation would restart from the beginning each time, so we
// resume it at the correct point using a negative delay based on elapsed time.
function floatingLabelHtml(uid){
  const fl = state.floatingLabels[uid];
  if(!fl) return '';
  const elapsedSec = Math.min(2.98, Math.max(0, (Date.now()-fl.startTime)/1000));
  return `<div class="float-label" style="animation-delay:-${elapsedSec.toFixed(2)}s">${fl.html}</div>`;
}

// Formerly wrapped resolver functions (doBasicAttack, resolveSpecial, resolveDashThenTarget,
// etc.) to pop an on-board action toast after each resolved action. The toasts were removed
// (battle log remains the source of truth), so this now just calls the wrapped fn through
// unchanged — kept as a passthrough so the withActionToasts(...) call sites below don't need
// to be unwound one by one.
function withActionToasts(fn){
  return function(attacker, target, ...rest){
    return fn.call(this, attacker, target, ...rest);
  };
}

// Colors every character-name mention in a log message by that character's team
// (blue for Player 1, orange for Player 2). Names are unique per battle (the draft
// prevents both players from picking the same character), so a name→team lookup
// built from both teams' instances is safe.
function colorizeLogEntry(msg){
  if(!state.p1 || !state.p2) return msg;
  const nameColor = {};
  state.p1.instances.forEach(c=>{ nameColor[c.def.name] = 'var(--p1)'; });
  state.p2.instances.forEach(c=>{ nameColor[c.def.name] = 'var(--p2)'; });
  let out = msg;
  Object.keys(nameColor).forEach(name=>{
    const esc = name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const re = new RegExp(`<b>${esc}</b>`, 'g');
    out = out.replace(re, `<b style="color:${nameColor[name]}">${name}</b>`);
  });
  // Team-name mentions (e.g. a chosen profile name, or "Guest"/"CPU") — handle
  // already-bold ones first via placeholders so the plain-text pass below doesn't
  // double-wrap them. Skipped entirely if both teams share the same name (e.g.
  // both left on "Guest"), since substitution would corrupt itself in that case.
  const p1Name = state.p1.name, p2Name = state.p2.name;
  if(p1Name && p2Name && p1Name!==p2Name){
    const escP1 = p1Name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    const escP2 = p2Name.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    out = out.replace(new RegExp(`<b>${escP1}</b>`, 'g'), '\u0000P1B\u0000');
    out = out.replace(new RegExp(`<b>${escP2}</b>`, 'g'), '\u0000P2B\u0000');
    out = out.replace(new RegExp(escP1, 'g'), `<span style="color:var(--p1)">${p1Name}</span>`);
    out = out.replace(new RegExp(escP2, 'g'), `<span style="color:var(--p2)">${p2Name}</span>`);
    out = out.replace(/\u0000P1B\u0000/g, `<b style="color:var(--p1)">${p1Name}</b>`);
    out = out.replace(/\u0000P2B\u0000/g, `<b style="color:var(--p2)">${p2Name}</b>`);
  }
  return out;
}

function backToMapSelect(){
  if(state.vsMode==='online' && onlineRoomCode && onlineRole!=='host') return;
  const vsMode = state.vsMode, cpuDifficulty = state.cpuDifficulty;
  const p1ProfileIndex = state.p1ProfileIndex, p2ProfileIndex = state.p2ProfileIndex;
  const p1Name = state.p1.name, p2Name = state.p2.name;
  state = freshState();
  state.vsMode = vsMode; state.cpuDifficulty = cpuDifficulty;
  state.p1ProfileIndex = p1ProfileIndex; state.p2ProfileIndex = p2ProfileIndex;
  state.p1.name = p1Name; state.p2.name = p2Name;
  render();
}

function backToDraft(){
  if(state.vsMode==='online' && onlineRoomCode && onlineRole!=='host') return;
  const map = state.selectedMap;
  const vsMode = state.vsMode, cpuDifficulty = state.cpuDifficulty;
  const p1ProfileIndex = state.p1ProfileIndex, p2ProfileIndex = state.p2ProfileIndex;
  const p1Name = state.p1.name, p2Name = state.p2.name;
  state = freshState();
  state.selectedMap = map;
  state.vsMode = vsMode; state.cpuDifficulty = cpuDifficulty;
  state.p1ProfileIndex = p1ProfileIndex; state.p2ProfileIndex = p2ProfileIndex;
  state.p1.name = p1Name; state.p2.name = p2Name;
  state.phase = 'draft';
  render();
}

function rollDie(){ return 1+Math.floor(Math.random()*6); }

function instantiate(defId, teamId, x, y){
  const def = ROSTER.find(r=>r.id===defId);
  return {
    uid: teamId+'_'+defId+'_'+Math.random().toString(36).slice(2,7),
    defId, def, team:teamId, x, y,
    hp:def.hp, maxHp:def.hp,
    alive:true,
    status:{poison:0, sleep:0, legbreak:0, armbreak:0, blind:0, regen:0, confuse:0, haste:0},
    shield:0,
    specialCharges: def.specialCharges || 2,
    basicBonus:0,
    basicOverride:null, // permanently swapped-in basic attack (e.g. Outlaw's Lock-On), per-instance only
    movedThisTurn:false, actedThisTurn:false,
    elevated:false,
  };
}

/* ============== DRAFT ============== */
function pickCharacter(defId){
  if(!isMyOnlineTurn()) return;
  if(state.draftPicks.includes(defId)) return;
  state.draftPicks.push(defId);
  const teamId = state.draftTurn;
  const team = teamId===1? state.p1 : state.p2;
  team.chars.push(defId);
  if(team.chars.length>=4 && (teamId===1?state.p2.chars.length:state.p1.chars.length)>=4){
    // both possibly done; check overall
  }
  state.draftTurn = state.draftTurn===1?2:1;
  if(state.p1.chars.length>=4 && state.p2.chars.length>=4){
    startPlacement();
  }
  render();
}

function startPlacement(){
  state.phase = 'placement';
  // Randomly decide which team's placement zone is the bottom row (y=12) vs the top row (y=0).
  const p1OnBottom = Math.random() < 0.5;
  state.p1Side = p1OnBottom ? 'bottom' : 'top';
  state.p2Side = p1OnBottom ? 'top' : 'bottom';
  state.placementTurn = 1;
  state.p1.placements = [];
  state.p2.placements = [];
  state.placementSelectedDef = null;
  log(`Sides randomized &mdash; <b>${state.p1.name}</b> starts on the ${state.p1Side} and <b>${state.p2.name}</b> starts on the ${state.p2Side}.`);
}

function zoneTilesFor(side){
  return side==='top' ? ZONE_A : ZONE_B;
}

function placeCharacter(defId, x, y){
  if(!isMyOnlineTurn()) return;
  const teamId = state.placementTurn;
  const team = teamId===1? state.p1 : state.p2;
  if(team.placements.some(p=>p.defId===defId)) return;
  if(team.placements.some(p=>p.x===x && p.y===y)) return;
  team.placements.push({defId, x, y});
  state.placementSelectedDef = null;
  if(team.placements.length>=4){
    if(state.placementTurn===1){
      state.placementTurn = 2;
    } else {
      startBattle();
      render();
      return;
    }
  }
  render();
}

// Randomly places every remaining unplaced character for the CURRENT team on open
// tiles within their placement zone, then advances the turn/starts the battle exactly
// like finishing placement normally would.
function randomPlaceAllForCurrentTeam(){
  if(!isMyOnlineTurn()) return;
  const teamId = state.placementTurn;
  const team = teamId===1? state.p1 : state.p2;
  const side = teamId===1? state.p1Side : state.p2Side;
  const zoneTiles = zoneTilesFor(side);
  const placedDefIds = new Set(team.placements.map(p=>p.defId));
  const unplaced = team.chars.filter(id=>!placedDefIds.has(id));
  if(!unplaced.length) return;
  const allPlacements = [...state.p1.placements, ...state.p2.placements];
  const occupiedKeys = new Set(allPlacements.map(p=>p.x+','+p.y));
  const openTiles = zoneTiles.filter(t=>!occupiedKeys.has(t.x+','+t.y));
  // Shuffle open tiles (Fisher-Yates) so placement order doesn't bias tile choice.
  for(let i=openTiles.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [openTiles[i],openTiles[j]] = [openTiles[j],openTiles[i]];
  }
  unplaced.forEach((defId,idx)=>{
    const tile = openTiles[idx];
    if(!tile) return; // not enough open tiles left — shouldn't normally happen
    team.placements.push({defId, x:tile.x, y:tile.y});
  });
  state.placementSelectedDef = null;
  if(team.placements.length>=4){
    if(state.placementTurn===1){
      state.placementTurn = 2;
    } else {
      startBattle();
      render();
      return;
    }
  }
  render();
}

function startBattle(){
  state.phase='battle';
  state.p1.instances = state.p1.placements.map(p=>instantiate(p.defId,1,p.x,p.y));
  state.p2.instances = state.p2.placements.map(p=>instantiate(p.defId,2,p.x,p.y));
  // Each team has its own turn order (placement order). Turns strictly alternate
  // between teams; if the next character up on a team's list has died, that team
  // just moves to its next living unit — the other team never gets two turns in a row.
  state.p1TurnOrder = state.p1.instances.map(c=>c.uid);
  state.p2TurnOrder = state.p2.instances.map(c=>c.uid);
  state.p1TurnIdx = 0;
  state.p2TurnIdx = 0;
  state.activeTeam = Math.random() < 0.5 ? 1 : 2;
  log(`<b>${state.activeTeam===1?state.p1.name:state.p2.name}</b> wins the coin flip and goes first.`);
  log('Battle begins!');
  advanceToLivingTurn(true);
}

/* ============== HELPERS ============== */
function allInstances(){
  return [...state.p1.instances, ...state.p2.instances];
}
function getByUid(uid){ return allInstances().find(c=>c.uid===uid); }
function activeTurnOrder(){ return state.activeTeam===1 ? state.p1TurnOrder : state.p2TurnOrder; }
function activeTurnIdx(){ return state.activeTeam===1 ? state.p1TurnIdx : state.p2TurnIdx; }
function setActiveTurnIdx(i){ if(state.activeTeam===1) state.p1TurnIdx = i; else state.p2TurnIdx = i; }
function currentChar(){
  const order = activeTurnOrder();
  if(!order || !order.length) return null;
  return getByUid(order[activeTurnIdx() % order.length]);
}
function teamOf(c){ return c.team===1?state.p1:state.p2; }
function enemyTeamOf(c){
  // Specter's Possess: while a character is living out their own hijacked
  // turn (see endTurnAdvance/resolvePossessLanding), they act against their
  // OWN real team instead of their true opposition — Specter has turned them
  // against their side for the length of this one turn. Same shape as
  // charmedOwnTeam for Thief's Charm.
  if(state.possession && state.possession.targetUid===c.uid){
    return { instances: teamOf(c).instances.filter(e=>e.uid!==c.uid) };
  }
  const team = c.team===1?state.p2:state.p1;
  // Specter is invisible while possessing — filtered out of every enemy
  // lookup that would otherwise include it, so nothing (CPU or human, single-
  // target or AOE) can ever select it as an attack target. Doesn't touch
  // teamOf, so Specter's own side can still see/support it normally.
  if(state.possession){
    const specter = getByUid(state.possession.specterUid);
    if(specter && specter.team!==c.team){
      return { instances: team.instances.filter(u=>u.uid!==specter.uid) };
    }
  }
  return team;
}
function teamCls(c){ return c.team===1?'p1':'p2'; }
// CSS class(es) for the vs.-CPU turn highlight — steady glow while the CPU's
// character is up, then a one-shot fade after its turn ends. Empty otherwise
// (never applied to the human player's own characters).
function cpuGlowClass(uid){
  if(state.cpuActiveUid===uid) return 'cpu-turn-glow';
  if(state.cpuFadeUid===uid) return 'cpu-turn-glow fading';
  return '';
}
// The whole board is rebuilt from scratch on every render() call, so a plain CSS
// animation on the fading token would restart from full brightness on every
// re-render (e.g. every time the human hovers or clicks during their own turn) —
// the glow would keep snapping back instead of actually dimming, then vanish
// abruptly the instant the JS timeout clears it. A negative animation-delay equal
// to real elapsed time makes each freshly-rebuilt element resume the fade exactly
// where it should be, so it dims smoothly over the full 3s no matter how many
// re-renders happen in between.
function cpuGlowStyle(uid){
  if(state.cpuFadeUid===uid && state.cpuFadeStartTime){
    const elapsedSec = Math.min(5.98, Math.max(0, (Date.now()-state.cpuFadeStartTime)/1000));
    return `style="animation-delay:-${elapsedSec.toFixed(2)}s"`;
  }
  return '';
}
function teamColorVar(c){ return c.team===1?'var(--p1)':'var(--p2)'; }
function occupantsAt(x,y){ return allInstances().filter(c=>c.alive && c.x===x && c.y===y); }
function occupantAt(x,y,elevated){
  const occs = occupantsAt(x,y);
  if(occs.length===0) return undefined;
  if(elevated===undefined || !isBridgeTile(x,y)) return occs[0];
  // Bridge tile: the two layers are independent, so only match the requested layer.
  return occs.find(o=> !!o.elevated === !!elevated);
}
function terrainAt(x,y){
  if(x<0||x>=BOARD_COLS||y<0||y>=BOARD_ROWS) return 2;
  return TERRAIN[y][x];
}
function manhattan(a,b){ return Math.abs(a.x-b.x)+Math.abs(a.y-b.y); }
function chebyshev(a,b){ return Math.max(Math.abs(a.x-b.x),Math.abs(a.y-b.y)); }
// Most abilities measure range in orthogonal steps (manhattan). A "square" ability
// (e.g. the Admiral's R1SQ) measures range including diagonals (chebyshev) instead.
function distanceFor(a,b,abilityDef){ return (abilityDef && abilityDef.square) ? chebyshev(a,b) : manhattan(a,b); }
// For "hit everyone in range" abilities (aoeEnemiesRange): a straightOnly ability
// (e.g. Vigilant's boomerang) only reaches enemies directly on one of the 4 cardinal
// lines from the attacker — not diagonal, not off-axis — regardless of distance.
function isOnStraightLine(a,b){ return a.x===b.x || a.y===b.y; }

        if(awaitingRelocate) return; // interactive step still pending — see the click handler's basicRelocateSelect check
        if(awaitingMugTeleport) return; // interactive step still pending — see the click handler's mugTeleportSelectDest check
        if(s.matey){
          const allyPool = teamOf(attacker).instances.filter(u=>u.alive && u.uid!==attacker.uid);
          if(allyPool.length){
            state.mode = 'mateySelectAlly';
            log(`&mdash; choose an ally anywhere on the board to immediately use their basic attack.`, '');
          } else {
            log(`&mdash; no other ally available to act.`, '');
          }
        }
        if(s.vaultAttack){
          const landingTiles = vaultLandingTiles(attacker, target);
          if(landingTiles.length){
            state.mode = 'vaultSelectLanding';
            state.vaultTargetUid = target.uid;
            attacker.movedThisTurn = true;
            log(`&mdash; choose an adjacent tile to land on.`, '');
          } else {
            log(`&mdash; no open tile next to them to land on.`, '');
          }
        }
      }
    }
  }
}

// Second phase of a "dashThenTarget" special (e.g. Raider's Sandslash): the attacker
// has already dashed to their chosen tile; this resolves the single-target hit from
// that new position. specialCharges was already spent when the dash tile was chosen.
// The roll for this already happened before the dash was even offered (see
// rollTileSpecialUpfront) — reaching here means it succeeded, so this is a
// guaranteed hit; no second roll.
function resolveDashThenTarget(attacker, target){
  const s = attacker.def.special;
  const dealt = applyDamage(target, s.dmg, attacker);
  if(s.applyStatus) applyStatus(target, s.applyStatus, s.statusDur||1);
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; -${dealt} HP${s.applyStatus?(' + '+s.applyStatus):''}`, '');
}

// Seeker's Dice: one independent roll against one target, called once per click
// (or once per CPU pick) — up to abilityDef.rollsEach times per use of the special.
// Unlike every other multi-hit special, each roll here is its own separate roll,
// not one shared roll covering several hits, and a different target can be picked
// for each one. The special charge itself is spent once for the whole action by
// the caller (the click handler / CPU loop), not per roll.
function resolveDiceRoll(attacker, target){
  const s = attacker.def.special;
  const roll = specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return;
  }
  const dealt = applyDamage(target, s.dmg, attacker);
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: -${dealt} HP.`, '');
}

// Priest's basic (D1 to an enemy, then Heal 2 to self/an ally): a single roll decides
// whether the WHOLE action lands — one roll, not one per half. On a hit, both the
// damage and the heal apply together; on a miss, neither does.
function resolvePriestBasicCombo(attacker, enemyTarget, healTarget){
  const b = effectiveBasic(attacker);
  const isBlind = attacker.status.blind>0;
  const roll = isBlind ? blindRoll() : basicAttackRoll(enemyTarget.status.sleep>0);
  const dmg = b.dmg + (attacker.basicBonus||0);
  const isSelfHeal = healTarget.uid===attacker.uid;
  const healAmt = isSelfHeal ? b.selfHeal : b.heal;
  if(roll.result==='miss-counter'){
    if(canReach(attacker,enemyTarget,effectiveBasic(enemyTarget))){
      const recoil = applyDamage(attacker, 1, enemyTarget);
      log(`<b>${attacker.def.name}</b> attacks <b>${enemyTarget.def.name}</b> and tries to heal <b>${healTarget.def.name}</b> &mdash; rolled 1: miss! <b>${enemyTarget.def.name}</b> counters for ${recoil} recoil dmg.`, 'miss');
    } else {
      log(`<b>${attacker.def.name}</b> attacks <b>${enemyTarget.def.name}</b> and tries to heal <b>${healTarget.def.name}</b> &mdash; rolled 1: miss! (out of <b>${enemyTarget.def.name}</b>'s range, no counter)`, 'miss');
    }
  } else if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> attacks <b>${enemyTarget.def.name}</b> and tries to heal <b>${healTarget.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
  } else {
    const isCrit = roll.result==='crit';
    const dealt = applyDamage(enemyTarget, dmg, attacker);
    if(b.applyStatus) applyStatus(enemyTarget, b.applyStatus, b.statusDur||1);
    healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp + healAmt);
    if(isCrit && enemyTarget.specialCharges>0){ enemyTarget.specialCharges--; }
    log(`<b>${attacker.def.name}</b> attacks <b>${enemyTarget.def.name}</b> and heals <b>${healTarget.def.name}</b> &mdash; rolled ${roll.roll}${isCrit?' CRITICAL':''}: -${dealt} HP to <b>${enemyTarget.def.name}</b>, +${healAmt} HP to <b>${healTarget.def.name}</b>${isCrit?' (special charge lost)':''}`, isCrit?'crit':'');
  }
}

// For tile-type specials (Sandslash, Bulldoze) the roll now happens FIRST — you
// don't get to pick a destination or a target unless it succeeds. Consumes the
// special charge on the ATTEMPT itself, win or lose — same as every other special
// in the game (resolveSpecial always spends the charge up front, regardless of the
// roll) — so cancelling out of targeting after a successful roll can't be used to
// "re-roll for free."
function rollTileSpecialUpfront(attacker){
  const s = attacker.def.special;
  // Committed the instant the charge is spent and the roll happens — the
  // destination pick that follows a hit is just finishing an action already
  // in progress, not something Undo Move should be able to back out of.
  attacker.actedThisTurn = true;
  attacker.specialCharges--;
  const roll = specialAttackRoll(attacker.status.blind>0);
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> tries to use <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
    return false;
  }
  return true;
}
rollTileSpecialUpfront = withActionToasts(rollTileSpecialUpfront);

// Seeker's Dice: same upfront-roll shape as a tile special — Dice itself has to
// land first (one normal special attack roll, charge spent either way) before the
// player (or CPU) gets to pick targets for the 5 individual rolls that follow.
// Each of those 5 rolls is then its OWN separate hit/miss check (see
// resolveDiceRoll) — this upfront roll only gates whether that sequence happens
// at all this turn.
function rollDiceUpfront(attacker){
  const s = attacker.def.special;
  // Same reasoning as rollTileSpecialUpfront: the charge/roll is already spent
  // here, so this locks immediately rather than waiting for the 5 individual
  // target picks that follow a hit.
  attacker.actedThisTurn = true;
  attacker.specialCharges--;
  const roll = specialAttackRoll(attacker.status.blind>0);
  if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> tries to use <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
    return false;
  }
  log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: hit! Rolls ${s.rollsEach} times.`, '');
  return true;
}
rollDiceUpfront = withActionToasts(rollDiceUpfront);

// Every resolved action (not movement) should pop a fading notice over the board —
// wrap the resolver entry points once here, rather than editing their internal
// branches, so nothing inside them has to change.
doBasicAttack = withActionToasts(doBasicAttack);
resolveSpecial = withActionToasts(resolveSpecial);
resolveDashThenTarget = withActionToasts(resolveDashThenTarget);
resolvePriestBasicCombo = withActionToasts(resolvePriestBasicCombo);
// Cannoneer's/Outlaw's target-point basic is fired directly from tile/token click
// handlers (not routed through doBasicAttack), so it needs its own wrapping too —
// otherwise neither a hit NOR a miss ever produced a popup for it.
resolveBasicTargetPoint = withActionToasts(resolveBasicTargetPoint);
// Seeker's Dice: each individual roll (up to 5 per use) needs its own popup too.
resolveDiceRoll = withActionToasts(resolveDiceRoll);
/* ============== RENDER ============== */
/* ============== CPU OPPONENT (Player 2, vs. CPU mode) ============== */
// Team 2 plays itself whenever state.vsMode==='cpu'. Draft picks are always random
// (not difficulty-based). Difficulty only affects in-battle decisions: 'easy' leans
// random, 'normal' targets the weakest reachable enemy with occasional special use,
// 'hard' always goes for the strongest available play and favors finishing off
// low-HP targets.
function cpuDifficultyLevel(){ return state.cpuDifficulty || 'normal'; }

function cpuDraftPick(){
  if(state.phase!=='draft' || state.draftTurn!==2) return;
  const avail = availableRoster();
  if(!avail.length) return;
  // Draft picks are fully random regardless of difficulty — difficulty only
  // affects in-battle decisions (see cpuDifficultyLevel comment above).
  pickCharacter(avail[Math.floor(Math.random()*avail.length)].id);
}

function cpuPlaceAll(){
  if(state.phase!=='placement' || state.placementTurn!==2) return;
  randomPlaceAllForCurrentTeam();
}

// Computes every valid destination tile for a targetType:'tile' special (Sandslash,
// Bulldoze) — mirrors the same rules the UI uses to build its clickable tile set.
function tileSpecialOptions(c, abil){
  const opts = [];
  const canCrossWater = c.def.abilities?.float || (!WATER_IMPASSABLE && abil.crossWater);
  for(let ty=0; ty<BOARD_ROWS; ty++){
    for(let tx=0; tx<BOARD_COLS; tx++){
      if(tx===c.x && ty===c.y) continue;
      if(manhattan(c,{x:tx,y:ty})>abil.moveRange) continue;
      const terr = terrainAt(tx,ty);
      if(terr===2) continue;
      if(terr===1 && !canCrossWater) continue;
      if(occupantsAt(tx,ty).length>0) continue;
      opts.push({x:tx,y:ty});
    }
  }
  return opts;
}

// Whether a targetType:'tile' special (Sandslash, Bulldoze) has ANY destination that
// would actually land a hit right now — used to keep the Special button disabled
// entirely when there's nothing to use it on, rather than letting the roll-first
// mechanic burn a charge (or open an empty targeting screen) for nothing.
function tileSpecialHasAnyValidTarget(c){
  const special = c.def.special;
  if(special.targetType!=='tile') return true; // not applicable — don't block other ability types
  const targets = state.charmBonusUid===c.uid ? charmedOwnTeam(c) : enemyTeamOf(c);
  const enemies = targets.instances.filter(e=>e.alive);
  if(!enemies.length) return false;
  return tileSpecialOptions(c, special).some(opt=>{
    const pseudo = {x:opt.x, y:opt.y, elevated: isElevatedGround(opt.x, opt.y)};
    if(special.dashThenTarget) return enemies.some(e=>canReach(pseudo, e, special));
    if(special.aoeEnemiesRange!==undefined) return enemies.some(e=>manhattan(opt,e)<=special.aoeEnemiesRange);
    return false;
  });
}

// Tries a targetType:'tile' special (Sandslash's dash-then-hit, Bulldoze's move-and-AOE).
// Picks whichever reachable destination lines up the best hit, then resolves it directly
// (dash specials via resolveDashThenTarget, plain move-and-AOE specials via resolveSpecial).
// Returns true if it used the special (which also counts as this turn's move + attack).
// Cannoneer-style: finds the best point within a targetPoint ability's range —
// the one hitting the most enemies, tie-broken toward the lowest total HP among
// them (or purely random on easy difficulty). fromPos lets movement-scoring ask
// "if I moved here, what's my best shot?" without actually moving the character.
function bestTargetPointFor(c, abilityDef, diff, fromPos){
  const pos = fromPos || c;
  let best = null, bestScore = -Infinity;
  for(let ty=0; ty<BOARD_ROWS; ty++){
    for(let tx=0; tx<BOARD_COLS; tx++){
      if(manhattan(pos,{x:tx,y:ty})>abilityDef.range) continue;
      if(!abilityDef.ignoreObstacles && !hasLineOfSight(pos,{x:tx,y:ty,elevated:isElevatedGround(tx,ty)})) continue;
      const hits = enemyTeamOf(c).instances.filter(e=>e.alive && manhattan({x:tx,y:ty},e)<=abilityDef.aoeRadius);
      if(!hits.length) continue;
      const totalHp = hits.reduce((s,e)=>s+e.hp, 0);
      const score = diff==='easy' ? Math.random() : (hits.length*100 - totalHp);
      if(score>bestScore){ bestScore=score; best={x:tx,y:ty}; }
    }
  }
  return best;
}
// How many enemies the best available shot would hit from a given (hypothetical)
// position — used by movement scoring to weigh "should I move here" for a
// targetPoint basic, mirroring how aoeEnemiesRange abilities are already scored.
function bestTargetPointHitCount(c, abilityDef, fromPos){
  const point = bestTargetPointFor(c, abilityDef, 'normal', fromPos);
  return point ? enemyTeamOf(c).instances.filter(e=>e.alive && manhattan(point,e)<=abilityDef.aoeRadius).length : 0;
}

function cpuTryTileSpecial(c, enemies, diff){
  const special = c.def.special;
  if(special.targetType!=='tile' || c.actedThisTurn || c.specialCharges<=0 || c.status.armbreak>0) return false;
  const options = tileSpecialOptions(c, special);
  if(!options.length) return false;
  const specialChance = diff==='hard' ? 1 : (diff==='normal' ? 0.6 : 0.25);

  if(special.dashThenTarget){
    // Single-target hit from the new position (e.g. Sandslash) — uses the special's
    // own range, same as the UI's dashThenTargetSelect step.
    let bestTile=null, bestTarget=null, bestScore=-Infinity;
    options.forEach(opt=>{
      const pseudo = {x:opt.x, y:opt.y, elevated: isElevatedGround(opt.x, opt.y)};
      const hits = enemies.filter(e=>canReach(pseudo, e, special));
      if(!hits.length) return;
      const target = diff==='easy' ? hits[Math.floor(Math.random()*hits.length)] : hits.slice().sort((a,b)=>a.hp-b.hp)[0];
      const score = hits.length*10 - target.hp*0.1;
      if(score>bestScore){ bestScore=score; bestTile=opt; bestTarget=target; }
    });
    if(!bestTile || Math.random()>=specialChance) return false;
    // Roll FIRST, before committing to any movement — matches the player-facing flow.
    // A miss ends the turn right here with no repositioning at all.
    if(!rollTileSpecialUpfront(c)){
      c.actedThisTurn = true;
      return true;
    }
    c.undoX=c.x; c.undoY=c.y; c.undoElevated=c.elevated;
    c.x=bestTile.x; c.y=bestTile.y; c.elevated=isElevatedGround(bestTile.x, bestTile.y);
    checkHeartTokenPickup(c);
    checkTrapTrigger(c); checkCropTrigger(c);
    checkTeleportDoorway(c);
    log(`<b>${c.def.name}</b> dashes to an empty tile.`,'');
    resolveDashThenTarget(c, bestTarget);
    c.actedThisTurn = true; c.movedThisTurn = true;
    return true;
  }

  if(special.aoeEnemiesRange!==undefined){
    // Move-then-AOE (e.g. Bulldoze) — hits every enemy within aoeEnemiesRange of the
    // new spot, same rule resolveSpecial itself uses for this branch (not canReach,
    // since this isn't a single-target ranged hit).
    let bestTile=null, bestHits=-1;
    options.forEach(opt=>{
      const hits = enemies.filter(e=>manhattan(opt,e)<=special.aoeEnemiesRange).length;
      if(hits>bestHits){ bestHits=hits; bestTile=opt; }
    });
    if(!bestTile || bestHits<=0 || Math.random()>=specialChance) return false;
    // Roll FIRST, before committing to any movement — matches the player-facing flow.
    if(!rollTileSpecialUpfront(c)){
      c.actedThisTurn = true;
      return true;
    }
    resolveSpecial(c, bestTile);
    c.actedThisTurn = true; c.movedThisTurn = true;
    return true;
  }

  return false;
}

// True walking distance from a character's position to a target tile via BFS
// (unlimited range), honoring the same height-climb and terrain rules reachableTiles
// uses — not just "trees block movement", but also "you can only climb/drop your
// climb capacity per step". Used as the CPU's movement heuristic instead of raw
// straight-line (Manhattan) distance, so it correctly judges maps like Castle
// Lookout — where the roof/keep in the middle can't be walked straight over, and
// getting around means genuinely detouring rather than just greedily minimizing
// straight-line distance and pacing at the base of it.
function boardPathDistance(c, targetX, targetY){
  const startElevated = !!c.elevated;
  if(c.x===targetX && c.y===targetY) return 0;
  const abilities = (c.def && c.def.abilities) || {};
  const climb = abilities.jump || 1;
  const key = (x,y,el)=> x+','+y+','+(el?1:0);
  const visited = new Set([key(c.x,c.y,startElevated)]);
  let frontier = [{x:c.x,y:c.y,elevated:startElevated}];
  let dist = 0;
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const maxSteps = BOARD_COLS*BOARD_ROWS*2;
  while(frontier.length && dist<=maxSteps){
    dist++;
    const next = [];
    for(const cur of frontier){
      const curHeight = effectiveHeightAt(cur.x,cur.y,cur.elevated);
      for(const [dx,dy] of dirs){
        const nx=cur.x+dx, ny=cur.y+dy;
        if(nx<0||nx>=BOARD_COLS||ny<0||ny>=BOARD_ROWS) continue;
        if(isEdgeBlocked(cur.x,cur.y,dx,dy)) continue; // a wall on just this one border — always blocks
        const terr = terrainAt(nx,ny);
        if(terr===2) continue; // trees — always impassable
        if(terr===1 && WATER_IMPASSABLE && !abilities.float) continue; // open ocean — impassable without Float
        const nextElevated = (isBridgeTile(nx,ny) ? cur.elevated : isElevatedGround(nx,ny));
        const nextHeight = effectiveHeightAt(nx,ny,nextElevated);
        if(Math.abs(nextHeight-curHeight) > climb) continue; // too steep to climb or drop
        const sKey = key(nx,ny,nextElevated);
        if(visited.has(sKey)) continue;
        if(nx===targetX && ny===targetY) return dist;
        visited.add(sKey);
        next.push({x:nx,y:ny,elevated:nextElevated});
      }
    }
    frontier = next;
  }
  return Math.abs(c.x-targetX)+Math.abs(c.y-targetY)+maxSteps; // no path found — treat as very far, but still finite so sorting works
}

// Whether a targetType:'none' special (AOE/support abilities like Pray, Guard,
// Whirl, Blizzard, Wave) would actually do anything useful right now — either its
// damage component would reach a real enemy, or its heal/cure/shield component
// would help an ally that actually needs it. Prevents the CPU from burning a charge
// on something like Pray's pure Regen when the whole team is already at full HP.
function cpuNoneSpecialHasValue(c, special, enemies){
  let hasDamageValue = false;
  if(special.dmg!==undefined){
    if(special.aoeEnemiesRange===undefined || special.aoeEnemiesRange>=9999){
      hasDamageValue = enemies.length>0;
    } else {
      hasDamageValue = enemiesInAoeRange(c, special).length>0;
    }
  }
  if(hasDamageValue) return true;
  const allies = teamOf(c).instances.filter(a=>a.alive && (!special.excludeSelf || a.uid!==c.uid));
  if((special.regen!==undefined || special.healAllies!==undefined) && allies.some(a=>a.hp<a.maxHp)) return true;
  if(special.cureAllies && allies.some(a=>Object.values(a.status||{}).some(v=>v>0))) return true;
  if(special.shield!==undefined && special.shieldRange!==undefined){
    const shieldTargets = teamOf(c).instances.filter(a=>a.alive && manhattan(c,a)<=special.shieldRange);
    if(shieldTargets.some(a=>(a.shield||0) < special.shield)) return true;
  }
  return false;
}

function cpuTakeTurn(){
  const c = currentChar();
  // Specter's Possess: during a hijacked turn, whoever controls Specter is
  // deciding — not c's own actual team — so the CPU-turn guard below has to
  // check that instead of c.team directly.
  const possessingSpecter = (c && state.possession && state.possession.targetUid===c.uid) ? getByUid(state.possession.specterUid) : null;
  const controllingTeam = possessingSpecter ? possessingSpecter.team : c?.team;
  if(!c || !c.alive || controllingTeam!==2 || state.phase!=='battle') return;
  const diff = cpuDifficultyLevel();

  if(c.status.confuse>0){
    resolveConfusedBasic(c);
    c.actedThisTurn = true; state.mode = null;
    maybeAutoEnd(); endTurnAdvance();
    state.cpuThinking = false;
    render();
    return;
  }

  const enemies = enemyTeamOf(c).instances.filter(e=>e.alive);
  const canAttack = c.status.armbreak<=0;
  const basic = effectiveBasic(c);
  const special = c.def.special;
  // Haste's bonus turn (see advanceToLivingTurn/startHasteBonusTurn) is restricted
  // to move + basic attack only — no special, regardless of charges available.
  const specialUsable = canAttack && c.specialCharges>0 && state.hasteActiveUid!==c.uid && !(state.possession && state.possession.targetUid===c.uid);

  function reachableEnemiesFrom(ability, fromX, fromY){
    const pseudo = {x:fromX, y:fromY, elevated:c.elevated};
    return enemies.filter(e=>canReach(pseudo,e,ability));
  }

  // 0. Dash/move-then-hit specials (Sandslash, Bulldoze) replace both the normal
  // move and attack steps when used, since they already reposition the attacker.
  const usedTileSpecial = specialUsable && special.targetType==='tile'
    ? cpuTryTileSpecial(c, enemies, diff) : false;

  // 1. Movement: of every reachable tile (including staying put), pick the one that
  // sets up the best attack this turn, or otherwise closes the distance.
  if(!usedTileSpecial && !c.movedThisTurn && c.status.legbreak<=0){
    const reach = reachableTiles(c);
    const options = [{x:c.x,y:c.y,elevated:c.elevated}, ...reach];
    let best = options[0], bestScore = -Infinity;
    options.forEach(opt=>{
      const hitsBasic = (!canAttack || basic.passive) ? 0 : (basic.targetType==='none'
        ? (basic.aoeEnemiesRange!==undefined ? enemiesInAoeRange(c, basic, {x:opt.x,y:opt.y,elevated:opt.elevated}).length : 0)
        : basic.targetType==='targetPoint' ? bestTargetPointHitCount(c, basic, {x:opt.x,y:opt.y})
        : (basic.targetType!=='ally' ? reachableEnemiesFrom(basic, opt.x, opt.y).length : 0));
      const hitsSpecial = specialUsable && special.targetType==='enemy' ? reachableEnemiesFrom(special, opt.x, opt.y).length : 0;
      const nearest = enemies.length ? Math.min(...enemies.map(e=>boardPathDistance({x:opt.x, y:opt.y, elevated:opt.elevated, def:c.def}, e.x, e.y))) : 0;
      let score = hitsBasic*10 + hitsSpecial*8 - nearest*0.15;
      if(diff==='hard' && canAttack){
        const finishable = reachableEnemiesFrom(basic, opt.x, opt.y).some(e=>e.hp<=(basic.dmg||0));
        if(finishable) score += 6;
      }
      if(diff==='easy') score += (Math.random()*6-3);
      if(score>bestScore){ bestScore=score; best=opt; }
    });
    if(best.x!==c.x || best.y!==c.y){
      // Reconstructed before c actually moves, same as the human move handler —
      // Huntress's Sense cares about the walk, not just the landing spot.
      const walkPath = reconstructMovePath(best.x, best.y, reach.costMap);
      c.x=best.x; c.y=best.y; c.elevated=best.elevated;
      checkHeartTokenPickup(c);
      checkTrapTrigger(c); checkCropTrigger(c);
      checkTeleportDoorway(c);
      checkSenseReactions(c, walkPath);
      checkTombTrapTriggers(c, walkPath);
      syncPossessedSpecter(c);
    }
    c.movedThisTurn = true;
  }

  // 2. Attack (skipped if a tile special already acted this turn). Paused 2s
  // after the move step above (and 2s before it, in maybeRunCpu) so every CPU
  // action is visibly spaced out rather than resolving all at once.
  // Re-derive `basic` now that movement (if any) is done — moveOrderVariant
  // characters (Scholar) have a different range/dmg once movedThisTurn flips,
  // and the attack phase must use that, not the pre-move value computed above.
  const attackBasic = effectiveBasic(c);
  render();
  setTimeout(()=> cpuTakeTurnAttackPhase(c, diff, enemies, canAttack, attackBasic, special, specialUsable, usedTileSpecial, reachableEnemiesFrom), 1500);
}

// Mercenary's Hire, from the calling ally's side: opportunistic only — the ally's
// own movement (already resolved earlier in cpuTakeTurn, using their real stats)
// doesn't know to aim for Mercenary, so this only fires when they happen to end
// up within his hireRange anyway. Spends the ally's attack action either way.
function cpuTryHireAssist(c, diff){
  if(!c.alive || c.status.confuse>0) return false;
  const helper = findHireHelper(c);
  if(!helper) return false;
  const specialChance = diff==='hard' ? 1 : (diff==='normal' ? 0.6 : 0.2);
  if(Math.random()>=specialChance) return false;
  const hs = helper.def.special;
  helper.specialCharges--;
  const roll = specialAttackRoll(helper.status.blind>0);
  if(roll.result==='miss'){
    log(`<b>${c.def.name}</b> calls on <b>${helper.def.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
    return true;
  }
  log(`<b>${c.def.name}</b> calls on <b>${helper.def.name}</b> &mdash; rolled ${roll.roll}: hit! <b>${helper.def.name}</b> rushes in.`, '');
  const boostedBasic = hs.hireBasic;
  const boostedMove = hs.hireMove || helper.def.move;
  // Reuse reachableTiles' existing c.move-override hook (already checked ahead of
  // c.def.move) rather than duplicating its pathfinding here — set it, read the
  // result, then let clearHireBonus below put it back right away.
  helper.move = boostedMove;
  const options = [{x:helper.x,y:helper.y,elevated:helper.elevated}, ...reachableTiles(helper)];
  const helperEnemies = enemyTeamOf(helper).instances.filter(e=>e.alive);
  let best = options[0], bestScore = -Infinity;
  options.forEach(opt=>{
    const pseudo = {x:opt.x, y:opt.y, elevated:opt.elevated};
    const hits = helperEnemies.filter(e=>canReach(pseudo,e,boostedBasic)).length;
    const nearest = helperEnemies.length ? Math.min(...helperEnemies.map(e=>manhattan(pseudo,e))) : 0;
    const score = hits*10 - nearest*0.15;
    if(score>bestScore){ bestScore=score; best=opt; }
  });
  helper.x = best.x; helper.y = best.y; helper.elevated = best.elevated;
  checkHeartTokenPickup(helper);
  checkTrapTrigger(helper); checkCropTrigger(helper);
  checkTeleportDoorway(helper);
  const targets = helperEnemies.filter(e=>e.alive && canReach(helper,e,boostedBasic));
  if(targets.length){
    const target = targets.slice().sort((a,b)=>a.hp-b.hp)[0];
    const dealt = applyDamage(target, boostedBasic.dmg, helper);
    log(`<b>${helper.def.name}</b> attacks <b>${target.def.name}</b> &mdash; automatically hits: -${dealt} HP.`, '');
  }
  helper.move = undefined;
  return true;
}

function cpuTakeTurnAttackPhase(c, diff, enemies, canAttack, basic, special, specialUsable, usedTileSpecial, reachableEnemiesFrom){
  if(!c || !c.alive || state.phase!=='battle'){ maybeAutoEnd(); endTurnAdvance(); state.cpuThinking = false; render(); return; }
  let acted = usedTileSpecial;
  if(!acted && canAttack && cpuTryHireAssist(c, diff)){ acted = true; }
  if(!acted && canAttack){
    const pickWeakest = (list)=> list.slice().sort((a,b)=> a.hp-b.hp || manhattan(c,a)-manhattan(c,b))[0];
    const specialChance = diff==='hard' ? 1 : (diff==='normal' ? 0.6 : 0.2);

    if(!acted && specialUsable && special.rollsEach && Math.random()<specialChance){
      // Seeker's Dice: the 5-roll sequence needs its own successful roll first
      // (same upfront gate the player faces via rollDiceUpfront) — a miss here
      // still spends the charge but skips the 5 individual rolls entirely.
      const targets = reachableEnemiesFrom(special, c.x, c.y);
      if(targets.length){
        c.specialCharges--;
        const gateRoll = specialAttackRoll(c.status.blind>0);
        if(gateRoll.result==='miss'){
          log(`<b>${c.def.name}</b> tries to use <b>${special.name}</b> &mdash; rolled ${gateRoll.roll}: miss, no effect.`, 'miss');
        } else {
          log(`<b>${c.def.name}</b> uses <b>${special.name}</b> &mdash; rolled ${gateRoll.roll}: hit! Rolls ${special.rollsEach} times.`, '');
          // Each roll re-checks who's still alive and reachable, so a target that
          // died mid-sequence (or moved out of an R1 range that never itself
          // changes) is never picked again.
          let rollsLeft = special.rollsEach;
          while(rollsLeft>0){
            const pool = enemyTeamOf(c).instances.filter(e=>e.alive && canReach(c,e,special));
            if(!pool.length) break;
            const tgt = diff==='easy' ? pool[Math.floor(Math.random()*pool.length)] : pickWeakest(pool);
            resolveDiceRoll(c, tgt);
            rollsLeft--;
          }
        }
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.jumpBetweenHits && Math.random()<specialChance){
      // Shinobi's Aerial: pick a first target normally, then look for whichever
      // open landing tile (within jumpRange) offers the best follow-up hit —
      // same "score every option, keep the best" shape as cpuTryTileSpecial's
      // dashThenTarget scoring, just without needing to actually move there first.
      const targets = reachableEnemiesFrom(special, c.x, c.y);
      if(targets.length){
        const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
        const landingOptions = tileSpecialOptions(c, {moveRange:special.jumpRange, crossWater:special.crossWater});
        let bestLanding = null, bestSecond = null, bestScore = -Infinity;
        landingOptions.forEach(opt=>{
          const pseudo = {x:opt.x, y:opt.y, elevated:isElevatedGround(opt.x,opt.y)};
          const hits = enemyTeamOf(c).instances.filter(e=>e.alive && canReach(pseudo,e,special));
          const second = hits.length ? (diff==='easy' ? hits[Math.floor(Math.random()*hits.length)] : pickWeakest(hits)) : null;
          const score = second ? (100 - second.hp) : (diff==='easy' ? Math.random() : -1);
          if(score>bestScore){ bestScore=score; bestLanding=opt; bestSecond=second; }
        });
        if(bestLanding) state.pendingAerialLanding = {x:bestLanding.x, y:bestLanding.y};
        resolveSpecial(c, bestSecond ? [first, bestSecond] : [first]);
        state.pendingAerialLanding = null;
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.targetType==='enemy' && !special.chargeCombo && !special.rollsEach && !special.jumpBetweenHits
        && special.splitDmg===undefined && !special.thenBonusAttack && !special.placePortals
        && (special.secondRange===undefined || hasValidTwoRangePair(c, special)) && Math.random()<specialChance){
      const targets = reachableEnemiesFrom(special, c.x, c.y);
      if(targets.length){
        const hitsNeeded = special.hits||1;
        let chosen;
        if(special.adjacentPairPick){
          // Chill-style: pick the first target normally (from the ones actually in
          // range), then the second must be adjacent to THAT one specifically —
          // it doesn't have to appear in `targets` at all, since it can be outside
          // the ability's normal range. bothMustBeInRange (Swing) additionally
          // restricts the second pick to only those adjacent candidates that are
          // ALSO within the ability's own range.
          const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          let adjacent = enemyTeamOf(c).instances.filter(e=>e.alive && e.uid!==first.uid && manhattan(e,first)===1);
          if(special.bothMustBeInRange){
            adjacent = adjacent.filter(e=> targets.some(t=>t.uid===e.uid));
          }
          const second = adjacent.length ? (diff==='easy' ? adjacent[Math.floor(Math.random()*adjacent.length)] : pickWeakest(adjacent)) : first;
          chosen = [first, second];
        } else if(special.secondRange!==undefined){
          // Arcane/Holy-style: a valid pair is already guaranteed by the
          // hasValidTwoRangePair check above, so only pick a first target that
          // actually leaves a distinct second one available — these never fire as
          // a partial, first-hit-only attack. secondRangeFromTarget (Paladin's
          // Holy, Runeblade) measures the second range from the first target's own
          // position instead of the attacker's. secondHitOptional (Runeblade) skips
          // the "must leave a second option" requirement on the first pick entirely
          // — any reachable enemy works, and the second hit just doesn't happen if
          // nothing else turns out to be in range from there.
          const eligibleFirsts = special.secondHitOptional ? targets : targets.filter(e1=>
            enemyTeamOf(c).instances.some(e2=>e2.alive && e2.uid!==e1.uid && canReach(special.secondRangeFromTarget?e1:c,e2,{...special, range:special.secondRange})));
          const first = diff==='easy' ? eligibleFirsts[Math.floor(Math.random()*eligibleFirsts.length)] : pickWeakest(eligibleFirsts);
          const secondPool = enemyTeamOf(c).instances.filter(e=>e.alive && e.uid!==first.uid && canReach(special.secondRangeFromTarget?first:c,e,{...special, range:special.secondRange}));
          const second = secondPool.length ? (diff==='easy' ? secondPool[Math.floor(Math.random()*secondPool.length)] : pickWeakest(secondPool)) : null;
          chosen = second ? [first, second] : [first];
        } else if(special.optionalSecondHit){
          // Twofold-style: prefer a finishing blow on one enemy if singleDmg can
          // secure a kill, otherwise spread D(dmg) across two if a second target is
          // available (more total damage), else just hit the one enemy in range.
          const soloDmg = special.singleDmg!==undefined ? special.singleDmg : special.dmg;
          const finishable = targets.find(e=>e.hp<=soloDmg);
          if(finishable){
            chosen = [finishable];
          } else if(targets.length>=2){
            const sorted = targets.slice().sort((a,b)=>a.hp-b.hp);
            const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : sorted[0];
            const secondPool = targets.filter(e=>e.uid!==first.uid);
            const second = diff==='easy' ? secondPool[Math.floor(Math.random()*secondPool.length)] : secondPool[0];
            chosen = [first, second];
          } else {
            chosen = [diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets)];
          }
        } else if(special.secondPickAlly){
          // Scholar's Erudite: the enemy pick (Poison) and the ally pick (Regen)
          // are two different populations, not one shared pool — pick the weakest
          // reachable enemy as usual, then separately look for the most-hurt other
          // living ally, if any exists. Haste on Scholar himself isn't a pick at all.
          const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          const allyPool = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid);
          if(allyPool.length){
            const ally = diff==='easy' ? allyPool[Math.floor(Math.random()*allyPool.length)]
              : allyPool.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0];
            chosen = [first, ally];
          } else {
            chosen = [first];
          }
        } else if(special.distinctTargets){
          // Fencer's Combo: prefer 2 distinct reachable enemies (weakest first,
          // then next-weakest of the rest); only repeats the same one if it's the
          // sole enemy in range.
          const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          const others = targets.filter(e=>e.uid!==first.uid);
          const second = others.length ? (diff==='easy' ? others[Math.floor(Math.random()*others.length)] : pickWeakest(others)) : first;
          chosen = [first, second];
        } else {
          chosen = [];
          for(let i=0;i<hitsNeeded;i++) chosen.push(diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets));
        }
        resolveSpecial(c, hitsNeeded>1 ? chosen : chosen[0]);
        c.actedThisTurn = true; acted = true;
        // Stalker's Swift: if the straight-ahead landing tile was blocked and
        // both side tiles are open, resolveSpecial left the choice pending for
        // a human to click — the CPU just has to actually pick one now.
        if(special.landAfterLast && state.mode==='stalkerLandSelect' && state.pendingStalkerLandOptions.length){
          const p = state.pendingStalkerLandOptions[Math.floor(Math.random()*state.pendingStalkerLandOptions.length)];
          c.x = p.x; c.y = p.y; c.elevated = isElevatedGround(p.x,p.y); c.movedThisTurn = true;
          checkHeartTokenPickup(c);
          checkTrapTrigger(c); checkCropTrigger(c);
          checkTeleportDoorway(c);
          syncPossessedSpecter(c);
          state.pendingStalkerLandOptions = []; state.pendingStalkerLandUid = null;
          state.mode = null;
        }
        // Matey: the special grants an ally an immediate bonus basic attack from
        // wherever they're standing. Pick whichever ally actually has a target.
        if(special.matey && state.mode==='mateySelectAlly'){
          const allyPool = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid);
          let chosenAlly=null, allyTarget=null;
          allyPool.forEach(a=>{
            if(chosenAlly) return;
            const ab = effectiveBasic(a);
            const atType = ab.targetType===undefined ? 'enemy' : ab.targetType;
            let candidates = [];
            if(atType==='enemy') candidates = enemyTeamOf(a).instances.filter(e=>e.alive && canReach(a,e,ab));
            else if(atType==='ally') candidates = teamOf(a).instances.filter(x=>x.alive && x.uid!==a.uid && x.hp<x.maxHp && canReach(a,x,ab));
            if(candidates.length){
              chosenAlly = a;
              allyTarget = diff==='easy' ? candidates[Math.floor(Math.random()*candidates.length)]
                : candidates.slice().sort((p,q)=> atType==='ally' ? (p.hp/p.maxHp - q.hp/q.maxHp) : (p.hp-q.hp))[0];
            }
          });
          if(chosenAlly && allyTarget) doBasicAttack(chosenAlly, allyTarget, true, true); // no second roll here either
          state.mateyAllyUid = null;
          state.mode = null;
        }
        // Darkness: pick a different enemy for the follow-up basic attack the
        // same way any other CPU basic-attack target gets picked.
        if(special.thenBasicAttack && state.mode==='darknessSelectTarget'){
          const ab = effectiveBasic(c);
          const pool = enemyTeamOf(c).instances.filter(e=>e.alive && e.uid!==state.pendingDarknessFirstTargetUid && canReach(c,e,ab));
          if(pool.length){
            const second = diff==='easy' ? pool[Math.floor(Math.random()*pool.length)] : pickWeakest(pool);
            doBasicAttack(c, second, true, true);
          }
          state.pendingDarknessFirstTargetUid = null;
          state.mode = null;
        }
        // Vault: land next to whoever was just hit. Any valid tile works equally
        // well for the CPU (no meaningful strategic difference between them), so
        // it just grabs one.
        if(special.vaultAttack && state.mode==='vaultSelectLanding'){
          const vaultTarget = getByUid(state.vaultTargetUid);
          if(vaultTarget){
            const tiles = vaultLandingTiles(c, vaultTarget);
            if(tiles.length){
              const landing = tiles[Math.floor(Math.random()*tiles.length)];
              c.x = landing.x; c.y = landing.y;
              c.elevated = isElevatedGround(landing.x, landing.y);
              c.movedThisTurn = true;
              checkHeartTokenPickup(c);
              checkTrapTrigger(c); checkCropTrigger(c);
              checkTeleportDoorway(c);
            }
          }
          state.vaultTargetUid = null;
          state.mode = null;
        }
        // Charm: no human to click the controlled attack's target, so the CPU
        // picks one itself (weakest reachable enemy of the charmed unit),
        // resolves it with no extra roll, then lands Thief's own D1 afterward —
        // the same sequencing a human player's click triggers.
        if(special.charmAttack && state.mode==='charmControlSelect'){
          const pc = state.pendingCharm;
          const charmed = pc ? getByUid(pc.targetUid) : null;
          if(charmed && charmed.alive){
            const ability = pc.useSpecial ? charmed.def.special : effectiveBasic(charmed);
            const controlledTargets = charmedOwnTeam(charmed).instances.filter(e=>e.alive && canReach(charmed,e,ability));
            if(controlledTargets.length){
              const pick = diff==='easy' ? controlledTargets[Math.floor(Math.random()*controlledTargets.length)] : pickWeakest(controlledTargets);
              if(pc.useSpecial) resolveSpecial(charmed, pick, true);
              else doBasicAttack(charmed, pick, true, true);
            }
            if(charmed.alive){
              const dealt = applyDamage(charmed, pc.dmg, c);
              log(`&mdash; <b>${c.def.name}</b>'s Charm wears off: <b>${charmed.def.name}</b> -${dealt}.`, '');
            }
          }
          state.pendingCharm = null;
          state.mode = null;
        }
      }
    }
    if(!acted && specialUsable && special.chargeCombo && Math.random()<specialChance){
      if(!c.chargeComboPending){
        // First use: a plain roll, no target, no effect — just banks the result.
        chargeUpFirstAttack(c);
        c.actedThisTurn = true; acted = true;
      } else {
        // Second use: this is the real attack, needs a target like any normal special.
        const targets = reachableEnemiesFrom(special, c.x, c.y);
        if(targets.length){
          const target = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          resolveSpecial(c, target);
          c.actedThisTurn = true; acted = true;
        }
      }
    }
    if(!acted && specialUsable && special.targetType==='none' && !special.chargeCombo && Math.random()<specialChance && cpuNoneSpecialHasValue(c, special, enemies)){
      resolveSpecial(c, null);
      c.actedThisTurn = true; acted = true;
    }
    if(!acted && specialUsable && special.targetType==='targetPoint' && Math.random()<specialChance){
      const point = bestTargetPointFor(c, special, diff);
      if(point){
        resolveSpecial(c, point);
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.targetType==='layTraps' && Math.random()<specialChance){
      // Simple heuristic: prefer tiles near a living enemy (likely to be walked
      // through), falling back to any valid tile within range.
      const needed = special.layTraps || 2;
      const validTiles = [];
      for(let ty=0; ty<BOARD_ROWS; ty++){
        for(let tx=0; tx<BOARD_COLS; tx++){
          if(manhattan(c,{x:tx,y:ty})>special.range) continue;
          if(terrainAt(tx,ty)===2) continue;
          if(isHazardTile(tx,ty)) continue;
          if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
          if(state.traps.some(t=>t.x===tx && t.y===ty)) continue;
          if(state.tombTraps.some(t=>t.x===tx && t.y===ty)) continue;
          if(state.crops.some(t=>t.x===tx && t.y===ty)) continue;
          validTiles.push({x:tx,y:ty});
        }
      }
      if(validTiles.length){
        validTiles.sort((a,b)=>{
          const da = enemies.length ? Math.min(...enemies.map(e=>manhattan(a,e))) : 0;
          const db = enemies.length ? Math.min(...enemies.map(e=>manhattan(b,e))) : 0;
          return da-db;
        });
        const points = validTiles.slice(0, needed);
        if(points.length===needed){
          resolveSpecial(c, points);
          c.actedThisTurn = true; acted = true;
        }
      }
    }
    if(!acted && specialUsable && special.targetType==='ally' && Math.random()<specialChance){
      // Ally-targeted specials (Blacksmith's Temper, Guardian's Aid): pick
      // whichever living ally in range is most hurt — a reasonable default for
      // both a heal/regen-style effect and a permanent buff, with no real
      // downside to using it whenever it's available.
      const allyPool = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && canReach(c,a,special));
      if(allyPool.length){
        const chosen = diff==='easy' ? allyPool[Math.floor(Math.random()*allyPool.length)]
          : allyPool.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0];
        resolveSpecial(c, chosen);
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.targetType==='anyAlign' && special.healFollowup && Math.random()<specialChance){
      // Diviner's Faith: same hybrid shape as Priest's basic on the CPU side —
      // attacking an enemy always chains into a mandatory follow-up heal (self or
      // the most hurt ally in range); with nothing worth attacking, it can still
      // be used purely as a heal.
      const enemyTargets = reachableEnemiesFrom(special, c.x, c.y);
      const hurtAllies = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && a.hp<a.maxHp && canReach(c,a,special));
      const selfHurt = special.selfHeal!==undefined && c.hp<c.maxHp;
      if(enemyTargets.length){
        const enemyTarget = diff==='easy' ? enemyTargets[Math.floor(Math.random()*enemyTargets.length)] : pickWeakest(enemyTargets);
        const healTarget = hurtAllies.length ? hurtAllies.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0] : c;
        resolveSpecial(c, [enemyTarget, healTarget]); // one roll for the whole action
        c.actedThisTurn = true; acted = true;
      } else if(hurtAllies.length){
        resolveSpecial(c, hurtAllies.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0]);
        c.actedThisTurn = true; acted = true;
      } else if(selfHurt){
        resolveSpecial(c, c);
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.splitDmg!==undefined && Math.random()<specialChance){
      // Shaman's Extract: simplest reasonable heuristic — dump every splitDmg
      // point onto the single weakest reachable enemy (concentrating damage
      // for a kill beats spreading it thin), then every splitHeal point onto
      // whoever on the team is most hurt (self included).
      const targets = reachableEnemiesFrom(special, c.x, c.y);
      const dmgTargets = [];
      if(targets.length){
        const weakest = pickWeakest(targets);
        for(let i=0;i<special.splitDmg;i++) dmgTargets.push(weakest);
      }
      const healPool = [c, ...teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && canReach(c,a,special))];
      const mostHurt = healPool.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0] || c;
      const healTargets = [];
      for(let i=0;i<special.splitHeal;i++) healTargets.push(mostHurt);
      resolveSpecial(c, {dmgTargets, healTargets});
      c.actedThisTurn = true; acted = true;
    }
    if(!acted && specialUsable && special.thenBonusAttack && Math.random()<specialChance){
      // Assassin's Quick: land the first hit, then — if it granted the bonus
      // move+act slot (i.e. it actually hit) — use that slot right away, in
      // this same decision tick, rather than waiting for a future turn-tick
      // that will never come (the wrapper below always finalizes the CPU's
      // turn immediately after this block returns).
      const targets = reachableEnemiesFrom(special, c.x, c.y);
      if(targets.length){
        const firstTarget = pickWeakest(targets);
        resolveSpecial(c, firstTarget);
        if(state.quickBonusUid===c.uid && c.alive){
          const bonusBasic = effectiveBasic(c); // now the overridden bonus attack
          const reach = reachableTiles(c);
          const options = [{x:c.x,y:c.y,elevated:c.elevated}, ...reach];
          let best = options[0], bestScore = -Infinity;
          options.forEach(opt=>{
            const hits = reachableEnemiesFrom(bonusBasic, opt.x, opt.y).filter(e=>e.uid!==bonusBasic.excludeUid).length;
            const nearest = enemies.length ? Math.min(...enemies.map(e=>boardPathDistance({x:opt.x, y:opt.y, elevated:opt.elevated, def:c.def}, e.x, e.y))) : 0;
            const score = hits*10 - nearest*0.15;
            if(score>bestScore){ bestScore=score; best=opt; }
          });
          if(best.x!==c.x || best.y!==c.y){
            const walkPath = reconstructMovePath(best.x, best.y, reach.costMap);
            c.x=best.x; c.y=best.y; c.elevated=best.elevated;
            checkHeartTokenPickup(c);
            checkTrapTrigger(c); checkCropTrigger(c);
            checkTeleportDoorway(c);
            checkSenseReactions(c, walkPath);
            checkTombTrapTriggers(c, walkPath);
            syncPossessedSpecter(c);
          }
          c.movedThisTurn = true;
          const secondPool = reachableEnemiesFrom(bonusBasic, c.x, c.y).filter(e=>e.uid!==bonusBasic.excludeUid);
          if(secondPool.length) doBasicAttack(c, pickWeakest(secondPool), true, true);
          clearQuickBonus();
        }
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && specialUsable && special.placePortals && Math.random()<specialChance){
      // Splitter's Portal: pick the weakest reachable enem(y/ies) — 1 on her
      // upgraded 2nd cast, else 2 (same distinct-if-possible fallback as
      // everywhere else) — then drop the resulting portals on random valid
      // open tiles within range. No attempt at smart placement or at actually
      // using the portal network for her own future movement — same accepted
      // scope limit as the Teleport Coin button, which has no CPU logic at all.
      const upgraded = c.specialCharges===1 && (c.portalHits||0)>=1;
      const pool = reachableEnemiesFrom(special, c.x, c.y);
      if(pool.length){
        const first = pickWeakest(pool);
        const targets = upgraded ? [first] : [first, pool.find(e=>e.uid!==first.uid) || first];
        resolveSpecial(c, targets);
        if(state.mode==='portalPlaceSelect' && state.pendingPortalPlace){
          const need = state.pendingPortalPlace.count;
          const openTiles = [];
          for(let ty=0; ty<BOARD_ROWS; ty++){
            for(let tx=0; tx<BOARD_COLS; tx++){
              if(!inRangeWithHeightRule(c,{x:tx,y:ty},special)) continue;
              if(terrainAt(tx,ty)===2) continue;
              if(isHazardTile(tx,ty)) continue;
              if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
              if(state.portals.some(p=>p.x===tx && p.y===ty)) continue;
              openTiles.push({x:tx,y:ty});
            }
          }
          for(let i=0;i<need && openTiles.length;i++){
            const idx = Math.floor(Math.random()*openTiles.length);
            const tile = openTiles.splice(idx,1)[0];
            state.portals.push({x:tile.x, y:tile.y, team:c.team});
          }
          state.pendingPortalPlace = null;
          state.mode = null;
        }
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted && canAttack && basic.targetType==='none' && cpuNoneSpecialHasValue(c, basic, enemies)){
      resolveBasicAoe(c);
      c.actedThisTurn = true; acted = true;
    }
    if(!acted && canAttack && basic.targetType==='targetPoint'){
      const point = bestTargetPointFor(c, basic, diff);
      if(point){
        resolveBasicTargetPoint(c, point);
        c.actedThisTurn = true; acted = true;
      }
    }
    if(!acted){
      if(basic.targetType==='anyAlign' && basic.healFollowup){
        // Hybrid Priest-style basic: attacking an enemy always chains into a mandatory
        // follow-up heal (self or the most hurt ally in range), mirroring the two-step
        // flow a human player walks through. If there's nothing worth attacking, it can
        // still be used purely as a heal.
        const enemyTargets = enemies.filter(e=>canReach(c,e,basic));
        const hurtAllies = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && a.hp<a.maxHp && canReach(c,a,basic));
        const selfHurt = basic.selfHeal!==undefined && c.hp<c.maxHp;
        if(enemyTargets.length){
          const enemyTarget = diff==='easy' ? enemyTargets[Math.floor(Math.random()*enemyTargets.length)] : pickWeakest(enemyTargets);
          const healTarget = hurtAllies.length ? hurtAllies.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0] : c;
          resolvePriestBasicCombo(c, enemyTarget, healTarget); // one roll for the whole action
          c.actedThisTurn = true; acted = true;
        } else if(hurtAllies.length){
          doBasicAttack(c, hurtAllies.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0], true);
          c.actedThisTurn = true; acted = true;
        } else if(selfHurt){
          doBasicAttack(c, c, true);
          c.actedThisTurn = true; acted = true;
        }
      } else if(basic.targetType==='ally' || basic.targetType==='anyAlign'){
        const hurtAllies = teamOf(c).instances.filter(a=>a.alive && a.uid!==c.uid && a.hp<a.maxHp && canReach(c,a,basic));
        const selfHurt = basic.selfHeal!==undefined && c.hp<c.maxHp;
        if(hurtAllies.length){
          const target = hurtAllies.slice().sort((a,b)=>(a.hp/a.maxHp)-(b.hp/b.maxHp))[0];
          doBasicAttack(c, target, true);
          c.actedThisTurn = true; acted = true;
        } else if(selfHurt){
          doBasicAttack(c, c, true);
          c.actedThisTurn = true; acted = true;
        }
      }
      if(!acted && basic.optionalSecondHit){
        // Duke's dual basic: hit two if a valid pair exists (one within closeRange),
        // otherwise just hit whoever's in range. closeRange is Duke-specific — a
        // basic like Guardian's that doesn't define it has no such restriction, so
        // every reachable enemy counts as eligible for the pair.
        const targets = enemies.filter(e=>canReach(c,e,basic));
        if(targets.length){
          const closeOnes = basic.closeRange!==undefined ? targets.filter(e=>manhattan(c,e)<=basic.closeRange) : targets;
          let chosen;
          if(closeOnes.length && targets.length>1){
            const first = diff==='easy' ? closeOnes[Math.floor(Math.random()*closeOnes.length)] : pickWeakest(closeOnes);
            const secondPool = targets.filter(e=>e.uid!==first.uid);
            const second = secondPool.length ? (diff==='easy' ? secondPool[Math.floor(Math.random()*secondPool.length)] : pickWeakest(secondPool)) : null;
            chosen = second ? [first, second] : [first];
          } else {
            chosen = [diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets)];
          }
          doBasicAttack(c, chosen, true);
          c.actedThisTurn = true; acted = true;
        }
      }
      if(!acted && basic.adjacentPairPick){
        // Farmer-style: same idea as Chill/Swing on the special side — pick the
        // first target normally, then the second must be adjacent to THAT one
        // specifically (it doesn't need to be in normal range at all, unless
        // bothMustBeInRange requires it). Falls back to hitting the same
        // target twice if nothing's adjacent to it.
        const targets = enemies.filter(e=>canReach(c,e,basic));
        if(targets.length){
          const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          let adjacent = enemyTeamOf(c).instances.filter(e=>e.alive && e.uid!==first.uid && manhattan(e,first)===1);
          if(basic.bothMustBeInRange){
            adjacent = adjacent.filter(e=> targets.some(t=>t.uid===e.uid));
          }
          const second = adjacent.length ? (diff==='easy' ? adjacent[Math.floor(Math.random()*adjacent.length)] : pickWeakest(adjacent)) : first;
          doBasicAttack(c, [first, second], true);
          c.actedThisTurn = true; acted = true;
        }
      }
      if(!acted && basic.secondRange!==undefined){
        // Runeblade's chained basic: the first hit is guaranteed as long as anyone
        // is in normal range; the second, from that target's own position, is a
        // bonus that just doesn't happen if nothing else is reachable from there.
        const targets = enemies.filter(e=>canReach(c,e,basic));
        if(targets.length){
          const first = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          const secondPool = enemyTeamOf(c).instances.filter(e=>e.alive && e.uid!==first.uid && canReach(basic.secondRangeFromTarget?first:c,e,{...basic, range:basic.secondRange}));
          const second = secondPool.length ? (diff==='easy' ? secondPool[Math.floor(Math.random()*secondPool.length)] : pickWeakest(secondPool)) : null;
          doBasicAttack(c, second ? [first, second] : [first], true);
          c.actedThisTurn = true; acted = true;
        }
      }
      if(!acted && !basic.passive && (basic.targetType==='enemy' || basic.targetType==='anyAlign')){
        const targets = enemies.filter(e=>canReach(c,e,basic));
        if(targets.length){
          const target = diff==='easy' ? targets[Math.floor(Math.random()*targets.length)] : pickWeakest(targets);
          doBasicAttack(c, target, true);
          c.actedThisTurn = true; acted = true;
        }
      }
    }
  }

  // If a human-controlled Mystic just got offered the Invert choice on this
  // attack, hold off ending the CPU's turn — the btnInvertYes/btnInvertNo
  // handlers finish it (actedThisTurn + endTurnAdvance + clearing cpuThinking)
  // once the human decides. cpuThinking stays true in the meantime — on top of
  // the state.mode==='invertPrompt' guard in maybeRunCpu, so a render() during
  // this pause can't accidentally kick off another CPU turn.
  if(state.mode==='invertPrompt'){
    render();
    return;
  }
  maybeAutoEnd();
  endTurnAdvance();
  state.cpuThinking = false;
  render();
}

// Kicks off the CPU's move automatically whenever it becomes team 2's turn in
// vs.-CPU mode. Called at the end of render() so it catches every phase transition.
// cpuThinking guards against scheduling more than one pending action at once.
function maybeRunCpu(){
  if(state.vsMode!=='cpu' || state.cpuThinking || state.gameEnded || state.mode==='invertPrompt') return;
  if(state.phase==='draft' && state.draftTurn===2){
    state.cpuThinking = true;
    setTimeout(()=>{ state.cpuThinking=false; cpuDraftPick(); }, 500);
  } else if(state.phase==='placement' && state.placementTurn===2){
    state.cpuThinking = true;
    setTimeout(()=>{ state.cpuThinking=false; cpuPlaceAll(); }, 500);
  } else if(state.phase==='battle'){
    const c = currentChar();
    // Specter's Possess: while c is living out a hijacked turn, whoever
    // controls Specter is actually deciding this turn — not c's own side.
    const possessingSpecter = (c && state.possession && state.possession.targetUid===c.uid) ? getByUid(state.possession.specterUid) : null;
    const controllingTeam = possessingSpecter ? possessingSpecter.team : c?.team;
    if(c && c.alive && controllingTeam===2 && !state.confirmForfeit && !state.confirmBackToDraft){
      state.cpuThinking = true;
      // Light up the CPU's active character as soon as its turn starts — before the
      // "thinking" delay — so the glow is visible the whole time it's deciding/acting,
      // not just for an instant. Guarded so this doesn't re-render on every poll.
      if(state.cpuActiveUid!==c.uid){
        state.cpuActiveUid = c.uid;
        state.cpuFadeUid = null;
        render();
      }
      setTimeout(()=> cpuTakeTurn(), 1500); // 1.5s pause before the CPU's first action, matching the pacing between its later actions. cpuThinking stays true across this whole turn (including the movement→attack pause inside cpuTakeTurn) — it's only cleared once the turn actually ends, so a mid-turn render() here can't cause this to fire a second time.
    }
  }
}

// Tracks the phase from the PREVIOUS render, purely so render() below can tell
// a genuine screen switch (title -> draft, battle -> gameover, etc.) apart from
// an in-place re-render of the same screen (a click during battle, End Turn,
// and so on). Those two cases want opposite scroll behavior — see render().
let lastRenderedPhase = null;

function render(){
  const app = document.getElementById('app');
  // Mobile-scroll fixes, most noticeable right after End Turn (which disables
  // itself while the CPU's turn runs):
  // 1) Blur a focused button before the rebuild below. On iOS Safari,
  //    replacing/disabling the element you just tapped can make the page
  //    hunt for a new focus target and auto-scroll to it. Blurring first
  //    means there's nothing for it to chase. Scoped to buttons only, so it
  //    never interrupts someone actively typing in a text input elsewhere.
  // 2) Capture scroll position now and restore it after the rebuild — a
  //    direct backstop that keeps the page from shifting regardless of the
  //    underlying browser quirk (this, or scroll anchoring, or anything else).
  //    This restore is only for an in-place re-render of the SAME screen,
  //    though — switching to a genuinely different screen (see phaseChanged
  //    below) should always land at the top instead, not wherever the old
  //    screen happened to be scrolled to.
  // 3) .battle-wrap (the board+sidebar row on the battle/placement screens) is
  //    its OWN horizontally-scrollable container on narrow screens, separate
  //    from the page's scroll — and since it's torn down and rebuilt from
  //    scratch every render, its scrollLeft was resetting to 0 (screen
  //    "jumping back to the left") on every action, End Turn included. The
  //    old node is gone by the time the new one exists, so its position has
  //    to be captured before the rebuild and reapplied to the new node after.
  if(document.activeElement && document.activeElement.tagName==='BUTTON') document.activeElement.blur();
  const scrollX = window.scrollX, scrollY = window.scrollY;
  const oldWrap = app.querySelector('.battle-wrap');
  const wrapScrollLeft = oldWrap ? oldWrap.scrollLeft : null;
  // A genuine screen switch (forward or back) always lands at the top — the
  // one exception is the Puzzle Tactics level-picking screen (puzzlePath),
  // which manages its own scroll position (see renderPuzzlePath) to land on
  // the current/next level instead.
  const phaseChanged = lastRenderedPhase !== state.phase;
  lastRenderedPhase = state.phase;
  if(state.phase==='title'){ renderTitle(app); }
  else if(state.phase==='playerSelect'){ renderPlayerSelect(app); }
  else if(state.phase==='profileDetail'){ renderProfileDetail(app); }
  else if(state.phase==='mapSelect'){ renderMapSelect(app); }
  else if(state.phase==='ruleBook'){ renderRuleBook(app); }
  else if(state.phase==='puzzlePath'){ renderPuzzlePath(app); }
  else if(state.phase==='puzzlePlay'){ renderPuzzlePlay(app); }
  else if(state.phase==='draft'){ renderDraft(app); maybeRunCpu(); }
  else if(state.phase==='placement'){ renderPlacement(app); maybeRunCpu(); }
  else if(state.phase==='battle'){ updateFloatingLabels(); renderBattle(app); maybeRunCpu(); }
  else if(state.phase==='gameover'){ renderGameOver(app); }
  if(phaseChanged && state.phase!=='puzzlePath'){
    window.scrollTo(0, 0);
  } else if(window.scrollX!==scrollX || window.scrollY!==scrollY) window.scrollTo(scrollX, scrollY);
  if(wrapScrollLeft!==null){
    const newWrap = app.querySelector('.battle-wrap');
    if(newWrap) newWrap.scrollLeft = wrapScrollLeft;
  }
  // Mirror the whole state to the room after every render, so nothing that
  // touches state can forget to sync it — see pushOnlineState's own comment.
  if(state.vsMode==='online' && onlineRoomCode) pushOnlineState();
}

// Shared save-slot markup — used by the title screen. Same format/behavior
// as the original mapSelect continue/rename/delete controls; kept in one
// place so it isn't reformatted or duplicated elsewhere.
function renderSaveSlots(){
  if(savedGameCache.some(s=>s===undefined)) checkSavedGames();
  if(!slotNamesLoaded) loadSlotMeta();
  return [0,1].map(i=>{
    const save = savedGameCache[i];
    if(!save){
      return `
      <div class="draft-status" style="margin-top:-6px;">
        <button class="back-btn ui-font" disabled style="font-size:13px; padding:8px 18px; opacity:0.45; cursor:default;">
          ${slotNames[i]} &mdash; Empty
        </button>
      </div>
    `;
    }
    const mapName = MAPS.find(m=>m.id===save.selectedMap)?.name || 'Unknown map';
    if(editingSlotIndex===i){
      return `
      <div class="draft-status" style="margin-top:-6px;">
        <input type="text" class="slotNameInput" data-slot="${i}" value="${slotNames[i].replace(/"/g,'&quot;')}" maxlength="40"
          style="font-size:13px; padding:8px 10px; background:var(--panel-2); border:1px solid var(--gold); color:var(--text); border-radius:2px;">
        <button class="back-btn ui-font slotNameSaveBtn" data-slot="${i}" style="margin-left:8px; border-color:var(--gold); color:var(--gold);">&#10003; Save</button>
        <button class="back-btn ui-font slotNameCancelBtn" style="margin-left:8px;">Cancel</button>
      </div>
    `;
    }
    return `
      <div class="draft-status" style="margin-top:-6px;">
        <button class="back-btn ui-font continueSavedBtn" data-slot="${i}" style="font-size:13px; padding:8px 18px; border-color:var(--gold); color:var(--gold);">
          &#9654; Continue ${slotNames[i]} &mdash; ${mapName}${slotDates[i]? ` &mdash; started ${formatSlotDate(slotDates[i])}` : ''}
        </button>
        <button class="back-btn ui-font renameSavedBtn" data-slot="${i}" title="Rename slot" style="margin-left:8px; padding:8px 10px;">&#9998;</button>
        <button class="back-btn ui-font deleteSavedBtn" data-slot="${i}" style="margin-left:8px;">Delete</button>
      </div>
    `;
  }).join('');
}

// Wires up the continue/rename/delete controls rendered by renderSaveSlots().
function attachSaveSlotHandlers(app){
  app.querySelectorAll('.continueSavedBtn').forEach(el=>{
    el.onclick = ()=> loadSavedGame(Number(el.dataset.slot));
  });
  app.querySelectorAll('.renameSavedBtn').forEach(el=>{
    el.onclick = ()=>{ editingSlotIndex = Number(el.dataset.slot); render(); };
  });
  app.querySelectorAll('.slotNameInput').forEach(el=>{
    el.onkeydown = (evt)=>{
      if(evt.key==='Enter') saveSlotNameEdit(Number(el.dataset.slot), el.value);
      if(evt.key==='Escape'){ editingSlotIndex = null; render(); }
    };
  });
  app.querySelectorAll('.slotNameSaveBtn').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.slot);
      const input = app.querySelector(`.slotNameInput[data-slot="${i}"]`);
      saveSlotNameEdit(i, input ? input.value : '');
    };
  });
  app.querySelectorAll('.slotNameCancelBtn').forEach(el=>{
    el.onclick = ()=>{ editingSlotIndex = null; render(); };
  });
  app.querySelectorAll('.deleteSavedBtn').forEach(el=>{
    el.onclick = ()=> deleteSavedGame(Number(el.dataset.slot));
  });
}

// Editable player-name slots shown at the bottom of the title screen — only
// activated profiles (renamed away from their "Profile N" placeholder) are shown,
// plus an "Add new" button for any remaining open slot. Clicking a name opens its
// detail page; the pencil renames it (who plays as P1/P2 is chosen on the
// player-select screen instead).
function renderProfileSlots(){
  if(!profileNamesLoaded) loadProfileMeta();
  // The crown badge above each profile's name needs all three of these loaded —
  // without this, it renders as 0 until the player happens to visit a profile's
  // detail page (which triggers these same loads) and comes back.
  if(!profileWinLogsLoaded) loadProfileWinLogs();
  if(!mapPvpWinLogLoaded) loadMapPvpWinLog();
  if(!deletedOpponentWinsLoaded) loadDeletedOpponentWins();
  if(!puzzleProgressLoaded) loadPuzzleProgress();
  const activeIndices = profileIndices().filter(i=>isProfileActive(i));
  const nextOpenIndex = profileIndices().find(i=>!isProfileActive(i));
  return `
    <div style="margin-top:32px; width:100%; display:flex; align-items:center; justify-content:center; gap:12px; max-width:760px; margin-left:auto; margin-right:auto;">
      <div style="flex:1; height:1px; background:linear-gradient(to right, transparent, var(--gold));"></div>
      <span style="color:var(--gold); font-size:15px; line-height:1;">&#10022;</span>
      <div style="flex:1; height:1px; background:linear-gradient(to left, transparent, var(--gold));"></div>
    </div>
    <div class="ui-font" style="margin-top:32px; font-size:12px; color:var(--text-dim); text-align:center;">Profiles</div>
    <div class="draft-random-actions" style="margin-top:8px; flex-wrap:wrap; align-items:flex-end;">
      ${activeIndices.map(i=>{
        if(editingProfileIndex===i){
          return `
            <span style="display:inline-flex; align-items:center; gap:4px;">
              <input type="text" class="profileNameInput" data-slot="${i}" value="${profileNames[i].replace(/"/g,'&quot;')}" maxlength="40"
                style="font-size:13px; padding:8px 10px; background:var(--panel-2); border:1px solid var(--gold); color:var(--text); border-radius:2px; width:120px;">
              <button class="back-btn ui-font profileNameSaveBtn" data-slot="${i}" style="border-color:var(--gold); color:var(--gold); padding:8px 10px;">&#10003;</button>
              <button class="back-btn ui-font profileNameCancelBtn" style="padding:8px 10px;">&#10005;</button>
            </span>
          `;
        }
        return `
          <span style="display:inline-flex; align-items:flex-end; gap:4px;">
            <span style="position:relative; padding-top:24px; display:inline-flex;">
              <span style="position:absolute; top:0; left:0; right:0; display:flex; align-items:center; justify-content:center; gap:4px; font-size:15px; font-weight:700; color:var(--gold);">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="var(--gold)"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>
                ${crownCountForProfile(i)}
              </span>
              <button class="back-btn ui-font openProfileBtn" data-slot="${i}" style="font-size:13px; padding:8px 16px;">${profileNames[i]}</button>
            </span>
            <button class="back-btn ui-font editProfileBtn" data-slot="${i}" title="Rename profile" style="padding:8px 10px;">&#9998;</button>
          </span>
        `;
      }).join('')}
      ${editingProfileIndex!==null && editingProfileIndex!==undefined && !isProfileActive(editingProfileIndex) ? `
        <span style="display:inline-flex; align-items:center; gap:4px;">
          <input type="text" class="profileNameInput" data-slot="${editingProfileIndex}" value="" placeholder="Name" maxlength="40"
            style="font-size:13px; padding:8px 10px; background:var(--panel-2); border:1px solid var(--gold); color:var(--text); border-radius:2px; width:120px;">
          <button class="back-btn ui-font profileNameSaveBtn" data-slot="${editingProfileIndex}" style="border-color:var(--gold); color:var(--gold); padding:8px 10px;">&#10003;</button>
          <button class="back-btn ui-font profileNameCancelBtn" style="padding:8px 10px;">&#10005;</button>
        </span>
      ` : (nextOpenIndex!==undefined ? `
        <button id="addProfileBtn" class="back-btn ui-font" style="font-size:13px; padding:8px 16px;">+ Add new</button>
      ` : '')}
    </div>
  `;
}

function attachProfileHandlers(app){
  app.querySelectorAll('.openProfileBtn').forEach(el=>{
    el.onclick = ()=>{
      state.viewingProfileIndex = Number(el.dataset.slot);
      confirmingDeleteProfileIndex = null;
      state.phase = 'profileDetail';
      render();
    };
  });
  app.querySelectorAll('.editProfileBtn').forEach(el=>{
    el.onclick = ()=>{ editingProfileIndex = Number(el.dataset.slot); render(); };
  });
  document.getElementById('addProfileBtn')?.addEventListener('click', ()=>{
    const nextOpenIndex = profileIndices().find(i=>!isProfileActive(i));
    if(nextOpenIndex!==undefined){ editingProfileIndex = nextOpenIndex; render(); }
  });
  app.querySelectorAll('.profileNameInput').forEach(el=>{
    el.onkeydown = (evt)=>{
      if(evt.key==='Enter') saveProfileNameEdit(Number(el.dataset.slot), el.value);
      if(evt.key==='Escape'){ editingProfileIndex = null; render(); }
    };
  });
  app.querySelectorAll('.profileNameSaveBtn').forEach(el=>{
    el.onclick = ()=>{
      const i = Number(el.dataset.slot);
      const input = app.querySelector(`.profileNameInput[data-slot="${i}"]`);
      saveProfileNameEdit(i, input ? input.value : '');
    };
  });
  app.querySelectorAll('.profileNameCancelBtn').forEach(el=>{
    el.onclick = ()=>{ editingProfileIndex = null; render(); };
  });
}

// Profile detail page — opened by clicking a profile name on the title screen.
// Shows the running vs.-CPU win log (by map, by difficulty) and a head-to-head
// record against the other profiles/Guest (by map). Built as its own page/section
// list so more stats can be dropped in alongside it later.
function renderProfileDetail(app){
  if(!profileWinLogsLoaded) loadProfileWinLogs();
  if(!mapPvpWinLogLoaded) loadMapPvpWinLog();
  if(!deletedOpponentWinsLoaded) loadDeletedOpponentWins();
  if(!puzzleProgressLoaded) loadPuzzleProgress();
  const i = state.viewingProfileIndex;
  const name = (i!==null && i!==undefined) ? profileNames[i] : '';
  const log = (i!==null && i!==undefined) ? (profileWinLogs[i] || {}) : {};
  const total = (i!==null && i!==undefined) ? totalProfileWins(i) : 0;
  const crownsCell = (w) => `<td style="padding:6px 4px; text-align:center; white-space:nowrap;">
    ${MAP_CPU_CROWN_THRESHOLDS.map((threshold, idx)=>{
      const earned = idx < mapCpuCrownsEarned(w);
      return `<svg width="16" height="16" viewBox="0 0 24 24" fill="${earned?'var(--gold)':'var(--text-dim)'}" style="opacity:${earned?1:0.45}; margin:0 1px; vertical-align:middle;"><title>${threshold} win${threshold>1?'s':''} on Easy, Normal, and Hard</title><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>`;
    }).join('')}
  </td>`;
  const rows = MAPS.map(m=>{
    const w = log[m.id] || {easy:0, normal:0, hard:0};
    return `
      <tr>
        <td style="padding:6px 10px; text-align:left;">${m.name}</td>
        <td style="padding:6px 10px; text-align:center;">${w.easy||0}</td>
        <td style="padding:6px 10px; text-align:center;">${w.normal||0}</td>
        <td style="padding:6px 10px; text-align:center;">${w.hard||0}</td>
        ${crownsCell(w)}
      </tr>
    `;
  }).join('');
  const selfKey = profileKeyFor(i);
  const opponents = profileIndices().filter(idx=>idx!==i && isProfileActive(idx)).map(idx=>({key:String(idx), label:profileNames[idx]}))
    .concat([{key:'guest', label:'Guest'}]);
  const h2hRows = MAPS.map(m=>{
    const cells = opponents.map(opp=>{
      const wins = (mapPvpWinLog[m.id] && mapPvpWinLog[m.id][selfKey] && mapPvpWinLog[m.id][selfKey][opp.key]) || 0;
      const losses = (mapPvpWinLog[m.id] && mapPvpWinLog[m.id][opp.key] && mapPvpWinLog[m.id][opp.key][selfKey]) || 0;
      return `<td style="padding:6px 10px; text-align:center;">${wins}-${losses}</td>`;
    }).join('');
    return `
      <tr>
        <td style="padding:6px 10px; text-align:left;">${m.name}</td>
        ${cells}
      </tr>
    `;
  }).join('');
  app.innerHTML = `
    <div style="max-width:520px; margin:0 auto; padding:24px 16px;">
      <button id="backToTitleFromProfileBtn" class="back-btn ui-font" style="margin-bottom:16px;">&larr; Back to main menu</button>
      <div class="draft-status" style="text-align:left;">
        <!-- Puzzle Tactics sits beside the profile name: the mode belongs to this
             profile, and the crown count next to it is that profile's Puzzle
             Tactics haul, which also feeds crownCountForProfile(). -->
        <div class="pt-entry">
          <span class="turn-badge p1">${name}</span>
          ${(i!==null && i!==undefined) ? `
            <button id="profilePuzzleTacticsBtn" class="back-btn ui-font pt-entry-btn">
              <span>Puzzle Tactics</span>
              <span class="pt-sub">${puzzleSolvedCountFor(String(i))} of ${PUZZLE_TACTICS.length} solved</span>
            </button>
            <span class="pt-entry-crowns ${puzzleCrownsEarned(i) ? '' : 'none'}" title="Crowns earned from Puzzle Tactics">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>
              ${puzzleCrownsEarned(i)}
            </span>` : ''}
        </div>
      </div>
      <div style="display:flex; align-items:center; justify-content:flex-start; margin:24px 0 8px; gap:14px; flex-wrap:wrap;">
        <h3 class="ui-font" style="margin:0; font-size:18px; color:var(--text-dim); font-weight:700;">Total wins &mdash; ${total} total</h3>
        <!-- Total-wins achievement crowns — one per threshold in
             TOTAL_WINS_CROWN_THRESHOLDS. Earned crowns render solid gold; the rest
             stay grayed out. -->
        <div style="display:flex; gap:6px; flex-shrink:0;">
          ${TOTAL_WINS_CROWN_THRESHOLDS.map((threshold, idx)=>{
            const earned = (i!==null && i!==undefined) && idx < totalWinsCrownsEarned(i);
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${earned?'var(--gold)':'var(--text-dim)'}" style="opacity:${earned?1:0.45};"><title>${threshold} wins</title><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>`;
          }).join('')}
        </div>
      </div>
      <h3 class="ui-font" style="margin:24px 0 8px; font-size:14px; color:var(--text-dim); font-weight:700;">Player vs. CPU <span style="color:var(--text-dim); font-weight:400;">&mdash; ${(i!==null && i!==undefined) ? cpuWinsForProfile(i) : 0} wins</span></h3>
      <table class="ui-font" style="width:100%; border-collapse:collapse; font-size:13px;">
        <thead>
          <tr style="border-bottom:1px solid var(--line);">
            <th style="padding:6px 10px; text-align:left; color:var(--text-dim); font-weight:700;">Stage</th>
            <th style="padding:6px 10px; text-align:center; color:var(--text-dim); font-weight:700;">Easy</th>
            <th style="padding:6px 10px; text-align:center; color:var(--text-dim); font-weight:700;">Normal</th>
            <th style="padding:6px 10px; text-align:center; color:var(--text-dim); font-weight:700;">Hard</th>
            <th style="padding:6px 4px; text-align:center; color:var(--text-dim); font-weight:700;"></th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
      <div style="display:flex; align-items:center; justify-content:flex-start; margin:24px 0 8px; gap:14px; flex-wrap:wrap;">
        <h3 class="ui-font" style="margin:0; font-size:14px; color:var(--text-dim); font-weight:700;">Player vs. Player <span style="color:var(--text-dim); font-weight:400;">&mdash; ${(i!==null && i!==undefined) ? pvpWinsForProfile(i) : 0} wins</span></h3>
        <!-- Player-vs-Player achievement crowns — one per threshold in
             PVP_CROWN_THRESHOLDS. Earned crowns render solid gold; the rest stay
             grayed out. -->
        <div style="display:flex; gap:6px; flex-shrink:0;">
          ${PVP_CROWN_THRESHOLDS.map((threshold, idx)=>{
            const earned = (i!==null && i!==undefined) && idx < pvpCrownsEarned(i);
            return `<svg width="20" height="20" viewBox="0 0 24 24" fill="${earned?'var(--gold)':'var(--text-dim)'}" style="opacity:${earned?1:0.45};"><title>${threshold} PvP win${threshold>1?'s':''}</title><path d="M3 8l4 3 5-6 5 6 4-3-2 10H5L3 8z"/><rect x="5" y="19" width="14" height="2"/></svg>`;
          }).join('')}
        </div>
      </div>

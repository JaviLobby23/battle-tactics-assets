function resolveBasicTargetPoint(attacker, point, forceAutoHit){ resolveTargetPointAttack(attacker, effectiveBasic(attacker), point, true, forceAutoHit); }

// Returns the ability object to use for `c`'s basic attack right now — normally
// the character's default def.basic, but permanently swapped out by abilities
// like Outlaw's Lock-On once they succeed (stored per-instance so the shared
// ROSTER definition object is never mutated). moveOrderVariant (Scholar): the
// basic's range/dmg/exactRange differ depending on whether this character has
// already moved this turn or not — re-evaluated live, so the displayed label and
// actual targeting both update the instant the player moves (or doesn't).
function effectiveBasic(c){
  // Specter's Possess: the hijacked turn's basic is a plain single-target D2
  // hit at the host's own normal range — deliberately stripped of whatever
  // special mechanics (AOE, line, pickUpAndMove, etc.) the host's real basic
  // has, so the forced turn stays simple and predictable no matter who's
  // possessed.
  if(state.possession && state.possession.targetUid===c.uid){
    const ownRange = (c.basicOverride || c.def.basic).range || 1;
    return { range: ownRange, dmg: 2, targetType: 'enemy' };
  }
  const base = c.basicOverride || c.def.basic;
  if(base.moveOrderVariant){
    const variant = c.movedThisTurn ? base.moveOrderVariant.moved : base.moveOrderVariant.notMoved;
    return { ...base, exactRange:undefined, ...variant };
  }
  return base;
}

// Duke's dual basic attack: one shared roll, then D2 to each of 1 or 2 chosen
// enemies (the UI/CPU logic already guarantee any pair passed in is valid — see
// the optionalSecondHit targeting code and resolveDualBasicAttack's callers).
// Note: unlike the single-target path in doBasicAttack, this does NOT check for
// a Mystic's Invert — same precedent as Outlaw/Cannoneer's target-point basics,
// which also bypass that reactive check.
function resolveDualBasicAttack(attacker, targets, forceAutoHit){
  const b = effectiveBasic(attacker);
  const isBlind = attacker.status.blind>0;
  const roll = forceAutoHit ? {result:'hit', roll:null} : (isBlind ? blindRoll() : basicAttackRoll());
  const live = targets.filter(t=>t && t.alive);
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return true;
  }
  const isCrit = roll.result==='crit';
  // A solo hit (e.g. Guardian choosing 1 enemy instead of 2) uses singleDmg when
  // the basic defines one — otherwise it'd silently fall back to the same lower
  // per-target dmg used for a 2-enemy split, which is wrong whenever those two
  // numbers actually differ (Duke's basic deals the same either way, which is
  // why this was never noticed there).
  const solo = targets.length===1;
  const dmgEach = solo ? (b.singleDmg!==undefined ? b.singleDmg : b.dmg) : b.dmg;
  const dealtList = live.map(t=>{
    const dealt = applyDamage(t, dmgEach, attacker);
    if(isCrit && t.specialCharges>0) t.specialCharges--;
    return dealt;
  });
  const desc = live.map((t,i)=>`<b>${t.def.name}</b> -${dealtList[i]}`).join(' and ');
  const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}${isCrit?' CRITICAL':''}`;
  log(`<b>${attacker.def.name}</b> attacks ${desc} &mdash; ${rollNote}${isCrit?' (special charge lost per hit)':''}`, isCrit?'crit':'');
  return true;
}

// Runeblade's chained basic: R1, D2, then (if a different enemy is reachable from
// wherever the first target ends up standing) R3 from there, D2 more. One shared
// roll covers both hits; unlike resolveDualBasicAttack, only the first target is
// guaranteed — the second is opportunistic and simply doesn't happen if nothing
// else is in range from the first target's position (see the targeting UI/CPU
// logic, which both already only ever pass in a second target when one is
// genuinely reachable). Like resolveDualBasicAttack, this does NOT check for a
// Mystic's Invert.
function resolveTwoRangeComboBasicAttack(attacker, targets, forceAutoHit){
  const b = effectiveBasic(attacker);
  const isBlind = attacker.status.blind>0;
  const roll = forceAutoHit ? {result:'hit', roll:null} : (isBlind ? blindRoll() : basicAttackRoll());
  const first = targets[0], second = targets[1];
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return true;
  }
  const isCrit = roll.result==='crit';
  let firstDealt = 0, secondDealt = 0;
  if(first && first.alive){
    firstDealt = applyDamage(first, b.dmg, attacker);
    if(isCrit && first.specialCharges>0) first.specialCharges--;
  }
  const gotSecond = second && first && second.uid!==first.uid && second.alive;
  if(gotSecond){
    secondDealt = applyDamage(second, b.dmg2!==undefined ? b.dmg2 : b.dmg, attacker);
    if(isCrit && second.specialCharges>0) second.specialCharges--;
  }
  const desc = gotSecond
    ? `<b>${first.def.name}</b> -${firstDealt} and <b>${second.def.name}</b> -${secondDealt}`
    : `<b>${first ? first.def.name : '?'}</b> -${firstDealt} &mdash; no second enemy in range`;
  const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}${isCrit?' CRITICAL':''}`;
  log(`<b>${attacker.def.name}</b> attacks ${desc} &mdash; ${rollNote}${isCrit?' (special charge lost per hit)':''}`, isCrit?'crit':'');
  return true;
}

function doBasicAttack(attacker, target, isCpu, forceAutoHit){
  const b = effectiveBasic(attacker);
  // An attack attempt is irreversible the moment it's made — win, lose, or
  // draw the roll. Locking this here, before the roll even happens, means a
  // miss locks Undo Move exactly the same as a hit; nothing below needs to
  // remember to set it on every branch/return path.
  attacker.actedThisTurn = true;
  // Haste's bonus turn (see startHasteBonusTurn): the basic auto-hits at a fixed
  // Dmg 2 (or Dmg 1 if the character's own basic already deals only 1) — no roll,
  // since this rides on the already-successful cast that granted Haste.
  const hasted = state.hasteActiveUid===attacker.uid;
  const autoHit = forceAutoHit || hasted;
  if(b.lineAttack){ resolveLineBasicAttack(attacker, target, autoHit); return true; }
  if(b.targetType==='targetPoint'){ resolveBasicTargetPoint(attacker, target, autoHit); return true; }
  if(b.optionalSecondHit || b.adjacentPairPick){ return resolveDualBasicAttack(attacker, Array.isArray(target) ? target : [target], autoHit); }
  if(b.twoRangeCombo){ return resolveTwoRangeComboBasicAttack(attacker, Array.isArray(target) ? target : [target], autoHit); }
  const isSelfHeal = b.selfHeal!==undefined && target.uid===attacker.uid;
  // During Thief's Charm bonus segment (or Specter's Possess, same shape), the
  // controlled unit's valid targets are its own real teammates — same actual
  // .team value as the attacker, but the whole point is turning them against
  // that side. A plain team-equality check would misread that as friendly
  // fire and route it into heal logic instead of an attack, so it's
  // suppressed here for both mechanics.
  const isPossessedTurn = state.possession && state.possession.targetUid===attacker.uid;
  const isSameTeam = state.charmBonusUid!==attacker.uid && !isPossessedTurn && target.team===attacker.team;
  const isBlind = attacker.status.blind>0;
  // "Attacks" only makes sense against an enemy — a self/ally heal should read as
  // a heal, not as attacking your own teammate.
  const actionPhrase = isSelfHeal ? 'heals themself' : (isSameTeam ? `heals <b>${target.def.name}</b>` : `attacks <b>${target.def.name}</b>`);
  // forceAutoHit is for Admiral's Matey specifically: the one Matey roll already
  // succeeded (this only runs after that), so the ally's basic attack it grants
  // doesn't get an independent roll of its own — it just lands, same as any other
  // permanently-autoHit ability, but scoped to just this one call.
  const roll = (b.autoHit || autoHit) ? {result:'hit', roll:null} : (isBlind ? blindRoll() : basicAttackRoll(target.status.sleep>0));
  // Hybrid basics (e.g. Priest's R4: D1 to an enemy, or Heal 2 to self/an ally) only
  // apply the half that matches who's actually being targeted — an ally never takes
  // damage from this, and an enemy never gets healed by it.
  const dmg = (isSelfHeal || isSameTeam) ? 0 : (hasted ? (b.dmg===1?1:2) : b.dmg + (attacker.basicBonus||0));
  const healAmt = isSelfHeal ? b.selfHeal : (isSameTeam ? b.heal : 0);
  if(roll.result==='miss-counter'){
    if(!isSameTeam && canReach(attacker,target,effectiveBasic(target))){
      const recoil = applyDamage(attacker, 1, target);
      log(`<b>${attacker.def.name}</b> ${actionPhrase} &mdash; rolled 1: miss! <b>${target.def.name}</b> counters for ${recoil} recoil dmg.`, 'miss');
    } else {
      log(`<b>${attacker.def.name}</b> ${actionPhrase} &mdash; rolled 1: miss!${!isSameTeam ? ` (out of <b>${target.def.name}</b>'s range, no counter)` : ''}`, 'miss');
    }
    return true;
  } else if(roll.result==='miss'){
    log(`<b>${attacker.def.name}</b> ${actionPhrase} &mdash; rolled ${roll.roll}: miss.`, 'miss');
    return true;
  }
  // A real hit against an enemy — see if a Mystic is standing by to Invert it.
  if(dmg>0){
    const mystic = findInvertProtector(target, attacker);
    if(mystic){
      const pending = { mysticUid:mystic.uid, attackerUid:attacker.uid, targetUid:target.uid, dmg, healAmt, isSelfHeal, isSameTeam, actionPhrase, isCrit: roll.result==='crit', rollRoll: roll.roll, isCpu: !!isCpu };
      // The choice always belongs to whoever controls the Mystic. In PvP both
      // sides are human, so it's always a prompt. In vs-CPU mode, if the CPU
      // owns this Mystic it decides for itself (no one to ask); otherwise it's
      // the human's Mystic, so we pause — cpuTakeTurn() checks state.mode right
      // after acting and holds off ending its turn until this is resolved.
      const cpuOwnsMystic = state.vsMode==='cpu' && mystic.team===2;
      if(cpuOwnsMystic){
        return resolveInvertDecision(mystic, pending, true); // CPU always attempts Invert when it can
      }
      state.pendingInvert = pending;
      state.mode = 'invertPrompt';
      return false;
    }
  }
  return finishBasicHit(attacker, target, roll, dmg, healAmt, isSelfHeal, isSameTeam, actionPhrase, isCpu);
}

// Looks for whoever should get offered the chance to react to this hit landing —
// either a living teammate of `target` (Mystic's Invert: protects an ally within
// its own range of them) or `target` itself (Squire's Impede, protectsSelf:true:
// protects only itself, and only if the attacker is standing within its range).
// Either way the protector needs an unspent reactive special. Only fires for a
// genuine attack on an enemy (never on a heal/self-heal).
function findInvertProtector(target, attacker){
  const isPossessedTurn = state.possession && state.possession.targetUid===attacker.uid;
  if(state.charmBonusUid!==attacker.uid && !isPossessedTurn && target.team===attacker.team) return null;
  const team = teamOf(target);
  return team.instances.find(m=>{
    if(!m.alive || !m.def.special || !m.def.special.reactiveOnly || m.specialCharges<=0) return false;
    if(m.def.special.protectsSelf){
      return m.uid===target.uid && manhattan(attacker, target) <= (m.def.special.range||0);
    }
    return m.uid!==target.uid && manhattan(m, target) <= (m.def.special.range||0);
  }) || null;
}

// Resolves a pending Invert/Impede-style choice. useInvert=false (declined, or no
// longer valid) just lets the original attack land as normal. useInvert=true spends
// the charge and rolls: on success the original attack is fully negated and the
// attacker takes recoil dmg instead; on failure the original attack proceeds untouched.
function resolveInvertDecision(mystic, pending, useInvert){
  const attacker = getByUid(pending.attackerUid);
  const target = getByUid(pending.targetUid);
  const roll = {result: pending.isCrit ? 'crit' : 'hit', roll: pending.rollRoll};
  if(!useInvert || !mystic.alive || mystic.specialCharges<=0){
    return finishBasicHit(attacker, target, roll, pending.dmg, pending.healAmt, pending.isSelfHeal, pending.isSameTeam, pending.actionPhrase, pending.isCpu);
  }
  mystic.specialCharges--;
  const defRoll = specialAttackRoll(mystic.status.blind>0);
  const isSelfProtect = mystic.def.special.protectsSelf;
  if(defRoll.result==='hit'){
    const recoil = applyDamage(attacker, mystic.def.special.dmg||3, mystic);
    if(isSelfProtect){
      log(`<b>${mystic.def.name}</b> uses <b>${mystic.def.special.name}</b> &mdash; rolled ${defRoll.roll}: avoids the damage and strikes back! <b>${attacker.def.name}</b> takes ${recoil} recoil dmg.`, 'crit');
    } else {
      log(`<b>${mystic.def.name}</b> Inverts &mdash; rolled ${defRoll.roll}: <b>${target.def.name}</b>'s attack is reversed! <b>${attacker.def.name}</b> takes ${recoil} recoil dmg.`, 'crit');
    }
    return true;
  }
  if(isSelfProtect){
    log(`<b>${mystic.def.name}</b> tries to use <b>${mystic.def.special.name}</b> &mdash; rolled ${defRoll.roll}: fails, the attack lands as normal.`, 'miss');
  } else {
    log(`<b>${mystic.def.name}</b> tries to Invert &mdash; rolled ${defRoll.roll}: fails, the attack lands as normal.`, 'miss');
  }
  return finishBasicHit(attacker, target, roll, pending.dmg, pending.healAmt, pending.isSelfHeal, pending.isSameTeam, pending.actionPhrase, pending.isCpu);
}

// Applies a basic attack's actual effects (damage/status/heal/pushback/pickup) once
// it's been decided the attack lands unopposed — either because no Invert applied,
// or because it was offered and declined/failed. Returns false only while a further
// interactive step (relocate destination pick) is still pending.
function finishBasicHit(attacker, target, roll, dmg, healAmt, isSelfHeal, isSameTeam, actionPhrase, isCpu){
  const b = effectiveBasic(attacker);
  const isCrit = roll.result==='crit';
  let awaitingFollowup = false;
  let dealt = 0;
  if(dmg) dealt = applyDamage(target, dmg, attacker);
  if(b.applyStatus && dmg) applyStatus(target, b.applyStatus, b.statusDur||1);
  if(healAmt){ target.hp = Math.min(target.maxHp, target.hp + healAmt); }
  if(isCrit && target.specialCharges>0){ target.specialCharges--; }
  let pushed = 0, confused = false, fell = false;
  if(b.pushBack && dmg && target.alive){
    const result = pushBackTarget(attacker, target, b.pushBack);
    pushed = result.moved;
    if(result.collision==='obstruction'){
      applyStatus(target, 'confuse', 1);
      confused = true;
    } else if(result.collision==='fall'){
      fell = true;
    }
  }
  let relocated = false;
  if(b.pickUpAndMove && dmg && target.alive){
    // Machinist's version moves the target within the same range as the hit
    // itself; Undertaker's throw uses a separate, usually longer, throwRange
    // instead — falls back to the attack's own range when unset.
    const moveRange = b.throwRange!==undefined ? b.throwRange : b.range;
    if(isCpu){
      const dest = pickBestRelocateDest(attacker, target, moveRange);
      if(dest){
        target.x = dest.x; target.y = dest.y; target.elevated = isElevatedGround(dest.x, dest.y);
        checkHeartTokenPickup(target);
        checkTrapTrigger(target); checkCropTrigger(target);
        checkTeleportDoorway(target);
        syncPossessedSpecter(target);
        relocated = true;
      }
    } else {
      // Interactive: the destination pick is a separate click, so the turn
      // doesn't finalize until that happens — see the caller's use of this
      // function's return value.
      state.pendingRelocateUid = target.uid;
      state.pendingRelocateOrigin = {x:attacker.x, y:attacker.y};
      state.pendingRelocateRange = moveRange;
      state.pendingRelocateAttackerUid = attacker.uid;
      state.pendingRelocateDropAoe = null; // no basic currently has a drop-site AOE
      state.mode = 'basicRelocateSelect';
      awaitingFollowup = true;
    }
  }
  let vaulted = false;
  if(b.vaultAttack && dmg){
    // Rogue's basic: unlike pickUpAndMove, it's the ATTACKER who moves here —
    // jumping in for the hit, then landing on an open tile next to the target,
    // same mechanic as Lancer's Vault special (see vaultLandingTiles). Either
    // way this counts as the turn's move, same principle as Possess. Doesn't
    // require target.alive — same as the special-side vaultAttack handling
    // below (resolveSpecial's plain single-target path) — a lethal hit still
    // lands Rogue on an open tile next to where the target fell; target.x/y
    // stay valid (and vaultLandingTiles only reads position) even once dead.
    attacker.movedThisTurn = true;
    if(isCpu){
      const landingTiles = vaultLandingTiles(attacker, target);
      if(landingTiles.length){
        const dest = landingTiles[Math.floor(Math.random()*landingTiles.length)];
        attacker.x = dest.x; attacker.y = dest.y; attacker.elevated = isElevatedGround(dest.x, dest.y);
        checkHeartTokenPickup(attacker);
        checkTrapTrigger(attacker); checkCropTrigger(attacker);
        checkTeleportDoorway(attacker);
        vaulted = true;
      }
    } else {
      const landingTiles = vaultLandingTiles(attacker, target);
      if(landingTiles.length){
        state.mode = 'vaultSelectLanding';
        state.vaultTargetUid = target.uid;
        awaitingFollowup = true;
      }
    }
  }
  // selfHealOnHit (Shaman's basic): a flat lifesteal heal to the ATTACKER, not the
  // target — distinct from healAmt (which lands on target, for the anyAlign/heal
  // cases above). Gated on the hit actually landing, same as any other on-hit effect.
  let selfHealed = 0;
  if(b.selfHealOnHit && dmg && dealt && attacker.alive){
    selfHealed = Math.min(b.selfHealOnHit, attacker.maxHp-attacker.hp);
    if(selfHealed) attacker.hp += selfHealed;
  }
  const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}${isCrit?' CRITICAL':''}`;
  log(`<b>${attacker.def.name}</b> ${actionPhrase} &mdash; ${rollNote}: ${dealt?('-'+dealt+' HP'):''}${healAmt?(' +'+healAmt+' HP'):''}${selfHealed?(' &mdash; '+attacker.def.name+' heals +'+selfHealed+' HP'):''}${isCrit?' (special charge lost)':''}${pushed?` (pushed back ${pushed})`:''}${confused?` &mdash; <b>${target.def.name}</b> slams into an obstruction and is now Confused!`:''}${fell?` &mdash; <b>${target.def.name}</b> is pushed off a ledge and falls, taking 1 damage!`:''}${relocated?` &mdash; <b>${target.def.name}</b> is picked up and moved!`:''}${vaulted?` &mdash; <b>${attacker.def.name}</b> lands nearby!`:''}${(b.vaultAttack && dmg && !vaulted && !awaitingFollowup)?` &mdash; no open tile next to them to land on!`:''}`, isCrit?'crit':'');
  return !awaitingFollowup;
}

// CPU's choice of where to drop a pickUpAndMove target: among the valid tiles
// within range of the attacker, prefers whichever puts the most distance between
// the target and their own nearest living ally (isolating them for a follow-up).
// dropAoe, when given ({range, dmg} — see Forcer's Displace), flips that goal:
// the CPU instead prefers the landing spot that catches the most enemies (from
// the attacker's side) in the resulting blast, ties broken by the same isolation
// score as a secondary factor.
function pickBestRelocateDest(attacker, target, range, dropAoe){
  const theirAllies = teamOf(target).instances.filter(e=>e.alive && e.uid!==target.uid);
  const blastTargets = dropAoe ? enemyTeamOf(attacker).instances.filter(e=>e.alive && e.uid!==target.uid) : null;
  let best = null, bestScore = -Infinity;
  for(let ty=0; ty<BOARD_ROWS; ty++){
    for(let tx=0; tx<BOARD_COLS; tx++){
      if(manhattan(attacker,{x:tx,y:ty})>range) continue;
      const hazardHere = isHazardTile(tx,ty);
      if(terrainAt(tx,ty)===2 && !hazardHere) continue; // a real wall/tree
      if(hazardHere && !(target.def.abilities||{}).float) continue; // landing on a pit/lava tile needs the target to Float
      if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
      const isolationScore = theirAllies.length
        ? Math.min(...theirAllies.map(a=>manhattan({x:tx,y:ty},a)))
        : Math.random();
      const score = dropAoe
        ? blastTargets.filter(e=>manhattan({x:tx,y:ty},e)<=dropAoe.range).length + isolationScore*0.001
        : isolationScore;
      if(score>bestScore){ bestScore=score; best={x:tx,y:ty}; }
    }
  }
  return best;
}

// Gypsy's Mug bonus teleport (CPU side): unlike pickBestRelocateDest, there's no
// range limit at all here — "anywhere on the map" — so this scans the whole
// board. Same isolation heuristic: prefer whatever tile puts the most distance
// between the target and their own surviving allies.
function pickCpuTeleportDest(target){
  const theirAllies = teamOf(target).instances.filter(e=>e.alive && e.uid!==target.uid);
  let best = null, bestScore = -Infinity;
  for(let ty=0; ty<BOARD_ROWS; ty++){
    for(let tx=0; tx<BOARD_COLS; tx++){
      const hazardHere = isHazardTile(tx,ty);
      if(terrainAt(tx,ty)===2 && !hazardHere) continue; // a real wall/tree
      if(hazardHere && !(target.def.abilities||{}).float) continue; // needs Float to land on a pit/lava tile
      if(occupantsAt(tx,ty).some(o=>o.alive)) continue;
      const score = theirAllies.length
        ? Math.min(...theirAllies.map(a=>manhattan({x:tx,y:ty},a)))
        : Math.random();
      if(score>bestScore){ bestScore=score; best={x:tx,y:ty}; }
    }
  }
  return best;
}

// "Hit everyone in range" BASIC attacks (e.g. Vigilant's boomerang) — no single
// target to click, resolved via the Confirm button like a targetType:'none' special.
// Uses the normal basic-attack roll table; a roll of 1 has no one specific to
// counter off of, so it's treated as a plain miss here.
function resolveBasicAoe(attacker){
  const b = effectiveBasic(attacker);
  const enemies = enemiesInAoeRange(attacker, b);
  const roll = attacker.status.blind>0 ? blindRoll() : basicAttackRoll();
  if(roll.result==='miss' || roll.result==='miss-counter'){
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
    return;
  }
  if(enemies.length){
    const dealtList = enemies.map((e,i)=>{
      const eDmg = (b.dmgOverflow!==undefined && i>=2) ? b.dmgOverflow : b.dmg;
      const dealt = applyDamage(e, eDmg, attacker);
      if(b.applyStatus) applyStatus(e, b.applyStatus, b.statusDur||1);
      return dealt;
    });
    const dmgNote = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: hits ${dmgNote}.`,'');
  } else {
    log(`<b>${attacker.def.name}</b> attacks &mdash; rolled ${roll.roll}: no enemies in range.`,'');
  }
}

// Lancer's Vault: after the hit lands, she can land on any open tile directly
// adjacent to the target — same passability rules as normal movement (a wall
// always blocks, a pit/lava needs jump>=2 or Float, water needs Float if this
// map's water is impassable).
function vaultLandingTiles(attacker, target){
  const abilities = attacker.def.abilities || {};
  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  return dirs.map(([dx,dy])=>({x:target.x+dx,y:target.y+dy}))
    .filter(p=>p.x>=0 && p.x<BOARD_COLS && p.y>=0 && p.y<BOARD_ROWS)
    .filter(p=>{
      const terr = terrainAt(p.x,p.y);
      const hazardHere = isHazardTile(p.x,p.y);
      if(terr===2 && !hazardHere) return false;
      if(hazardHere && !abilities.float && (abilities.jump||0)<2) return false;
      if(terr===1 && WATER_IMPASSABLE && !abilities.float) return false;
      return true;
    })
    .filter(p=>!occupantsAt(p.x,p.y).some(o=>o.alive));
}
// Stalker's Swift: land past the LAST enemy hit, continuing straight in the
// same direction the line was fired. If that tile is blocked (wall or another
// character), fall back to whichever of the two tiles perpendicular to the
// travel direction, beside that last enemy, are actually open — same
// open-tile rule as vaultLandingTiles, just a fixed 3-candidate set (forward,
// then the two sides) instead of all 4 sides of the target.
function stalkerLandingOptions(attacker, dir, lastEnemy){
  const isOpen = (p)=> p.x>=0 && p.x<BOARD_COLS && p.y>=0 && p.y<BOARD_ROWS
    && terrainAt(p.x,p.y)!==2 && !isHazardTile(p.x,p.y)
    && !(terrainAt(p.x,p.y)===1 && WATER_IMPASSABLE)
    && !occupantsAt(p.x,p.y).some(o=>o.alive);
  const forward = {x:lastEnemy.x+dir.dx, y:lastEnemy.y+dir.dy};
  if(isOpen(forward)) return {forced:forward};
  const sideA = {x:lastEnemy.x+dir.dy, y:lastEnemy.y-dir.dx};
  const sideB = {x:lastEnemy.x-dir.dy, y:lastEnemy.y+dir.dx};
  return {choices:[sideA,sideB].filter(isOpen)};
}
// Charm (Thief) forces an enemy to use one of their own attacks, but only ones
// simple enough to run through a single unit-picking step: a single-target
// 'enemy' ability with no extra setup — no direction-aim, no dual-population
// picks, no upfront gating roll, no follow-up tile/ally choice, no multi-hit
// sequencing. Special is preferred when it qualifies; basic is the fallback.
function charmAttackEligible(ability){
  if(!ability || ability.targetType!=='enemy') return false;
  if((ability.hits||1)>1) return false;
  if(ability.lineAttack || ability.pierce || ability.reactiveOnly || ability.chargeCombo
    || ability.rollsEach || ability.secondPickAlly || ability.matey || ability.vaultAttack
    || ability.dashThenTarget || ability.optionalSecondHit || ability.possess || ability.thenBasicAttack) return false;
  return true;
}
// Same idea as charmAttackEligible, but for the human-controlled Charm bonus
// segment specifically, which resolves through the normal target-picking UI
// rather than a single forced auto-hit. That UI already resolves multi-target
// specials (twoRangeCombo, optionalSecondHit) by applying damage directly to
// whichever targets got clicked — no internal enemyTeamOf(attacker) lookup —
// so those are safe to allow here even though the CPU's simpler forced-attack
// version above can't handle them. Line attacks, Dice's rollsEach, Scholar's
// secondPickAlly, and the rest still do their own internal team-side lookups
// that assume the attacker's real team is the attacking side, which isn't
// true for a charmed unit — those stay excluded until that's verified safe.
function charmBonusEligible(ability){
  if(!ability || ability.targetType!=='enemy') return false;
  if(ability.lineAttack || ability.pierce || ability.reactiveOnly || ability.chargeCombo
    || ability.rollsEach || ability.secondPickAlly || ability.matey || ability.vaultAttack
    || ability.dashThenTarget || ability.possess || ability.thenBasicAttack || ability.jumpBetweenHits) return false;
  return true;
}
// A charmed character attacks their OWN original team, not Thief's — from
// their point of view, that's still "the enemy": Thief has turned them against
// whoever they used to fight alongside. enemyTeamOf(charmed) would get this
// backwards (it'd point at Thief's side), so every charm-related targeting
// check goes through this instead.
function charmedOwnTeam(charmed){
  return { instances: teamOf(charmed).instances.filter(e=>e.uid!==charmed.uid) };
}
function resolveSpecial(attacker, target, forceAutoHit){
  const s = attacker.def.special;
  // Same principle as doBasicAttack: the special is committed the moment it's
  // used, regardless of how the roll turns out or how many follow-up picks
  // (second target, relocate, charm control) still remain.
  attacker.actedThisTurn = true;
  // Tile-type specials already spent their charge in rollTileSpecialUpfront(), since
  // that's when the roll now happens — every other special type still spends it here.
  if(s.targetType!=='tile') attacker.specialCharges--;
  if(s.permanentBasicSwap){
    // Indigen's Snap: the staff breaks whether the attack that follows actually
    // lands or not — same "unconditional, before the roll" timing as the charge
    // spend just above, not gated on a hit like Outlaw's lockOnBasic. Stored
    // per-instance via basicOverride so the shared ROSTER definition itself is
    // never touched.
    attacker.basicOverride = s.permanentBasicSwap;
    log(`<b>${attacker.def.name}</b>'s staff breaks! Basic attack is now permanently <b>${s.permanentBasicSwap.label}</b>.`, '');
  }
  if(s.barrelRoll){ resolveBarrelRollSpecialAttack(attacker, target); return; }
  if(s.lineAttack){ resolveLineSpecialAttack(attacker, target); return; }

  if(s.jumpBetweenHits){
    // Shinobi's Aerial: R1 D3, then Jump to an empty tile (state.pendingAerialLanding,
    // set by the landing-tile pick), then R1 D3 again from the new spot. One shared
    // roll covers the whole combo — same "single roll, multiple hits" precedent as
    // resolveTwoRangeComboBasicAttack — and the jump itself only happens on a hit,
    // same principle as vaultAttack only repositioning when the attack actually lands.
    const targets = Array.isArray(target) ? target : [target];
    const first = targets[0], second = targets[1];
    const landing = state.pendingAerialLanding;
    const roll = forceAutoHit ? {result:'hit', roll:null} : specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      state.pendingAerialLanding = null;
      return;
    }
    const isCrit = roll.result==='crit';
    let firstDealt = 0, secondDealt = 0;
    if(first && first.alive){
      firstDealt = applyDamage(first, s.dmg, attacker);
      if(isCrit && first.specialCharges>0) first.specialCharges--;
    }
    let jumped = false;
    if(landing){
      attacker.x = landing.x; attacker.y = landing.y;
      attacker.elevated = isElevatedGround(landing.x, landing.y);
      attacker.movedThisTurn = true;
      checkHeartTokenPickup(attacker);
      checkTrapTrigger(attacker); checkCropTrigger(attacker);
      checkTeleportDoorway(attacker);
      jumped = true;
    }
    const gotSecond = second && second.alive && canReach(attacker, second, s);
    if(gotSecond){
      secondDealt = applyDamage(second, s.dmg, attacker);
      if(isCrit && second.specialCharges>0) second.specialCharges--;
    }
    const desc = gotSecond
      ? `<b>${first ? first.def.name : '?'}</b> -${firstDealt} and <b>${second.def.name}</b> -${secondDealt}`
      : `<b>${first ? first.def.name : '?'}</b> -${firstDealt} &mdash; no second hit landed`;
    const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}${isCrit?' CRITICAL':''}`;
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; ${desc} &mdash; ${rollNote}${isCrit?' (special charge lost per hit)':''}${jumped?` &mdash; <b>${attacker.def.name}</b> jumps to a new position!`:''}`, isCrit?'crit':'');
    state.pendingAerialLanding = null;
    return;
  }

  if(s.thenBasicAttack){
    // Rogue's Darkness: one roll covers the status half of the special. On a
    // hit, applies a randomly-chosen status from s.randomStatus, then looks
    // for a DIFFERENT enemy within Rogue's own basic-attack range to
    // immediately use that basic attack on — auto-hit, same "the enabling
    // roll already succeeded" precedent as Admiral's Matey. If Rogue's basic
    // happens to be a vault-style attack (it is, here), that follow-up hit
    // can trigger its own landing-tile pick same as any other use of it.
    const roll = forceAutoHit ? {result:'hit', roll:null} : specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const choice = s.randomStatus[Math.floor(Math.random()*s.randomStatus.length)];
    applyStatus(target, choice.status, choice.dur);
    const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}`;
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; ${rollNote}: ${STATUS_DISPLAY_NAME[choice.status]||choice.status} ${choice.dur}.`, '');
    const ab = effectiveBasic(attacker);
    const secondPool = enemyTeamOf(attacker).instances.filter(e=>e.alive && e.uid!==target.uid && canReach(attacker,e,ab));
    if(secondPool.length){
      state.mode = 'darknessSelectTarget';
      state.pendingDarknessFirstTargetUid = target.uid;
      log(`&mdash; choose a different enemy for <b>${attacker.def.name}</b>&rsquo;s basic attack.`, '');
    } else {
      log(`&mdash; no other enemy in range for the follow-up basic attack.`, '');
    }
    return;
  }

  if(s.possess){
    // Specter's Possess: single roll, like any other basic special hit — but
    // on a hit, Specter itself moves onto the TARGET's tile (the reverse of
    // pickUpAndMove, which relocates the target instead) and the possession
    // begins. See enemyTeamOf/effectiveBasic for how the target's own next
    // turn gets hijacked, and endTurnAdvance/resolvePossessLanding for how
    // the possession ends and Specter reappears nearby.
    const roll = forceAutoHit ? {result:'hit', roll:null} : specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const dealt = applyDamage(target, s.dmg, attacker);
    const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}`;
    if(target.alive){
      attacker.x = target.x; attacker.y = target.y; attacker.elevated = target.elevated;
      // Possess relocates Specter (onto the target's tile) same as any other
      // move — mark the turn's move as used so it can't also take a separate
      // normal move afterward.
      attacker.movedThisTurn = true;
      state.possession = { specterUid: attacker.uid, targetUid: target.uid };
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; ${rollNote}: -${dealt} HP &mdash; <b>${attacker.def.name}</b> possesses <b>${target.def.name}</b>, invisible until their turn ends.`, '');
    } else {
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; ${rollNote}: -${dealt} HP &mdash; <b>${target.def.name}</b> is defeated before <b>${attacker.def.name}</b> could possess them.`, '');
    }
    return;
  }

  if(s.charmAttack){
    // Thief's Charm: one roll for the whole action — Charm itself always rolls
    // for real (it's Thief's own attack). On a hit, Thief takes control of the
    // target. What "control" means differs by who's controlling Thief:
    //  - A CPU-controlled Thief resolves it all synchronously, right here, with
    //    no UI: whichever of the target's own abilities is available and simple
    //    enough to force (their special, preferred, if it qualifies — see
    //    charmAttackEligible — otherwise their basic), fired once at whoever's
    //    already reachable. No movement; see the charmControlSelect handling in
    //    cpuTakeTurnAttackPhase for the actual pick.
    //  - A human-controlled Thief instead gets a real bonus segment on the
    //    charmed unit: a full move + a choice of Basic or Special, exactly like
    //    a normal turn, via the same panel-control-override trick as
    //    Mercenary's Hire (state.charmBonusUid). Whichever attack they land is
    //    forced to auto-hit — no second roll — since Charm's own roll already
    //    covered it.
    // Either way, Thief's own D1 is deliberately held until AFTER the controlled
    // attack resolves (see endCharmSegment) — landing it first could drop the
    // target before it ever gets to act.
    const roll = specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const thiefIsCpu = state.vsMode==='cpu' && attacker.team===2;
    if(thiefIsCpu){
      const specialAbil = target.def.special;
      const useSpecial = target.specialCharges>0 && charmAttackEligible(specialAbil)
        && charmedOwnTeam(target).instances.some(e=>e.alive && canReach(target,e,specialAbil));
      const basicAbil = effectiveBasic(target);
      const useBasic = !useSpecial && charmAttackEligible(basicAbil)
        && charmedOwnTeam(target).instances.some(e=>e.alive && canReach(target,e,basicAbil));
      if(!useSpecial && !useBasic){
        // Nothing simple enough to force (or nothing of theirs is in range) —
        // Charm still connects, so its own D1 lands right away since there's no
        // controlled attack to sequence it after.
        const dealt = applyDamage(target, s.dmg, attacker);
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: -${dealt} HP (no attack of theirs was available to force).`, '');
        return;
      }
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: takes control &mdash; choose who they attack.`, '');
      state.pendingCharm = { thiefUid: attacker.uid, targetUid: target.uid, dmg: s.dmg, useSpecial };
      state.mode = 'charmControlSelect';
      return;
    }
    // Human-controlled Thief: hand the target a fresh move+act slot and let the
    // normal Move/Basic/Special panel take over, same as Hire's bonus segment.
    // No basicOverride needed here (unlike Hire, which swaps in a boosted
    // ability) — the charmed unit uses their OWN basic/special unchanged; every
    // click-handler call site for this segment already passes forceAutoHit
    // straight through instead, so the guaranteed-hit part is handled there.
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: takes control!`, '');
    target.movedThisTurn = false;
    target.actedThisTurn = false;
    target.undoX = undefined; target.undoY = undefined; target.undoElevated = undefined;
    state.pendingCharm = { thiefUid: attacker.uid, targetUid: target.uid, dmg: s.dmg };
    state.charmBonusUid = target.uid;
    state.mode = null;
    return;
  }

  if(s.chargeCombo){
    // This is always the SECOND use — the first use (chargeUpFirstAttack) already
    // rolled and stored roll1 on the character, with no target and no effect. This
    // one rolls the second attack, needs the target that was just picked, and is
    // where the actual outcome (big hit / board-wide chip damage / self-damage)
    // finally executes.
    const roll1 = (attacker.chargeComboPending && attacker.chargeComboPending.roll1)
      || specialAttackRoll(attacker.status.blind>0, target.status.sleep>0); // fallback if somehow reached without a first use
    const roll2 = attacker.status.blind>0 ? blindRoll() : specialAttackRoll(false, target.status.sleep>0);
    attacker.chargeComboPending = null;
    resolveChargeComboOutcome(attacker, target, s, roll1, roll2);
    return;
  }

  if(s.targetType==='targetPoint'){ resolveTargetPointAttack(attacker, s, target, false, forceAutoHit); return; }

  if(s.targetType==='layTraps'){
    const roll = specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no traps laid.`, 'miss');
      return;
    }
    if(s.plantsCrops){
      // Farmer's Plant: unlike a trap (which only ever harms the OPPOSING
      // team — see checkTrapTrigger), a crop helps or hurts depending on who
      // steps on it: Heal 2 for the Farmer's own team, D2 for the enemy team.
      // See checkCropTrigger for the actual effect.
      target.forEach(p=>{
        if(!state.crops.some(t=>t.x===p.x && t.y===p.y)) state.crops.push({x:p.x, y:p.y, team:attacker.team});
      });
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: plants ${target.length} crop${target.length===1?'':'s'}.`, '');
      return;
    }
    if(s.trapStatuses){
      // Undertaker's Tomb: each tile (in the order clicked) gets a DIFFERENT
      // status trap, and these live in their own list — unlike a normal trap
      // they don't block movement at all (see checkTombTrapTriggers, which
      // fires on the walker's whole path, not just where they stop).
      target.forEach((p,i)=>{
        const status = s.trapStatuses[i] || s.trapStatuses[s.trapStatuses.length-1];
        if(!state.tombTraps.some(t=>t.x===p.x && t.y===p.y)) state.tombTraps.push({x:p.x, y:p.y, status, team:attacker.team});
      });
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: lays ${target.length} traps (${s.trapStatuses.map(x=>STATUS_DISPLAY_NAME[x]||x).join(', ')}).`, '');
      return;
    }
    target.forEach(p=>{
      if(!state.traps.some(t=>t.x===p.x && t.y===p.y)) state.traps.push({x:p.x, y:p.y, team:attacker.team});
    });
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: lays ${target.length} trap${target.length===1?'':'s'}.`, '');
    return;
  }

  if(s.targetType==='tile'){
    // The roll for this already happened before the destination was even offered
    // (see rollTileSpecialUpfront) — reaching here means it succeeded, so this is
    // a guaranteed hit; no second roll.
    const dest = target; // {x,y} — the empty tile the player chose
    attacker.x = dest.x; attacker.y = dest.y;
    attacker.elevated = isElevatedGround(dest.x, dest.y);
    log(`<b>${attacker.def.name}</b> moves to an empty tile.`,'');
    checkHeartTokenPickup(attacker);
    checkTrapTrigger(attacker); checkCropTrigger(attacker);
    checkTeleportDoorway(attacker);
    const enemies = enemyTeamOf(attacker).instances.filter(c=>c.alive && manhattan(attacker,c)<=s.aoeEnemiesRange);
    if(enemies.length){
      const dealtList = enemies.map(e=> applyDamage(e, s.dmg, attacker));
      const notes = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; hits ${notes}.`,'');
      if(s.sleepOne){
        // A human player picks which enemy falls asleep when there's a genuine
        // choice; a CPU-controlled attacker just has to pick one, so it stays
        // automatic there since there's no one to click through the choice.
        const humanControlled = !(state.vsMode==='cpu' && attacker.team===2);
        if(enemies.length > 1 && humanControlled){
          state.pendingSleepChoice = enemies.map(e=>e.uid);
          state.mode = 'sleepChoiceSelect';
          log(`&mdash; choose which enemy falls asleep.`,'');
        } else {
          const pick = enemies[Math.floor(Math.random()*enemies.length)];
          applyStatus(pick,'sleep',1);
          log(`&mdash; <b>${pick.def.name}</b> falls asleep.`,'');
        }
      }
    } else {
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; no enemies in range.`,'');
    }
    return;
  }

  if(s.targetType==='none'){
    if(s.lockOnBasic){
      // A one-shot self-buff: roll once, and on success permanently swap this
      // character's basic attack for a new (usually stronger, no-roll) one —
      // stored per-instance via basicOverride so the shared ROSTER definition
      // itself is never touched.
      const roll = specialAttackRoll(attacker.status.blind>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
        return;
      }
      attacker.basicOverride = s.lockOnBasic;
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: locked on! <b>${attacker.def.name}</b>'s basic attack is now permanently <b>${s.lockOnBasic.label}</b>.`, 'crit');
      return;
    }
    if(s.selfBuffBasic){
      // Huntress's Focus: a one-shot self-buff, same shape as lockOnBasic, except
      // it just permanently adds to Sense's damage (via the same basicBonus field
      // Blacksmith's Temper uses for allies) instead of swapping the ability out.
      const roll = specialAttackRoll(attacker.status.blind>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
        return;
      }
      attacker.basicBonus = (attacker.basicBonus||0) + s.selfBuffBasic;
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: Sense permanently +${s.selfBuffBasic} damage.`, 'crit');
      return;
    }
    if(s.aoe==='allies'){
      const roll = specialAttackRoll(attacker.status.blind>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
        return;
      }
      const affected = teamOf(attacker).instances.filter(c=>c.alive && (!s.excludeSelf || c.uid!==attacker.uid));
      if(s.regen){
        affected.forEach(c=> applyStatus(c,'regen',s.regen));
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: allies${s.excludeSelf?' (not self)':''} gain Regen ${s.regen} (heal 2 at the start of their next ${s.regen} turn${s.regen===1?'':'s'}).`,'');
      } else if(s.heal){
        affected.forEach(c=>{ c.hp=Math.min(c.maxHp,c.hp+s.heal); });
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: allies${s.excludeSelf?' (not self)':''} heal ${s.heal} HP.`,'');
      }
    } else if(s.aoeEnemiesRange!==undefined){
      const enemies = enemiesInAoeRange(attacker, s);
      const roll = specialAttackRoll(attacker.status.blind>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
        return;
      }
      if(enemies.length){
        // Viking's Whirl (or any future dmgOverflow AOE with more than 2 hittable
        // enemies): rather than silently assigning the lower dmg tier by whatever
        // order the enemies happen to sit in, a human player picks which 2 take
        // the lower tier — the rest take the overflow tier. With 2 or fewer
        // enemies hit there's nothing to choose (everyone's within the "first 2"),
        // so it resolves immediately same as before.
        if(s.dmgOverflow!==undefined && enemies.length>2){
          const humanControlled = !(state.vsMode==='cpu' && attacker.team===2);
          if(humanControlled){
            state.pendingWhirlChoice = { enemyUids: enemies.map(e=>e.uid), dmg:s.dmg, dmgOverflow:s.dmgOverflow, pickedUids:[] };
            state.mode = 'whirlChoiceSelect';
            log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: choose 2 enemies to take ${s.dmg} dmg (the rest take ${s.dmgOverflow}).`,'');
            return;
          } else {
            const shuffled = [...enemies].sort(()=>Math.random()-0.5);
            const lowTier = shuffled.slice(0,2), highTier = shuffled.slice(2);
            const lowDealt = lowTier.map(e=> applyDamage(e, s.dmg, attacker));
            const highDealt = highTier.map(e=> applyDamage(e, s.dmgOverflow, attacker));
            const notes = [...lowTier.map((e,i)=>`<b>${e.def.name}</b> -${lowDealt[i]}`), ...highTier.map((e,i)=>`<b>${e.def.name}</b> -${highDealt[i]}`)].join(', ');
            log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: hits ${notes}.`,'');
            return;
          }
        }
        const dealtList = enemies.map((e,i)=>{
          const eDmg = (s.dmgOverflow!==undefined && i>=2) ? s.dmgOverflow : s.dmg;
          return applyDamage(e, eDmg, attacker);
        });
        // applyStatus on an aoeEnemiesRange special (Buccaneer's Swabble): unlike
        // sleepOne (which picks a single enemy out of the group), this lands on
        // EVERY enemy the AOE actually hit — same "status alongside the hit"
        // precedent as resolveTargetPointAttack's own applyStatus handling.
        if(s.applyStatus){
          enemies.forEach(e=>{ if(e.alive) applyStatus(e, s.applyStatus, s.statusDur||1); });
        }
        const statusNote = s.applyStatus ? ` + ${STATUS_DISPLAY_NAME[s.applyStatus]||s.applyStatus}` : '';
        const dmgNote = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: hits ${dmgNote}${statusNote}.`,'');
        if(s.sleepOne){
          const humanControlled = !(state.vsMode==='cpu' && attacker.team===2);
          if(enemies.length > 1 && humanControlled){
            state.pendingSleepChoice = enemies.map(e=>e.uid);
            state.mode = 'sleepChoiceSelect';
            log(`&mdash; choose which enemy falls asleep.`,'');
          } else {
            const pick = enemies[Math.floor(Math.random()*enemies.length)];
            applyStatus(pick,'sleep',1);
            log(`&mdash; <b>${pick.def.name}</b> falls asleep.`,'');
          }
        }
      } else {
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: no enemies in range.`,'');
      }
      if(s.shield){
        state.guardAuraSourceUid = attacker.uid;
        const inRangeNow = teamOf(attacker).instances.filter(c=> c.alive && (s.shieldRange===undefined || manhattan(attacker,c)<=s.shieldRange));
        log(`&mdash; <b>${attacker.def.name}</b> raises a guard: allies within R${s.shieldRange} take ${s.shield} less damage per hit until <b>${attacker.def.name}</b>'s next turn or death (currently protecting ${inRangeNow.length}). Moving out of range drops protection; moving in gains it.`,'');
      }
      if(s.healAllies){
        teamOf(attacker).instances.filter(c=>c.alive).forEach(c=>{ c.hp=Math.min(c.maxHp,c.hp+s.healAllies); });
        log(`&mdash; allies heal ${s.healAllies} HP.`,'');
      }
      if(s.cureAllies){
        teamOf(attacker).instances.filter(c=>c.alive).forEach(c=>{
          c.status.poison=0; c.status.sleep=0; c.status.legbreak=0; c.status.armbreak=0; c.status.blind=0;
        });
        log(`&mdash; allies' status effects are cured.`,'');
      }
      if(s.rearrangeRange){
        const possessingSpecterUid = state.possession ? state.possession.specterUid : null;
        const pool = allInstances().filter(u=>u.alive && u.uid!==attacker.uid && u.uid!==possessingSpecterUid && manhattan(attacker,u)<=s.rearrangeRange);
        if(pool.length){
          state.rearrangeQueue = pool.map(u=>u.uid);
          state.rearrangeOrigin = {x:attacker.x, y:attacker.y};
          log(`&mdash; choose new positions for ${pool.length} character${pool.length===1?'':'s'} within range.`,'');
        } else {
          log(`&mdash; no one else is in range to reposition.`,'');
        }
      }
    }
    return;
  }

  if(s.targetType==='ally'){
    const roll = specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`,'miss');
      return;
    }
    if(s.buffAlly){
      target.basicBonus = (target.basicBonus||0) + s.buffAlly;
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: basic attack permanently +${s.buffAlly} damage.`,'');
    }
    if(s.regenSelfAndAlly){
      // Guardian's Aid: the caster's own Regen is automatic (not something the
      // player picks), on top of whichever ally they chose to also grant it to —
      // and, separately, everyone else in range just takes AOE damage regardless
      // of the ally choice.
      applyStatus(attacker, 'regen', s.regenSelfAndAlly);
      applyStatus(target, 'regen', s.regenSelfAndAlly);
      let note = `<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: <b>${attacker.def.name}</b> and <b>${target.def.name}</b> gain Regen ${s.regenSelfAndAlly}`;
      if(s.aoeEnemiesRange!==undefined){
        const enemies = enemiesInAoeRange(attacker, s);
        if(enemies.length){
          const dealtList = enemies.map(e=> applyDamage(e, s.dmg, attacker));
          const notes = enemies.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ');
          note += `; ${notes}`;
        }
      }
      log(note+'.', '');
    }
    if(s.hasteSelfAndAlly){
      // Oracle's DuHaste: same self+ally shape as Guardian's Aid above, but
      // granting Haste instead of Regen, with no accompanying AOE damage.
      applyStatus(attacker, 'haste', s.hasteSelfAndAlly);
      applyStatus(target, 'haste', s.hasteSelfAndAlly);
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: <b>${attacker.def.name}</b> and <b>${target.def.name}</b> gain Haste ${s.hasteSelfAndAlly}.`, '');
    }
    return;
  }

  if(s.healFollowup){
    // Diviner's Faith — same hybrid shape as Priest's basic (see
    // resolvePriestBasicCombo), just on the special side and with an extra status
    // half: pick an enemy (damage + s.applyStatus) which chains into a mandatory
    // heal pick (self or an ally, +heal and s.cureStatus), OR pick an ally/self
    // directly for a heal-only use with no enemy involved at all. One roll covers
    // whichever shape actually happened; a miss cancels everything in that shape.
    const targets = Array.isArray(target) ? target : [target];
    const first = targets[0];
    const isBlind = attacker.status.blind>0;
    const cureNote = (healTarget)=>{
      if(!s.cureStatus) return '';
      const had = Object.values(healTarget.status||{}).some(v=>v>0);
      if(!had) return '';
      healTarget.status.poison=0; healTarget.status.sleep=0; healTarget.status.legbreak=0; healTarget.status.armbreak=0; healTarget.status.blind=0;
      return ' and status effects cured';
    };
    if(targets.length===1 && first.team===attacker.team){
      // Heal-only: no enemy in the mix, so no sleep-aware roll table applies.
      const healTarget = first;
      const roll = isBlind ? blindRoll() : specialAttackRoll(false);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${healTarget.def.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
        return;
      }
      const isSelfHeal = healTarget.uid===attacker.uid;
      const healAmt = isSelfHeal && s.selfHeal!==undefined ? s.selfHeal : s.heal;
      if(healAmt) healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp+healAmt);
      const cured = cureNote(healTarget);
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on ${isSelfHeal?'themself':`<b>${healTarget.def.name}</b>`} &mdash; rolled ${roll.roll}: +${healAmt} HP${cured}.`, '');
      return;
    }
    const enemyTarget = first, healTarget = targets[1];
    const roll = isBlind ? blindRoll() : specialAttackRoll(false, enemyTarget.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${enemyTarget.def.name}</b>${healTarget?` and tries to heal <b>${healTarget.def.name}</b>`:''} &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const dealt = applyDamage(enemyTarget, s.dmg, attacker);
    if(s.applyStatus && enemyTarget.alive) applyStatus(enemyTarget, s.applyStatus, s.statusDur||1);
    let healNote = '';
    if(healTarget){
      const isSelfHeal = healTarget.uid===attacker.uid;
      const healAmt = isSelfHeal && s.selfHeal!==undefined ? s.selfHeal : s.heal;
      if(healAmt) healTarget.hp = Math.min(healTarget.maxHp, healTarget.hp+healAmt);
      const cured = cureNote(healTarget);
      healNote = ` + ${isSelfHeal?'themself':`<b>${healTarget.def.name}</b>`} +${healAmt} HP${cured}`;
    }
    const statusNote = (s.applyStatus && enemyTarget.alive) ? ` + ${STATUS_DISPLAY_NAME[s.applyStatus]||s.applyStatus}` : '';
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${enemyTarget.def.name}</b> &mdash; rolled ${roll.roll}: -${dealt} HP${statusNote}${healNote}.`, '');
    return;
  }

  if(s.splitDmg!==undefined){
    // Shaman's Extract: dmgTargets/healTargets are already fixed by the two
    // click phases (splitDmgSelect/splitHealSelect) — repeats and all, one
    // array entry per point spent on that target. One roll covers the whole
    // thing; a miss cancels both halves (nothing dealt, nothing healed).
    const { dmgTargets, healTargets } = target;
    const roll = specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      return;
    }
    const dmgCounts = {};
    (dmgTargets||[]).forEach(t=>{ if(t) dmgCounts[t.uid] = (dmgCounts[t.uid]||0)+1; });
    const dmgNotes = [];
    Object.keys(dmgCounts).forEach(uid=>{
      const t = getByUid(uid);
      if(!t || !t.alive) return;
      const dealt = applyDamage(t, dmgCounts[uid], attacker);
      dmgNotes.push(`<b>${t.def.name}</b> -${dealt}`);
    });
    const healCounts = {};
    (healTargets||[]).forEach(t=>{ if(t) healCounts[t.uid] = (healCounts[t.uid]||0)+1; });
    const healNotes = [];
    Object.keys(healCounts).forEach(uid=>{
      const t = getByUid(uid);
      if(!t || !t.alive) return;
      const amt = Math.min(healCounts[uid], t.maxHp-t.hp);
      if(amt>0) t.hp += amt;
      healNotes.push(`${t.uid===attacker.uid?'themself':`<b>${t.def.name}</b>`} +${healCounts[uid]}`);
    });
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: ${dmgNotes.length?dmgNotes.join(', '):'no enemies hit'}; heals ${healNotes.length?healNotes.join(', '):'no one'}.`, '');
    return;
  }

  if(s.thenBonusAttack){
    // Assassin's Quick: R1, D3 — then, only on a hit, a full bonus move + a
    // second forced attack (fixed dmg/status via basicOverride, s.thenBonusAttack)
    // against a DIFFERENT enemy than the one just hit. Same "fresh move+act slot"
    // mechanism as Hire/Charm's bonus segments, just self-targeted instead of
    // handed to someone else — see clearQuickBonus for how it's reverted. That
    // second attack auto-hits, no roll of its own — this roll already covered it,
    // same "the enabling roll already succeeded" precedent as Matey/Hire.
    const roll = specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const dealt = applyDamage(target, s.dmg, attacker);
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: -${dealt} HP. <b>${attacker.def.name}</b> moves again!`, '');
    attacker.movedThisTurn = false;
    attacker.actedThisTurn = false;
    attacker.undoX = undefined; attacker.undoY = undefined; attacker.undoElevated = undefined;
    attacker.basicOverride = { ...s.thenBonusAttack, excludeUid: target.uid };
    state.quickBonusUid = attacker.uid;
    state.mode = 'move';
    return;
  }

  if(s.swapHp){
    // Merchant's Barter: swap current HP with the target, each side capped at
    // its OWN max HP (a swap can't push you above your own cap). Still gated
    // behind a normal roll — a miss does nothing to either side. Either HP
    // total can land at 0 or below from this, so both sides get the same
    // death check applyDamage would give them.
    const roll = forceAutoHit ? {result:'hit', roll:null} : specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      return;
    }
    const attackerOldHp = attacker.hp, targetOldHp = target.hp;
    attacker.hp = Math.min(attacker.maxHp, targetOldHp);
    target.hp = Math.min(target.maxHp, attackerOldHp);
    if(attacker.hp<=0 && attacker.alive) defeat(attacker);
    if(target.hp<=0 && target.alive) defeat(target);
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: HP swapped (<b>${attacker.def.name}</b> ${attackerOldHp}&rarr;${attacker.hp}, <b>${target.def.name}</b> ${targetOldHp}&rarr;${target.hp}).`, '');
    return;
  }

  if(s.placePortals){
    // Splitter's Portal. Cast 1 (her first charge): R4, D3 to 2 distinct
    // enemies, one shared roll — same convention as every other multi-hit
    // special — then place 2 new portals anywhere within range. If cast 1
    // hit, the SECOND (and last — she only has 2 charges) cast upgrades:
    // R4, D4 to just 1 enemy, and adds 1 MORE portal on top of the 2 already
    // down. specialCharges was already decremented at the top of this
    // function, so 0 here means this WAS her final charge.
    const isSecondCast = attacker.specialCharges===0;
    const upgraded = isSecondCast && (attacker.portalHits||0)>=1;
    const targets = (Array.isArray(target) ? target : [target]).filter(t=>t && t.alive);
    const roll = specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      return;
    }
    attacker.portalHits = (attacker.portalHits||0) + 1;
    const dmgEach = upgraded ? s.upgradedDmg : s.dmg;
    const dealtList = targets.map(t=>applyDamage(t, dmgEach, attacker));
    const desc = targets.map((t,i)=>`<b>${t.def.name}</b> -${dealtList[i]}`).join(' and ');
    const portalCount = upgraded ? 1 : 2;
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: hits ${desc}${upgraded?' &mdash; both Portals connect! Upgraded strike, +1 more portal.':''} &mdash; choose ${portalCount} tile${portalCount===1?'':'s'} within range to place ${portalCount===1?'a portal':'portals'}.`, '');
    state.pendingPortalPlace = { count: portalCount, ownerTeam: attacker.team, placed: [] };
    state.mode = 'portalPlaceSelect';
    return;
  }

  if(s.optionalSecondHit){
    // Duke's Twofold: player's choice, not a fallback — one enemy for the bigger
    // singleDmg hit, or two distinct enemies within range for the smaller dmg each.
    // One roll covers the whole action either way.
    const targets = (Array.isArray(target) ? target : [target]).filter(t=>t && t.alive);
    const roll = specialAttackRoll(attacker.status.blind>0, targets.length===1 && targets[0].status.sleep>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      return;
    }
    const solo = targets.length===1;
    const dmgEach = solo ? (s.singleDmg!==undefined ? s.singleDmg : s.dmg) : s.dmg;
    const dealtList = targets.map(t=> applyDamage(t, dmgEach, attacker));
    const desc = targets.map((t,i)=>`<b>${t.def.name}</b> -${dealtList[i]}`).join(' and ');
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on ${desc} &mdash; rolled ${roll.roll}.`, '');
    return;
  }

  if(s.secondPickAlly){
    // Scholar's Erudite: one roll covers the whole special. target[0] is the enemy
    // (chosen anywhere on the board) who gets Poison; target[1], when the click UI
    // found a valid one, is a different ally (anywhere on the board) who gets
    // Regen. Haste always lands on the attacker itself and isn't a click at all —
    // it isn't gated by whether an ally happened to be available.
    const targets = Array.isArray(target) ? target : [target];
    const enemyTarget = targets[0], allyTarget = targets[1];
    const roll = specialAttackRoll(attacker.status.blind>0, !!(enemyTarget && enemyTarget.status.sleep>0));
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      return;
    }
    const parts = [];
    if(enemyTarget && enemyTarget.alive){
      applyStatus(enemyTarget, s.applyStatus, s.statusDur||1);
      parts.push(`<b>${enemyTarget.def.name}</b> is Poisoned`);
    }
    applyStatus(attacker, s.selfStatus, s.selfStatusDur||1);
    parts.push(`<b>${attacker.def.name}</b> gains Haste`);
    const gotAlly = allyTarget && allyTarget.alive && allyTarget.uid!==attacker.uid;
    if(gotAlly){
      applyStatus(allyTarget, s.allyStatus, s.allyStatusDur||1);
      parts.push(`<b>${allyTarget.def.name}</b> gains Regen`);
    }
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: ${parts.join(', ')}${gotAlly?'':' (no other ally on board to Regen)'}.`, '');
    return;
  }

  if(s.twoRangeCombo){
    // Sorcerer's Arcane: one roll covers both hits. The first target (chosen within
    // the ability's normal `range`) always gets hit; the second (chosen within
    // `secondRange` of the attacker, and required to be a different enemy) only
    // exists in `target` if one was actually available when it was picked — see the
    // click-selection UI and CPU logic, which both fall back to a single-element
    // array when no valid second enemy is in range.
    const targets = Array.isArray(target) ? target : [target];
    const first = targets[0], second = targets[1];
    const roll = specialAttackRoll(attacker.status.blind>0);
    if(roll.result==='miss'){
      log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      return;
    }
    let fell = false;
    let firstDealt = 0, secondDealt = 0;
    if(first && first.alive){
      firstDealt = applyDamage(first, s.dmg, attacker);
      // applyStatus (Wanderer's Kunai): a status on the FIRST hit — distinct
      // from secondApplyStatus below, which lands on the second, different target.
      if(s.applyStatus) applyStatus(first, s.applyStatus, s.statusDur||1);
      if(s.pushBack){
        const result = pushBackTarget(attacker, first, s.pushBack);
        if(result.collision==='obstruction') applyStatus(first, 'confuse', 1);
        else if(result.collision==='fall') fell = true;
      }
    }
    const gotSecond = second && first && second.uid!==first.uid && second.alive;
    if(gotSecond){
      secondDealt = applyDamage(second, s.dmg2!==undefined ? s.dmg2 : s.dmg, attacker);
      if(s.secondApplyStatus) applyStatus(second, s.secondApplyStatus, s.statusDur||1);
    }
    const firstTag = s.pushBack ? ' (push back)' : (s.applyStatus ? ` (${STATUS_DISPLAY_NAME[s.applyStatus]||s.applyStatus})` : '');
    const secondTag = s.secondApplyStatus ? ` (${STATUS_DISPLAY_NAME[s.secondApplyStatus]||s.secondApplyStatus})` : '';
    const desc = gotSecond
      ? `<b>${first.def.name}</b> -${firstDealt}${firstTag} and <b>${second.def.name}</b> -${secondDealt}${secondTag}`
      : `<b>${first ? first.def.name : '?'}</b> -${firstDealt}${firstTag} &mdash; no second enemy in range`;
    log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on ${desc} &mdash; rolled ${roll.roll}.${fell?` <b>${first.def.name}</b> is pushed off a ledge and falls, taking 1 extra damage!`:''}`, '');
    return;
  }

  if(s.targetType==='enemy'){
    const hits = s.hits||1;
    if(hits>1){
      // Multi-hit specials (e.g. Ninja's Twilight) roll ONCE for the whole special.
      // The player chooses `hits` targets beforehand (the same character can be chosen twice).
      // dualStatus (e.g. Crusader's Swing) applies a DIFFERENT status to each of 2 distinct
      // targets, assigned at random (not by pick order) — see the sameTarget branch below
      // for the single-enemy-in-range fallback.
      const targets = Array.isArray(target) ? target : [target];
      const roll = specialAttackRoll(attacker.status.blind>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> &mdash; rolled ${roll.roll}: miss, no effect.`, 'miss');
      } else {
        const sameTarget = targets.length===2 && targets[0] && targets[1] && targets[0].uid===targets[1].uid;
        let desc, randomStatus;
        if(s.dualStatus && sameTarget){
          // Only one enemy was in range to pick — one hit, one status (picked at random)
          // instead of double damage and both statuses on the same character.
          const tgt = targets[0];
          let dealt = 0;
          if(tgt && tgt.alive){
            dealt = applyDamage(tgt, s.dmg, attacker);
            randomStatus = s.dualStatus[Math.floor(Math.random()*s.dualStatus.length)];
            applyStatus(tgt, randomStatus, s.statusDur||1);
          }
          desc = `<b>${tgt.def.name}</b> -${dealt}`;
        } else if(sameTarget && (s.adjacentPairPick || s.distinctTargets)){
          // Only one enemy was in range to pick, for an ability that otherwise
          // insists on 2 distinct targets (e.g. Templar's Luminate, Fencer's Combo)
          // — hit them once, not twice: a single dmg + a single application of the
          // shared status, same as if only 1 target had ever been available to
          // begin with. Abilities WITHOUT that distinctness requirement (e.g.
          // Ninja's Twilight, which explicitly allows "the same or different
          // target") fall through to the branch below instead, since hitting the
          // same enemy twice there is a deliberate, always-available choice.
          const tgt = targets[0];
          let dealt = 0;
          if(tgt && tgt.alive){
            dealt = applyDamage(tgt, s.dmg, attacker);
            if(s.applyStatus) applyStatus(tgt, s.applyStatus, s.statusDur||1);
          }
          desc = `<b>${tgt.def.name}</b> -${dealt}`;
        } else {
          // Two distinct targets: which one gets which status is randomized, not tied to click order.
          const statusOrder = (s.dualStatus && Math.random()<0.5) ? [s.dualStatus[1], s.dualStatus[0]] : s.dualStatus;
          const dealtList = targets.map((tgt,i)=>{
            if(!tgt || !tgt.alive) return 0;
            const hitDmg = (i>0 && s.dmg2!==undefined) ? s.dmg2 : s.dmg;
            const dealt = applyDamage(tgt, hitDmg, attacker);
            if(statusOrder && statusOrder[i]){
              applyStatus(tgt, statusOrder[i], s.statusDur||1);
            } else if(s.applyStatus){
              applyStatus(tgt, s.applyStatus, s.statusDur||1);
            }
            return dealt;
          });
          if(s.dualStatus){
            desc = targets.filter(Boolean).map((t,i)=>`<b>${t.def.name}</b> -${dealtList[i]} (${STATUS_DISPLAY_NAME[statusOrder[i]]||statusOrder[i]})`).join(' and ');
          } else if(sameTarget){
            // Deliberately hitting the same enemy twice (e.g. Ninja's Twilight,
            // which explicitly allows "the same or different target") — phrase it
            // as one attack landing twice rather than "X and X".
            desc = `<b>${targets[0].def.name}</b> -${dealtList[0]} then -${dealtList[1]}`;
          } else {
            desc = targets.filter(Boolean).map((t,i)=>`<b>${t.def.name}</b> -${dealtList[i]}`).join(' and ');
          }
        }
        const statusText = (s.dualStatus && sameTarget) ? ` + ${STATUS_DISPLAY_NAME[randomStatus]||randomStatus}` : ((!s.dualStatus && s.applyStatus)?(' + '+(STATUS_DISPLAY_NAME[s.applyStatus]||s.applyStatus)):'');
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on ${desc} &mdash; rolled ${roll.roll}${statusText}.`, '');
      }
    } else if(s.pierce){
      // Aim picks the line; the shot itself resolves from the attacker outward.
      resolvePierceSpecialAttack(attacker, target, s);
    } else {
      // forceAutoHit (Thief's Charm): the charmed unit's forced attack doesn't get
      // its own roll — Thief's Charm roll already covered it.
      const roll = forceAutoHit ? {result:'hit', roll:null} : specialAttackRoll(attacker.status.blind>0, target.status.sleep>0);
      if(roll.result==='miss'){
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; rolled ${roll.roll}: miss.`, 'miss');
      } else {
        const dealt = applyDamage(target, s.dmg, attacker);
        // selfHealFlat (Master's Hurl, Samurai's Drain): only heals the
        // attacker when this hit actually lands — same roll gates both the
        // damage and the heal, rather than the heal being unconditional.
        let healed = 0;
        if(s.selfHealFlat && attacker.alive && attacker.hp<attacker.maxHp){
          healed = Math.min(s.selfHealFlat, attacker.maxHp-attacker.hp);
          attacker.hp += healed;
        }
        let pushed = 0, confused = false, fell = false;
        if(s.pushBack && dealt && target.alive){
          const pushResult = pushBackTarget(attacker, target, s.pushBack, {ignoreCharacters:!!s.pushIgnoresCharacters});
          pushed = pushResult.moved;
          if(pushResult.collision==='obstruction'){
            applyStatus(target, 'confuse', 1);
            confused = true;
          } else if(pushResult.collision==='fall'){
            fell = true;
          }
        }
        let appliedStatusName = s.applyStatus;
        if(s.randomStatusOptions){
          // Bard's Chord: one of several statuses, picked at random each time —
          // not a fixed pairing like dualStatus, just a coin flip on a single target.
          appliedStatusName = s.randomStatusOptions[Math.floor(Math.random()*s.randomStatusOptions.length)];
          applyStatus(target, appliedStatusName, s.statusDur||1);
        } else if(s.applyStatus){
          applyStatus(target, s.applyStatus, s.statusDur||1);
        }
        // applyStatus2 (Sumo's Crush): a SECOND status applied alongside the first,
        // both landing on the same hit — unlike dualStatus/randomStatusOptions,
        // which each only ever land one status per target, this one always fires
        // both together.
        let appliedStatus2Name = null;
        if(s.applyStatus2){
          appliedStatus2Name = s.applyStatus2;
          applyStatus(target, s.applyStatus2, s.statusDur2 || s.statusDur || 1);
        }
        // stealTeleportCoin (Gypsy's Mug): a real transfer — only comes off the
        // target's team if they actually have one to lose; the attacker's team
        // only gains one when something was actually taken. Teams can hold more
        // than 1 (see teleportCoins), so this just increments/decrements a count
        // rather than toggling a used flag.
        let coinNote = '';
        if(s.stealTeleportCoin && target.alive){
          const theirTeam = teamOf(target);
          if(theirTeam.teleportCoins>0){
            theirTeam.teleportCoins--;
            teamOf(attacker).teleportCoins++;
            coinNote = ' + steals a teleport coin';
          }
        }
        // teleportAfterHits (Gypsy's Mug, ==2 — "both Mugs"): counts successful
        // hits, not attempts — a miss doesn't advance it. On reaching the
        // threshold, THIS hit's target gets forcibly teleported anywhere on the
        // map as a bonus, entirely separate from the teleportCoins resource
        // above (this doesn't spend or require a coin at all).
        let awaitingMugTeleport = false, mugTeleportNote = '';
        if(s.teleportAfterHits){
          attacker.mugHits = (attacker.mugHits||0) + 1;
          if(attacker.mugHits>=s.teleportAfterHits && target.alive){
            if(state.vsMode==='cpu' && attacker.team===2){
              const dest = pickCpuTeleportDest(target);
              if(dest){
                target.x = dest.x; target.y = dest.y; target.elevated = isElevatedGround(dest.x, dest.y);
                checkHeartTokenPickup(target);
                checkTrapTrigger(target); checkCropTrigger(target);
                checkTeleportDoorway(target);
                syncPossessedSpecter(target);
              }
              mugTeleportNote = ' &mdash; both Mugs land! ' + target.def.name + ' is teleported across the map!';
            } else {
              state.pendingMugTeleportUid = target.uid;
              state.mode = 'mugTeleportSelectDest';
              awaitingMugTeleport = true;
              mugTeleportNote = ' &mdash; both Mugs land! Choose anywhere to teleport ' + target.def.name + '.';
            }
          }
        }
        let relocated = false, awaitingRelocate = false, dropAoeNote = '';
        if(s.pickUpAndMove && dealt && target.alive){
          // Same "pick up and move" mechanic as Machinist's basic (see
          // finishBasicHit) — here on a special instead. CPU picks a destination
          // synchronously; a human gets an interactive tile pick (state.mode
          // switches to basicRelocateSelect, same as the basic version uses).
          // throwRange (Sumo's Crush): the toss can go further than the hit's own
          // range, same override precedent as a basic attack's throwRange.
          const relocateRange = s.throwRange!==undefined ? s.throwRange : s.range;
          const dropAoe = s.dropAoeRange!==undefined ? {range:s.dropAoeRange, dmg:s.dropAoeDmg} : null;
          const attackerIsCpu = state.vsMode==='cpu' && attacker.team===2;
          if(attackerIsCpu){
            const dest = pickBestRelocateDest(attacker, target, relocateRange, dropAoe);
            if(dest){
              target.x = dest.x; target.y = dest.y; target.elevated = isElevatedGround(dest.x, dest.y);
              checkHeartTokenPickup(target);
              checkTrapTrigger(target); checkCropTrigger(target);
              checkTeleportDoorway(target);
              syncPossessedSpecter(target);
              relocated = true;
              if(dropAoe){
                // Forcer's Displace: the D1 blast hits enemies surrounding the
                // drop tile — the target itself already took the initial hit
                // and isn't hit again by this part.
                const hit = enemyTeamOf(attacker).instances.filter(e=>e.alive && e.uid!==target.uid && manhattan(dest,e)<=dropAoe.range);
                if(hit.length){
                  const dealtList = hit.map(e=> applyDamage(e, dropAoe.dmg, attacker));
                  dropAoeNote = ` &mdash; drop-site blast hits ${hit.map((e,i)=>`<b>${e.def.name}</b> -${dealtList[i]}`).join(', ')}`;
                }
              }
            }
          } else {
            state.pendingRelocateUid = target.uid;
            state.pendingRelocateOrigin = {x:attacker.x, y:attacker.y};
            state.pendingRelocateRange = relocateRange;
            state.pendingRelocateAttackerUid = attacker.uid;
            state.pendingRelocateDropAoe = dropAoe;
            state.mode = 'basicRelocateSelect';
            awaitingRelocate = true;
          }
        }
        const rollNote = roll.roll===null ? 'automatically hits' : `rolled ${roll.roll}`;
        log(`<b>${attacker.def.name}</b> uses <b>${s.name}</b> on <b>${target.def.name}</b> &mdash; ${rollNote}: -${dealt} HP${healed?(' + heals '+healed+' HP'):''}${appliedStatusName?(' + '+(STATUS_DISPLAY_NAME[appliedStatusName]||appliedStatusName)):''}${appliedStatus2Name?(' + '+(STATUS_DISPLAY_NAME[appliedStatus2Name]||appliedStatus2Name)):''}${coinNote}${pushed?` (pushed back ${pushed})`:''}${confused?` &mdash; <b>${target.def.name}</b> slams into an obstruction and is now Confused!`:''}${fell?` &mdash; <b>${target.def.name}</b> is pushed off a ledge and falls, taking 1 damage!`:''}${relocated?` &mdash; <b>${target.def.name}</b> is picked up and moved!`:''}${dropAoeNote}${mugTeleportNote}`, '');
